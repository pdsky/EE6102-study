ex:`<b>可以用，但要谨慎</b>。“永远不用”太绝对（所有算法都曾经是新的，AES 在 2001 年也是新算法）；“只用认证过的”和“只用宣称牢不可破的”，前两题已经说明这两种说法站不住。`,
op:[`✗ 太绝对`,`✓`,`✗ 不存在 certified encryption`,`✗ 不存在 unbreakable`],
tip:`这一组 8–11 题是连环题：信时间、不信宣传、不信证书、谨慎尝新。`,ref:`样题 Q4-3、Q4-4`},

{id:'4.12',p:4,s:'o',q:`Asymmetric encryption utilizes only a public key for encryption and decryption.`,
o:[`True`,`False`],a:1,
zh:`非对称加密只用公钥来加密和解密。`,
ex:`错。非对称加密使用<b>两把</b>数学相关的密钥：public key 和 private key（P4-44、P4-46）。一把加密，只有另一把能解密。`,
tip:`非对称 = 公钥 + 私钥，一对。`,ref:`P4-44、P4-46`},

{id:'4.13',p:4,s:'o',q:`Asymmetric encryption can be used for confidentiality but not for authentication.`,
o:[`True`,`False`],a:1,
zh:`非对称加密能用于机密性，但不能用于认证。`,
ex:`错。非对称加密<b>两者都能做</b>（P4-47）：<br>• <b>机密性</b>：用<b>接收方公钥</b>加密，只有接收方私钥能解（P4-48）；<br>• <b>认证</b>：发送方用<b>自己的私钥</b>“加密”（签名），任何人用发送方公钥能解开，就证明是他发的（P4-49 Public key authentication，即数字签名）。`,
tip:`机密性用对方公钥；认证用自己私钥。`,ref:`P4-47～P4-49`},

{id:'4.14',p:4,s:'o',q:`Public-key encryption is more secure than symmetric encryption as it uses two keys.`,
o:[`True`,`False`],a:1,
zh:`公钥加密比对称加密更安全，因为它用两把钥匙。`,
ex:`错。安全性取决于<b>算法强度和密钥长度</b>（P4-14：SECURITY = STRENGTH OF ALGORITHM + LENGTH OF KEY），与钥匙数量无关。P4-97 的等效强度表：128 位对称密钥 ≈ 256 位 ECC ≈ <b>3072 位 RSA</b>。公钥的优势是<b>解决了密钥分发</b>，不是“更安全”。`,
tip:`两把钥匙解决的是分发问题，不是强度问题。`,ref:`P4-14、P4-97、P4-100`},

{id:'4.15',p:4,s:'o',q:`The most widely used public-key cryptosystem is __________ .`,
o:[`RSA`,`DES`,`3DES`,`None of the above`],a:0,
zh:`最广泛使用的公钥密码系统是哪个？`,
ex:`<b>RSA</b>（Q&A Q24 "The most widely used public-key algorithm is the RSA cryptosystem"；P4-100 "RSA is the most commonly used system for web security"）。DES 和 3DES 都是对称算法。`,
op:[`✓`,`✗ 对称`,`✗ 对称`,`✗`],
tip:`公钥算法：RSA、Diffie-Hellman、ElGamal、ECC。`,ref:`P4-44、P4-100；Q&A Q24`},

{id:'4.16',p:4,s:'o',q:`The Diffie-Hellman algorithm depends on the difficulty of computing discrete logarithms for its effectiveness.`,
o:[`True`,`False`],a:0,
zh:`Diffie-Hellman 的安全性依赖于计算离散对数的困难性。`,
ex:`对。P4-51："Security is based on 'Discrete Log Problem'"：y = g<sup>x</sup> mod p，已知 g、x、p 求 y 很容易；已知 y、g、p 求 x 非常困难。对比：<b>RSA 依赖大数分解</b>的困难性。`,
tip:`DH 和 ElGamal 依赖离散对数；RSA 依赖大数分解。`,ref:`P4-51、P4-96`},

{id:'4.17',p:4,s:'o',q:`Most of the products and standards that use public-key cryptography for encryption and digital signatures use RSA.`,
o:[`True`,`False`],a:0,
zh:`大多数使用公钥密码做加密和数字签名的产品与标准都用 RSA。`,
ex:`对。RSA 是一个完整的系统（密钥生成 + 加密 + 解密），既能加密又能签名（P4-100、P4-117）。对比：DH 只能做密钥交换，不能加密消息（P4-51）。`,
tip:`RSA 能加密也能签名；DH 只能交换密钥。`,ref:`P4-100、P4-117`},

{id:'4.18',p:4,s:'o',q:`Suppose that you are using the RSA algorithm and have chosen two prime numbers, p = 5 and q = 11. What will be value of Phi`,
o:[`55`,`13`,`14`,`None of the above`],a:3,
zh:`RSA 中选 p = 5、q = 11，φ 是多少？`,
ex:`φ(n) = (p−1)(q−1) = 4 × 10 = <b>40</b>，不在选项里，所以选 D。<br>陷阱：55 是 n = p × q，不是 φ。`,
op:[`✗ 那是 n`,`✗`,`✗`,`✓ φ = 40`],
tip:`n = p·q；φ = (p−1)(q−1)。`,ref:`P4-67、P4-70`},

{id:'4.19',p:4,s:'o',q:`In RSA algorithm, if the two prime numbers are, 5 and 11 then what will be value of Modulus, N`,
o:[`55`,`44`,`20`,`None of the above`],a:0,
zh:`RSA 中两个素数是 5 和 11，模数 N 是多少？`,
ex:`N = p × q = 5 × 11 = <b>55</b>（P4-67："Compute their products (called modulus) N = p * q"）。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`和上一题连着考：N = 55，φ = 40。`,ref:`P4-67、P4-69`},

{id:'4.20',p:4,s:'o',q:`Given two very large prime numbers p and q, a composite number N (Modulus) can be calculated as N = p* q. However, given just N, it is not feasible for hackers to find p and q.`,
o:[`Yes, that is true`,`No, that is not true at all`,`It may be possible in some cases`,`None of the above`],a:0,
zh:`给定两个很大的素数，N = p × q 容易算；但只给 N，黑客找不出 p 和 q。对吗？`,
ex:`对，这就是 RSA 的安全基础：<b>大数分解难题</b>（P4-67 "RSA obtains its security from the difficulty of factoring large numbers"）。Q&A Q29：p、q 和 φ(n) 必须保密，知道任何一个就能推出另一个。`,
op:[`✓`,`✗`,`✗ 理论上有量子计算威胁（Shor 算法，P4-125），但本题的标准答案是 A`,`✗`],
tip:`乘法容易，分解难，这就是“单向”。`,ref:`P4-67；Q&A Q28、Q29`},

{id:'4.21',p:4,s:'o',q:`In public key cryptosystem when Carol sends a message to Bob for confidentiality, what key will she use to encrypt the message?`,
o:[`Public Key`,`Bob's Public Key`,`Carols' Private Key`,`None of the above.`],a:1,
zh:`公钥系统中，Carol 要给 Bob 发机密消息，她用哪把钥匙加密？`,
ex:`为了<b>机密性</b>，用<b>接收方（Bob）的公钥</b>加密，这样只有 Bob 的私钥能解开（P4-48："Bob use Alice key for encryption — Only Alice can decrypt"）。`,
op:[`✗ 没说是谁的公钥，不够精确`,`✓`,`✗ 用自己的私钥是签名（认证），不是保密`,`✗`],
tip:`保密 → 用收件人的公钥锁上 → 只有收件人能开。`,ref:`P4-47、P4-48`},

{id:'4.22',p:4,s:'o',q:`In public key cryptosystem when Carol sends an encrypted message to Bob for confidentiality, what key will Bob use to decrypt the message?`,
o:[`Bob's Private Key`,`Bob's Public Key`,`Carols' Private Key`,`Carol's Public Key`],a:0,
zh:`Bob 用哪把钥匙解密 Carol 发来的机密消息？`,
ex:`用 Bob 公钥加密的内容，只有 <b>Bob 的私钥</b>能解开（"If Key A encrypts message, only Key B can decrypt"，P4-44）。`,
op:[`✓`,`✗ 公钥加密的内容，公钥解不开`,`✗ Bob 没有 Carol 的私钥`,`✗`],
tip:`谁收件，谁用自己的私钥解。`,ref:`P4-44、P4-46`},

{id:'4.23',p:4,s:'o',q:`In a classroom with 30 students and a professor, how many public and private keys will be used if all students want to submit the encrypted assignment to the professor?`,
o:[`30 public and 30 private`,`1 public and 30 private`,`1 public and 1 private`,`Variable keys depending on the application`],a:3,
zh:`一个班 30 名学生加 1 位教授，学生都要向教授提交加密作业，要用多少把公钥和私钥？`,
ex:`官方答案 <b>D：取决于应用</b>。<br>• 如果只要求<b>机密性</b>：所有学生都用<b>教授的公钥</b>加密，教授用自己的私钥解密，只需 1 对密钥（1 public + 1 private）；<br>• 如果还要证明<b>是哪个学生交的</b>（认证或不可否认，即每人签名）：每个学生还需要自己的密钥对，就是 31 对；<br>• 如果采用混合系统，还会有会话密钥。<br>所以数量随应用需求而变。`,
op:[`✗`,`✗`,`易混项：只考虑机密性时是 1 对，但题目没限定应用`,`✓ 官方答案`],
tip:`这题考“看需求”：保密需要 1 对，签名需要每人 1 对。`,ref:`P4-47～P4-49`},

{id:'4.24',p:4,s:'o',q:`In asymmetric cryptography system for confidential communication, the private key is used by ----------------- to decrypt ciphertext`,
o:[`Sender`,`Receiver`,`Sender and receiver`,`All the connected devices on the network`],a:1,
zh:`非对称密码系统的机密通信中，谁用私钥解密密文？`,
ex:`<b>接收方</b>用自己的私钥解密。P4-46："PRIVATE-KEY: Known only to the recipient, used to decrypt messages, and sign (create) signatures."`,
op:[`✗ 发送方用接收方公钥加密`,`✓`,`✗ 私钥只有一人持有`,`✗`],
tip:`私钥 = 只有一个主人。`,ref:`P4-46`},

{id:'4.25',p:4,s:'o',q:`A __________ is a digital document issued and digitally signed by Certification Authority that binds the name of a subscriber to a public key.`,
o:[`Digital certificate`,`Digital signature`,`Both a and b`,`None of the above`],a:0,
zh:`由证书颁发机构签发并数字签名、把用户名字和公钥绑定在一起的数字文件是什么？`,
ex:`<b>数字证书</b>（X.509）。P4-118："Digital certificate provides the subject's (True Party's) name and public key." P4-121：CA 用自己的私钥给证书签名。`,
op:[`✓`,`✗ 签名是对消息摘要的私钥运算，不是 CA 签发的文件`,`✗`,`✗`],
tip:`证书 = 名字 + 公钥 + CA 签名。`,ref:`P4-118～P4-121`},

{id:'4.26',p:4,s:'o',q:`The principal object of a hash function is __________ .`,
o:[`Data integrity`,`Authentication`,`Both a and b`,`None of the above`],a:0,
zh:`哈希函数的主要目的是什么？`,
ex:`哈希的首要作用是<b>数据完整性</b>：消息改一个字，摘要就面目全非（P4-111 雪崩效应示例）。哈希本身<b>没有密钥</b>，所以单独使用无法证明是谁发的；要和私钥签名结合，才能提供认证。P4-124 汇总表：Hash Functions → Data integrity, password storage。`,
op:[`✓`,`✗ 认证要靠签名（私钥）`,`✗`,`✗`],
tip:`Hash 保证完整性；Hash + 私钥（签名）才有认证。`,ref:`P4-108～P4-111、P4-124`},

{id:'4.27',p:4,s:'o',q:`The most important and widely used family of cryptographic hash functions is the __________ family`,
o:[`Secure Hash Algorithm (SHA)`,`Digest`,`Hash Value`,`All of the above`],a:0,
zh:`最重要、最广泛使用的密码哈希函数家族是？`,
ex:`<b>SHA</b> 家族（P4-109）：SHA-1（160 位，已发现碰撞，不再安全）、SHA-2（SHA-224/256/384/512）。比特币的工作量证明就用 SHA-256（P6-63）。“Digest”和“Hash value”是哈希的输出，不是函数家族的名字。`,
op:[`✓`,`✗ 输出名称`,`✗ 输出名称`,`✗`],
tip:`MD5 和 SHA-1 已不安全，用 SHA-2 或 SHA-3。`,ref:`P4-109、P4-110`},

{id:'4.28',p:4,s:'o',q:`The hash value of a message in __________ application is encrypted with a sender's private key.`,
o:[`Digital signature`,`Digital certificate`,`Secure Hash Algorithm (SHA)`,`None of the above`],a:0,
zh:`在哪种应用中，消息的哈希值会用发送方私钥加密？`,
ex:`这就是<b>数字签名</b>的制作过程（P4-105、P4-112）：消息 → 哈希得到摘要 → 用<b>发送方私钥</b>加密摘要 → 得到签名，附在消息后面。`,
op:[`✓`,`✗ 证书由 CA 私钥签名，签的是证书内容`,`✗ SHA 只是哈希算法`,`✗`],
tip:`签名 = Encrypt<sub>私钥</sub>(Hash(消息))。`,ref:`P4-105、P4-112`},

{id:'4.29',p:4,s:'o',q:`A digital signature can guarantee`,
o:[`The integrity of the message`,`The source of the message`,`Both a and b`,`None of the above`],a:2,
zh:`数字签名能保证什么？`,
ex:`两者都能（P4-104）："Any changes to the message can be detected, due to the message digest algorithm"，这是<b>完整性</b>；"You can not deny signing the message, because it was signed with your private key"，这是<b>来源认证和不可否认</b>。<br>注意：数字签名<b>不</b>提供机密性（Q&A Q32）。`,
op:[`部分`,`部分`,`✓`,`✗`],
tip:`签名 = 完整性 + 认证 + 不可否认；不含机密性。`,ref:`P4-104、P4-124；Q&A Q32`},

{id:'4.30',p:4,s:'o',q:`When a message and a digital signature (signed hash) are received, a new hash is created from the received message and compared to the original hash in the digital signature. The message has not been altered when the hash values are:`,
o:[`Not equal`,`Equal`,`It doesn't matter`,`None of the above`],a:1,
zh:`收到消息和签名后，对消息重新算哈希，与签名中的原哈希比较。两个哈希值怎样时，消息未被篡改？`,
ex:`<b>相等</b>就说明没被改。验证步骤（Q&A Q32、P4-112）：① 用相同哈希算法对收到的消息算摘要；② 用发送方公钥解开签名，得到原摘要；③ 两者比较，相同就说明完整且确为对方所发。`,
op:[`✗ 不等说明被篡改，或者签名不是对方的`,`✓`,`✗`,`✗`],
tip:`两个摘要一样 = 没被改。`,ref:`P4-112；Q&A Q32`},

{id:'4.31',p:4,s:'o',q:`Digital signatures are created using a public key crypto system. Which key does a sender use when they wish to digitally sign a hash before it is sent?`,
o:[`Senders public key`,`Senders private key`,`Both a and b`,`None of the above`],a:1,
zh:`发送方给哈希做数字签名时用哪把钥匙？`,
ex:`<b>发送方私钥</b>。P4-104："To create a digital signature, you sign the message with your private key." 只有私钥持有者能生成签名，任何持有其公钥的人都能验证（P4-105）。`,
op:[`✗ 公钥用于验证签名`,`✓`,`✗`,`✗`],
tip:`签名用私钥，验签用公钥（与加密正好相反）。`,ref:`P4-104、P4-105`},

{id:'4.32',p:4,s:'o',q:`The purpose of a digital certificate is to -------`,
o:[`Authenticate the public key`,`Authenticate the private key`,`Both a and b`,`None of the above`],a:0,
zh:`数字证书的作用是什么？`,
ex:`证书证明<b>“这把公钥确实属于这个人”</b>。P4-124："Digital certificates provide assurance that the public-key claimed by the user does indeed belong to him/her." 私钥从不公开，也不会写进证书。P4-118：验证签名不能用“发送方自己提供的公钥”，否则冒充者总能自证，必须靠证书。`,
op:[`✓`,`✗ 私钥永不离开主人`,`✗`,`✗`],
tip:`证书解决“这把公钥是谁的”。`,ref:`P4-118、P4-124；Q&A Q28`},

{id:'4.33',p:4,s:'o',q:`A special mathematical function that performs one-way encryption is called`,
o:[`Asymmetric encryption`,`Transposition cipher`,`Hashing`,`Multiple encryption`],a:2,
zh:`执行单向加密的特殊数学函数叫什么？`,
ex:`P4-109 原文："A hashing function is a special mathematical function that performs <b>one-way encryption</b>." 一旦计算完成，无法从结果还原明文（不能 de-hash，Q&A Q31）。`,
op:[`✗ 可以用私钥解密，是双向的`,`✗ 置换密码可以逆向还原`,`✓`,`✗ 如 3DES，可逆`],
tip:`One-way = Hash。`,ref:`P4-109；Q&A Q31`},

{id:'4.34',p:4,s:'o',q:`Hybrid system uses public key cryptography for`,
o:[`Encryption`,`Key exchange`,`Both a and b`,`None of the above`],a:1,
zh:`混合系统用公钥密码做什么？`,
ex:`P4-98：公钥慢，对称快，于是组合起来：<b>第一步用公钥加密并分享会话密钥（key exchange）</b>；之后用这把对称会话密钥加密实际数据。SSL/TLS 就是这样（P5-18）。`,
op:[`✗ 数据加密用对称`,`✓`,`✗`,`✗`],
tip:`公钥送钥匙，对称加数据。`,ref:`P4-98、P4-99、P5-18`},

{id:'4.35',p:4,s:'o',q:`In hybrid system ------- crypto system is used to encrypt the session data`,
o:[`Symmetric`,`Asymmetric`,`Both a and B`,`None of the above`],a:0,
zh:`在混合系统中，用哪种密码系统加密会话数据？`,
ex:`<b>对称</b>。会话数据量大，要用对称算法的吞吐量（"Throughput of symmetric cipher, key management of asymmetric cipher"，P4-98）。`,
op:[`✓`,`✗ 只用来交换会话密钥`,`✗`,`✗`],
tip:`和上一题配对记。`,ref:`P4-98`},

/* ---------- 自编题（依据课件 sld4） ---------- */
{id:'4.c1',p:4,s:'c',q:`What is the block size of AES?`,
o:[`56 bits`,`64 bits`,`128 bits`,`256 bits`],a:2,
zh:`AES 的分组长度是多少？`,
ex:`AES 分组<b>固定 128 位</b>；密钥可选 128、192、256 位，对应 10、12、14 轮（P4-32、P4-36）。Rijndael 原算法允许分组和密钥各自在 128～256 之间选择，AES 标准把分组固定为 128 位。`,
op:[`✗ DES 密钥`,`✗ DES 分组`,`✓`,`✗ 最大的 AES 密钥`],
tip:`AES：块 128，钥 128/192/256，轮 10/12/14。`,ref:`P4-32、P4-36`},

{id:'4.c2',p:4,s:'c',q:`How many rounds does AES use with a 256-bit key?`,
o:[`10`,`12`,`14`,`16`],a:2,
zh:`AES-256 使用多少轮？`,
ex:`AES-128 → 10 轮；AES-192 → 12 轮；<b>AES-256 → 14 轮</b>（P4-32、P4-39）。16 轮是 DES。`,
op:[`✗ AES-128`,`✗ AES-192`,`✓`,`✗ DES`],
tip:`密钥每多 64 位，轮数加 2。`,ref:`P4-32、P4-39`},

{id:'4.c3',p:4,s:'c',q:`Double DES (2DES) is not much stronger than DES mainly because of:`,
o:[`Rainbow table attack`,`Meet-in-the-middle attack`,`SYN flood`,`Phishing`],a:1,
zh:`双重 DES 并不比 DES 强多少，主要是因为哪种攻击？`,
ex:`P4-28：2DES 用两把密钥（2×56 = 112 位），但利用已知的明文/密文对，可以做<b>中间相遇攻击（meet-in-the-middle）</b>：从两端分别加密和解密，在中间对上结果。计算量与破解单个 DES 相近。所以改用 <b>3DES</b>：慢三倍，但用得当时安全得多，是过渡到 AES 前的临时方案（P4-29）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`2DES 被中间相遇攻击打回原形，所以用 3DES。`,ref:`P4-28、P4-29`},

{id:'4.c4',p:4,s:'c',q:`RC4 is an example of a:`,
o:[`Block cipher`,`Stream cipher`,`Hash function`,`Public-key algorithm`],a:1,
zh:`RC4 属于哪一类？`,
ex:`P4-15："BIT STREAM: Each plaintext bit transformed into cipher bit one bit (or byte) at a time. <b>RC4 is widely used stream cipher</b>." 注意 TLS 1.3 已经移除了 RC4（P5-26）。`,
op:[`✗ DES、AES`,`✓`,`✗ SHA、MD5`,`✗ RSA、DH`],
tip:`RC4 = 流；DES、AES = 块。`,ref:`P4-15、P5-26`},

{id:'4.c5',p:4,s:'c',q:`In which encryption mode does the next input depend on the previous output?`,
o:[`Electronic Code Book (ECB)`,`Cipher Block Chaining (CBC)`,`Stream mode`,`Hash mode`],a:1,
zh:`哪种加密模式中，下一块的输入依赖上一块的输出？`,
ex:`P4-15：<br>• <b>ECB</b>：每块独立加密（相同明文块得到相同密文块，会泄露规律）；<br>• <b>CBC</b>：Next input depends on previous output（块与块链接起来，更安全）。`,
op:[`✗ 独立加密`,`✓ Chaining = 链接`,`✗`,`✗`],
tip:`CBC 的 C = Chaining（链）。`,ref:`P4-15`},

{id:'4.c6',p:4,s:'c',q:`Which statement about the Diffie-Hellman algorithm is correct?`,
o:[`It encrypts and decrypts messages directly`,`It is a public key algorithm only for key exchange and does not encrypt or decrypt the message`,`It is a hash function`,`It is a symmetric block cipher`],a:1,
zh:`关于 Diffie-Hellman，哪项正确？`,
ex:`P4-51 原文："It is a Public Key Algorithm <b>only for Key Exchange</b> and Does NOT Encrypt or Decrypt the message." 它让从未接触过的双方在不安全的信道上协商出共享密钥，安全性基于离散对数难题。它是 SSL 的密钥交换方法之一，TLS 1.3 只保留了 ephemeral DH（P5-20）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`DH 只能交换密钥；RSA 能交换、加密、签名。`,ref:`P4-51、P5-19、P5-20`},

{id:'4.c7',p:4,s:'c',q:`What is the main advantage of Elliptic Curve Cryptography (ECC) over RSA?`,
o:[`It needs no key at all`,`It offers the same security with smaller key sizes`,`It is a symmetric algorithm`,`It was invented before RSA`],a:1,
zh:`椭圆曲线密码（ECC）相对 RSA 的主要优势是什么？`,
ex:`P4-96："ECC ... offers <b>same security with smaller bit sizes</b>." P4-97 等效强度表：<br>对称 128 ≈ ECC 256 ≈ RSA 3072；对称 256 ≈ ECC 512 ≈ RSA 15360。<br>它在加密货币里被广泛使用。`,
op:[`✗`,`✓`,`✗ 是公钥算法`,`✗ 1985 年提出，晚于 RSA（1978）`],
tip:`ECC：钥匙短、强度高，适合 IoT 和移动端。`,ref:`P4-96、P4-97`},

{id:'4.c8',p:4,s:'c',q:`Which hash algorithms should NOT be used anymore because they have been shown to be insecure?`,
o:[`SHA-256 and SHA-512`,`MD5 and SHA-1`,`SHA-384 and SHA-3`,`AES and RSA`],a:1,
zh:`哪两个哈希算法已被证明不安全、不应再使用？`,
ex:`P4-110："Note: <b>MD5 and SHA-1</b> should not be used because they have been shown to be unsecure." SHA-1 已被发现易受碰撞攻击（P4-109）。TLS 1.3 也移除了 MD5 和 SHA-1（P5-26）。`,
op:[`✗ 安全`,`✓`,`✗ 安全`,`✗ 不是哈希算法`],
tip:`被淘汰的老算法：DES、MD5、SHA-1、RC4。`,ref:`P4-109、P4-110、P4-125`},

{id:'4.c9',p:4,s:'c',q:`"It is computationally infeasible to find any pair (x, y) such that H(x) = H(y)." This hash property is called:`,
o:[`Pre-image resistance (one-way)`,`Strong collision resistance`,`Fixed-length output`,`Avalanche-free`],a:1,
zh:`“计算上无法找到任意一对 (x, y) 使 H(x) = H(y)。”这条性质叫什么？`,
ex:`P4-108 哈希性质：<br>• 适用于任意长度输入，输出长度固定，计算容易；<br>• <b>One-way（抗原像）</b>：给定 h，找不到 x 使 H(x) = h；<br>• <b>弱抗碰撞</b>：给定 x，找不到 y ≠ x 使 H(y) = H(x)；<br>• <b>强抗碰撞</b>：找不到<b>任意一对</b> (x, y) 使 H(x) = H(y)。`,
op:[`✗ 那是“给定 h 求 x”`,`✓ “任意一对” = 强抗碰撞`,`✗`,`✗`],
tip:`给定 h → 单向；给定 x → 弱抗碰撞；任意一对 → 强抗碰撞。`,ref:`P4-108`},

{id:'4.c10',p:4,s:'c',q:`When verifying a digital certificate, the receiver checks all of the following EXCEPT:`,
o:[`The CA's digital signature using the CA's public key`,`The certificate's valid period`,`Whether the certificate has been revoked`,`The subject's private key`],a:3,
zh:`验证数字证书时，接收方要检查以下各项，除了哪项？`,
ex:`P4-122 和 Q&A Q33 的<b>三项检查</b>：<br>① 用 CA 的公钥验证证书上的签名，确认真实且未被修改；<br>② 检查是否在有效期内；<br>③ 检查是否已被吊销（必须向 CA 查询，例如通过 OCSP 协议，看证书字段是看不出来的）。<br>主体的私钥永远不会出现在证书里，也无从检查。`,
op:[`✗ 要查`,`✗ 要查`,`✗ 要查`,`✓ 不可能也不需要`],
tip:`验证证书三步：签名、期限、吊销。`,ref:`P4-122；Q&A Q33`},

{id:'4.c11',p:4,s:'c',q:`A Certificate Authority signs a digital certificate using:`,
o:[`The subject's public key`,`The subject's private key`,`The CA's own private key`,`The CA's public key`],a:2,
zh:`CA 用什么给数字证书签名？`,
ex:`P4-121："The digital signature of the certificate, signed by the CA with <b>the CA's own private key</b>." 用户必须独立获得 CA 的公钥来验证（浏览器和操作系统里预装了受信任的根证书）。`,
op:[`✗`,`✗ CA 拿不到`,`✓`,`✗ 公钥用于验证`],
tip:`谁签名，就用谁的私钥；CA 签证书，用 CA 的私钥。`,ref:`P4-120、P4-121`},

{id:'4.c12',p:4,s:'c',q:`According to the lecture, which algorithm on a quantum computer threatens RSA and ECC?`,
o:[`Shor's algorithm`,`Dijkstra's algorithm`,`Daugman's algorithm`,`Rijndael`],a:0,
zh:`按课件，量子计算机上的哪种算法会威胁 RSA 和 ECC？`,
ex:`P4-125 Challenges in Cryptography："Quantum computing threat (<b>Shor's algorithm</b> can break RSA & ECC)." 所以 TLS 正在推进后量子密码（PQC，P5-10）。Daugman 是虹膜识别算法，Rijndael 是 AES。`,
op:[`✓`,`✗ 最短路径算法`,`✗ 虹膜识别`,`✗ AES`],
tip:`Shor 会打破“大数分解”和“离散对数”这两个难题。`,ref:`P4-125、P5-10`},

{id:'4.c13',p:4,s:'c',q:`RSA with p = 3, q = 11 and public key e = 3. What is the private key d?`,
o:[`3`,`7`,`11`,`21`],a:1,
zh:`RSA 中 p = 3、q = 11、e = 3，私钥 d 是多少？`,
ex:`n = 33，φ = (3−1)(11−1) = 20。<br>求 d 使 e·d ≡ 1 (mod φ)：课件方法 d = (k·φ + 1) / e，k 取 1, 2, 3… 直到能整除。<br>k = 1：(20 + 1) / 3 = 21 / 3 = <b>7</b> ✓（P4-75）。<br>验证：3 × 7 = 21 = 20 + 1 ✓。`,
op:[`✗ 那是 e = 7 时的 d`,`✓`,`✗`,`✗ 21 是 kφ+1，还要除以 e`],
tip:`d = (kφ + 1) / e，找第一个能整除的 k。“计算题 → RSA”可以随机练。`,ref:`P4-74～P4-76`},

{id:'4.c14',p:4,s:'c',q:`Diffie-Hellman with prime p = 23, generator g = 5, Alice's private a = 6 and Bob's private b = 15. What is the shared secret key?`,
o:[`2`,`8`,`19`,`23`],a:0,
zh:`DH 中 p = 23、g = 5，Alice 私钥 6，Bob 私钥 15，共享密钥是多少？`,
ex:`A = 5<sup>6</sup> mod 23 = <b>8</b>；B = 5<sup>15</sup> mod 23 = <b>19</b>。<br>Alice：K = 19<sup>6</sup> mod 23 = <b>2</b>；Bob：K = 8<sup>15</sup> mod 23 = <b>2</b> ✓（P4-62）。`,
op:[`✓`,`✗ Alice 的公钥`,`✗ Bob 的公钥`,`✗`],
tip:`公开值 = g<sup>私钥</sup> mod p；共享钥 = 对方公开值<sup>自己私钥</sup> mod p。`,ref:`P4-53～P4-62`},

{id:'4.c15',p:4,s:'c',q:`In RSA key generation, the public exponent e must satisfy:`,
o:[`e = φ(n)`,`1 < e < φ(n) and gcd(e, φ(n)) = 1`,`e must be an even number`,`e must equal d`],a:1,
zh:`RSA 密钥生成中，公钥指数 e 必须满足什么？`,
ex:`P4-67："Select at random the encryption key e, where 1 < e < ø(N), gcd(e, ø(N)) = 1"，即 e 与 φ(n) <b>互素</b>（课件说法：e 与 p−1、q−1 没有公因子）。偶数 e 一定与 φ 共享因子 2（φ 总是偶数），所以 e 不能是偶数。常用 e = 65537（P4-89）。`,
op:[`✗`,`✓`,`✗ φ 为偶数，偶数 e 必然不互素`,`✗`],
tip:`选 e 的口诀：在 1 和 φ 之间，与 φ 互素。`,ref:`P4-67、P4-70`},

{id:'4.c16',p:4,s:'c',q:`Which cryptanalysis attack uses precomputed tables of hash values to recover passwords?`,
o:[`Brute force attack`,`Dictionary attack`,`Rainbow table attack`,`Man-in-the-middle attack`],a:2,
zh:`哪种密码分析攻击使用预先算好的哈希表来还原密码？`,
ex:`P4-7 列出三种密码分析攻击：<br>• <b>Brute force</b>：穷举所有组合；<br>• <b>Dictionary</b>：用字典里的常见词；<br>• <b>Rainbow table</b>：用<b>预计算的哈希表</b>反查（P1-53 "Attacker use hash tables to find the password"）。`,
op:[`✗`,`✗`,`✓`,`✗`],
tip:`彩虹表 = 拿空间换时间的哈希反查表；对策是加盐（salt）。`,ref:`P4-7、P1-53`},

{id:'4.c17',p:4,s:'c',q:`What is the correct way to verify a received digital signature?`,
o:[`Decrypt the message with the receiver's private key only`,`Hash the received message, decrypt the signature with the sender's public key, and compare the two digests`,`Encrypt the signature with the sender's private key`,`Ask the sender for the original message by phone`],a:1,
zh:`验证收到的数字签名，正确做法是什么？`,
ex:`Q&A Q32：① 用发送方同样的算法对收到的明文算哈希；② 用<b>真实发送方的公钥</b>解开签名，得到原摘要；③ 比较两个摘要，相同就通过。P4-118 强调：发送方公钥要从<b>数字证书</b>中获取，不能直接信任发送方自己附上的公钥。`,
op:[`✗`,`✓`,`✗ 那是签名过程，而且接收方没有发送方的私钥`,`✗`],
tip:`验签：Hash(消息) 与 Decrypt<sub>发送方公钥</sub>(签名) 比较。`,ref:`P4-112、P4-118；Q&A Q32`}
]);

/* Part 5 · Web Security (SSL/TLS, SET), Firewalls & IDS (sld5) */
window.MCQ = (window.MCQ || []).concat([
{id:'5.01',p:5,s:'o',q:`The most complex part of TLS is the __________.`,
o:[`signature`,`message header`,`payload`,`handshake protocol`],a:3,
zh:`TLS 最复杂的部分是什么？`,
ex:`P5-16："SSL HANDSHAKE PROTOCOL — <b>The most complex part of SSL</b>." 握手协议要完成：双方互相认证、协商加密和 MAC 算法、协商密钥。分四个阶段：建立安全能力 → 服务器认证与密钥交换 → 客户端认证与密钥交换 → 结束。`,
op:[`✗`,`✗`,`✗`,`✓`],
tip:`握手 = 认证 + 协商算法 + 协商密钥 → 最复杂。`,ref:`P5-16、P5-17`},

{id:'5.02',p:5,s:'o',q:`_______ is a list that contains the combinations of cryptographic algorithms supported by the client`,
o:[`Compression method`,`Session ID`,`Cipher Suite`,`All of the above`],a:2,
zh:`包含客户端支持的密码算法组合的列表叫什么？`,
ex:`<b>Cipher suite（密码套件）</b>。P5-17：Client Hello 中 "Client lists cipher suites it supports"；Server Hello 中 "Selects a cipher suite to use in the session"。一个套件 = 密钥交换算法 + 加密算法 + MAC/哈希算法。TLS 1.3 把支持的套件从 37 个减到 5 个（P5-21）。`,
op:[`✗`,`✗ Session ID 标识会话`,`✓`,`✗`],
tip:`Cipher suite = 算法组合菜单，客户端列出、服务器选择。`,ref:`P5-17、P5-21`},

{id:'5.03',p:5,s:'o',q:`The SSL record protocol provides two services for SSL/TLS connection: message integrity and _________`,
o:[`Confidentiality`,`Availability`,`Authentication`,`None of the above`],a:0,
zh:`SSL 记录协议为连接提供两项服务：消息完整性和什么？`,
ex:`P5-13："SSL RECORD PROTOCOL — Provides <b>confidentiality and message integrity</b> using shared keys established by the Handshake Protocol." 处理流程（P5-14）：分片 → 压缩 → 加 MAC（完整性）→ 加密（机密性）→ 加记录头。`,
op:[`✓`,`✗`,`✗ 认证是握手协议做的`,`✗`],
tip:`Record 协议：机密 + 完整；Handshake 协议：认证 + 协商。`,ref:`P5-13、P5-14`},

{id:'5.04',p:5,s:'o',q:`The _________ is used to convey SSL-related alerts to the peer entity`,
o:[`alert protocol`,`digital signature`,`Digital certificate`,`None of the above`],a:0,
zh:`哪个协议用来向对端传递 SSL 相关告警？`,
ex:`<b>Alert protocol</b>（P5-15）："Send SSL/TLS related alerts to peers." 告警消息 2 字节：一个字节表示 fatal 或 warning，一个字节是告警代码（如 bad record MAC、handshake failure、certificate expired、certificate revoked 等）。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`SSL 四个子协议：Handshake、Change Cipher Spec、Alert、Record。`,ref:`P5-12、P5-15`},

{id:'5.05',p:5,s:'o',q:`Most browsers come equipped with TLS/SSL and most Web servers have implemented the protocol`,
o:[`TRUE`,`FALSE`],a:0,
zh:`大多数浏览器都内置了 TLS/SSL，大多数 Web 服务器也实现了该协议。`,
ex:`对。P5-8："SSL is easy to apply and use because it is built in all major Web browsers (Edge, Opera, Chrome, Firefox, etc.) and servers." 只要用过 https:// 或看到地址栏的锁，就用过 SSL/TLS（P5-6）。`,
tip:`SSL/TLS 的最大优势就是“无处不在、开箱即用”。`,ref:`P5-6、P5-8`},

{id:'5.06',p:5,s:'o',q:`The firewall may be a single computer system or a set of two or more systems that cooperate to perform the firewall function.`,
o:[`TRUE`,`FALSE`],a:0,
zh:`防火墙可以是单台计算机，也可以是两台或更多系统协同实现防火墙功能。`,
ex:`对。P5-44：防火墙可以是硬件、软件或两者结合。P5-74 的 <b>Screened-subnet</b> 架构就是用两台过滤路由器（外部和内部）加中间的 DMZ 协同工作。`,
tip:`防火墙是一种“功能”，不一定是一台设备。`,ref:`P5-44、P5-69～P5-75`},

{id:'5.07',p:5,s:'o',q:`A traditional packet filter makes filtering decisions on an individual packet basis and does not take into consideration any higher layer context`,
o:[`TRUE`,`FALSE`],a:0,
zh:`传统包过滤器逐个包做过滤决定，不考虑任何更高层的上下文。`,
ex:`对。P5-55："Packet Filtering Firewall — Examines individual packets header based on source IP, destination IP, ports... <b>Stateless → no context of previous packets</b>." P5-58：静态包过滤 "Examines packets one at a time, in isolation"。要记住上下文，需要 Stateful Packet Inspection（SPI）。`,
tip:`包过滤 = 无状态、一个一个看；SPI = 有状态表。`,ref:`P5-55、P5-58、P5-59`},

{id:'5.08',p:5,s:'o',q:`The _________ is inserted between the premises network and the Internet to establish a controlled link and to erect an outer security wall or perimeter to protect the premises network from Internet-based attacks.`,
o:[`Firewall`,`Session ID`,`IP protocol field`,`All of the above`],a:0,
zh:`插在内部网络与互联网之间、建立受控连接并竖起外围安全墙的是什么？`,
ex:`<b>防火墙</b>。P5-42："At its most basic, a firewall is essentially the barrier that sits between a private internal network and the public Internet." 它的主要目的是放行无害流量、挡住危险流量。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`Firewall = 内网与外网之间的那道墙。`,ref:`P5-42`},

{id:'5.09',p:5,s:'o',q:`A _________ applies a set of rules to each incoming and outgoing IP packet and then forwards or discards the packet.`,
o:[`packet filtering firewall`,`IP protocol field`,`Both of the above`,`None of the above`],a:0,
zh:`对每个进出的 IP 包应用一组规则，然后转发或丢弃，这是什么？`,
ex:`<b>包过滤防火墙</b>：按规则（源 IP、目的 IP、端口等）逐包判断 allow 或 deny（P5-55、P5-57）。P5-52 的规则匹配例子：从上到下匹配，第一条命中的规则生效，最后一条通常是 Any/Any/Deny（默认拒绝）。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`包过滤：看包头，查规则，放行或丢弃。`,ref:`P5-52、P5-55、P5-57`},

{id:'5.10',p:5,s:'o',q:`An intruder transmitting packets from the outside with a source IP address field containing an address of an internal host is known as IP address _________.`,
o:[`spoofing`,`authentication`,`generation`,`None of the above`],a:0,
zh:`入侵者从外部发送源 IP 填成内部主机地址的数据包，这叫 IP 地址什么？`,
ex:`<b>IP 地址欺骗（spoofing）</b>。外部接口上不可能出现源地址是内部网段的合法包，所以防火墙很容易识别并丢弃（P5-58："It can stop attacks Packets with spoofed IP addresses"）。P1-65 也提到 DoS 攻击常用伪造源地址来隐藏身份。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`外部进来的包却带着内部地址 → spoofing。`,ref:`P5-58、P1-65`},

{id:'5.11',p:5,s:'o',q:`A __________ firewall controls the traffic between a personal computer or workstation on one side and the Internet or enterprise network on the other side`,
o:[`personnel`,`poxy server`,`application-level gateway`,`None of the above`],a:0,
zh:`控制个人电脑或工作站与互联网（或企业网）之间流量的是哪种防火墙？`,
ex:`<b>Personal firewall（个人防火墙）</b>，题目把 personal 误印成了 personnel。P5-53："A personal firewall (sometimes called a desktop firewall) is a software application used to protect a single Internet-connected computer." 它能挡黑客、阻止弹窗和某些 cookie、控制哪些程序能上网；但不能防邮件病毒（要靠杀毒软件），也需要定期更新规则。`,
op:[`✓（personal 的笔误）`,`✗ proxy 的笔误，代理服务器`,`✗ 应用层网关保护整个网络的应用`,`✗`],
tip:`单台电脑 → personal firewall。`,ref:`P5-53`},

{id:'5.12',p:5,s:'o',q:`The firewall can protect against attacks that bypass the firewall`,
o:[`TRUE`,`FALSE`],a:1,
zh:`防火墙能防御绕过它的攻击。`,
ex:`错。流量不经过防火墙，防火墙就管不着：例如内部人员作恶、U 盘带入恶意软件、员工私接 4G 热点、加密隧道（P5-54：No Protection Against Insider Threats；Bypass Risk）。P5-74 的结论："Firewalls alone cannot prevent all cyber threats; a layered security approach is necessary."`,
tip:`防火墙只管经过它的流量。`,ref:`P5-54、P5-74`},

{id:'5.13',p:5,s:'o',q:`Intrusion detection is based on the assumption that the behavior of the intruder differs from that of a legitimate user in ways that can be quantified.`,
o:[`TRUE`,`FALSE`],a:0,
zh:`入侵检测基于这样的假设：入侵者的行为与合法用户不同，并且这种差异可以量化。`,
ex:`对，这是 IDS 的基本假设（Stallings）。如果入侵者和正常用户的行为无法区分，IDS 就无从检测。异常检测先建立正常行为基线，偏离超过阈值（clipping level）就告警（P5-93）。`,
tip:`IDS 的前提：坏人的行为和好人不一样，而且能量化。`,ref:`P5-86、P5-93`},

{id:'5.14',p:5,s:'o',q:`Signature-based approaches attempt to define normal, or expected behavior, whereas anomaly approaches attempt to define proper behavior`,
o:[`TRUE`,`FALSE`],a:1,
zh:`基于特征的方法试图定义正常或预期行为，而异常方法试图定义恰当行为。`,
ex:`错，概念放错了位置。正确说法：<br>• <b>Signature-based</b>（knowledge-based）：匹配<b>已知攻击模式</b>（特征库），必须持续更新，对新攻击会漏报（false negative）；<br>• <b>Anomaly-based</b>（behavior-based）：先定义<b>正常行为基线</b>，偏离就告警，能发现新攻击，但误报（false positive）多（P5-87、P5-93）。`,
tip:`Signature 认“坏”；Anomaly 认“好”。`,ref:`P5-86、P5-87、P5-93`},

{id:'5.15',p:5,s:'o',q:`A _________ monitors the characteristics of a single host and the events occurring within that host for suspicious activity`,
o:[`host-based IDS`,`security intrusion`,`network-based IDS`,`None of the above`],a:0,
zh:`监控单台主机的特征和主机内发生的事件、寻找可疑活动的是什么？`,
ex:`<b>HIDS</b>（P5-90）："Examines activity only on a specific host — logs, audit trails, and network traffic coming into or leaving the host." 告警线索：登录失败、非正常时段登录、权限提升、新增用户账户。优点：能检查<b>解密后</b>的数据，误报较低。`,
op:[`✓`,`✗`,`✗ 监控网段流量`,`✗`],
tip:`单台主机 → HIDS；网段 → NIDS。`,ref:`P5-90～P5-92`},

{id:'5.16',p:5,s:'o',q:`A ________ monitors network traffic for particular network segments or devices and analyzes network, transport, and application protocols to identify suspicious activity`,
o:[`host-based IDS`,`security intrusion`,`network-based IDS`,`None of the above`],a:2,
zh:`监控特定网段或设备的流量，分析网络层、传输层和应用层协议以识别可疑活动的是什么？`,
ex:`<b>NIDS</b>（P5-87～P5-89）：解析网络流量，与攻击特征比对。优点：较少设备就能覆盖整个网段，成本低，能关联多台系统上的攻击。缺点：<b>流量加密后就失效</b>，也看不到主机内部的活动。`,
op:[`✗`,`✗`,`✓`,`✗`],
tip:`NIDS 怕加密；HIDS 能看到解密后的数据。`,ref:`P5-87～P5-89`},

{id:'5.17',p:5,s:'o',q:`__________ involves an attempt to define a set of rules or attack patterns that can be used to decide if a given behaviour is that of an intruder.`,
o:[`Profile based detection`,`Signature detection`,`Threshold detection`,`Anomaly detection`],a:3,alt:1,
zh:`试图定义一组规则或攻击模式、用来判断某行为是否来自入侵者的是哪种检测？`,
ex:`<span class="flag">⚠ 官方答案存疑</span><br>样题 PDF 把 <b>D. Anomaly detection</b> 标为答案，但按定义这句话描述的是 <b>B. Signature detection</b>：<br>• Stallings 原文："<b>Signature detection</b>: Involves an attempt to define a set of rules or attack patterns that can be used to decide that a given behavior is that of an intruder."<br>• 课件 P5-93："SIGNATURE-BASED IDS ... matches signatures, which are pre-configured, predetermined attack patterns."<br>• 本 Part 第 14 题也明确：signature 匹配攻击模式，anomaly 定义正常行为。<br>• 下一题（第 18 题）“收集合法用户行为数据”才是 anomaly detection。<br><b>结论</b>：概念上应选 B。本程序把 B 和 D 都判为正确。正式 quiz 如果原题照搬，答案键可能沿用 D，作答前请留意老师的口径。`,
op:[`✗ profile-based 是异常检测的一种子方法`,`✓ 按教材定义`,`✗ threshold 也是异常检测的子方法`,`官方标注的答案（疑似错误）`],
tip:`rules / attack patterns → Signature；normal behavior of legitimate users → Anomaly。`,ref:`P5-87、P5-93；样题 Q5-5`},

{id:'5.18',p:5,s:'o',q:`_________ involves the collection of data relating to the behavior of legitimate users over a period.`,
o:[`Profile based detection`,`Signature detection`,`Threshold detection`,`Anomaly detection`],a:3,
zh:`收集一段时间内合法用户行为数据的是哪种检测？`,
ex:`<b>Anomaly detection（异常检测）</b>。P5-93：Statistical anomaly-based IDS "Collects data from normal traffic and establishes a baseline"，之后定期采样与基线比较，超出 clipping level 就告警。能检测新型攻击，但误报多。Profile-based 和 threshold 都是异常检测下面的具体做法，题目问的是总称。`,
op:[`✗ 子方法`,`✗ 匹配攻击特征`,`✗ 子方法`,`✓`],
tip:`合法用户的行为基线 → Anomaly。`,ref:`P5-93`},

/* ---------- 自编题（依据课件 sld5） ---------- */
{id:'5.c1',p:5,s:'c',q:`HTTPS uses which default port number?`,
o:[`21`,`80`,`443`,`8080`],a:2,
zh:`HTTPS 默认使用哪个端口？`,
ex:`P5-5：HTTP 使用 <b>80</b> 端口，不加密；<b>HTTPS = HTTP + TLS</b>，使用 <b>443</b> 端口，提供机密性、完整性和服务器认证。HTTPS 因为要做 TLS 握手，会稍慢一些。`,
op:[`✗ FTP`,`✗ HTTP`,`✓`,`✗ 常见的备用 HTTP 端口`],
tip:`80 明文，443 加密。`,ref:`P5-4、P5-5`},

{id:'5.c2',p:5,s:'c',q:`Why was RSA key exchange removed from TLS 1.3?`,
o:[`RSA is too fast`,`It is not forward secret: if the server's private key is later obtained, recorded conversations can be decrypted`,`RSA cannot be used for signatures`,`Browsers do not support RSA`],a:1,
zh:`TLS 1.3 为什么移除了 RSA 密钥交换？`,
ex:`P5-20："RSA mode has a serious downside: it's <b>not forward secret</b>." 攻击者可以先录下加密的会话，日后一旦拿到服务器的 RSA 私钥，就能解密<b>过去所有</b>会话。所以 TLS 1.3 只保留 <b>ephemeral Diffie-Hellman</b>：每次会话生成新密钥对，单次泄露不影响过去的会话（Perfect Forward Secrecy）。RSA 在 TLS 1.3 中仍可用于<b>签名</b>（P5-21）。`,
op:[`✗`,`✓`,`✗ RSA 仍用于签名`,`✗`],
tip:`TLS 1.3：去掉 RSA 密钥交换，换成 ephemeral DH，实现前向保密（PFS）。`,ref:`P5-19～P5-21、P5-27`},

{id:'5.c3',p:5,s:'c',q:`Which is the correct order of operations in the SSL/TLS Record Protocol?`,
o:[`Encrypt → Compress → Fragment → Add MAC → Header`,`Fragment → Compress → Add MAC → Encrypt → Append header`,`Add MAC → Fragment → Encrypt → Compress → Header`,`Compress → Encrypt → Fragment → Add MAC → Header`],a:1,
zh:`SSL/TLS 记录协议的处理顺序是？`,
ex:`P5-14：Application Data → <b>Fragment</b>（分片）→ <b>Compress</b>（压缩）→ <b>Add MAC</b>（加消息认证码）→ <b>Encrypt</b>（加密）→ <b>Append SSL Record Header</b>（加记录头）。先压缩再加密是因为密文看起来是随机的，压缩不了。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`口诀：分、压、MAC、密、头。`,ref:`P5-14`},

{id:'5.c4',p:5,s:'c',q:`Which statement about SET (Secure Electronic Transaction) compared with SSL is correct?`,
o:[`SET is a two-party protocol like SSL`,`SET authenticates all parties (cardholder and merchant) with digital certificates and uses message encryption`,`SET is the most widely used e-commerce protocol today`,`With SET the merchant sees the customer's full card details`],a:1,
zh:`SET 与 SSL 相比，哪项正确？`,
ex:`P5-31～P5-38：<br>• SET 由 Visa、MasterCard、Microsoft、IBM、Netscape 等在 1996 年设计，是<b>多方</b>协议，为每个参与方提供身份认证；<br>• SET 加密的是<b>消息</b>，不是信道；<br>• 商家<b>看不到</b>客户的账户信息（交给支付网关处理）；<br>• 客户要对支付指令做数字签名，难以抵赖；<br>• 但需要银行、商家、客户三方都安装软件，所以<b>几乎没人用</b>。<br>SSL 是两方协议，只做服务器认证，用得很多。`,
op:[`✗ SSL 才是两方协议`,`✓`,`✗ 几乎没人用`,`✗ 恰恰相反`],
tip:`SSL：两方、信道加密、商家担责；SET：多方、消息加密、支付网关担责。`,ref:`P5-30～P5-38`},

{id:'5.c5',p:5,s:'c',q:`A Stateful Packet Inspection (SPI) firewall differs from a static packet filter because it:`,
o:[`Examines each packet in isolation`,`Keeps a state table of active connections and allows inbound packets that are responses to internally-initiated connections`,`Never inspects packet headers`,`Can only be installed on a personal computer`],a:1,
zh:`状态包检测（SPI）防火墙与静态包过滤有什么不同？`,
ex:`P5-59：SPI 用<b>状态表</b>记录每个连接（IP、端口、序列号），只放行“内网先发起的连接”的回包。优点：便宜、安全，几乎所有边界防火墙都在用（P5-64）。缺点：维护状态表要额外处理，可能被 DoS 拖垮。`,
op:[`✗ 那是静态包过滤`,`✓`,`✗`,`✗`],
tip:`SPI = 包过滤 + 记住会话。`,ref:`P5-57～P5-64`},

{id:'5.c6',p:5,s:'c',q:`Which firewall architecture uses two filtering routers/firewalls to create a DMZ where public-facing servers are placed?`,
o:[`Packet filtering router`,`Single-host (screened host) firewall`,`Dual-homed host firewall`,`Screened-subnet firewall`],a:3,
zh:`哪种防火墙架构用两台过滤路由器或防火墙形成 DMZ，用来放置面向公众的服务器？`,
ex:`P5-74～P5-75：<b>Screened-subnet</b> 架构用外部和内部两台过滤路由器，中间是 DMZ（Web 服务器等放在这里）。优点：三层防御；外部路由器只向互联网宣告 DMZ 的存在，内网对互联网不可见；内网主机也无法直接建立到互联网的路由。`,
op:[`✗ 第一代，单路由器`,`✗ 路由器加堡垒主机`,`✗ 双网卡主机，单点故障`,`✓`],
tip:`看到 DMZ 就选 screened subnet。`,ref:`P5-69～P5-75`},

{id:'5.c7',p:5,s:'c',q:`Firewall rules (checked top-down): 1) Src 192.168.1.0/24, Dst Any, Port 80 → Allow; 2) Src Any, Dst 10.0.0.5, Port 22 → Deny; 3) Any, Any, Any → Deny. A packet has Src 192.168.1.30, Dst 10.0.0.5, Port 443. What happens?`,
o:[`Allowed by Rule 1`,`Denied by Rule 2`,`Denied by Rule 3`,`Allowed because no rule matches`],a:2,
zh:`防火墙规则从上到下匹配，这个包（端口 443）会怎样？`,
ex:`逐条匹配（P5-52 Example Query 3）：<br>• Rule 1：源地址匹配，但端口 443 ≠ 80 → 不匹配；<br>• Rule 2：目的地址匹配，但端口 443 ≠ 22 → 不匹配；<br>• Rule 3：Any/Any/Any → 匹配 → <b>Deny</b>。<br>最后一条“全部拒绝”就是默认拒绝策略。`,
op:[`✗ 端口不符`,`✗ 端口不符`,`✓`,`✗ 默认规则兜底`],
tip:`从上到下，命中即停；每个字段都要匹配才算命中。`,ref:`P5-52`},

{id:'5.c8',p:5,s:'c',q:`What is the key difference between an IDS and an IPS?`,
o:[`IDS blocks attacks; IPS only alerts`,`IDS only detects and alerts (passive); IPS detects and actively blocks threats in real time`,`They are identical`,`IPS is only for hosts, IDS only for networks`],a:1,
zh:`IDS 和 IPS 的关键区别是什么？`,
ex:`P5-94：<b>IDS</b> 是被动的，检测后记录日志并告警，适合取证分析；<b>IPS</b> 是主动的，在流量到达系统之前检查并实时阻断，常集成在下一代防火墙（NGFW）中。P5-86 也写着 IDS 的缺点之一是 "No Active Protection ... (IPS does)"。`,
op:[`✗ 说反了`,`✓`,`✗`,`✗ 两者都有主机型和网络型`],
tip:`D = Detect（只报警）；P = Prevent（会拦截）。`,ref:`P5-86、P5-94`},

{id:'5.c9',p:5,s:'c',q:`A sacrificial computer system intended to attract cyberattacks like a decoy is called a:`,
o:[`Bastion host`,`Honeypot`,`Proxy server`,`DMZ`],a:1,
zh:`作为诱饵、专门吸引网络攻击的“牺牲”系统叫什么？`,
ex:`<b>Honeypot（蜜罐）</b>（P5-95）：故意留下漏洞，看起来像真实系统（如客户计费系统），用来吸引攻击者、研究他们的手法，或把他们从真实目标引开。局限：无法检测真实系统上的入侵，也不一定能识别攻击者。`,
op:[`✗ 堡垒主机是加固过的防火墙主机`,`✓`,`✗`,`✗`],
tip:`Honeypot = 引蛇出洞。`,ref:`P5-95`},

{id:'5.c10',p:5,s:'c',q:`A firewall can process 100,000 packets per second. Average packet size is 1000 bytes and link speed is 1 Gbps. Can it handle the load?`,
o:[`Yes, it needs only 12,500 pps`,`Yes, it needs only 100,000 pps`,`No, the link requires 125,000 pps`,`No, the link requires 1,000,000 pps`],a:2,
zh:`防火墙每秒能处理 10 万个包，平均包长 1000 字节，链路 1 Gbps，扛得住吗？`,
ex:`所需 pps = 带宽 ÷ (包长 × 8) = 1,000,000,000 ÷ 8,000 = <b>125,000 pps</b>。<br>防火墙能力 100,000 < 125,000，<b>扛不住</b>（P5-78 Example 2）。如果防火墙能力是 200,000 pps，就扛得住（Example 1）。`,
op:[`✗ 除错了`,`✗`,`✓`,`✗ 忘了 ×8`],
tip:`和 DoS 包速率题是同一个公式。`,ref:`P5-76～P5-78`},

{id:'5.c11',p:5,s:'c',q:`What is a key disadvantage of a Network-based IDS (NIDS)?`,
o:[`It requires an agent on every host`,`It is ineffective when traffic is encrypted`,`It cannot see any network traffic`,`It is more expensive to deploy than HIDS on every host`],a:1,
zh:`网络型 IDS（NIDS）的一个主要缺点是什么？`,
ex:`P5-89：NIDS 的缺点是 "<b>ineffective when traffic is encrypted</b>"，而且不了解主机内部的活动。HIDS 正好互补："Can examine data after it has been decrypted"（P5-90）。`,
op:[`✗ 那是 HIDS 的缺点`,`✓`,`✗`,`✗ NIDS 通常更便宜`],
tip:`加密流量让 NIDS 失明；P5-80 也说攻击者用 TLS 隧道绕过防火墙。`,ref:`P5-89、P5-90、P5-80`},

{id:'5.c12',p:5,s:'c',q:`In SSL/TLS, session keys shorter than ______ bits are considered insecure.`,
o:[`40`,`64`,`128`,`2048`],a:2,
zh:`SSL/TLS 中，会话密钥短于多少位被认为不安全？`,
ex:`P5-11：会话密钥一般在 40～256 位之间，"Anything lower than <b>128-bit</b> is considered insecure." 公钥和私钥则建议 2048 位（512 位弱，1024 位也能被破解）。如果浏览器支持 256 位而服务器只支持 128 位，连接就按 128 位建立。`,
op:[`✗`,`✗`,`✓`,`✗ 那是推荐的公钥长度`],
tip:`会话密钥 ≥ 128；RSA 密钥 ≥ 2048。`,ref:`P5-11`},

{id:'5.c13',p:5,s:'c',q:`Which firewall technology offers the best security but the lowest performance?`,
o:[`Packet filtering`,`Stateful packet inspection`,`Application proxy (gateway)`,`Personal firewall`],a:2,
zh:`哪种防火墙技术安全性最好但性能最低？`,
ex:`P5-68 对比表（数字越小越好）：<br>• Packet Filter：安全 3、性能 1（最快、最不智能）；<br>• SPI：安全 2、性能 2；<br>• <b>App Gateway / Proxy</b>：安全 1、性能 4（最安全、最慢）。<br>代理能看到完整的应用层协议，日志和审计也方便（P5-65）。`,
op:[`✗ 最快`,`✗ 折中`,`✓`,`✗`],
tip:`看得越深越安全，也越慢。`,ref:`P5-65～P5-68`},

{id:'5.c14',p:5,s:'c',q:`Which TLS 1.3 improvement is NOT correct?`,
o:[`Removes outdated algorithms such as RSA key exchange and SHA-1`,`Faster handshake (round trips reduced from 2 to 1)`,`Provides Perfect Forward Secrecy`,`Restores backward compatibility with SSL 2.0`],a:3,
zh:`下列关于 TLS 1.3 改进的说法，哪项错误？`,
ex:`P5-9、P5-27：TLS 1.3 移除了过时算法（RSA 密钥交换、SHA-1、DES、3DES、MD5、RC4）；握手往返从 2 次减到 1 次；提供完美前向保密；使用更强的加密（ChaCha20、AES）。它<b>取消</b>了与 SSL 的向后兼容（TLS 1.2 及以前还兼容 SSL 3.0）。`,
op:[`✗ 正确说法`,`✗ 正确说法`,`✗ 正确说法`,`✓ 错误：1.3 恰恰去掉了兼容`],
tip:`TLS 1.3：更少、更快、更安全。`,ref:`P5-9、P5-26、P5-27`}
]);

/* Part 6 · Blockchain, Payments, Cryptocurrencies, DeFi, Case Studies (sld6) — 全部为自编题 */
window.MCQ = (window.MCQ || []).concat([
{id:'6.c1',p:6,s:'c',q:`Which network type is generally considered more secure because it has no single point of attack?`,
o:[`Mainframe with dumb terminals`,`Client-server`,`Peer-to-peer (decentralized)`,`Centralized database`],a:2,
zh:`哪种网络结构因为没有单一攻击点而通常被认为更安全？`,
ex:`P6-3 计算架构的演进：<br>• Mainframe：集中式，所有计算和存储都在主机，终端只负责输入输出；<br>• Client-server：分布式计算能力；<br>• <b>Peer-to-peer</b>：去中心化，"P2P networks are generally considered to be more secure than centralized networks, as they do not have a single point of attack."<br>区块链就是 P2P 网络，每个节点都持有账本副本（P6-10）。`,
op:[`✗ 集中式`,`✗`,`✓`,`✗`],
tip:`去中心化 = 没有单点故障或单点攻击。`,ref:`P6-3、P6-10`},

{id:'6.c2',p:6,s:'c',q:`Who introduced Bitcoin and the first fully functional blockchain (whitepaper 2008)?`,
o:[`Vitalik Buterin`,`Satoshi Nakamoto`,`Stuart Haber and W. Scott Stornetta`,`Gavin Wood`],a:1,
zh:`谁提出了比特币和第一个完整可用的区块链（2008 年白皮书）？`,
ex:`P6-21：2008 年，化名 <b>Satoshi Nakamoto</b> 的个人或团体发表白皮书 "Bitcoin: A Peer-to-Peer Electronic Cash System"，2009 年上线（P6-5 称 2009 年引入了第一个分布式账本）。<b>1991 年 Haber & Stornetta</b> 提出了用密码学保护的区块链来给文档打时间戳，是概念先驱。Nakamoto 把密码学、PoW 共识和去中心化网络结合起来，做成了第一个完整的区块链。`,
op:[`✗ 以太坊联合创始人`,`✓`,`✗ 1991 年的概念先驱`,`✗ 提出 Proof of Authority 的以太坊前 CTO`],
tip:`1991 Haber & Stornetta → 2008 白皮书 → 2009 比特币上线 → 2015 以太坊。`,ref:`P6-5、P6-21`},

{id:'6.c3',p:6,s:'c',q:`"Once recorded, transactions cannot be altered or deleted." This blockchain characteristic is:`,
o:[`Transparency`,`Immutability`,`Decentralization`,`Consensus`],a:1,
zh:`“交易一旦记录就不能修改或删除”，这是区块链的哪个特征？`,
ex:`P6-6 关键特征：<br>• Decentralization：没有单一实体控制；<br>• Transparency：参与者都能看到交易；<br>• <b>Immutability</b>：一旦记录不可更改或删除，保证数据完整性；<br>• Security：用哈希和数字签名保证真实性；<br>• Consensus：所有节点就交易有效性达成一致。<br>P6-8：像用墨水写的账本，记错了要再写一笔来更正，而不是擦掉。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`Immutable = unchanging over time。`,ref:`P6-6～P6-9`},

{id:'6.c4',p:6,s:'c',q:`What links each block to the previous one to form a chain?`,
o:[`The block's timestamp only`,`A reference to the previous block's hash`,`The miner's IP address`,`The user's password`],a:1,
zh:`什么把每个区块和前一个区块连成链？`,
ex:`P6-25：每个区块包含 ① 交易列表 ② 自身哈希 ③ <b>前一个区块的哈希</b>（Prev Hash）。改动任何一个旧区块，它的哈希就会变，后面所有区块里记录的 Prev Hash 都对不上，必须全部重算。这就是“几乎不可篡改”的原因（P6-26）。`,
op:[`✗ 有时间戳，但真正链接的是哈希`,`✓`,`✗`,`✗`],
tip:`Block #101 的 Prev Hash = Block #100 的 Hash。`,ref:`P6-22、P6-25、P6-26`},

{id:'6.c5',p:6,s:'c',q:`Bitcoin's Proof-of-Work puzzle is based on which hash algorithm?`,
o:[`MD5`,`SHA-1`,`SHA-256`,`RSA`],a:2,
zh:`比特币的工作量证明谜题基于哪种哈希算法？`,
ex:`P6-63："This is called the Proof-of-Work. In Bitcoin, it is based on the <b>SHA 256</b> Hash algorithm." 矿工竞相找到能把新区块和前一块连起来的哈希，先解出的人可以添加区块，并获得 <b>coinbase 交易</b>奖励，这也是产生新比特币的<b>唯一</b>方式。`,
op:[`✗ 已不安全`,`✗ 已不安全`,`✓`,`✗ 不是哈希`],
tip:`比特币 = PoW + SHA-256；上限 2100 万枚。`,ref:`P6-61、P6-63`},

{id:'6.c6',p:6,s:'c',q:`In which consensus mechanism do validators invest in the coins of the system and validate blocks by placing a bet (stake)?`,
o:[`Proof of Work`,`Proof of Stake`,`Proof of Burn`,`Proof of Capacity`],a:1,
zh:`哪种共识机制中，验证者投资系统代币，以下注（质押）的方式验证区块？`,
ex:`P6-13：<br>• <b>PoW</b>：解复杂数学题，耗算力（比特币）；<br>• <b>PoS</b>：验证者投入（质押）代币下注（<b>Ethereum 2.0</b>）；<br>• <b>DPoS</b>：代币持有者投票选代表来验证，更高效；<br>• <b>PoB</b>：把币发到无法取回的地址，表示长期承诺，浪费资源所以不流行；<br>• <b>Proof of Capacity</b>：投入硬盘空间，空间越大越容易被选中。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`Work 耗算力；Stake 押币；Burn 烧币；Capacity 押硬盘。`,ref:`P6-13`},

{id:'6.c7',p:6,s:'c',q:`Which consensus algorithm, developed with Intel hardware, makes all nodes wait a random amount of time and is widely used in permissioned networks?`,
o:[`Proof of Elapsed Time (PoET)`,`Proof of Authority (PoA)`,`Byzantine Fault Tolerance (BFT)`,`Directed Acyclic Graph (DAG)`],a:0,
zh:`哪种共识算法借助 Intel 硬件，让所有节点随机等待一段时间，广泛用于许可链？`,
ex:`P6-14：<br>• <b>PoET</b>：所有节点随机等待，等待最短者出块，被认为是最公平的之一（Intel 开发硬件支持）；<br>• <b>PoA</b>：基于可信方的声誉，适合私链，Gavin Wood 于 2017 年提出；<br>• <b>BFT</b>：存在恶意节点时也能达成共识（如 Hyperledger Fabric）；<br>• <b>DAG</b>：区块链的替代结构，可并行验证（如 IOTA）。`,
op:[`✓`,`✗ 靠声誉`,`✗ 容忍恶意节点`,`✗ IOTA`],
tip:`Elapsed Time = 随机等待；Authority = 声誉；DAG = IOTA。`,ref:`P6-14`},

{id:'6.c8',p:6,s:'c',q:`Which programming language is used to write smart contracts on Ethereum?`,
o:[`Python`,`Solidity`,`Haskell`,`COBOL`],a:1,
zh:`以太坊上的智能合约用什么语言编写？`,
ex:`P6-15、P6-67：Ethereum 有自己的编程语言 <b>Solidity</b>，拥有最大的智能合约生态（DeFi、NFT）。其他平台：Solana（Rust、C、C++）、Binance Smart Chain（Solidity，兼容 EVM）、Cardano（Plutus，基于 Haskell）、Polkadot（Ink!、Rust）。`,
op:[`✗`,`✓`,`✗ Cardano 的 Plutus 基于 Haskell`,`✗`],
tip:`以太坊：Solidity + 智能合约 + PoS。`,ref:`P6-15、P6-67`},

{id:'6.c9',p:6,s:'c',q:`Which smart contract risk is described as "can't correct errors once deployed"?`,
o:[`Code vulnerabilities`,`Immutability risks`,`Scalability`,`Legal issues`],a:1,
zh:`哪种智能合约风险被描述为“部署后无法更正错误”？`,
ex:`P6-18 智能合约的挑战：<br>• Code vulnerabilities：代码 bug 会被利用；<br>• <b>Immutability risks</b>：部署后无法更正错误；<br>• Scalability：受区块链网络性能限制；<br>• Legal issues：监管和法律效力尚不明确。<br>不可篡改是区块链的优点，放到智能合约上也会变成风险。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`不可篡改有两面：防篡改，但也改不了 bug。`,ref:`P6-18`},

{id:'6.c10',p:6,s:'c',q:`In which type of blockchain can anyone read, transact and participate in the consensus process (e.g., Bitcoin, Ethereum)?`,
o:[`Public`,`Private`,`Consortium`,`Permissioned`],a:0,
zh:`哪种区块链任何人都能读、能交易、能参与共识（如比特币、以太坊）？`,
ex:`P6-30：<br>• <b>Public</b>：任何人可读、可交易、可参与共识，代码开源（Bitcoin、Ethereum）；<br>• <b>Private</b>：仅限一个组织或团体，可以限制读权限（课件举例 Ripple、Multichain、Corda）；<br>• <b>Permissioned</b>：需要邀请才能加入；<br>• <b>Consortium</b>：多个组织协作，适合所有参与者都需许可且共担责任的业务（R3、Hyperledger、Fabric）；<br>• <b>Hybrid</b>：公私结合（XinFin）。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`公链人人可进；联盟链是多家机构合作。`,ref:`P6-30`},

{id:'6.c11',p:6,s:'c',q:`A blockchain adds a new 1 MB block every 10 minutes and the average transaction size is 250 bytes. What is the approximate transactions per second (TPS)?`,
o:[`0.4 TPS`,`6.67 TPS`,`400 TPS`,`4000 TPS`],a:1,
zh:`区块链每 10 分钟出一个 1 MB 的块，平均交易大小 250 字节，TPS 大约是多少？`,
ex:`① 每块交易数 TPB = 区块大小 ÷ 交易大小 = 1,000,000 ÷ 250 = <b>4000 笔/块</b>；<br>② TPS = TPB ÷ 出块时间 = 4000 ÷ 600 s ≈ <b>6.67 TPS</b>（P6-34）。`,
op:[`✗`,`✓`,`✗`,`✗ 那是每块交易数，不是每秒`],
tip:`TPS = (区块大小 ÷ 交易大小) ÷ 出块秒数。`,ref:`P6-34、P6-35`},

{id:'6.c12',p:6,s:'c',q:`A blockchain processes 200 TPS with an average transaction size of 750 bytes. What is the data throughput?`,
o:[`0.15 Mbps`,`1.2 Mbps`,`12 Mbps`,`150 Mbps`],a:1,
zh:`区块链每秒处理 200 笔交易，平均 750 字节，数据吞吐量是多少？`,
ex:`bytes/s = 200 × 750 = 150,000 B/s；bits/s = 150,000 × 8 = 1,200,000 bit/s；Mbps = 1,200,000 ÷ 10<sup>6</sup> = <b>1.2 Mbps</b>。<br>⚠ 课件 P6-36 这一步写成了 “12 000 000 bits/second”，多写了一个 0，但最终结果 1.2 Mbps 是对的。`,
op:[`✗ 忘了 ×8`,`✓`,`✗ 照抄课件笔误的 12,000,000`,`✗`],
tip:`吞吐量 = TPS × 交易字节 × 8 ÷ 10<sup>6</sup>。`,ref:`P6-35、P6-36`},

{id:'6.c13',p:6,s:'c',q:`Which is TRUE about Bitcoin?`,
o:[`It has no supply limit`,`It has a capped supply of 21 million coins and uses Proof-of-Work`,`It supports Solidity smart contracts`,`It is controlled by a central bank`],a:1,
zh:`关于比特币，哪项正确？`,
ex:`P6-61、P6-73：比特币是去中心化数字货币，使用公链，供应<b>上限 2100 万枚</b>（目前流通约 1931 万），采用 <b>PoW</b>，<b>不支持</b>智能合约。对比 Ethereum：供应没有固定上限，现在用 PoS，支持智能合约，定位是去中心化应用平台。`,
op:[`✗ 那是以太坊`,`✓`,`✗ 那是以太坊`,`✗`],
tip:`BTC：2100 万、PoW、无智能合约；ETH：无上限、PoS、有智能合约。`,ref:`P6-61、P6-67、P6-73`},

{id:'6.c14',p:6,s:'c',q:`In Bitcoin, what is the ONLY way to create valid new bitcoins?`,
o:[`The central bank prints them`,`The miner who solves the PoW puzzle adds a coinbase transaction`,`Users copy existing coins`,`Exchanges mint them`],a:1,
zh:`在比特币中，产生新币的唯一合法方式是什么？`,
ex:`P6-63："As an incentive, he has the right to add a so-called <b>Coinbase transaction</b> that gives him a specific number of Bitcoins. This is the only way to create valid Bitcoins." 解出 PoW 谜题的矿工获得这个奖励。`,
op:[`✗`,`✓`,`✗ 那是双花`,`✗`],
tip:`Coinbase 交易 = 矿工奖励 = 新币唯一来源。`,ref:`P6-63`},

{id:'6.c15',p:6,s:'c',q:`"Double-spending" in a digital cash scheme means:`,
o:[`Paying twice the price`,`The same digital token is spent more than once because a digital file can be duplicated`,`Using two different currencies`,`Paying with both credit and debit card`],a:1,
zh:`数字现金中的“双花”是什么意思？`,
ex:`P6-56："A potential flaw in a digital cash scheme in which the <b>same single digital token can be spent more than once</b>. This is possible because a digital token consists of a digital file that can be duplicated." 银行的解法是用中心化账本记录谁拥有什么；比特币用公开的区块链和 PoW 解决了这个问题（P6-55）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`数字现金两大难题：匿名性、双花（P6-55）。`,ref:`P6-55、P6-56`},

{id:'6.c16',p:6,s:'c',q:`Fiat money is:`,
o:[`Backed by gold`,`Backed by the issuing government`,`A cryptocurrency`,`Backed by commodities such as cocoa beans`],a:1,
zh:`法定货币（fiat money）由什么背书？`,
ex:`P6-41、P6-56：自 20 世纪 70 年代初脱离金本位后，货币不再由金银背书，而是由<b>发行国政府</b>背书。fiat 是拉丁语“let it be done”的意思。缺点：中心化，发行数量没有上限（如无限量化宽松）。P6-38：MONEY = VALUE = TRUST。`,
op:[`✗ 金本位已放弃`,`✓`,`✗`,`✗ 早期商品货币`],
tip:`Fiat 靠对政府的信任。`,ref:`P6-38～P6-41、P6-56`},

{id:'6.c17',p:6,s:'c',q:`How does the Ripple network validate transactions?`,
o:[`Bitcoin-style Proof-of-Work mining`,`A unique distributed consensus mechanism in which participating nodes verify authenticity by conducting a poll`,`Proof of Burn`,`A single central server`],a:1,
zh:`Ripple 网络怎样验证交易？`,
ex:`P6-71：Ripple 是 XRP 背后的公司和网络，2012 年推出，用作两种货币或网络之间的中间交换媒介，功能类似 SWIFT。XRP 是<b>预挖</b>的；它不用挖矿，而是用一种独特的分布式共识，由参与节点<b>投票（poll）</b>验证交易。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`Ripple / XRP：预挖、投票共识、跨境支付。`,ref:`P6-71`},

{id:'6.c18',p:6,s:'c',q:`According to the lecture, what is a "scaling risk" of DeFi?`,
o:[`Ethereum can process about 15 transactions per second while Visa can process about 65,000`,`DeFi is too fast to regulate`,`DeFi has no smart contracts`,`DeFi only works offline`],a:0,
zh:`按课件，DeFi 的“扩展性风险”是什么？`,
ex:`P6-79 DeFi 风险：<br>• Volatility：建立在高波动的加密资产上；<br>• Immature Technology：技术不成熟，未经大规模、长时间的压力测试；<br>• <b>Scaling Risk</b>：共识机制慢，<b>以太坊约 15 TPS，Visa 约 65,000 TPS</b>。<br>DeFi 的好处：去中心化、可及性（服务无银行账户的人）、透明、安全（P6-78）。`,
op:[`✓`,`✗`,`✗ DeFi 依赖智能合约`,`✗`],
tip:`ETH 15 vs Visa 65,000。`,ref:`P6-78、P6-79`},

{id:'6.c19',p:6,s:'c',q:`What did the 2017 Equifax breach exploit?`,
o:[`A zero-day in Windows`,`An unpatched Apache Struts vulnerability in its online dispute portal`,`A phishing email to the CEO`,`A DDoS by the Mirai botnet`],a:1,
zh:`2017 年 Equifax 数据泄露利用了什么？`,
ex:`P6-102～P6-106：3 月 7 日 Apache 公布了 Struts 漏洞并提供补丁；3 月 8 日 US-CERT 通知了 Equifax；3 月 10 日黑客就通过<b>在线争议门户</b>里未打补丁的 Struts 入侵，导致 1.47 亿人数据被盗。Equifax 自己的策略要求 48 小时内打补丁，但服务器 5 个月后才修好；SSL 证书过期近 10 个月没续，导致数据外泄没被发现。教训：打好基础补丁、按需知密（need to know）的数据访问、监控异常行为（9000 次快速查询本该引起警觉）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`Equifax = 没打补丁（Struts）+ 证书过期 + 内网横向移动。`,ref:`P6-101～P6-106`},

{id:'6.c20',p:6,s:'c',q:`In the 2016 Bangladesh Central Bank heist, how did the attackers delay detection of the fraudulent SWIFT transfers?`,
o:[`They encrypted the bank's database`,`They disabled the bank's SWIFT notification printers with malware`,`They launched a DDoS against the Federal Reserve`,`They bribed the auditors`],a:1,
zh:`2016 年孟加拉央行劫案中，攻击者怎样推迟了欺诈 SWIFT 转账被发现的时间？`,
ex:`P6-108～P6-110：攻击者潜伏了数月，冒充 BCB 通过 <b>SWIFT</b> 向纽约联储发送转账指令；SWIFT 通常把转账通知发到银行的打印机上，攻击者用恶意软件<b>让打印机失灵</b>，还关掉了监控摄像头，又选在三天连休的周末动手。原计划转走 10 亿美元，因为把 “foundation” 拼成 “fandation” 等错误，只成功转走 8100 万美元。教训：共用密码、人为失误或内鬼、USB 传播的恶意软件、国际法律漏洞。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`孟加拉劫案：SWIFT + 打印机 + 长周末 + 拼写错误。`,ref:`P6-107～P6-110、P1-17`},

{id:'6.c21',p:6,s:'c',q:`What is the correct order of the incident response stages in the lecture?`,
o:[`Punish → Detect → Repair → Stop`,`Detect → Stop → Repair → Punish`,`Stop → Detect → Punish → Repair`,`Repair → Stop → Detect → Punish`],a:1,
zh:`课件中事件响应阶段的正确顺序是？`,
ex:`P6-113：<b>Detecting</b> the attack → <b>Stopping</b> the attack → <b>Repairing</b> the damage → <b>Punishing</b> the attacker。P6-112："Response should be 'reacting according to plan'"；P6-114：要<b>演练（rehearsals）</b>，既能发现计划中的问题，又能提高响应速度。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`发现 → 止损 → 修复 → 追责。`,ref:`P6-112～P6-114`},

{id:'6.c22',p:6,s:'c',q:`A Computer Security Incident Response Team (CSIRT) is convened when:`,
o:[`Any single password is reset`,`A major incident occurs that the on-duty security staff cannot handle`,`A new employee joins`,`The firewall is updated`],a:1,
zh:`什么时候召集计算机安全事件响应小组（CSIRT）？`,
ex:`P6-112："Major incidents are incidents the on-duty security staff cannot handle. Company must convene a CSIRT." 成员应包括：高层管理者、安全人员、IT 人员、受影响业务部门的人员，以及<b>公关和法务</b>部门。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`CSIRT 不只有技术人员，还要有高管、公关和法务。`,ref:`P6-112`},

{id:'6.c23',p:6,s:'c',q:`Which is listed in the lecture as one of the two big problems of digital cash?`,
o:[`How to guarantee anonymity`,`How to print the coins`,`How to make coins heavier`,`How to remove encryption`],a:0,
zh:`课件列出的数字现金两大难题之一是什么？`,
ex:`P6-55：数字现金的理想属性是 Secure、Anonymous、Portable、Reusable、User-friendly，没有已知系统能全部满足。<b>两大难题</b>：① 如何保证<b>匿名性</b>？② 如何避免<b>双花</b>？比特币在 2009 年给出了一个解决双花的方案。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`数字现金难题：匿名 + 双花。`,ref:`P6-55`},

{id:'6.c24',p:6,s:'c',q:`What are the three e-payment goals listed in the lecture?`,
o:[`Speed, Color, Size`,`Integrity, Accountability, Privacy`,`Availability, Mining, Staking`,`Hashing, Signing, Burning`],a:1,
zh:`课件列出的电子支付三大目标是什么？`,
ex:`P6-49：<br>• <b>Integrity</b>：币不能伪造，合法交易会被兑付；<br>• <b>Accountability</b>：交易事后不能否认，纠纷能高效解决；<br>• <b>Privacy</b>：某些参与方的身份不向其他方透露，数字现金不可追踪到付款人或收款人。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`支付三目标：不能伪造、不能抵赖、保护隐私。`,ref:`P6-49`},

{id:'6.c25',p:6,s:'c',q:`Which statement about the differences between blockchains and relational databases is correct?`,
o:[`Blockchain administrators can easily edit or delete data`,`A blockchain is a write-only (append-only) structure with no admin permissions to edit or delete, while a relational database can be modified by DBAs`,`Relational databases were designed for decentralized applications`,`They are identical`],a:1,
zh:`关于区块链和关系型数据库的区别，哪项正确？`,
ex:`P6-19：区块链是<b>只追加（write-only / append-only）</b>的数据结构，新条目通过链接前一块的哈希追加到末尾，没有管理员权限可以编辑或删除数据；关系型数据库的 DBA 可以随意修改数据和结构。区块链为去中心化应用设计，数据库最初为单一实体控制的中心化应用设计。`,
op:[`✗`,`✓`,`✗ 说反了`,`✗`],
tip:`区块链只增不改；数据库增删改查都可以。`,ref:`P6-19`},

{id:'6.c26',p:6,s:'c',q:`According to the lecture summary, the Internet was the "first digital revolution". What is the "second digital revolution"?`,
o:[`Cloud computing`,`Blockchain technology, facilitating peer-to-peer transactions without intermediaries`,`Social media`,`5G networks`],a:1,
zh:`按课件总结，互联网是“第一次数字革命”，“第二次数字革命”是什么？`,
ex:`P6-98："First Digital Revolution: The Internet ... is great for collaboration and communication, but is deeply flawed when it comes to commerce, privacy and trust. Second Digital Revolution: The <b>Blockchain</b> technology facilitates peer-to-peer transactions without any intermediary." 课程目标中也说 "Blockchain is considered second digital revolution"（P1-2）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`互联网传信息，区块链传价值与信任。`,ref:`P6-98、P1-2`}
]);

/* Q and A.pdf — 33 open questions (final-exam style). key = English model answer (condensed), jiang = 中文讲解 */
window.QA = [
{id:'Q1',p:1,q:`What is cyber security?`,
zh:`什么是网络安全？`,
key:`<ul><li>Cyber security is the protection of Internet-connected resources — <b>hardware, software and data</b> — from <b>unauthorized use, modification and theft</b> (and physical damage).</li><li>Examples: John uses the Internet to copy Mary's data and then crashes her system; Henry spoofs Julie's IP address to gain access to her computer; John steals ABC bank's data and sells it for $2 million.</li><li>Thus cyber security refers to the <b>policies, procedures and technical measures</b> applied to prevent unauthorized access, alteration, theft or physical damage to smart devices and information systems.</li><li>It aims to preserve the <b>CIA triad</b> (Confidentiality, Integrity, Availability) and is achieved through Products, People and Procedures.</li></ul>`,
jiang:`<p><b>答题框架</b>：定义（保护什么 → 防范什么）→ 2～3 个例子 → 结论句 → 加分点。</p><p>• 保护对象：hardware / software / data；防范：unauthorized use / modification / theft。<br>• 结论句一定要写出 <b>policies + procedures + technical measures</b>：本课程反复强调技术与管理缺一不可（Q18）。<br>• 加分：CIA 三元组（P1-8）、Products-People-Procedures 三实体（P1-10）。</p>`},

{id:'Q2',p:1,q:`Suppose that a network computer virus is designed such a way that as soon as it is copied onto a computer, X, it simply copies itself to six of computer X's neighboring computers and each time it uses a random file name, in order to evade detection. The virus itself does not cause any other damage (it doesn't read, delete or modify any other files). What harm would be done by such a virus and how would it be detected?`,
zh:`一种病毒一被复制到电脑 X，就把自己复制到 X 的 6 台邻近电脑上，每次换一个随机文件名以逃避检测。它本身不读、不删、不改任何文件。它会造成什么危害？怎样检测？`,
key:`<ul><li>Based on the true story of Cornell student <b>Robert Morris</b>; his program (more properly a <b>worm</b>) brought the Internet to its knees.</li><li>Each infected machine copies to 6 neighbours, which copy back to X and onward: 6 → 36 → 216 → … copies grow <b>exponentially</b>.</li><li>Soon X's disk fills with copies; the copies also consume all available <b>bandwidth and CPU</b>, eventually crashing X. It is therefore a <b>denial-of-service (DoS)</b> attack, even without a destructive payload.</li><li>Detection: look for <b>unusual activity</b> — sudden surges in network traffic, mail activity, slowdowns — and investigate. Because random file names defeat signature matching, <b>anomaly-based</b> detection is needed.</li></ul>`,
jiang:`<p><b>关键洞察</b>：“不破坏文件”不等于“无害”。病毒没有 payload，但自我复制本身就会耗尽资源，破坏的是 CIA 中的 <b>Availability</b>。</p><p><b>指数增长</b>：第 k 轮约有 6<sup>k</sup> 份副本：6、36、216、1296……而且邻居还会再复制回 X，所以 X 会被反复感染。</p><p><b>检测加分点</b>：随机文件名让<b>基于特征（signature）</b>的检测失效，所以要用<b>基于异常（anomaly）</b>的检测：建立正常流量基线，流量突增就告警（P5-93）。这样把 Part 1 和 Part 5 串起来，是很好的得分点。</p>`},

{id:'Q3',p:1,q:`Describe various types of cyber security threats and explain why despite huge advances in technology and encryption techniques it is not possible to provide 100% security for a smart device connected to an internet.`,
zh:`描述各类网络安全威胁，并解释为什么技术和加密进步巨大，联网智能设备仍不可能做到 100% 安全。`,
key:`<ul><li><b>Criminal attacks</b>: financial gain — fraud, destruction, theft (personal, brand, identity).</li><li><b>Privacy violations</b>: personal information acquired by unauthorized organizations — surveillance, databases, traffic analysis.</li><li><b>Publicity attacks</b>: attackers want their names in the papers; can affect ANY system.</li><li>The Internet's characteristics aid attackers: <b>Automation</b> (speed makes minimal-return attacks worthwhile; data mining is easy), <b>Action at a distance</b> (attackers far away; international legal differences hinder prosecution), <b>Electronic techniques easily transferable/duplicated</b> (counterfeit e-money; tools created by one person and easily modified).</li><li>Therefore it is impossible to obtain perfect security. Security is a <b>balance between protection, ease of use and availability</b>; no system can be 100% secure.</li></ul>`,
jiang:`<p><b>两段式作答</b>：① 威胁类型（Criminal / Privacy / Publicity，可以补充 Legal、Insider，以及 P1-38 的六类攻击：malware、DoS、social engineering、SQL injection、MITM、password）；② 不可能 100% 安全的原因。</p><p>“为什么不可能 100%”可以从三个角度写：<br>1. 互联网三特征让攻击成本低、难追责（P1-37）；<br>2. 人是最弱一环，技术挡不住社会工程（P2-31）；<br>3. 安全与可用性要权衡，绝对安全意味着不可用（P6-116："Security should be considered balance between protection and availability"）。<br>可以引用零日漏洞（Q15）作为补充例子。</p>`},

{id:'Q4',p:1,q:`The "Ransomware" attacks of May 2017, affected over 300,000 devices in 150 countries resulting in estimated cost of over $5+ billion. Discuss the working of Ransomware virus and how it is spread?`,
zh:`2017 年 5 月的勒索软件攻击影响了 150 国 30 多万台设备，损失超 50 亿美元。讨论勒索病毒的工作原理和传播方式。`,
key:`<ul><li>Ransomware: hackers take control of a computer system and <b>block access until a ransom is paid</b>.</li><li>To gain access, criminals must get malicious software onto a device in the network — often by getting a victim to <b>click a link or download it by mistake</b> (phishing email attachment).</li><li>Once on the victim's computer, the attack <b>locks/encrypts all files</b> it can find within the network — gradually, file after file.</li><li>Victims are asked to pay via <b>cryptocurrency</b> so attackers cannot be tracked. Even after paying, victims may not get their data; mediator companies sometimes negotiate.</li><li>Large organizations have paid huge ransoms (e.g., Acer was asked for $50M; JBS paid $11M).</li></ul>`,
jiang:`<p><b>工作原理三步</b>：入侵（钓鱼邮件、恶意链接）→ 加密（逐个加密文件，并在内网横向扩散）→ 勒索（用加密货币支付）。</p><p><b>传播</b>：2017 年 5 月的 WannaCry 还利用了 Windows SMB 漏洞像<b>蠕虫</b>一样自动传播，而微软两个月前就发布了补丁（见 Q12）。答题时点出“钓鱼 + 未打补丁”两条传播路径，会更完整。</p><p><b>为什么用加密货币</b>：难追踪（P1-40 "normally using Bitcoin"）。</p>`},

{id:'Q5–Q9',p:1,q:`Ransomware quick facts: Q5 What is ransomware? Q6 Where did it originate? Q7 How does it affect a computer? Q8 How can you protect yourself? Q9 How much are victims expected to pay?`,
zh:`勒索软件速答五连问：是什么？起源？怎样影响电脑？怎样自保？要付多少钱？`,
key:`<ul><li><b>Q5</b>: Malicious software that <b>locks a device</b> (computer, tablet, smartphone) and then <b>demands a ransom</b> to unlock it.</li><li><b>Q6</b>: The first documented case appeared in <b>2005 in the United States</b>, then quickly spread worldwide.</li><li><b>Q7</b>: Normally contained in an <b>email attachment</b> masquerading as something innocent; once opened it <b>encrypts the hard drive</b>, making photos, documents etc. inaccessible.</li><li><b>Q8</b>: <b>Anti-virus software</b> can protect your machine, although criminals constantly find new ways around it.</li><li><b>Q9</b>: Varies; on average about <b>$300 in bitcoins</b>, with no guarantee of getting data back. Large organizations are asked for much more (Acer: $50M).</li></ul>`,
jiang:`<p>这一组适合出简答题或选择题，记住关键数字：<b>2005 年美国</b>首例；平均 <b>$300 比特币</b>；Acer 被勒索 <b>$5000 万</b>（P1-25，当时有记录的最大一笔赎金）。</p><p>Q8 的标准答案只写了杀毒软件；考试可以补充 Q10 的<b>离线备份</b>，这才是最有效的手段。</p>`},

{id:'Q10',p:1,q:`How one can protect itself from Ransomware attack?`,
zh:`如何防范勒索软件攻击？`,
key:`<ul><li>The best protection is to have all files <b>backed up in a completely separate system</b>; if attacked, no information is lost.</li><li>It is difficult to stop determined hackers, but <b>exercising caution</b> helps: attackers must first get the malicious software onto the device.</li><li>The most common infection routes are <b>compromised emails and websites</b> — don't open suspicious attachments or links.</li><li><b>Educate yourself and use technology</b> (anti-virus, patching, firewalls) to protect your devices.</li></ul>`,
jiang:`<p><b>得分点排序</b>：① 隔离的备份（最重要；勒索软件会加密网内所有能访问到的文件，所以备份必须<b>隔离</b>）；② 小心邮件和网站；③ 教育 + 技术。</p><p>可以补充课件 P2-48 的“如何避免勒索软件”：不随便下载文件、警惕带附件的钓鱼邮件、不把公司邮箱和密码用在私人用途、不把密码存在文本文件或表格里。</p>`},

{id:'Q11',p:1,q:`On Tuesday, 27 June 2017, second wave of "Ransomware" attacks was successfully launched. Explain why the lessons were not learnt from the first wave of attacks and why the second wave was also successful?`,
zh:`2017 年 6 月 27 日第二波勒索攻击又成功了。为什么第一波的教训没被吸取？为什么第二波也成功了？`,
key:`<ul><li>Most organizations <b>did not have security policies in place</b> to handle this sort of situation.</li><li>When the second wave was launched, they simply <b>didn't know what to do</b>, so it was also successful.</li><li>(Lessons not learnt: systems still unpatched, no incident-response plan, no staff training.)</li></ul>`,
jiang:`<p>核心论点：<b>问题出在管理，而不是技术</b>。第一波过后，很多组织只是“救火”，没有建立<b>策略、补丁管理流程、事件响应计划</b>。</p><p>可以联系 P6-112："A compromise is not the right time to think about what to do"，响应必须是 “reacting according to plan”。没有计划，就会重复犯错。</p>`},

{id:'Q12',p:1,q:`Was the reasons for "Ransomware's" success due to lack of technical expertise or due to lack of policies and its enforcements?`,
zh:`勒索软件得手，是因为缺少技术能力，还是缺少策略及其执行？`,
key:`<ul><li><b>Both</b> technical and non-technical aspects of information security.</li><li><b>Patching</b> (technical/procedural): Microsoft had issued patches <b>two months earlier</b>, but infected computers were not updated.</li><li><b>Training</b> (policy/people): <b>83%</b> of ransomware attacks originate when an employee clicks a malicious link, so investing in anti-phishing and malware training should be a priority.</li></ul>`,
jiang:`<p>这类“A 还是 B”的问题，本课程的标准答案几乎都是 <b>Both</b>（参见 Q18：只重技术或只重策略的做法一定失败）。</p><p>两个必背证据：<b>补丁早两个月就发布了</b>；<b>83% 的攻击始于员工点击链接</b>。</p>`},

{id:'Q13',p:1,q:`Eve installed some spyware software on 1000 USB flash drives and has designed this software to auto load from these drives along with some photos of a famous star. She then painted the logo of a well-known magazine on each one and randomly scattered these flash drives in the parking lots of several large companies in her town. What type of malware attack is this and what vulnerability is she trying to exploit in order to get her malware code past the network firewalls of these companies?`,
zh:`Eve 在 1000 个 U 盘里装了会自动加载的间谍软件，附上明星照片，印上知名杂志的 logo，散落在几家大公司的停车场。这是什么类型的恶意软件攻击？她想利用什么漏洞来绕过公司防火墙？`,
key:`<ul><li>This is a <b>Trojan horse</b> attack: users expect photos of a famous star (given the magazine logo) but do not expect the spyware.</li><li>Eve wants employees to insert the drives into company computers <b>inside the firewall</b>, exploiting the vulnerability of <b>auto-execution (autorun) being enabled</b>, so the spyware loads along with the expected photos.</li><li>She is also exploiting <b>social engineering</b> (curiosity).</li></ul>`,
jiang:`<p>三个关键词：<b>Trojan horse</b>（伪装成有用的东西）、<b>autorun</b>（技术漏洞）、<b>social engineering</b>（利用好奇心）。</p><p><b>为什么能绕过防火墙</b>：防火墙只管经过它的网络流量，U 盘是员工亲手带进内网的（防火墙防不了 bypass 它的攻击，见样题 Q5-12、P5-54）。</p><p>课件对策 P2-49："Don't plug any USB that isn't yours into your device." 孟加拉央行案也怀疑恶意软件经共享 U 盘传播（P6-110）。</p>`},

{id:'Q14',p:1,q:`Suppose you want to use an Internet cafe to login to your personal account on a bank web site, but you suspect that the computers in this cafe are infected with software keyloggers. Assuming that you can have both a web browser window and a text editing window open at the same time, describe a scheme that allows you to type in your userID and password so that a keylogger, used in isolation of any screen captures or mouse event captures, would not be able to discover your userID and password.`,
zh:`在网吧登录网银，怀疑电脑装了键盘记录器。可以同时开浏览器和文本编辑器，设计一种输入方法，使只记录键盘（不截屏、不记录鼠标）的记录器无法得到你的账号密码。`,
key:`<ul><li>Open the bank login page in the browser and a <b>new unnamed file</b> in a text editor.</li><li>Use the <b>mouse to toggle</b> input focus between the two windows.</li><li>In the browser window, type <b>a single character</b> of the userID/password, then click back to the text editor.</li><li>In the text editor, type a <b>reasonably long sequence of random characters</b>.</li><li>Repeat. The keylogger sees one long stream of random characters with the real characters intermixed, hard to detect.</li></ul>`,
jiang:`<p><b>原理</b>：键盘记录器只记录<b>按键顺序</b>，不知道每个键落在哪个窗口；用鼠标切换窗口是它看不到的。真实字符被淹没在大量噪声里。</p><p><b>题目限定条件</b>（不截屏、不记录鼠标）一定要在答案里呼应：如果记录器能截屏或记录鼠标点击，这个方法就失效。</p>`},

{id:'Q15',p:1,q:`What is the difference between a skilled hacker and an unskilled hacker (other than the lack of skill)? How does protection against each differ?`,
zh:`熟练黑客和不熟练黑客除技能外有何区别？对两者的防护有何不同？`,
key:`<ul><li><b>Expert hacker</b>: develops software scripts and code to exploit relatively <b>unknown vulnerabilities</b>; masters several programming languages, protocols and operating systems.</li><li><b>Unskilled hacker</b> (script kiddie / hacker in training): <b>uses scripts and code developed by skilled hackers</b>; rarely writes their own hacks.</li><li>Protecting against an expert is much harder: they often use <b>new attack code</b>, almost impossible to guard against at first — <b>zero-day attacks</b>.</li><li>Unskilled hackers use <b>publicly available tools</b>, so protection = staying <b>up to date with patches</b> and being aware of published hacking tools.</li></ul>`,
jiang:`<p>对比表答法最清楚：</p><table class="mini"><tr><th></th><th>Expert</th><th>Script kiddie</th></tr><tr><td>工具</td><td>自己写，攻击未知漏洞</td><td>用别人写好的</td></tr><tr><td>威胁</td><td>零日攻击</td><td>已知攻击</td></tr><tr><td>防护</td><td>难：纵深防御 + 异常检测</td><td>易：及时打补丁 + 关注公开工具</td></tr></table><p>呼应 P1-91 的黑客分类和 P1-95 的动机（script kiddies 为了 gain respect）。</p>`},

{id:'Q16',p:1,q:`Why it is easy to find secret information (like password, credit card, social security etc.) via social engineering and social networks?`,
zh:`为什么通过社会工程和社交网络很容易获取密码、信用卡号、社保号等秘密信息？`,
key:`<ul><li>Social networks let you share messages, pictures, files and up-to-the-minute information about what you are doing and <b>where you are</b>.</li><li>They are owned by private businesses that make money by <b>collecting and selling data</b> about individuals, particularly to third-party advertisers.</li><li>On these sites you leave the freedoms of the Internet and enter a network <b>governed by the site's owners</b>.</li><li>Most risks are <b>old scams with new twists</b> — e.g., a Facebook post that seems to come from a friend; it is hard not to click.</li><li>Social engineers <b>mine social networks to build trust</b>; once they know your likes, friends and daily updates, gaining your trust is easy.</li></ul>`,
jiang:`<p>答题逻辑：<b>信息多</b>（用户自己公开）→ <b>平台卖数据</b> → <b>规则由平台定</b> → <b>老骗术换新包装</b> → <b>建立信任</b>（社会工程最大的武器）。</p><p>联系 spear phishing（P2-40：攻击者研究过你、知道你的家人和老板）和 P2-43 的假好友账号。</p>`},

{id:'Q17',p:1,q:`I am using an unsecured Wi-Fi from a neighbour. Am I compromising my cyber security?`,
zh:`我在用邻居没加密的 Wi-Fi，这会危及我的网络安全吗？`,
key:`<ul><li>Yes. <b>Login information interception</b>: data over unsecured Wi-Fi can be intercepted and login credentials extracted to access banking, email etc. (identity theft).</li><li><b>Sensitive information interception</b>: instant messages, emails and other data can be intercepted — especially dangerous for corporate information.</li><li><b>Compromised devices</b> may also be connected to the same Wi-Fi.</li><li><b>Malicious hotspots</b>: most dangerously, the hotspot itself may be malicious.</li><li>Using unsecured Wi-Fi can lead to identity theft and credit fraud.</li></ul>`,
jiang:`<p>四个风险点：凭证被截获、敏感信息被截获、同网段的被感染设备、<b>热点本身就是恶意的</b>（即 MITM 攻击，P1-60 的预防措施里就有 "Refrain from using public Wi-Fi networks"）。</p><p>补充对策：只访问 HTTPS 网站（P5-5）、使用 VPN、不在这种网络上做敏感操作。</p>`},

{id:'Q18',p:3,q:`What are the two aspects of computer security and explain why computer security strategies that are technology-centric or policy-centric always fail. Also suggest ways to overcome this major problem?`,
zh:`计算机安全的两个方面是什么？为什么只重技术或只重策略的安全战略总会失败？如何克服？`,
key:`<ul><li>Two aspects: <b>Technological</b> (hardware, software, network — encryption, firewalls, biometrics) and <b>Managerial</b> (policies, procedures, operational and human issues).</li><li>The two groups have different roles; the problem is that they <b>don't understand and appreciate each other's work</b>, and without cooperation neither succeeds.</li><li><b>Technology-centric</b> strategies are weak without strong policies and practices.</li><li><b>Policy-centric</b> strategies are ineffective without technology to monitor and enforce them.</li><li>Solution — a comprehensive, multi-faceted approach: <b>senior management support, strong and sensible policies, practical procedures, modern security technologies</b>. Information security is a management issue and a people issue.</li></ul>`,
jiang:`<p>这是<b>本课程的核心论点</b>，期末大题很可能考。</p><p>答题四段：① 两个方面（P3-5）；② 失败原因（两拨人互不理解）；③ 各自的缺陷（技术没有策略 → 弱；策略没有技术 → 无法执行）；④ 四要素方案。</p><p>加分：联系 DLM 四层防御（P3-13：高层支持 → 使用政策 → 安全流程 → 技术工具）和 People-Process-Technology 三角（P3-16），再举 Equifax 为例：策略要求 48 小时打补丁，却 5 个月没执行（P6-103）。</p>`},

{id:'Q19',p:3,q:`Assume that you have been appointed a security consultant in a start-up company which is starting branches in several countries. The higher management is not very technical; however, they do know the importance of cyber security and are all geared up to support whatever measure you are willing to take. Thus, describe the two most important steps you will take?`,
zh:`你被一家在多国开分支的初创公司聘为安全顾问，高层不懂技术但很支持。描述你要做的两个最重要的步骤。`,
key:`<ul><li><b>Step 1 — Identification</b>: identify what the organization needs to protect (assets) and against what attacks; identify the types of threat facing its information systems.</li><li><b>Step 2 — Understand vulnerabilities</b>: which may be due to human errors or the complexity of software.</li></ul>`,
jiang:`<p>两步：<b>识别资产与威胁</b> → <b>理解脆弱性</b>。这就是风险评估的前半部分（P2-53 Identify → Assess → Analyze；P2-57 Risk = Threat × Vulnerability × Asset）。</p><p>“多国分支”是加分提示：不同国家的合规要求不同（GDPR 等，P3-4），而且要注意 action at a distance 带来的跨国法律问题（P1-37）。</p>`},

{id:'Q20',p:3,q:`In Q19, if the top management was not keen on cyber security, would you still be able to design, implement and manage the security system? If not then what would you need to do to convince the higher management that the security should be taken seriously.`,
zh:`如果高层不重视安全，你还能设计、实施和管理安全系统吗？若不能，怎样说服高层？`,
key:`<ul><li>One can design and implement the system, but <b>without proper policies and enforcement it will not be effective</b>.</li><li>Convince management by making them realize the <b>extent of the problem and what is at risk</b>: data, knowledge, software, physical, financial, employee, customer & partner assets, and goodwill.</li><li>Employees will not change behaviour if they do not see <b>respect for security by their superiors</b>.</li><li>Inform management of threats using attention-getting facts: 100,000 e-commerce sites attacked each week; Yahoo! lost $1 billion in share price after a DoS attack; 39% of companies had DoS downtime over 8 hours; IP theft costs US businesses over $250 billion a year (ASIS).</li></ul>`,
jiang:`<p>先回答“能不能”：<b>能做，但不会有效</b>（缺乏 top-down 支持，P3-10 的 bottom-up 缺点）。</p><p>再回答“怎么说服”：<b>用钱说话</b>，列出风险资产清单（P1-12），用真实事件和数字（可以换成课件里更新的案例：Equifax 罚款 7 亿美元、MGM 损失 8000 万美元、全球网络犯罪 10.5 万亿美元，P1-29、P1-35）。</p>`},

{id:'Q21',p:4,q:`What is cryptography and what were some of the first uses of cryptography? Most cryptography systems use a key for both encrypting and decrypting messages, thus explain what is a key, and what is it used for?`,
zh:`什么是密码学？最早用于什么？什么是密钥，有什么用？`,
key:`<ul><li><b>Cryptography</b> is the use of mathematical operations to protect messages travelling between parties or stored on a computer (from Greek kryptós "hidden" + gráphein "to write").</li><li>First recorded use: <b>concealing military and political secrets</b> while they were transported.</li><li>A <b>key</b> can be a series of bits used by a computer program, or a passphrase used by humans that is converted into bits.</li><li>The key is used <b>with an algorithm</b> to create ciphertext from plaintext, or derive plaintext from ciphertext. The algorithm stays the same; different keys give different results.</li></ul>`,
jiang:`<p>加分点：<b>Kerckhoffs 思想</b>（课件 P4-13："The algorithms stay the same, but a different key is used"；DES 设计要求 "The security of the algorithm must depend on the key"，P4-21）：算法可以公开，安全全靠密钥。</p><p>再补一句 P4-14：SECURITY = STRENGTH OF ALGORITHM + LENGTH OF KEY，每多 1 位密钥，组合数翻倍。</p>`},

{id:'Q22',p:4,q:`What is general idea behind symmetric key and asymmetric cryptography and what are the fundamental differences between these two systems?`,
zh:`对称密码和非对称密码的基本思想是什么？两者的根本区别是什么？`,
key:`<ul><li>Alice's original message is <b>plaintext</b>; what is sent is <b>ciphertext</b>. Alice uses an encryption algorithm and a <b>shared secret key</b>; Bob uses the decryption algorithm and the <b>same</b> key.</li><li><b>Symmetric</b> (private/secret-key): the same key encrypts and decrypts; both parties must own it. Problem: getting a copy of the key to the other party securely.</li><li><b>Asymmetric</b> (public-key): two separate keys — one <b>public</b>, one <b>private</b>.</li><li>Differences: symmetric uses one key, asymmetric two; symmetric is <b>much faster</b> but raises <b>key-management cost</b> (key must be sent securely); asymmetric needs <b>four keys</b> for a two-party conversation and is less efficient in CPU and key management.</li></ul>`,
jiang:`<p>建议画表：</p><table class="mini"><tr><th></th><th>Symmetric</th><th>Asymmetric</th></tr><tr><td>密钥</td><td>1 把共享</td><td>公钥 + 私钥</td></tr><tr><td>速度</td><td>快</td><td>慢</td></tr><tr><td>难点</td><td>密钥分发</td><td>计算量大、要证明公钥属于谁（PKI）</td></tr><tr><td>例子</td><td>DES、3DES、AES、RC4</td><td>RSA、DH、ElGamal、ECC</td></tr><tr><td>用途</td><td>大量数据加密</td><td>密钥交换、数字签名</td></tr></table><p>结尾点出<b>混合系统</b>（P4-98）：用公钥交换会话密钥，用对称密钥加密数据。“四把钥匙”指双方各有一对公私钥。</p>`},

{id:'Q23',p:4,q:`In PKI, is it possible to derive private key from the public key?`,
zh:`在 PKI 中，能从公钥推出私钥吗？`,
key:`<ul><li>No. Asymmetric algorithms are designed so that it is <b>impossible (computationally infeasible)</b> to derive the private key from the related public key; otherwise the algorithm could not be used.</li><li>Algorithms are therefore <b>tested for many years</b> under real-world conditions by industry, academia, mathematicians, cryptography experts and industrial users.</li><li>Whenever an algorithm is compromised, it is no longer used.</li></ul>`,
jiang:`<p>两把钥匙在数学上相关，但从公钥推私钥需要解一个难题：RSA 是<b>分解 n = p×q</b>，DH 是<b>离散对数</b>。</p><p>这题也是样题 Q4-8 选 “How long the algorithm has been around” 的理论依据：可信来自<b>长期公开检验</b>。补充：量子计算（Shor 算法）未来可能打破这一点（P4-125）。</p>`},

{id:'Q24',p:4,q:`Describe RSA cryptosystem. a. What is the one-way function in the system? b. What is the trapdoor in the system? c. Define the public key and private key in the system. d. Describe the security of the system.`,
zh:`描述 RSA 密码系统：a 单向函数是什么？b 陷门是什么？c 公钥和私钥分别是什么？d 系统的安全性。`,
key:`<ul><li>Most widely used public-key algorithm (Rivest, Shamir, Adleman); uses exponentiation of integers modulo a product of primes.</li><li>Encrypt: <b>C = M<sup>e</sup> mod n</b>; Decrypt: <b>M = C<sup>d</sup> mod n = (M<sup>e</sup>)<sup>d</sup> mod n = M</b>. Both parties know n and e; only the receiver knows d.</li><li><b>a.</b> One-way function: <b>C = P<sup>e</sup> mod n</b> — given P and e, C is easy to compute; given C and e, P is hard to find when n is very large.</li><li><b>b.</b> Trapdoor: the value of <b>d</b> (Bob's private key), which lets Bob compute P = C<sup>d</sup> mod n.</li><li><b>c.</b> Public key = <b>e</b> (with n); private key = <b>d</b>.</li><li><b>d.</b> Security depends mainly on the <b>difficulty of factoring n</b>; if n is very large and e is chosen properly, the system is secure.</li></ul>`,
jiang:`<p><b>概念区分</b>：单向函数（正向容易、反向难）+ <b>陷门</b>（掌握秘密信息 d 的人可以轻松反向）= <b>陷门单向函数</b>，这是公钥密码的核心。</p><p>记得写出<b>密钥生成步骤</b>（P4-67）：选素数 p、q → n = pq → φ = (p−1)(q−1) → 选 e 与 φ 互素 → 求 d 使 e·d ≡ 1 (mod φ)。</p><p>安全性补充：p、q、φ 必须保密（Q29），n 要足够大（建议 ≥ 2048 位，P5-11）。</p>`},

{id:'Q25',p:4,q:`In RSA cryptosystem the message "STOP" is to be encrypted using a block of 4. Let us assume that the user has chosen two prime numbers p = 43 and q = 59 and e = 13. Show step by step, the resultant encrypted message.`,
zh:`RSA 中用 4 位一块加密消息“STOP”，p = 43、q = 59、e = 13。逐步写出加密结果。`,
key:`<ul><li>n = p × q = 43 × 59 = <b>2537</b></li><li>Convert letters to numbers (position in alphabet − 1, i.e., A = 00): S = 18, T = 19, O = 14, P = 15 → blocks of 4: <b>1819 1415</b></li><li>Encrypt each block with C = M<sup>13</sup> mod 2537:</li><li>1819<sup>13</sup> mod 2537 = <b>2081</b> (ST)</li><li>1415<sup>13</sup> mod 2537 = <b>2182</b> (OP)</li><li>Encrypted message: <b>2081 2182</b></li></ul>`,
jiang:`<p><b>编码约定</b>：本题 A = 00, B = 01, …, Z = 25（字母序号减 1），每两个字母拼成 4 位一块。因为每块必须小于 n = 2537，最大的块 2525（ZZ）也小于它，所以 4 位分块可行。</p><p><b>手算 1819<sup>13</sup> mod 2537</b>：用平方-乘法。13 = 1101₂ = 8 + 4 + 1，依次算 x<sup>1</sup>, x<sup>2</sup>, x<sup>4</sup>, x<sup>8</sup>（每步都取 mod），再把 x<sup>8</sup>·x<sup>4</sup>·x<sup>1</sup> 相乘取 mod。考场上有计算器的话，用分步取模避免溢出。</p><p>点下方“在计算器中打开”，可以看到完整的平方-乘法表。</p>`,
calc:{tool:'rsa',p:43,q:59,e:13,pt:'STOP',ct:''}},

{id:'Q26',p:4,q:`In RSA cryptosystem an encrypted message "0981 0461" is to be decrypted using a block of 4. Let us assume that the user has chosen two prime numbers p = 43 and q = 59 and e = 13. Show step by step, the resultant decrypted message.`,
zh:`RSA 中密文“0981 0461”按 4 位一块解密，p = 43、q = 59、e = 13。逐步写出解密结果。`,
key:`<ul><li>M = C<sup>d</sup> mod n</li><li>n = 43 × 59 = 2537; φ = (43−1)(59−1) = 42 × 58 = <b>2436</b></li><li>d = e<sup>−1</sup> mod φ = 13<sup>−1</sup> mod 2436 = <b>937</b> (check: 13 × 937 = 12181 = 5 × 2436 + 1)</li><li>0981<sup>937</sup> mod 2537 = <b>0704</b> → 07 = h, 04 = e</li><li>0461<sup>937</sup> mod 2537 = <b>1115</b> → 11 = l, 15 = p</li><li>Decrypted message: <b>"help"</b></li></ul>`,
jiang:`<p><b>求 d 的两种方法</b>：</p><p>① 课件的 k 试除法：d = (k·2436 + 1) / 13，k = 1, 2, … 直到能整除。2436 mod 13 = 5，所以要 5k + 1 ≡ 0 (mod 13)，得 k = 5：(5 × 2436 + 1) / 13 = 12181 / 13 = <b>937</b>。</p><p>② 扩展欧几里得：2436 = 13×187 + 5；13 = 5×2 + 3；5 = 3×1 + 2；3 = 2×1 + 1，回代得 13<sup>−1</sup> ≡ 937 (mod 2436)。</p><p><b>解码</b>：用和加密相同的编码（A = 00），0704 → h e，1115 → l p。</p>`,
calc:{tool:'rsa',p:43,q:59,e:13,pt:'',ct:'0981 0461'}},

{id:'Q27',p:4,q:`In RSA: a. Given q = 13, p = 17, e = 5, find φ(n) and d. b. Given q = 31, p = 127 and e = 17, find d. c. Given p = 19, q = 23 and e = 3, find n, φ(n).`,
zh:`RSA 计算三小题：a 求 φ 和 d；b 求 d；c 求 n 和 φ。`,
key:`<ul><li><b>a.</b> φ(n) = (13−1)(17−1) = 12 × 16 = <b>192</b>; d = 5<sup>−1</sup> mod 192 = <b>77</b> (5 × 77 = 385 = 2 × 192 + 1)</li><li><b>b.</b> φ(n) = 30 × 126 = <b>3780</b>; d = 17<sup>−1</sup> mod 3780 = <b>3113</b> (17 × 3113 = 52921 = 14 × 3780 + 1)</li><li><b>c.</b> n = 19 × 23 = <b>437</b>; φ(n) = 18 × 22 = <b>396</b></li></ul>`,
jiang:`<p><b>a 的 k 试除法</b>：d = (192k + 1) / 5。k = 1 → 193 ✗；k = 2 → 385 / 5 = <b>77</b> ✓。</p><p><b>b</b>：3780 mod 17 = 6，要 6k + 1 ≡ 0 (mod 17)，得 k = 14 → (14 × 3780 + 1) / 17 = 52921 / 17 = <b>3113</b>。k 比较大时，用扩展欧几里得更快。</p><p><b>c 的陷阱</b>：φ = 396 = 2² × 3² × 11，<b>e = 3 与 φ 不互素</b>，所以 d 根本不存在，这组参数下 e = 3 不能用。题目只问 n 和 φ，大概就是这个原因。考试如果追问 d，要指出 gcd(3, 396) = 3 ≠ 1。</p>`,
calc:{tool:'rsa',p:13,q:17,e:5,pt:'',ct:''}},

{id:'Q28',p:4,q:`In Public key, different keys are used for encryption and decryption. The user gives/publishes his/her public key which can be used to send him/her encrypted messages. Thus, how does a receiver know that the public key he/she is using is authentic? Is it possible to spoof a public key? (Also: since the keys are mathematically related, can the private key be calculated from the known public key?)`,
zh:`怎么知道用的公钥是真的？公钥能被冒充吗？（附：公私钥数学相关，能从公钥算出私钥吗？）`,
