'4.31':`W8：只有发送方能生成签名<span class="zhen">（signature）</span>，用<b>发送方私钥<span class="zhen">（private key）</span></b>；接收方用发送方公钥<span class="zhen">（public key）</span>验证。`,
'4.32':`W8：数字证书<span class="zhen">（digital certificate）</span>只认证<span class="zhen">（authentication）</span><b>公钥<span class="zhen">（public key）</span></b>。私钥<span class="zhen">（private key）</span>从不给别人，谈不上认证<span class="zhen">（authentication）</span>。登录 NTU 邮箱时，服务器<span class="zhen">（server）</span>发来的证书<span class="zhen">（certificate）</span>里就嵌着它的公钥<span class="zhen">（public key）</span>。`,
'4.34':`W8：混合系统<span class="zhen">（hybrid system）</span>中公钥<span class="zhen">（public key）</span>用于<b>交换会话密钥<span class="zhen">（session key）</span></b>，对称会话密钥<span class="zhen">（symmetric session key）</span>加密<span class="zhen">（encryption）</span>数据（登录 Facebook 的例子）。`,
'4.35':`W7/W8：混合系统<span class="zhen">（hybrid system）</span> = 公钥<span class="zhen">（public key）</span>交换会话密钥<span class="zhen">（session key）</span> + 对称密钥加密<span class="zhen">（symmetric key encryption）</span>会话<span class="zhen">（session）</span>数据。会话<span class="zhen">（session）</span>结束密钥<span class="zhen">（key）</span>作废，下次登录换新的。`,
'4.c1':`W6：AES 分组固定 128 位；密钥<span class="zhen">（key）</span> 128/192/256 位，“从 quiz 角度要知道”。DES 是 64 位分组。`,
'4.c2':`W6：轮数<span class="zhen">（number of rounds）</span>取决于密钥长度<span class="zhen">（key length）</span>：128 位 10 轮、192 位 12 轮、256 位 14 轮。不考 AES 结构图（“往年也没考过”）。`,
'4.c3':`W6：2DES 是两把 56 位密钥<span class="zhen">（key）</span>，不是一把 112 位，可以分开破，加上中间相遇攻击<span class="zhen">（meet-in-the-middle attack）</span>，所以被放弃。`,
'4.c6':`W6：DH <b>只是密钥交换<span class="zhen">（key exchange）</span>协议<span class="zhen">（protocol）</span></b>，不能加解密<span class="zhen">（decryption）</span>，交换完用 AES 之类的对称算法<span class="zhen">（symmetric algorithm）</span>加密<span class="zhen">（encryption）</span>。老师反复说“DH 必考”。`,
'4.c7':`W7：等强度下 ECC 密钥<span class="zhen">（key）</span>更短、更快（AES-128 ≈ ECC-256；AES-256 ≈ ECC-512 ≈ RSA-15360）。老师个人认为 ECC 不会取代 RSA：RSA 简单、软硬件都围绕它建成。`,
'4.c8':`W7/W8：MD5、SHA-1（以及 DES）都不安全，不应再用；SHA-256 用于比特币<span class="zhen">（Bitcoin）</span>。`,
'4.c10':`W8：“<b>这道题以前考过</b>”：如何验证证书<span class="zhen">（certificate）</span>？三件事：① 用 CA 公钥<span class="zhen">（public key）</span>验证 CA 签名<span class="zhen">（signature）</span>，确认 CA 可信；② 是否在有效期<span class="zhen">（validity period）</span>内；③ 是否被吊销<span class="zhen">（revocation）</span>（查序列号<span class="zhen">（serial number）</span>）。三项都通过浏览器<span class="zhen">（browser）</span>才接受。`,
'4.c13':`W7：用课件的 k 法：d = (kφ+1)/e，k 从 1 试到整除为止，老师建议考试就用这个方法省时间。考试数字都 &lt; 20。`,
'4.c14':`W6：DH 计算是期末 <b>15 分</b>题，“really easy 15 marks”。公式不给：Y = g<sup>x</sup> mod p，K = Y<sub>对方</sub><sup>x</sup> mod p，必须背。`,
'4.c15':`W7 老师口径（期末要写）：选 e 的<b>三个条件</b>：① 1 &lt; e &lt; φ；② e 是素数<span class="zhen">（prime number）</span>；③ e 与 p−1、q−1 没有公因子<span class="zhen">（common factor）</span>。标准说法只要 gcd(e, φ) = 1，考试按老师的三条写。`,
'4.c17':`W7：先用发送方公钥<span class="zhen">（public key）</span>解开签名<span class="zhen">（signature）</span>得到摘要<span class="zhen">（digest）</span>，再自己对消息做哈希<span class="zhen">（hash）</span>得到摘要<span class="zhen">（digest）</span>，两者相同才接受。期末手算时不用哈希<span class="zhen">（hash）</span>：S = M<sup>d</sup> mod n，验证 S<sup>e</sup> mod n = M。`,
'5.01':`W8：TLS 的子协议<span class="zhen">（sub-protocol）</span>里最复杂、最重要的是 Handshake，因为密钥交换<span class="zhen">（key exchange）</span>在这里完成。`,
'5.03':`W8：Record 协议<span class="zhen">（protocol）</span>：分片<span class="zhen">（fragmentation）</span> → 压缩 → 哈希（MAC）→ 加密<span class="zhen">（encryption）</span> → 加头。它在握手<span class="zhen">（handshake）</span>完成、交换好密钥<span class="zhen">（key）</span>之后才工作。`,
'5.04':`W8：证书<span class="zhen">（certificate）</span>出问题（过期、被吊销<span class="zhen">（revocation）</span>、未知 CA、不支持的证书<span class="zhen">（certificate）</span>）时由 Alert 协议<span class="zhen">（protocol）</span>报警，还包括坏的 MAC、解压失败<span class="zhen">（decompression failure）</span>、握手失败<span class="zhen">（handshake failure）</span>等。`,
'5.c1':`W8：HTTP 用 80 端口<span class="zhen">（port）</span>、不加密<span class="zhen">（without encryption）</span>；HTTPS = HTTP + TLS，用 443 端口<span class="zhen">（port）</span>。`,
'5.c2':`W8：RSA 密钥交换<span class="zhen">（key exchange）</span>下服务器<span class="zhen">（server）</span>私钥<span class="zhen">（private key）</span>长期不变，几十亿用户共用。一旦被破，录下的所有历史通信都能解开（前向保密<span class="zhen">（forward secrecy）</span>问题）。TLS 1.3 改用临时 DH（EDH），每次会话<span class="zhen">（session）</span>都换参数。`,
'5.c12':`W8：TLS 里公钥（RSA/DH）至少 2048 位；会话密钥<span class="zhen">（session key）</span> 128 位足够，低于 128 位不安全，浏览器<span class="zhen">（browser）</span>最高支持 256 位。`,
'5.c14':`W8：TLS 1.3 算法套件<span class="zhen">（cipher suite）</span>从 37 个减到 5 个，去掉了 DES、3DES、SHA-1、MD5。研究显示服务器<span class="zhen">（server）</span>出问题多半是管理员<span class="zhen">（administrator）</span>配错算法，选项少了就不容易配错。握手<span class="zhen">（handshake）</span>更短更快，回访同一服务器<span class="zhen">（server）</span>还能复用参数。`
};

window.MCQ = (window.MCQ || []).concat([
{id:'1.c15',p:1,s:'c',q:`An attacker forges the source IP address of packets so that they appear to come from a trusted server. This is called:`,
o:[`Masquerading`,`Spoofing`,`Repudiation`,`Phishing`],a:1,
zh:`攻击者<span class="zhen">（attacker）</span>伪造<span class="zhen">（forgery）</span>数据包<span class="zhen">（packet）</span>的源 IP 地址<span class="zhen">（source IP address）</span>，让它看起来来自可信服务器<span class="zhen">（server）</span>。这叫什么？`,
ex:`伪造<span class="zhen">（forgery）</span>的是<b>服务器<span class="zhen">（server）</span> / IP 地址<span class="zhen">（IP address）</span></b>，所以是 spoofing。如果是一个<b>人</b>冒用别人身份，才叫 masquerading（样题 P1-13 就是这种）。`,
op:[`✗ 人冒充<span class="zhen">（masquerading）</span>别人时才用这个词`,`✓ IP / 服务器<span class="zhen">（server）</span>伪造<span class="zhen">（forgery）</span>`,`✗ 抵赖<span class="zhen">（repudiation）</span>：事后否认自己做过`,`✗ 钓鱼<span class="zhen">（phishing）</span>：骗人点链接或交出信息`],
tip:`人 → masquerading；机器（IP、服务器<span class="zhen">（server）</span>）→ spoofing。`,ref:`P1 · 录音 W3`,
hot:`W3：“说人的时候用 masquerading，说服务器<span class="zhen">（server）</span>的时候用 spoofing，IP 地址<span class="zhen">（IP address）</span>是被 spoof 的。”`},

{id:'3.c13',p:3,s:'c',q:`Can a user be authorized to use a resource without first being authenticated?`,
o:[`Yes`,`No`],a:1,
zh:`一个用户没有先通过认证<span class="zhen">（authentication）</span>，能不能被授权<span class="zhen">（authorization）</span>使用资源？`,
ex:`不能。顺序永远是先 <b>authentication</b>（确认你是谁），再 <b>authorization</b>（按你的角色决定你能用什么）。连身份都不知道，就无从授权<span class="zhen">（authorization）</span>。`,
op:[`✗`,`✓ 先认证<span class="zhen">（authentication）</span>后授权<span class="zhen">（authorization）</span>`],
tip:`AuthN（你是谁）→ AuthZ（你能做什么）。`,ref:`P3 · 录音 W5`,
hot:`W5：“真题可能会问：can a person be authorized without authentication？答案是 No。”`},

{id:'4.c18',p:4,s:'c',q:`In 3DES (Encrypt–Decrypt–Encrypt), if the sub-keys K1 and K2 happen to be the same, the result is:`,
o:[`Three times stronger than DES`,`Equivalent to single DES, but three times slower`,`Equivalent to 2DES`,`Impossible to decrypt`],a:1,
zh:`3DES 按“加密<span class="zhen">（encryption）</span>-解密<span class="zhen">（decryption）</span>-加密<span class="zhen">（encryption）</span>”运行。如果子密钥<span class="zhen">（subkey）</span> K1 和 K2 恰好相同，结果会怎样？`,
ex:`用户给 168 位密钥<span class="zhen">（key）</span>，系统切成三把 56 位子密钥<span class="zhen">（subkey）</span>。若 K1 = K2：先用 K1 加密<span class="zhen">（encryption）</span>，再用同一把钥匙解密<span class="zhen">（decryption）</span>，等于回到明文<span class="zhen">（plaintext）</span>，最后只剩第三步一次加密<span class="zhen">（encryption）</span>。效果<b>和单 DES 一样，却慢 3 倍</b>。这种情况偶尔会发生，所以 3DES 只能算临时方案，最终被 AES 取代。`,
op:[`✗`,`✓ E 与 D 互相抵消`,`✗`,`✗ 照样能解密<span class="zhen">（decryption）</span>`],
tip:`E(K1) → D(K2=K1) 抵消 → 只剩一次 E。`,ref:`P4 DES/3DES · 录音 W6`,
hot:`W6：老师专门讲了 3DES 的 EDE 结构和子密钥<span class="zhen">（subkey）</span>相同的问题，以及“为什么 3DES 只是临时方案”。`},

{id:'4.c19',p:4,s:'c',q:`AES is based on the Rijndael algorithm. What is the only difference between them?`,
o:[`AES uses a 64-bit block`,`AES fixes the block size (128 bits) and key sizes, while Rijndael allows any multiple of 32 bits`,`AES adds a hash function to Rijndael`,`AES is a public-key version of Rijndael`],a:1,
zh:`AES 基于 Rijndael 算法。两者唯一的区别是什么？`,
ex:`Rijndael 的分组和密钥长度<span class="zhen">（key length）</span>可以是任何 32 的倍数；AES 把分组固定为 128 位，密钥<span class="zhen">（key）</span>只能是 128/192/256 位。<b>为什么要固定？</b>因为它是国际标准：参数统一后，通信双方不用协商，也没有兼容性问题。`,
op:[`✗ 64 位是 DES 的分组`,`✓`,`✗`,`✗ 两者都是对称算法<span class="zhen">（symmetric algorithm）</span>`],
tip:`Rijndael 灵活 → AES 固定，为了统一标准、免协商、无兼容问题。`,ref:`P4 AES · 录音 W6`,
hot:`W6：老师在课上提问“为什么 AES 要把参数固定？”，答案是国际标准要保证所有人参数一致。`},

{id:'4.c20',p:4,s:'c',q:`In RSA, why can 2 never be chosen as the public key e?`,
o:[`Because 2 is not a prime number`,`Because 2 is always larger than φ(n)`,`Because p−1 and q−1 are always even, so 2 is always a common factor`,`Because the private key would become too large`],a:2,
zh:`RSA 中为什么 2 永远不能当公钥<span class="zhen">（public key）</span> e？`,
ex:`除 2 以外的素数<span class="zhen">（prime number）</span>都是奇数，奇数减 1 一定是偶数，所以 p−1、q−1 都含因子 2。e = 2 违反第三个条件（不能与 p−1、q−1 有公因子<span class="zhen">（common factor）</span>）。不管 p、q 大小都一样。2 本身是素数<span class="zhen">（prime number）</span>，也满足 1 &lt; e &lt; φ，只是第三条不满足。`,
op:[`✗ 2 是素数<span class="zhen">（prime number）</span>`,`✗ φ 通常远大于 2`,`✓`,`✗ 问题是 d 根本不存在`],
tip:`奇素数<span class="zhen">（odd prime）</span> − 1 = 偶数 → 2 永远是公因子<span class="zhen">（common factor）</span>。`,ref:`P4 RSA · 录音 W7`,
hot:`W7：这是往年期末 15 分 RSA 大题的第一问：“Why 2 cannot be chosen as a public key in RSA?”，要答出三个条件中哪一条不满足。`},

{id:'4.c21',p:4,s:'c',q:`A website offers to e-mail you your original password when you forget it. What does this tell you?`,
o:[`It stores passwords as hash values, so it is safe`,`It does not store passwords as hash values (they can be recovered), so it should not be trusted`,`It uses a digital certificate`,`It uses TLS 1.3`],a:1,
zh:`某网站说忘记密码<span class="zhen">（password）</span>时可以把原密码<span class="zhen">（password）</span>发到你的邮箱。这说明什么？`,
ex:`正确做法是只存密码<span class="zhen">（password）</span>的<b>哈希值<span class="zhen">（hash value）</span></b>。登录时把你输入的密码<span class="zhen">（password）</span>再哈希<span class="zhen">（hash）</span>一次，和库里的比对。哈希<span class="zhen">（hash）</span>不可逆，网站自己也不知道你的原密码<span class="zhen">（password）</span>，所以只能让你<b>重置</b>，不能<b>找回</b>。能找回说明它存的是明文<span class="zhen">（plaintext）</span>或可解密<span class="zhen">（decryption）</span>的密文<span class="zhen">（ciphertext）</span>，数据库<span class="zhen">（database）</span>一泄露<span class="zhen">（leak）</span>密码<span class="zhen">（password）</span>就全暴露。`,
op:[`✗ 哈希<span class="zhen">（hash）</span>存储是找不回原密码<span class="zhen">（password）</span>的`,`✓`,`✗ 无关`,`✗ 无关`],
tip:`能“找回”原密码<span class="zhen">（password）</span> = 没用哈希<span class="zhen">（hash）</span> = 不安全；正常只能“重置”。`,ref:`P4 Hashing · 录音 W7`,
hot:`W7：“如果网站说能帮你找回密码<span class="zhen">（password）</span>，说明它没用哈希<span class="zhen">（hash）</span>，这个网站不应该用。NTU 也只能让你重置。”`},

{id:'4.c22',p:4,s:'c',q:`For the same level of security, which ordering from fastest to slowest is correct?`,
o:[`RSA > ECC > AES`,`ECC > AES > RSA`,`AES > ECC > RSA`,`AES > RSA > ECC`],a:2,
zh:`在同等安全强度下，从快到慢排序哪个正确？`,
ex:`对称<span class="zhen">（symmetric）</span>的 AES 最快，ECC 次之，RSA 最慢。密钥长度<span class="zhen">（key length）</span>对比：AES-128 ≈ ECC-256 ≈ RSA-3072；AES-256 ≈ ECC-512 ≈ RSA-15360。密钥<span class="zhen">（key）</span>越长越慢。所以实际中用公钥<span class="zhen">（public key）</span>交换密钥<span class="zhen">（key）</span>，再用 AES 加密<span class="zhen">（encryption）</span>大量数据，也就是混合系统<span class="zhen">（hybrid system）</span>。`,
op:[`✗ 反了`,`✗ AES 最快`,`✓`,`✗ RSA 最慢`],
tip:`AES（对称<span class="zhen">（symmetric）</span>）> ECC > RSA。`,ref:`P4 ECC · 录音 W7`,
hot:`W7：老师用密钥长度<span class="zhen">（key length）</span>表说明“最快的是 AES，然后 ECC，最慢的是 RSA”。`},

{id:'4.c23',p:4,s:'c',q:`What is the main reason the ElGamal encryption algorithm is rarely used today?`,
o:[`It can only exchange keys, not encrypt`,`Its ciphertext is about twice the size of the plaintext, making it slow`,`It was broken by the EFF in 1998`,`It is still protected by a patent`],a:1,
zh:`ElGamal 加密算法<span class="zhen">（encryption algorithm）</span>今天很少使用，主要原因是什么？`,
ex:`ElGamal 把 DH 扩展成能加解密<span class="zhen">（decryption）</span>、能签名<span class="zhen">（signature）</span>的完整系统（是重要突破），但<b>密文<span class="zhen">（ciphertext）</span>大约是明文<span class="zhen">（plaintext）</span>的两倍</b>，所以很慢。在计算机领域，“慢的就不会被用”。`,
op:[`✗ 这是 DH 的局限，ElGamal 能加密<span class="zhen">（encryption）</span>`,`✓`,`✗ 1998 年被 EFF 破解的是 DES`,`✗`],
tip:`ElGamal：DH 的扩展，密文<span class="zhen">（ciphertext）</span> ×2，慢。`,ref:`P4 ElGamal · 录音 W7`,
hot:`W7：“ElGamal 的问题是密文<span class="zhen">（ciphertext）</span>是明文<span class="zhen">（plaintext）</span>的两倍，很慢，所以不用。”老师说只简单介绍 ElGamal 和 ECC，重点是 DH 和 RSA。`},

{id:'4.c24',p:4,s:'c',q:`In the Diffie-Hellman key exchange, which values must be kept secret?`,
o:[`The prime number p and the generator g`,`The public keys of both users`,`Each user's private (secret) number`,`All of the above`],a:2,
zh:`在 Diffie-Hellman 密钥交换<span class="zhen">（key exchange）</span>中，哪些值必须保密？`,
ex:`p 和 g 是公开协商的，双方的公钥<span class="zhen">（public key）</span>也会在网上交换，攻击者<span class="zhen">（attacker）</span>都能看到。<b>只有双方各自的私密数<span class="zhen">（private value）</span></b>必须保密。私密数<span class="zhen">（private value）</span>一旦泄露<span class="zhen">（leak）</span>，攻击者<span class="zhen">（attacker）</span>就能用 K = Y<sub>对方</sub><sup>x</sup> mod p 算出共享密钥<span class="zhen">（shared key）</span>，DH 就毫无安全性。另外，实际使用时这些数必须很大（至少 2048 位），太小可以直接试出来。`,
op:[`✗ 公开的`,`✗ 公开交换的`,`✓`,`✗`],
tip:`DH 中公开的有 p、g、Y<sub>A</sub>、Y<sub>B</sub>；保密的只有 x<sub>A</sub>、x<sub>B</sub>。`,ref:`P4 DH · 录音 W6`,
hot:`W6：老师列出的期末 DH 可能问法：简述 DH；私密数<span class="zhen">（private value）</span>泄露<span class="zhen">（leak）</span>会怎样（不安全）；数字太小会怎样（会被破，至少 2048 位）。`},

{id:'4.c25',p:4,s:'c',q:`Why is the message hashed before it is signed in a practical digital signature scheme?`,
o:[`Hashing provides confidentiality of the message`,`Signing the short fixed-length digest is much faster than signing the whole message, and any change to the message can be detected`,`Hashing replaces the need for a private key`,`Hashing makes the signature reversible`],a:1,
zh:`实际的数字签名<span class="zhen">（digital signature）</span>为什么要先对消息做哈希<span class="zhen">（hash）</span>再签名<span class="zhen">（signature）</span>？`,
ex:`如果直接用私钥<span class="zhen">（private key）</span>“加密<span class="zhen">（encryption）</span>”整条消息（比如 1 GB），签名<span class="zhen">（signature）</span>和验证都非常慢。先哈希<span class="zhen">（hash）</span>得到固定长度的短摘要<span class="zhen">（digest）</span>，只对摘要<span class="zhen">（digest）</span>签名<span class="zhen">（signature）</span>，就快得多。消息哪怕只改一位，摘要<span class="zhen">（digest）</span>也会完全不同，所以改动能被发现。注意：这种签名<span class="zhen">（signature）</span><b>不保护消息内容</b>，消息仍是明文<span class="zhen">（plaintext）</span>发送。要保密还得再用接收方公钥加密<span class="zhen">（public-key encryption）</span>。`,
op:[`✗ 哈希<span class="zhen">（hash）</span>不提供保密性<span class="zhen">（confidentiality）</span>`,`✓ 快 + 能检测改动`,`✗ 签名<span class="zhen">（signature）</span>仍需私钥<span class="zhen">（private key）</span>`,`✗ 哈希<span class="zhen">（hash）</span>不可逆`],
tip:`哈希<span class="zhen">（hash）</span>的两个作用：缩短（快）+ 检测改动（完整性<span class="zhen">（integrity）</span>）。`,ref:`P4 Digital Signature · 录音 W7`,
hot:`W7：“为了让数字签名<span class="zhen">（digital signature）</span>更快，我们用哈希<span class="zhen">（hash）</span>。”老师还对比了两种版本：消息不加密<span class="zhen">（without encryption）</span>（常用、快）和消息用接收方公钥加密<span class="zhen">（public-key encryption）</span>（安全但慢）。`},

{id:'4.c26',p:4,s:'c',q:`How does a Certification Authority (CA) cancel the certificate of a client who has misbehaved?`,
o:[`By deleting the client's public key`,`By revoking the certificate's unique serial number`,`By changing the certificate's expiry date`,`By asking the client to return the certificate`],a:1,
zh:`客户有违规行为时，CA 怎样作废他的证书<span class="zhen">（certificate）</span>？`,
ex:`证书<span class="zhen">（certificate）</span>文件在客户手里，CA 收不回来。但每张证书<span class="zhen">（certificate）</span>都有<b>唯一的序列号<span class="zhen">（serial number）</span></b>，CA 把这个序列号<span class="zhen">（serial number）</span>列为作废，就完成了<b>吊销（revocation）</b>。验证证书<span class="zhen">（certificate）</span>时要检查三件事：CA 签名<span class="zhen">（signature）</span>（可信吗）、有效期<span class="zhen">（validity period）</span>、是否被吊销<span class="zhen">（revocation）</span>。第三项就是查这个序列号<span class="zhen">（serial number）</span>。证书<span class="zhen">（certificate）</span>格式标准是 X.509 v3。`,
op:[`✗`,`✓`,`✗`,`✗ 收不回来`],
tip:`吊销<span class="zhen">（revocation）</span>看序列号<span class="zhen">（serial number）</span>；验证证书<span class="zhen">（certificate）</span> = 可信 CA + 有效期<span class="zhen">（validity period）</span> + 未吊销<span class="zhen">（not revoked）</span>。`,ref:`P4 Digital Certificate · 录音 W8`,
hot:`W8：“证书<span class="zhen">（certificate）</span>已经在客户手里，CA 没法取消证书<span class="zhen">（certificate）</span>本身，只能取消它的序列号<span class="zhen">（serial number）</span>，这叫 revocation。”`},

{id:'5.c15',p:5,s:'c',q:`Since 2020, which SSL/TLS versions are prohibited and should no longer be used by servers?`,
o:[`TLS 1.2 and TLS 1.3`,`SSL 2.0/3.0, TLS 1.0 and TLS 1.1`,`Only TLS 1.3`,`None — all versions are still allowed`],a:1,
zh:`从 2020 年起，哪些 SSL/TLS 版本被禁止、服务器<span class="zhen">（server）</span>不应再使用？`,
ex:`时间线：Netscape 在 1994 年推出 SSL，SSL 3.0 于 1996 年发布。1999 年交给 IETF，改名 TLS 1.0。之后 TLS 1.1 于 2006 年、1.2 于 2008 年、<b>1.3 于 2018 年 3 月</b>发布。SSL 3.0 在 2015 年被禁，TLS 1.0/1.1 在 2020 年被禁。原计划 2020 年底全部改用 1.3，但因疫情没有强制执行，现在 1.2 还在用。`,
op:[`✗ 这两个是现在该用的`,`✓`,`✗`,`✗`],
tip:`能用：1.3（推荐）、1.2；禁用：SSL 全部、TLS 1.0、1.1。`,ref:`P5 TLS · 录音 W8`,
hot:`W8：老师用 SSL Labs 演示：微信、Facebook、Google 还开着 TLS 1.0/1.1，被评为 B（为了用户量和广告收入）；Microsoft、NTU 关掉了，评为 A+。`},

{id:'5.c16',p:5,s:'c',q:`In SSL/TLS, why is the client usually NOT authenticated?`,
o:[`The protocol does not allow client authentication`,`It would require a digital certificate for every client, making the connection slower and less user-friendly`,`Clients do not have IP addresses`,`Because the server is not authenticated either`],a:1,
zh:`在 SSL/TLS 中，为什么通常不认证<span class="zhen">（no authentication）</span>客户端<span class="zhen">（client）</span>？`,
ex:`协议<span class="zhen">（protocol）</span>本身<b>允许</b>双向认证<span class="zhen">（mutual authentication）</span>，但如果认证<span class="zhen">（authentication）</span>客户端<span class="zhen">（client）</span>，每个用户都得买并维护数字证书<span class="zhen">（digital certificate）</span>，浏览器<span class="zhen">（browser）</span>还要逐一验证，连接会变慢，也不好用，没人会用。所以实际中只认证<span class="zhen">（authentication）</span><b>服务器<span class="zhen">（server）</span></b>（服务器<span class="zhen">（server）</span>必须有 SSL 证书<span class="zhen">（certificate）</span>和公私钥<span class="zhen">（public-private key pair）</span>），客户端<span class="zhen">（client）</span>不需要任何密钥<span class="zhen">（key）</span>，并且总是由客户端<span class="zhen">（client）</span>发起连接。`,
op:[`✗ 协议<span class="zhen">（protocol）</span>允许`,`✓`,`✗`,`✗ 服务器<span class="zhen">（server）</span>总是要认证<span class="zhen">（authentication）</span>`],
tip:`TLS：服务器<span class="zhen">（server）</span>必须认证<span class="zhen">（authentication）</span>（有证书<span class="zhen">（certificate）</span>），客户端<span class="zhen">（client）</span>几乎从不认证<span class="zhen">（no authentication）</span>。`,ref:`P5 TLS · 录音 W8`,
hot:`W8：“按协议<span class="zhen">（protocol）</span>客户端<span class="zhen">（client）</span>也可以认证<span class="zhen">（authentication）</span>，但几乎从不这样做，因为会很慢、不友好，没人会用。”`},

{id:'5.c17',p:5,s:'c',q:`In TLS 1.3, "ephemeral" Diffie-Hellman (EDH/DHE) means:`,
o:[`The server reuses the same DH values for every client`,`New DH secret values are generated for every session, so cracking one session key does not expose other sessions`,`RSA is used to encrypt the DH values`,`The session key never changes`],a:1,
zh:`TLS 1.3 中的临时（ephemeral）Diffie-Hellman 是什么意思？`,
ex:`如果 DH 参数固定，共享密钥<span class="zhen">（shared key）</span>也固定，和 RSA 密钥交换<span class="zhen">（key exchange）</span>一样有长期密钥<span class="zhen">（long-term key）</span>的问题。<b>Ephemeral</b> 是指每次会话<span class="zhen">（session）</span>都重新选素数<span class="zhen">（prime number）</span>、生成元<span class="zhen">（generator）</span>和私密数<span class="zhen">（private value）</span>，只在这一次会话<span class="zhen">（session）</span>有效。攻击者<span class="zhen">（attacker）</span>就算侥幸破了一个会话密钥<span class="zhen">（session key）</span>，也只影响这一个客户的这一次会话<span class="zhen">（session）</span>。这就是<b>前向保密<span class="zhen">（forward secrecy）</span></b>，也是 TLS 1.3 不再允许 RSA 做密钥交换<span class="zhen">（key exchange）</span>的原因（RSA 仍可用于签名<span class="zhen">（signature）</span>）。`,
op:[`✗ 这正是要避免的`,`✓`,`✗ 1.3 不用 RSA 做密钥交换<span class="zhen">（key exchange）</span>`,`✗ 每次会话<span class="zhen">（session）</span>都换`],
tip:`Ephemeral = 每会话<span class="zhen">（session）</span>一换 → 前向保密<span class="zhen">（forward secrecy）</span>。`,ref:`P5 TLS 1.3 · 录音 W8`,
hot:`W8：老师先问“这和 RSA 有什么区别？参数固定的话一样会被破”，然后引出 EDH：每次都换数字，攻击者<span class="zhen">（attacker）</span>没有足够时间。`},

{id:'5.c18',p:5,s:'c',q:`In HTTPS, which party must have an SSL/TLS digital certificate with a public/private key pair?`,
o:[`Only the client (browser)`,`Only the server`,`Both the client and server, always`,`Neither — HTTPS does not use certificates`],a:1,
zh:`在 HTTPS 中，哪一方必须持有 SSL/TLS 数字证书<span class="zhen">（digital certificate）</span>和公私钥<span class="zhen">（public-private key pair）</span>对？`,
ex:`服务器<span class="zhen">（server）</span>必须有 SSL 证书<span class="zhen">（certificate）</span>（证书<span class="zhen">（certificate）</span>里嵌着服务器<span class="zhen">（server）</span>公钥<span class="zhen">（public key）</span>，服务器<span class="zhen">（server）</span>保管私钥<span class="zhen">（private key）</span>）。客户端<span class="zhen">（client）</span>（浏览器<span class="zhen">（browser）</span>）不需要任何密钥<span class="zhen">（key）</span>：它向服务器<span class="zhen">（server）</span>请求连接，收到证书<span class="zhen">（certificate）</span>后检查 CA、有效期<span class="zhen">（validity period）</span>、是否吊销<span class="zhen">（revocation）</span>，然后随机生成会话密钥（TLS 1.2 用服务器<span class="zhen">（server）</span>公钥加密<span class="zhen">（public-key encryption）</span>发回；TLS 1.3 用 EDH 协商）。`,
op:[`✗`,`✓`,`✗ 客户端<span class="zhen">（client）</span>几乎不认证<span class="zhen">（no authentication）</span>`,`✗`],
tip:`服务器<span class="zhen">（server）</span>：证书<span class="zhen">（certificate）</span> + 公私钥<span class="zhen">（public-private key pair）</span>；客户端<span class="zhen">（client）</span>：什么都不用，只负责发起连接。`,ref:`P5 TLS · 录音 W7–W8`,
hot:`W7：“作为客户端<span class="zhen">（client）</span>你不需要任何密钥<span class="zhen">（key）</span>，但服务器<span class="zhen">（server）</span>必须有 SSL 证书<span class="zhen">（certificate）</span>。”`}
]);

window.NOTES = window.NOTES || {};
window.NOTES.t = `<h3 class="warn">考试安排（老师课上宣布）</h3>
<ul>
<li><b>你是 Group A：Quiz 在 10 月 30 日（周五），具体时间和教室待确认。</b>老师 W2 课上宣布的是 Group B 的安排：10 月 26 日（周一）10:40，在上课的 LT；原定 11 月 1 日（周日）取消，因为 NTU 规定周末不能考；Group A 另外安排。<span class="ref">W2</span></li>
<li>Quiz：30 分钟，每人从题库随机抽题（左右前后的人题目都不同）。单选，不倒扣，<b>点了就不能回退</b>。电脑装 LockDown Browser；可带一张空白纸，但要先给监考看。<span class="ref">W2、W3</span></li>
<li>Quiz 范围是 <b>Part 1–5</b>，<b>Part 6 区块链<span class="zhen">（blockchain）</span>不考</b>。只考 slides，不考视频和统计数字。<b>P4 题最多</b>，P2 也会有。<span class="ref">W8</span></li>
<li>样题不会原样出现，会改写、换选项顺序。真题<b>比样题简单</b>，样题里的“绕”是故意的。老师说提前交卷的人错得最多，30 分钟足够，慢慢做。<span class="ref">W3、W5、W8</span></li>
<li>期末：<b>约 80% 是计算题</b>，每题都有计算。只能带 NTU 批准的科学计算器（没有 mod 键），不能带纸和电子设备，要带实体证件（如护照）。<span class="ref">W2</span></li>
<li>第 12 周复习课会告诉大家考哪些题、怎样答才能拿满分；考前 2–3 天会有 Zoom 答疑。<span class="ref">W2、W6</span></li>
</ul>
<h3 class="warn">期末计算题清单（每题约 15 分）</h3>
<table class="mini"><tr><th>题型</th><th>老师怎么说</th><th>去哪练</th></tr>
<tr><td>暴力破解时间<span class="zhen">（brute-force time）</span></td><td>“最容易拿的 15 分”，但很多人算错单位；÷ 31,536,000 换算成年；有 bots 再除</td><td>计算题 → 暴力破解<span class="zhen">（brute force）</span></td></tr>
<tr><td>DoS 包数</td><td>和暴力破解<span class="zhen">（brute force）</span>合计约 30 分；包大小<span class="zhen">（packet size）</span>与网速的关系</td><td>计算题 → DoS</td></tr>
<tr><td>风险分<span class="zhen">（risk score）</span> / 密码合规<span class="zhen">（password compliance）</span></td><td>“如果考 compliance，每题都有计算”</td><td>计算题 → 风险分<span class="zhen">（risk score）</span></td></tr>
<tr><td><b>Diffie-Hellman</b></td><td>“really easy 15 marks”；简述原理 + 算公钥<span class="zhen">（public key）</span>和共享密钥<span class="zhen">（shared key）</span></td><td><b>期末专项</b></td></tr>
<tr><td><b>RSA</b></td><td>“至少 15 分”；为什么 e ≠ 2 + 选 e + 求 d + 加密<span class="zhen">（encryption）</span>解密<span class="zhen">（decryption）</span></td><td><b>期末专项</b></td></tr>
<tr><td><b>RSA 数字签名<span class="zhen">（digital signature）</span></b></td><td>不用哈希<span class="zhen">（hash）</span>：S = M<sup>d</sup> mod n，验证 S<sup>e</sup> mod n</td><td><b>期末专项</b></td></tr>
</table>
<h3>考试数字和手算规则</h3>
<ul>
<li><b>数字都小于 20，最大素数<span class="zhen">（large prime）</span>是 19</b>（老师在 W6、W7 重复了很多遍，说“到复习时你们还会发邮件问计算器为什么算不了大数”）。</li>
<li>计算器没有 mod 键，用除法法：320 mod 9 → 320 ÷ 9 = 35.55…；35 × 9 = 315；320 − 315 = <b>5</b>。</li>
<li><b>公式考试不给，必须背：</b>
  <ul>
  <li>DH：Y = g<sup>x</sup> mod p；K = (对方的 Y)<sup>自己的 x</sup> mod p</li>
  <li>RSA：n = pq；φ = (p−1)(q−1)；e·d mod φ = 1；C = M<sup>e</sup> mod n；M = C<sup>d</sup> mod n</li>
  <li>签名<span class="zhen">（signature）</span>：S = M<sup>d</sup> mod n；验证：S<sup>e</sup> mod n = M（与加密<span class="zhen">（encryption）</span>相反：私钥<span class="zhen">（private key）</span>签，公钥<span class="zhen">（public key）</span>验）</li>
  </ul></li>
<li>老师说过的扣分点：答案对但没按题目要求写步骤，15 分题只给约 5 分（“我和朋友答案一样，为什么他 A 我 C？”）。每一步都写：公式 → 代入 → 结果，最后验算（解密<span class="zhen">（decryption）</span>回原文 / 双方密钥<span class="zhen">（key）</span>相等）。</li>
</ul>
<h3>DH 必背（W6）</h3>
<ol><li>公开选定素数<span class="zhen">（prime number）</span> p 和生成元<span class="zhen">（generator）</span> g（题目会给）</li><li>双方各自选私密数<span class="zhen">（private value）</span>（题目会给）</li><li>A 算公钥<span class="zhen">（public key）</span> Y<sub>A</sub> = g<sup>a</sup> mod p</li><li>B 算公钥<span class="zhen">（public key）</span> Y<sub>B</sub> = g<sup>b</sup> mod p</li><li>交换公钥<span class="zhen">（public key）</span></li><li>各自算共享密钥<span class="zhen">（shared key）</span>：K<sub>A</sub> = Y<sub>B</sub><sup>a</sup> mod p，K<sub>B</sub> = Y<sub>A</sub><sup>b</sup> mod p，两者相等</li></ol>
<p>可能的追问：私密数<span class="zhen">（private value）</span>泄露<span class="zhen">（leak）</span>会怎样？（攻击者<span class="zhen">（attacker）</span>能算出 K，毫无安全性）数字太小会怎样？（会被试出来，实际至少 2048 位）DH 能加密<span class="zhen">（encryption）</span>吗？（不能，只交换密钥<span class="zhen">（key）</span>，之后用 AES 加密<span class="zhen">（encryption）</span>）安全基础是什么？（离散对数难题<span class="zhen">（discrete logarithm problem）</span>）</p>
<h3>RSA 必背（W7）</h3>
<ul><li>安全基础：大数分解难题<span class="zhen">（integer factorization problem）</span>。</li>
<li>选 e 的<b>三个条件</b>：① 1 &lt; e &lt; φ；② e 是素数<span class="zhen">（prime number）</span>；③ e 与 p−1、q−1 没有公因子<span class="zhen">（common factor）</span>。</li>
<li><b>为什么 e 不能是 2</b>（往年考题）：除 2 外的素数<span class="zhen">（prime number）</span>都是奇数，减 1 后是偶数，2 一定是公因子<span class="zhen">（common factor）</span>，不满足第 ③ 条。</li>
<li>求 d 的 k 法：d = (kφ + 1)/e，k = 1, 2, 3… 直到整除。老师建议考试就用这个方法。</li>
<li>老师课上的练习题：p=5, q=11 自选密钥<span class="zhen">（key）</span>；p=17, q=19, e=5, M=25；p=13, q=23, e=7。</li></ul>
<h3>Quiz 高频陷阱（老师点名）</h3>
<ul>
<li>CIA 题有约 20 个版本、约 80% 人做错：注意 Access / Consideration 这类拼写陷阱。<span class="ref">W3</span></li>
<li>virus 要宿主，worm 不要；人冒充叫 masquerading，服务器<span class="zhen">（server）</span>/IP 伪造<span class="zhen">（forgery）</span>叫 spoofing。<span class="ref">W2、W3</span></li>
<li>没认证<span class="zhen">（authentication）</span>不能授权<span class="zhen">（authorization）</span>。<span class="ref">W5</span></li>
<li>DES = Data Encryption Standard；<b>DES 密钥<span class="zhen">（key）</span> 56 位</b>（不是 64 位）；AES 分组 128 位，128/192/256 位密钥<span class="zhen">（key）</span>分别对应 10/12/14 轮。<span class="ref">W6</span></li>
<li>“公钥<span class="zhen">（public key）</span>更安全因为有两把钥匙”是错的；没有 unbreakable，也没有 certified encryption；新算法可以用但要谨慎。<span class="ref">W8</span></li>
<li>哈希<span class="zhen">（hash）</span>只提供完整性<span class="zhen">（integrity）</span>，不提供认证<span class="zhen">（authentication）</span>；证书<span class="zhen">（certificate）</span>只认证<span class="zhen">（authentication）</span>公钥<span class="zhen">（public key）</span>；SHA 是算法，digest 和 hash value 是输出。<span class="ref">W8</span></li>
<li>验证证书<span class="zhen">（certificate）</span>看三件事（“这题以前考过”）：可信 CA（验 CA 签名<span class="zhen">（signature）</span>）、有效期<span class="zhen">（validity period）</span>内、未被吊销<span class="zhen">（revocation）</span>（查序列号<span class="zhen">（serial number）</span>）。<span class="ref">W8</span></li>
</ul>
<h3>Part 1–3 老师口径</h3>
<ul>
<li>gray hat：发现漏洞<span class="zhen">（vulnerability）</span>告诉所有者，但会索要钱。<span class="ref">W3</span></li>
<li>top-down 总是有效，bottom-up 不行；DLM 第 1–3 层是非技术层（约 75%）；zero trust 下连总裁的设备也要认证<span class="zhen">（authentication）</span>。<span class="ref">W4</span></li>
<li>identification 是一对多<span class="zhen">（one-to-many）</span>，verification 是一对一<span class="zhen">（one-to-one）</span>；FRR 是 Type I，FAR 是 Type II；3D 人脸<span class="zhen">（face）</span>约在 90° 内有效。生物识别<span class="zhen">（biometrics）</span>要 100% 匹配才能取代密码<span class="zhen">（password）</span>，所以现在只能增强。<span class="ref">W5</span></li>
<li>密码学<span class="zhen">（cryptography）</span>能提供保密性<span class="zhen">（confidentiality）</span>、完整性<span class="zhen">（integrity）</span>、认证<span class="zhen">（authentication）</span>和不可否认<span class="zhen">（non-repudiation）</span>；<b>不能提供可用性<span class="zhen">（availability）</span>和隐私<span class="zhen">（privacy）</span></b>（机密性<span class="zhen">（confidentiality）</span> ≠ 隐私<span class="zhen">（privacy）</span>）。对称加密<span class="zhen">（symmetric encryption）</span>适合加密<span class="zhen">（encryption）</span>自己的硬盘，公钥加密<span class="zhen">（public-key encryption）</span>适合通信，TLS 是两者混合。<span class="ref">W5</span></li>
</ul>
<h3>TLS / Web 安全（W8）</h3>
<ul>
<li>HTTP 用 80 端口<span class="zhen">（port）</span>；HTTPS = HTTP + TLS，用 443 端口<span class="zhen">（port）</span>。只认证服务器<span class="zhen">（authentication server）</span>，客户端<span class="zhen">（client）</span>几乎不认证<span class="zhen">（no authentication）</span>（太慢、不友好）。</li>
<li>SSL 由 Netscape 在 1994 年推出（ElGamal 主导），SSL 3.0 在 1996 年；1999 年 IETF 改名 TLS 1.0；1.1 在 2006 年、1.2 在 2008 年、<b>1.3 在 2018 年 3 月</b>。SSL 3.0 在 2015 年禁用，TLS 1.0/1.1 在 2020 年禁用（因疫情没强制执行）。</li>
<li>公钥<span class="zhen">（public key）</span>至少 2048 位；会话密钥<span class="zhen">（session key）</span> 128 位足够，低于 128 位不安全。</li>
<li><b>TLS 1.3 去掉 RSA 密钥交换<span class="zhen">（key exchange）</span></b>：服务器<span class="zhen">（server）</span>私钥<span class="zhen">（private key）</span>长期不变，被破后历史通信都能解开（前向保密<span class="zhen">（forward secrecy）</span>问题），所以改用临时 DH（EDH），每次会话<span class="zhen">（session）</span>都换参数。RSA 仍可用于签名<span class="zhen">（signature）</span>。</li>
<li>TLS 1.3 算法套件<span class="zhen">（cipher suite）</span>从 37 个减到 5 个（不安全的去掉了，管理员<span class="zhen">（administrator）</span>也不容易配错），握手<span class="zhen">（handshake）</span>更快。</li>
<li>Record：分片<span class="zhen">（fragmentation）</span> → 压缩 → MAC → 加密<span class="zhen">（encryption）</span> → 加头。证书<span class="zhen">（certificate）</span>问题由 Alert 报出。Handshake 最复杂。</li>
</ul>
<h3 class="warn">老师课上的口误 / 课件错误</h3>
<ul>
<li>DH 例 p=29、g=2、a=5、b=13：课件写 K = 26，<b>正确是 Y<sub>B</sub> = 14、K = 19</b>。</li>
<li>W8 把 TLS 1.3 说成“TLS 3.1”；W7 说 SHA-1 是“168 位”，实际是 160 位；W4 风险<span class="zhen">（risk）</span>例子把 4×3×5 说成“16”，实际是 60。</li>
<li>老师要求 RSA 的 e“必须是素数<span class="zhen">（prime number）</span>”，比标准说法（gcd(e, φ) = 1）更严格，考试按老师的写。</li>
</ul>`;

/* 合并两份进度（本机 a、云端或导入的 b）：同一题以较新的作答为准，错题取并集，尊重“清空错题本 / 清空全部”的时间 */
function mergeState(a,b){
  var bl=blank();a=a||bl;b=b||bl;
  function fill(x){for(var k in bl){if(x[k]===undefined)x[k]=clone(bl[k])}return x}
  a=fill(clone(a));b=fill(clone(b));
  var ta=a._t||0,tb=b._t||0;
  if((a._reset||0)>tb)return a;if((b._reset||0)>ta)return b;
  var nw=ta>=tb?a:b,od=nw===a?b:a,m=clone(nw);
  var ans={},src={};[[od,'o'],[nw,'n']].forEach(function(p){var o=p[0].ans||{};for(var k in o){if(!ans[k]||(o[k].t||0)>=(ans[k].t||0)){ans[k]=o[k];src[k]=p[0]}}});
  m.ans=ans;
  var clr=Math.max(a._wclr||0,b._wclr||0),C=(a._wclr||0)>=(b._wclr||0)?a:b,w={};
  [a,b].forEach(function(X){for(var k in X.wrong){
    var an=ans[k];
    if(clr&&!C.wrong[k]&&!(an&&an.t>clr&&!an.ok))continue;
    if(an&&an.ok&&src[k]&&!src[k].wrong[k])continue;
    w[k]=1}});
  m.wrong=w;
  var st={};[a,b].forEach(function(X){for(var k in X.star)st[k]=1});m.star=st;

  mk.sort(function(x,y){return (x.t||0)-(y.t||0)});m.mocks=mk;
  m._t=Math.max(ta,tb);m._wclr=clr;m._reset=Math.max(a._reset||0,b._reset||0);
  return m;
}

function cloudQueue(){if(!CL.ref)return;clearTimeout(CL.timer);CL.timer=setTimeout(cloudPush,2500)}
function cloudPush(){
  if(!CL.ref)return;if(CL.busy){CL.dirty=true;return}
  CL.busy=true;clearTimeout(CL.timer);
  CL.ref.set({s:clone(S),at:Date.now()}).then(function(){CL.st='on'},function(e){CL.st=(e&&e.code==='invalid_argument')?'ro':'err'}).then(function(){CL.busy=false;cloudBadge();if(CL.dirty){CL.dirty=false;cloudPush()}});
}
function applyRemote(r){
  var m=mergeState(S,r);if(JSON.stringify(m)===JSON.stringify(S))return false;

function cloudInit(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],us=r[1];if(!db||!us)return null;
    return us.id().then(function(id){
      if(!id)return null;
      CL.ref=db.collection('data/users/'+id).doc('drill');
      return CL.ref.get().then(function(snap){
        var remote=snap.exists?(snap.data()||{}).s:null;
        if(remote)applyRemote(remote);
        CL.st='on';cloudBadge();
        if(!remote||JSON.stringify(remote)!==JSON.stringify(S))cloudPush();
        CL.ref.onSnapshot(function(sn){if(!sn.exists||sn.metadata.hasPendingWrites)return;var rr=(sn.data()||{}).s;if(rr&&(rr._t||0)>(S._t||0))applyRemote(rr)},function(){});
      });
    });
  }).catch(function(){CL.st='err';cloudBadge()});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&CL.timer){cloudPush()}});
}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function drawMock(){
  var pool=MCQ.filter(function(q){if(q.p>5)return false;if(M.scope==='hot')return !!hotOf(q);return M.scope==='all'||(M.scope==='n'?(q.s==='n'||q.mock):M.scope==='calc'?!!q.calc:q.s==='o')});
  var parts={};pool.forEach(function(q){(parts[q.p]=parts[q.p]||[]).push(q.id)});
  var keys=Object.keys(parts);keys.forEach(function(k){shuffle(parts[k])});
  var out=[],per=Math.floor(M.n/keys.length);
  keys.forEach(function(k){out=out.concat(parts[k].splice(0,per))});
  var rest=shuffle([].concat.apply([],keys.map(function(k){return parts[k]})));
  out=out.concat(rest.slice(0,M.n-out.length));
  out.sort(function(x,y){return BY[x].p-BY[y].p||MCQ.indexOf(BY[x])-MCQ.indexOf(BY[y])});
  return out;
}

function parseNum(s){
  if(s===undefined||s===null)return NaN;
  s=String(s).trim().replace(/,/g,'').replace(/\s+/g,'').replace(/×/g,'*').replace(/x10\^|\*10\^/gi,'e').replace(/\^/g,'e');
  if(/^[+-]?\d+(\.\d+)?e[+-]?\d+$/i.test(s)||/^[+-]?\d*\.?\d+$/.test(s))return parseFloat(s);
  return NaN;
}
function checkAns(v,a){
  if(a.text)return String(v).trim().toUpperCase().replace(/\s+/g,'')===String(a.v).toUpperCase().replace(/\s+/g,'');
  var x=parseNum(v);if(isNaN(x))return false;
  if(a.log){if(x<=0)return false;return Math.abs(Math.log10(x)-a.log)<0.03}
  var t=a.tol!==undefined?a.tol:0;
  return Math.abs(x-a.v)<=Math.max(t,1e-9)||(!!a.rel&&Math.abs(x-a.v)<=Math.abs(a.v)*a.rel);
}

/* ---- big-int helpers ---- */
function B(x){try{return BigInt(String(x).trim())}catch(e){return null}}
function bgcd(a,b){while(b){var t=a%b;a=b;b=t}return a}
function isPrimeN(n){n=Number(n);if(!Number.isFinite(n)||n<2||n!==Math.floor(n))return false;if(n<4)return true;if(n%2===0)return false;for(var i=3;i*i<=n;i+=2)if(n%i===0)return false;return true}
function primeFactors(n){n=Number(n);var f=[],d=2;while(n>1&&d*d<=n){if(n%d===0){f.push(d);while(n%d===0)n/=d}d++}if(n>1)f.push(n);return f}
function mpow(x,e,n){x=((x%n)+n)%n;var r=1n;while(e>0n){if(e&1n)r=r*x%n;x=x*x%n;e>>=1n}return r}
function mpowTable(x,e,n,label){
  var base=((x%n)+n)%n,res=1n,ee=e,i=0,rows='',bits=e.toString(2);
  while(ee>0n){var bit=ee&1n;var pw=(1n<<BigInt(i)).toString();if(bit)res=res*base%n;
    rows+='<tr class="'+(bit?'hit':'dim')+'"><td>'+i+'</td><td>'+bit+'</td><td>'+label+'<sup>'+pw+'</sup> ≡ '+base+'</td><td>'+(bit?res:'—')+'</td></tr>';
    base=base*base%n;ee>>=1n;i++}
  var parts=[];for(var j=0;j<bits.length;j++)if(bits[bits.length-1-j]==='1')parts.unshift((1n<<BigInt(j)).toString());
  return {res:res,html:'<p>指数 '+e+' = '+bits+'₂ = '+parts.join(' + ')+'。从低位到高位反复平方，只在该位为 1 时把当前幂乘进结果（每一步都 mod '+n+'）：</p><div class="tbl"><table class="calc"><tr><th>位 i</th><th>位值</th><th>'+label+'<sup>2^i</sup> mod '+n+'</th><th>累乘结果</th></tr>'+rows+'</table></div>'};
}
function inverseSteps(e,m){
  /* k-method (course style) + extended Euclid */
  var out={d:null,k:'',eu:''};
  if(bgcd(e,m)!==1n)return out;
  var rows='',k=1n,found=null,shown=0;
  while(found===null){var val=k*m+1n,ok=val%e===0n;
    if(k<=6n||ok)rows+='<tr class="'+(ok?'hit':'')+'"><td>'+k+'</td><td>'+k+'×'+m+'+1 = '+val+'</td><td>'+(ok?'÷'+e+' = '+(val/e)+' ✓':'不能被 '+e+' 整除')+'</td></tr>';
    else if(shown===0){rows+='<tr class="dim"><td>…</td><td>…</td><td>…</td></tr>';shown=1}
    if(ok)found=val/e;k++;if(k>200000n)break}
  out.d=found;
  out.k='<p>课件方法：e·d = k·φ + 1，所以 d = (k·φ + 1) / e。k 从 1 开始试，直到能整除：</p><div class="tbl"><table class="calc"><tr><th>k</th><th>k·φ+1</th><th>能否整除</th></tr>'+rows+'</table></div>';
  var r0=m,r1=e,t0=0n,t1=1n,er='<tr><td>—</td><td>'+r0+'</td><td>—</td><td>'+t0+'</td></tr><tr><td>—</td><td>'+r1+'</td><td>—</td><td>'+t1+'</td></tr>';
  while(r1!==0n){var q=r0/r1;var r2=r0-q*r1,t2=t0-q*t1;er+='<tr'+(r2===1n?' class="hit"':'')+'><td>'+q+'</td><td>'+r2+'</td><td>'+r0+' = '+q+'×'+r1+' + '+r2+'</td><td>'+t2+'</td></tr>';r0=r1;r1=r2;t0=t1;t1=t2}
  var inv=((t0%m)+m)%m;
  out.eu='<p>扩展欧几里得表：每行做一次带余除法，t<sub>i</sub> = t<sub>i−2</sub> − q·t<sub>i−1</sub>。余数为 1 那一行的 t 就是逆元（负数时加 '+m+'）：t = '+t0+' → d = '+inv+'</p><div class="tbl"><table class="calc"><tr><th>q</th><th>r</th><th>除法</th><th>t</th></tr>'+er+'</table></div>';
  return out;
}

function letterEnc(txt,n){
  var L=String(txt).toUpperCase().replace(/[^A-Z]/g,'');
  var nums=L.split('').map(function(c){return c.charCodeAt(0)-65});
  var pair=n>2525n;
  var blocks=[],labels=[];
  if(pair){if(nums.length%2){nums.push(23);L+='X'}for(var i=0;i<nums.length;i+=2){blocks.push(BigInt(nums[i]*100+nums[i+1]));labels.push(L.substr(i,2))}}
  else for(var j=0;j<nums.length;j++){blocks.push(BigInt(nums[j]));labels.push(L[j])}

}

    return rsaItem({p:p2,q:q2,e:sel?0:e,M:M},type);
  }
  return rsaItem({p:5,q:11,e:3,M:32},type);
}
function divMod(V,n){
  if(V<n)return V+' &lt; '+n+'，所以 mod 结果就是 <b>'+V+'</b>';
  var q=V/n,r=V-q*n,frac=(Number(r)/Number(n)).toFixed(4).slice(1);
  return V+' ÷ '+n+' = '+q+frac+'… → 取整数部分 '+q+'，'+q+' × '+n+' = '+(q*n)+' → '+V+' − '+(q*n)+' = <b>'+r+'</b>';
}
function powLine(x,e,n){
  x=BigInt(x);e=BigInt(e);n=BigInt(n);
  var V=x**e;
  if(V<=9999999999n)return {res:V%n,html:'<p class="mono" style="font-size:13px">'+x+'<sup>'+e+'</sup> = '+V+'；'+divMod(V,n)+'</p>'};
  var t=mpowTable(x,e,n,String(x));
  return {res:t.res,html:'<p class="muted" style="font-size:13px">'+x+'<sup>'+e+'</sup> 有 '+String(V).length+' 位，计算器放不下，用平方-乘法，每一步都先取 mod：</p>'+t.html};
}
function eSelHTML(it){
  var p=it.p,q=it.q,fp=primeFactors(p-1),fq=primeFactors(q-1),rows='',c=[2,3,5,7,11,13,17,19],chosen=it.e;
  for(var i=0;i<c.length;i++){var x=c[i];if(x>=it.phi)break;var bad=fp.indexOf(x)>=0||fq.indexOf(x)>=0;
    rows+='<tr class="'+(x===chosen?'hit':'')+'"><td>'+x+'</td><td style="text-align:left">'+(bad?'✗ 是 '+(fp.indexOf(x)>=0?'p−1':'q−1')+' 的因子':'✓ 不是 p−1、q−1 的因子')+'</td></tr>';
    if(x>chosen&&i>=3)break}
  return '<p>Conditions: (1) 1 &lt; e &lt; φ(n) = '+it.phi+'; (2) e is a prime number; (3) e has no common factor with p−1 and q−1.</p><p class="mono" style="font-size:13px">p−1 = '+(p-1)+' = '+fp.join(' × ')+'（素因子）；q−1 = '+(q-1)+' = '+fq.join(' × ')+'</p><div class="tbl"><table class="calc"><tr><th>候选 e</th><th style="text-align:left">条件 (3)</th></tr>'+rows+'</table></div><p>'+(it.sel?'最小的可用值：':'题目给定 ')+'<b>e = '+chosen+'</b>'+(it.sel?'':'，三个条件都满足 ✓')+'</p>';
}
function examKeyHTML(it){
  var h='',sn=1;
  if(it.type==='dh'){
    h+=step('(a)','Briefly explain DH（简答，照这个结构写）','<ul class="en-ans"><li>Diffie-Hellman is a <b>key-exchange protocol</b> (it does not encrypt data); its security is based on the <b>discrete logarithm problem</b> (one-way function).</li><li><b>Step 1:</b> both users publicly agree on a large prime p and a generator g.</li><li><b>Step 2:</b> each user selects a secret (private) number, a and b, and keeps it secret.</li><li><b>Step 3/4:</b> user A computes the public key Y<sub>A</sub> = g<sup>a</sup> mod p; user B computes Y<sub>B</sub> = g<sup>b</sup> mod p.</li><li><b>Step 5:</b> they swap public keys over the Internet.</li><li><b>Step 6:</b> A computes K = Y<sub>B</sub><sup>a</sup> mod p and B computes K = Y<sub>A</sub><sup>b</sup> mod p. Both get the same shared key, which is then used by a symmetric algorithm such as AES.</li><li>An attacker knows p, g, Y<sub>A</sub>, Y<sub>B</sub> but cannot find a or b; in practice the numbers must be at least 2048 bits.</li></ul>');
    var A=powLine(it.g,it.a,it.p),Bv=powLine(it.g,it.b,it.p),KA=powLine(it.YB,it.a,it.p),KB=powLine(it.YA,it.b,it.p);
    h+=step('(b)','Calculation','<p>Step 1 · Public values: p = '+it.p+', g = '+it.g+'. Private numbers: Alice a = '+it.a+', Bob b = '+it.b+'.</p>'+
      '<span class="eq">Step 2 · Alice public key: Y<sub>A</sub> = g<sup>a</sup> mod p = '+it.g+'<sup>'+it.a+'</sup> mod '+it.p+' = <b>'+A.res+'</b></span>'+A.html+
      '<span class="eq">Step 3 · Bob public key: Y<sub>B</sub> = g<sup>b</sup> mod p = '+it.g+'<sup>'+it.b+'</sup> mod '+it.p+' = <b>'+Bv.res+'</b></span>'+Bv.html+
      '<p>Step 4 · Swap: Alice sends '+A.res+' to Bob; Bob sends '+Bv.res+' to Alice.</p>'+
      '<span class="eq">Step 5 · Alice shared key: K<sub>A</sub> = Y<sub>B</sub><sup>a</sup> mod p = '+it.YB+'<sup>'+it.a+'</sup> mod '+it.p+' = <b>'+KA.res+'</b></span>'+KA.html+
      '<span class="eq">Step 6 · Bob shared key: K<sub>B</sub> = Y<sub>A</sub><sup>b</sup> mod p = '+it.YA+'<sup>'+it.b+'</sup> mod '+it.p+' = <b>'+KB.res+'</b></span>'+KB.html+
      '<p><b>K<sub>A</sub> = K<sub>B</sub> = '+KA.res+'</b> ✓ Both users obtain the same shared secret key.</p>'+
      (it.p===29&&it.g===2&&it.b===13?'<div class="tipbox">⚠ 课件 P4-63 把 2<sup>13</sup> mod 29 写成 27，K 写成 26；正确是 Y<sub>B</sub> = 14、K = 19。</div>':''));
    h+=step('(c)','Follow-up','<p class="en-ans">'+DHFOLLOW[it.fu].a+'</p>');
  }else{
    if(it.type==='rsa')h+=step('(a)','Why 2 cannot be the public key（往年原题）','<ul class="en-ans"><li>The public key e must satisfy three conditions: (1) 1 &lt; e &lt; φ(n); (2) e must be a prime number; (3) e must have <b>no common factor</b> with (p−1) and (q−1).</li><li>All prime numbers except 2 are odd, so p−1 and q−1 are always <b>even</b> and always contain the factor 2.</li><li>Therefore e = 2 always shares the common factor 2 with p−1 and q−1 and fails condition (3), whether the primes are small or large. (2 does satisfy conditions 1 and 2.)</li></ul>');
    else h+=step('(a)','Encryption vs signature（简答）','<ul class="en-ans"><li><b>RSA encryption</b> (confidentiality): the sender encrypts with the <b>receiver\'s public key</b>, C = M<sup>e</sup> mod n; only the receiver can decrypt with his <b>private key</b>, M = C<sup>d</sup> mod n.</li><li><b>RSA digital signature</b> (authentication, non-repudiation, integrity): the signer signs with his <b>own private key</b>, S = M<sup>d</sup> mod n; anyone verifies with the <b>signer\'s public key</b>, M = S<sup>e</sup> mod n.</li><li>The same algorithm is used with the keys reversed. In practice the hash (digest) of the message is signed instead of the whole message, for speed.</li></ul>');
    var b=it.type==='rsa'?'(b)':'(b)';
    h+=step(b,'n and φ(n)','<span class="eq">n = p × q = '+it.p+' × '+it.q+' = <b>'+it.n+'</b></span><span class="eq">φ(n) = (p−1)(q−1) = '+(it.p-1)+' × '+(it.q-1)+' = <b>'+it.phi+'</b></span>');
    var inv=inverseSteps(BigInt(it.e),BigInt(it.phi));
    h+=step(it.type==='rsa'?'(c)':'(b)',(it.sel?'Select e, then ':'')+'private key d',eSelHTML(it)+'<p>Private key: e × d mod φ(n) = 1 → d = (k·φ(n) + 1) / e</p>'+inv.k+'<span class="eq">d = <b>'+it.d+'</b>　check: '+it.e+' × '+it.d+' = '+(it.e*it.d)+' = '+Math.floor(it.e*it.d/it.phi)+' × '+it.phi+' + 1 ✓</span><p>Public key (e, n) = ('+it.e+', '+it.n+')；Private key (d, n) = ('+it.d+', '+it.n+')</p>');
    if(it.type==='rsa'){
      var en=powLine(it.M,it.e,it.n),de=powLine(it.C,it.d,it.n);
      h+=step('(d)','Encrypt and decrypt','<span class="eq">Encryption: C = M<sup>e</sup> mod n = '+it.M+'<sup>'+it.e+'</sup> mod '+it.n+' = <b>'+en.res+'</b></span>'+en.html+
        '<span class="eq">Decryption: M = C<sup>d</sup> mod n = '+it.C+'<sup>'+it.d+'</sup> mod '+it.n+' = <b>'+de.res+'</b></span>'+de.html+'<p>The decrypted value equals the original message M = '+it.M+' ✓, so the keys and the calculation are correct.</p>');
    }else{
      var sg=powLine(it.M,it.d,it.n),vf=powLine(it.S,it.e,it.n);
      h+=step('(c)','Sign and verify','<span class="eq">Signature (private key): S = M<sup>d</sup> mod n = '+it.M+'<sup>'+it.d+'</sup> mod '+it.n+' = <b>'+sg.res+'</b></span>'+sg.html+
        '<span class="eq">Verification (public key): S<sup>e</sup> mod n = '+it.S+'<sup>'+it.e+'</sup> mod '+it.n+' = <b>'+vf.res+'</b></span>'+vf.html+'<p>The result equals M = '+it.M+' ✓, so the signature is verified (signed with the private key d, verified with the public key e).</p>');
    }
  }
  h+='<div class="hotbox"><b>老师的扣分提醒</b>：每一步写“公式 → 代入数字 → 结果”，公式不会给你；最后一定要验算（解密回原文、双方 K 相等、验签得回 M）。只写最终答案，15 分只剩约 5 分。</div>';
  return h;
}
