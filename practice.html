ex:`不合理的策略<span class="zhen">（policy）</span>会被<b>绕过</b>。例如要求每周换一次 20 位密码<span class="zhen">（password）</span>，员工就会把密码<span class="zhen">（password）</span>写在便利贴上。Q&A Q18 强调需要 "Strong and <b>sensible</b> policies"；P3-8 实施策略时要 "Including staff in policy development"。`,
op:[`✓`,`✗ 用户不能随意修改策略<span class="zhen">（policy）</span>。`,`✗`,`✗`],
tip:`策略<span class="zhen">（policy）</span>要 sensible，否则会被 bypass。`,ref:`P3-8；Q&A Q18`},

{id:'3.06',p:3,s:'o',q:`Distinguish between standards and guidelines.`,
o:[`Standards are mandatory while guidelines are discretionary`,`Standards must be followed, while guidelines can be completely ignored`,`Standard can be optional while guidelines are fixed`,`None of the above`],a:0,
zh:`区分标准（standards）与指南（guidelines）。`,
ex:`<b>Standards 是强制的（mandatory）</b>，必须遵守；<b>Guidelines 是酌情的（discretionary）</b>，可以根据情况决定是否采用。但“酌情”不等于“完全忽略”，见下一题：决策者必须认真考虑 guidelines。`,
op:[`✓`,`✗ “完全忽略”说过头了。`,`✗ 说反了。`,`✗`],
tip:`Standard = must；Guideline = should consider。`,ref:`样题 Q3-2、Q3-3`},

{id:'3.07',p:3,s:'o',q:`For guidelines, what is mandatory?`,
o:[`It is mandatory for decision makers to carefully consider guidelines`,`Nothing is mandatory for guidelines`,`Since guidelines are must, everything is mandatory in guidelines`,`None of the above`],a:0,
zh:`对于指南，什么是强制的？`,
ex:`虽然 guidelines 不强制执行，但<b>决策者必须认真考虑它们</b>。这正是“discretionary”和“可以无视”的区别：可以不采纳，但不能不考虑，不采纳时要有理由。`,
op:[`✓`,`✗ 必须考虑。`,`✗ 并非样样强制。`,`✗`],
tip:`Guideline：可以不照做，但不能不考虑。`,ref:`样题 Q3-3`},

{id:'3.08',p:3,s:'o',q:`Which of the following is not an authentication factor?`,
o:[`Something you have`,`Something you know`,`Something you see`,`Something you are`],a:2,
zh:`以下哪项不是认证因素<span class="zhen">（authentication factor）</span>？`,
ex:`P3-18 三种认证因素<span class="zhen">（authentication factor）</span>：<br>• <b>Something you have</b>：令牌<span class="zhen">（token）</span>、智能卡<span class="zhen">（smart card）</span>；<br>• <b>Something you know</b>：PIN、密码<span class="zhen">（password）</span>；<br>• <b>Something you are</b>：生物特征<span class="zhen">（biometric characteristic）</span>。<br>“Something you see”是编造的。`,
op:[`✗ 是`,`✗ 是`,`✓ 不是`,`✗ 是`],
tip:`Have / Know / Are。MFA = 至少两种不同类别的因素组合。`,ref:`P3-18`},

{id:'3.09',p:3,s:'o',q:`________ is the process of assessing the identity of each individual claiming to have permission to use a resource.`,
o:[`Authorizations`,`Authentication`,`Availability`,`None of the above`],a:1,
zh:`______ 是对每个声称有权使用资源的人进行身份评估的过程。`,
ex:`<b>Authentication 认证</b> = 验证“你是不是你声称的那个人”。<b>Authorization 授权</b> = 确认身份后决定“你能做什么”。题干的关键词是 assessing the <b>identity</b>，所以是认证<span class="zhen">（authentication）</span>。`,
op:[`✗ 授权<span class="zhen">（authorization）</span>在认证<span class="zhen">（authentication）</span>之后，决定权限<span class="zhen">（privileges）</span>。`,`✓`,`✗ CIA 中的可用性<span class="zhen">（availability）</span>。`,`✗`],
tip:`AuthN（认证<span class="zhen">（authentication）</span>：你是谁）→ AuthZ（授权<span class="zhen">（authorization）</span>：你能干什么）。`,ref:`P3-18、P3-24`},

{id:'3.10',p:3,s:'o',q:`Short and simple reusable passwords are always easy for hackers to crack?`,
o:[`Yes: As it can be cracked or guessed easily`,`No: Regardless whether it is simple or complex, no password can be easily cracked`,`It will still take very long time as no password is easy to crack`,`None of the above`],a:0,
zh:`短而简单、重复使用的密码<span class="zhen">（reused password）</span>，对黑客<span class="zhen">（hacker）</span>来说总是容易破解吗？`,
ex:`是。短密码<span class="zhen">（password）</span>的组合数<span class="zhen">（number of combinations）</span>小，暴力破解<span class="zhen">（brute force）</span>很快（P1-55：6 位数字只要 2 秒）；简单密码<span class="zhen">（password）</span>在字典里，<b>字典攻击<span class="zhen">（dictionary attack）</span></b>立即命中；重复使用的密码<span class="zhen">（reused password）</span>在一处泄露<span class="zhen">（leak）</span>后，可以拿去<b>撞库</b>（P1-59 GitHub 2013 事件）。P3-18 也说处理器提速和密码分析<span class="zhen">（cryptanalysis）</span>的进步让密码<span class="zhen">（password）</span>成为弱保护。`,
op:[`✓`,`✗ 显然错。`,`✗ 简单密码<span class="zhen">（password）</span>几秒就能破。`,`✗`],
tip:`密码强度<span class="zhen">（password strength）</span>：长度 > 复杂度；不要复用。`,ref:`P1-53～P1-59、P3-18`},

{id:'3.11',p:3,s:'o',q:`Using biometric technology can enhance customer trust?`,
o:[`Yes: In fact, it does enhance customer trust and combat fraud`,`No: Trust is not related to biometric based technology`,`Trust can only be enhanced using complex system`,`None of the above`],a:0,
zh:`使用生物识别<span class="zhen">（biometrics）</span>技术能增强客户信任吗？`,
ex:`能。生物特征<span class="zhen">（biometric characteristic）</span>难伪造<span class="zhen">（forgery）</span>、不可转让（P3-23 Advantages：Hard to Forge、Non-transferable），用在银行 App 登录、e-KYC 数字身份验证（P3-22）中，能<b>增强信任、打击欺诈<span class="zhen">（fraud）</span></b>。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`生物识别<span class="zhen">（biometrics）</span> → 难伪造<span class="zhen">（forgery）</span> → 防欺诈<span class="zhen">（fraud）</span> → 增强信任。`,ref:`P3-22、P3-23`},

{id:'3.12',p:3,s:'o',q:`What is the most common type of biometrics device in use today?`,
o:[`Lie detectors that measure pulse rate`,`Long and complex passwords`,`Fingerprint scanners and readers`,`Retinal scanners`,`None of the above`],a:2,
zh:`如今最常见的生物识别<span class="zhen">（biometrics）</span>设备是什么？`,
ex:`P3-25："Fingerprint is the <b>most widely used biometric</b> because it is easy to use, and very inexpensive to deploy." 笔记本、手机里都内置了指纹读取器<span class="zhen">（fingerprint reader）</span>。（原题选项字母印成了 a,b,b,c,d，这里按顺序排成 A–E。）`,
op:[`✗ 测谎仪不是认证<span class="zhen">（authentication）</span>设备。`,`✗ 密码<span class="zhen">（password）</span>不是生物特征<span class="zhen">（biometric characteristic）</span>。`,`✓`,`✗ 视网膜扫描<span class="zhen">（retinal scan）</span>精确但不是主流（要贴近镜头、往眼睛里打光）。`,`✗`],
tip:`最常用：指纹<span class="zhen">（fingerprint）</span>；最准确：虹膜<span class="zhen">（iris）</span>；最难伪造<span class="zhen">（forgery）</span>但不普及：视网膜<span class="zhen">（retina）</span>。`,ref:`P3-25、P3-30、P3-35`},

{id:'3.13',p:3,s:'o',q:`A false acceptance occurs when a person is improperly matched to a template?`,
o:[`Yes`,`No`],a:0,
zh:`当一个人被错误地匹配到某个模板<span class="zhen">（template）</span>时，就发生了错误接受<span class="zhen">（false acceptance）</span>？`,
ex:`是。<b>False acceptance（FAR，Type II error）</b>：系统把未授权<span class="zhen">（unauthorized）</span>的人错误地认证<span class="zhen">（authentication）</span>通过，相当于把他匹配到了别人的模板（P3-47："incorrectly authenticates unauthorized users"）。反过来，<b>False rejection（FRR，Type I）</b>：合法用户<span class="zhen">（genuine user）</span>被拒。`,
tip:`FAR 放进坏人（危险）；FRR 拦住好人（烦人）。`,ref:`P3-47`},

{id:'3.14',p:3,s:'o',q:`When an attacker deliberately attempts to fool the system, this is called ________.`,
o:[`deception`,`false acceptance`,`false rejection`,`None of the above`],a:0,
zh:`攻击者<span class="zhen">（attacker）</span>故意试图欺骗<span class="zhen">（deception）</span>系统，这叫什么？`,
ex:`P3-49 区分两个概念：<br>• <b>ERRORS</b>：when subject is <b>not</b> trying to fool the system（无意的识别错误）；<br>• <b>DECEPTION</b>：when subject <b>is</b> trying to fool the system（蓄意欺骗<span class="zhen">（deception）</span>，例如用明胶假指纹<span class="zhen">（fingerprint）</span>）。`,
op:[`✓ 故意 = deception`,`✗ 是错误的结果，不区分是否故意。`,`✗`,`✗`],
tip:`无意 → error；故意 → deception。`,ref:`P3-49`},

{id:'3.15',p:3,s:'o',q:`Which of the following statements accurately describes fingerprint recognition?`,
o:[`Fingerprint recognition scanners are very expensive`,`Fingerprint recognition is easily deceived`,`Fingerprint recognition is rarely used`,`None of the above`],a:1,
zh:`以下哪项准确描述了指纹识别<span class="zhen">（fingerprint recognition）</span>？`,
ex:`指纹<span class="zhen">（fingerprint）</span><b>容易被欺骗<span class="zhen">（deception）</span></b>：P3-28 用明胶等材料做的假指纹<span class="zhen">（fingerprint）</span>能骗过系统；P3-29 缺点：指纹<span class="zhen">（fingerprint）</span>更容易被偷（我们摸过的东西上到处都是），可以做出高质量复制品；P3-52 指纹<span class="zhen">（fingerprint）</span>能从键盘上提取，甚至能从高清照片还原。`,
op:[`✗ P3-25：very inexpensive to deploy。`,`✓`,`✗ 最常用。`,`✗`],
tip:`指纹<span class="zhen">（fingerprint）</span>：便宜、常用、但容易被骗。`,ref:`P3-25、P3-28、P3-29、P3-52`},

/* ---------- 自编题（依据课件 sld3） ---------- */
{id:'3.c1',p:3,s:'c',q:`What is the key disadvantage of the bottom-up approach to cyber security?`,
o:[`It lacks technical expertise`,`It lacks participant support and organizational staying power`,`It is too expensive`,`It is initiated by the CEO`],a:1,
zh:`自下而上<span class="zhen">（bottom-up）</span>的安全方法，主要缺点是什么？`,
ex:`P3-10：<b>Bottom-up</b> 由系统管理员<span class="zhen">（system administrator）</span>发起。优点是有技术专长；缺点是很少成功，因为缺少 <b>participant support</b>（参与者支持）和 <b>organizational staying power</b>（组织持续力）。<b>Top-down</b> 由高层发起，有支持、有专门资金、规划清晰，还有机会影响组织文化。`,
op:[`✗ 技术专长恰恰是它的优点。`,`✓`,`✗`,`✗ 那是 top-down。`],
tip:`Bottom-up：有技术，没权力；Top-down：有权力、有钱。`,ref:`P3-10、P3-11`},

{id:'3.c2',p:3,s:'c',q:`In the Digital Liability Management (DLM) four tiers of defense, Tier 1 is:`,
o:[`Hardware, software and network security tools`,`Secure-use procedures`,`Acceptable-use policies and other statements of practice`,`Senior management commitment and support`],a:3,
zh:`在 DLM 四层防御<span class="zhen">（four-tier defense）</span>中，第 1 层是什么？`,
ex:`P3-13 DLM 四层（自上而下<span class="zhen">（top-down）</span>）：<br><b>Tier 1</b> 高层承诺与支持<span class="zhen">（senior management commitment and support）</span> → <b>Tier 2</b> 可接受使用政策<span class="zhen">（acceptable use policy (AUP)）</span>等实践声明<span class="zhen">（statements of practice）</span> → <b>Tier 3</b> 安全使用流程<span class="zhen">（secure-use procedures）</span> → <b>Tier 4</b> 软硬件和网络安全工具<span class="zhen">（network security tools）</span>。<br>DLM 也叫 "The Intersection of Policy and Technology"，体现了 top-down 的思路：技术工具放在<b>最后一层</b>。`,
op:[`✗ Tier 4`,`✗ Tier 3`,`✗ Tier 2`,`✓ Tier 1`],
tip:`DLM：领导 → 政策<span class="zhen">（policy）</span> → 流程 → 工具。`,ref:`P3-12、P3-13`},

{id:'3.c3',p:3,s:'c',q:`The core principle of Zero Trust security is:`,
o:[`Trust everything inside the corporate network`,`Never trust, always verify`,`Trust but verify once`,`Only trust the firewall`],a:1,
zh:`零信任<span class="zhen">（zero trust）</span>安全的核心原则是什么？`,
ex:`P3-14、P5-80："Zero trust implies, <b>never trust, always verify</b>." 访问权限<span class="zhen">（access rights）</span>基于身份、上下文和最小权限<span class="zhen">（least privilege）</span>，而不是网络位置。它取代了“内网<span class="zhen">（internal network）</span>可信、外网<span class="zhen">（external network）</span>不可信”的传统边界模型<span class="zhen">（traditional perimeter model）</span>。常与 Defense in Depth（纵深防御，P3-15：层层叠加防御）一起使用。`,
op:[`✗ 那是传统边界模型<span class="zhen">（traditional perimeter model）</span>。`,`✓`,`✗`,`✗`],
tip:`零信任<span class="zhen">（zero trust）</span>：不看你在哪，只看你是谁、有什么权限<span class="zhen">（privileges）</span>。`,ref:`P3-14、P3-15、P5-80`},

{id:'3.c4',p:3,s:'c',q:`In biometrics, "identification" (Who are you?) involves which type of comparison?`,
o:[`One-to-one`,`One-to-many`,`Many-to-one`,`No comparison`],a:1,
zh:`生物识别<span class="zhen">（biometrics）</span>中的“识别”（你是谁？）属于哪种比对？`,
ex:`P3-18、P3-19：<br>• <b>Identification</b>：确定一个人是谁，Who are you? → <b>一对多<span class="zhen">（one-to-many）</span></b>（在整个库里搜索）；<br>• <b>Verification</b>：确认或否认声称的身份，Are you who you claim to be? → <b>一对一<span class="zhen">（one-to-one）</span></b>（只和你声称的那个模板<span class="zhen">（template）</span>比）。`,
op:[`✗ 那是 verification`,`✓`,`✗`,`✗`],
tip:`Identify = 1:N；Verify = 1:1。`,ref:`P3-18、P3-19`},

{id:'3.c5',p:3,s:'c',q:`The False Rejection Rate (FRR) is also known as:`,
o:[`Type I error`,`Type II error`,`Crossover error`,`Failure to enroll`],a:0,
zh:`错误拒绝率（FRR）也称为什么？`,
ex:`P3-47：<br>1. <b>FRR = Type I error</b>：未能验证合法用户<span class="zhen">（genuine user）</span>的身份（拒绝了好人）；<br>2. <b>FAR = Type II error</b>：错误地认证<span class="zhen">（authentication）</span>了未授权<span class="zhen">（unauthorized）</span>用户（放进了坏人）；<br>3. <b>CER</b>：FAR = FRR 的交叉点，用来比较不同系统，CER 越低越好。`,
op:[`✓`,`✗ FAR`,`✗ CER 是交点`,`✗ FTE 是无法注册<span class="zhen">（failure to enroll）</span>`],
tip:`按字母顺序记：R(eject) → I，A(ccept) → II。`,ref:`P3-47`},

{id:'3.c6',p:3,s:'c',q:`As we increase the sensitivity of a biometric sensor, what happens?`,
o:[`FRR increases and FAR decreases`,`FRR decreases and FAR increases`,`Both FRR and FAR increase`,`Both FRR and FAR decrease`],a:0,
zh:`提高生物识别<span class="zhen">（biometrics）</span>传感器<span class="zhen">（sensor）</span>的灵敏度<span class="zhen">（sensitivity）</span>，会发生什么？`,
ex:`P3-47："As we increase the sensitivity of the biometrics sensors, the FRR increases, and the FAR decreases." 标准越严，坏人越难进（FAR↓），但好人也更常被拒（FRR↑），会让真实用户很烦。两者是此消彼长的关系。`,
op:[`✓`,`✗ 说反了`,`✗`,`✗`],
tip:`越严 → FAR↓ FRR↑。高安全场所（金库）偏好低 FAR；手机解锁偏好低 FRR。`,ref:`P3-47`},

{id:'3.c7',p:3,s:'c',q:`Which biometric is considered the most accurate in the lecture because significantly more information can be measured?`,
o:[`Fingerprint`,`Face`,`Iris`,`Voice`],a:2,
zh:`课件认为哪种生物特征<span class="zhen">（biometric characteristic）</span>最准确（因为可测量的信息多得多）？`,
ex:`P3-30："Because there is significantly more information that can be measured, <b>iris is considered the most accurate biometric</b>." 可以在 1～3 英尺外采集，常用于医疗系统。算法：Daugman 算法，用 Gabor 小波<span class="zhen">（Gabor wavelet）</span>编码，用 Hamming 距离匹配（P3-32）。`,
op:[`✗ 最常用，但不是最准`,`✗ 不如指纹<span class="zhen">（fingerprint）</span>准（P3-37）`,`✓`,`✗`],
tip:`虹膜<span class="zhen">（iris）</span>：最准；视网膜<span class="zhen">（retina）</span>：也非常准，但侵入性强、不是主流。`,ref:`P3-30～P3-35`},

{id:'3.c8',p:3,s:'c',q:`Which of the following is a BEHAVIORAL biometric?`,
o:[`Hand geometry`,`Keystroke dynamics`,`Iris`,`DNA`],a:1,
zh:`以下哪项是行为生物特征<span class="zhen">（behavioral biometric）</span>？`,
ex:`P3-21：<br>• 生理特征（Physiological，身体特征<span class="zhen">（physical characteristic）</span>）：指纹<span class="zhen">（fingerprint）</span>、虹膜<span class="zhen">（iris）</span>、视网膜<span class="zhen">（retina）</span>、人脸<span class="zhen">（face）</span>、手形<span class="zhen">（hand geometry）</span>、DNA；<br>• <b>行为特征（Behavioral）</b>：声音、<b>击键动态<span class="zhen">（keystroke dynamics）</span>（打字节<span class="zhen">（byte）</span>奏、速度、力度）</b>、步态<span class="zhen">（gait）</span>、签名<span class="zhen">（signature）</span>。<br>生理特征<span class="zhen">（physiological characteristic）</span>通常更稳定（P3-22）。`,
op:[`✗ 生理`,`✓ 行为`,`✗ 生理`,`✗ 生理`],
tip:`“做出来的”是行为特征<span class="zhen">（behavioral characteristic）</span>，“长出来的”是生理特征<span class="zhen">（physiological characteristic）</span>。`,ref:`P3-21、P3-22`},

{id:'3.c9',p:3,s:'c',q:`"Failure to Enroll (FTE)" in biometrics refers to:`,
o:[`An attacker fooling the system`,`A subject who cannot enroll in the system, e.g., due to worn fingerprints from construction work`,`The point where FAR equals FRR`,`A revoked biometric template`],a:1,
zh:`生物识别<span class="zhen">（biometrics）</span>中的“注册失败（FTE）”指什么？`,
ex:`P3-49：<b>Failure to Enroll</b>：某人根本<b>无法注册</b>进系统。例如建筑工人、文员或老人的指纹<span class="zhen">（fingerprint）</span>磨损严重，采不到合格的模板<span class="zhen">（template）</span>。影响性能的其他因素还有：人口特征、模板老化<span class="zhen">（template aging）</span>、生理变化<span class="zhen">（physiological change）</span>、外表（眼镜、化妆）、行为（紧张、姿势）。`,
op:[`✗ deception`,`✓`,`✗ CER`,`✗`],
tip:`FTE 发生在“注册”阶段，FAR 和 FRR 发生在“认证<span class="zhen">（authentication）</span>”阶段。`,ref:`P3-49`},

{id:'3.c10',p:3,s:'c',q:`Using an artifact (e.g., a fake gelatin fingerprint) to mimic the biometric of an enrolled user is called:`,
o:[`Sensor output interception`,`Presentation attack`,`Insider threat`,`Enrollment integrity attack`],a:1,
zh:`用人造物（如明胶假指纹<span class="zhen">（fingerprint）</span>）冒充<span class="zhen">（masquerading）</span>已注册用户的生物特征<span class="zhen">（biometric characteristic）</span>，这叫什么攻击？`,
ex:`P3-50 生物识别系统<span class="zhen">（biometric system）</span>的攻击方式：<br>• <b>Presentation attacks</b>：用人造物模仿用户的生物特征<span class="zhen">（biometric characteristic）</span>；<br>• Sensor output interception：截获参考模板<span class="zhen">（reference template）</span>后用于攻击；<br>• Reference & database：利用漏洞<span class="zhen">（vulnerability）</span>访问模板库<span class="zhen">（template database）</span>；<br>• Integrity of enrollment：攻击者<span class="zhen">（attacker）</span>用自己的特征替授权<span class="zhen">（authorization）</span>用户注册；<br>• Insider threats：内部人员偷取或滥用模板<span class="zhen">（template）</span>。`,
op:[`✗`,`✓ 在传感器<span class="zhen">（sensor）</span>前“出示”假特征`,`✗`,`✗`],
tip:`Presentation = 在传感器<span class="zhen">（sensor）</span>前“出示”假特征。`,ref:`P3-50`},

{id:'3.c11',p:3,s:'c',q:`What is the lecture's conclusion about biometrics versus passwords?`,
o:[`Biometrics should completely replace passwords`,`Biometrics can enhance, but not replace, passwords`,`Passwords are always more secure`,`Biometrics cannot be spoofed`],a:1,
zh:`课件对生物识别<span class="zhen">（biometrics）</span>和密码<span class="zhen">（password）</span>的结论是什么？`,
ex:`P3-53："Biometrics can <b>enhance, but not replace</b>, passwords." 原因：生物特征<span class="zhen">（biometric characteristic）</span><b>不可撤销<span class="zhen">（irrevocable）</span></b>（泄露<span class="zhen">（leak）</span>后换不了，P3-23 Non-revocability、P3-51 High risk）、可能被伪造<span class="zhen">（forgery）</span>、有隐私<span class="zhen">（privacy）</span>问题，所以最好与密码<span class="zhen">（password）</span>配合使用（多因素认证<span class="zhen">（multi-factor authentication (MFA)）</span>）。`,
op:[`✗`,`✓`,`✗`,`✗ 可以被伪造<span class="zhen">（forgery）</span>`],
tip:`生物特征<span class="zhen">（biometric characteristic）</span>最大的弱点：泄露<span class="zhen">（leak）</span>后没法换。`,ref:`P3-23、P3-51、P3-53`},

{id:'3.c12',p:3,s:'c',q:`Which is the correct order of the biometric authentication process?`,
o:[`Capture → Enrollment → Decision → Comparison`,`Enrollment → Capture → Comparison → Decision`,`Comparison → Capture → Enrollment → Decision`,`Decision → Enrollment → Capture → Comparison`],a:1,
zh:`生物识别<span class="zhen">（biometrics）</span>认证<span class="zhen">（authentication）</span>流程的正确顺序是？`,
ex:`P3-24：1. <b>Enrollment</b>：采集并存储为模板<span class="zhen">（template）</span>；2. <b>Capture</b>：需要认证<span class="zhen">（authentication）</span>时扫描特征；3. <b>Comparison</b>：与存储的模板<span class="zhen">（template）</span>比对；4. <b>Decision</b>：匹配就放行，否则拒绝。P3-46 的图也是同样两个阶段：初始注册<span class="zhen">（initial enrollment）</span>，然后后续访问时比对，判断是否 "close enough"。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`先注册，后采集，再比对，最后判决。`,ref:`P3-24、P3-46`}
]);

/* Part 4 · Cryptography, Digital Signature & Digital Certificates (sld4) */
window.MCQ = (window.MCQ || []).concat([
{id:'4.01',p:4,s:'o',q:`The process of converting from plaintext to cipher text is known as deciphering or decryption.`,
o:[`Yes`,`No`],a:1,
zh:`把明文<span class="zhen">（plaintext）</span>转换成密文<span class="zhen">（ciphertext）</span>的过程叫解密<span class="zhen">（decryption）</span>。对吗？`,
ex:`不对，说反了。P4-5：<b>ENCRYPTION</b>：Changing plaintext to ciphertext（明文 → 密文，也叫 enciphering）；<b>DECRYPTION</b>：Changing ciphertext to plaintext（密文 → 明文，也叫 deciphering）。`,
tip:`En- 进去（变成密文<span class="zhen">（ciphertext）</span>），De- 出来（还原明文<span class="zhen">（plaintext）</span>）。`,ref:`P4-5、P4-8、P4-9`},

{id:'4.02',p:4,s:'o',q:`If both sender and receiver use the same key to encrypt and decrypt, the system is referred to as:`,
o:[`Public-key crypto system`,`Asymmetric key crypto system`,`Symmetric key crypto system`,`None of the above`],a:2,
zh:`发送方和接收方用同一把密钥<span class="zhen">（key）</span>加密<span class="zhen">（encryption）</span>和解密<span class="zhen">（decryption）</span>，这种系统叫什么？`,
ex:`同一把密钥<span class="zhen">（key）</span>就是<b>对称</b>（Symmetric），也叫 secret-key / private-key cryptography。P4-11：E<sub>K</sub>(M) = C，D<sub>K</sub>(C) = M，一把 K 搞定。`,
op:[`✗ 公钥<span class="zhen">（public key）</span>是两把钥匙`,`✗ 非对称<span class="zhen">（asymmetric）</span>是两把钥匙`,`✓`,`✗`],
tip:`对称<span class="zhen">（symmetric）</span> = 一把钥匙（快，但分发难）；非对称<span class="zhen">（asymmetric）</span> = 一对钥匙（慢，但分发易）。`,ref:`P4-11、P4-12、P4-19`},

{id:'4.03',p:4,s:'o',q:`When message is divided into blocks (e.g., sets of 8- or 16-bit blocks) and each is transformed into encrypted block of cipher using algorithm and key it is called`,
o:[`Block Cipher`,`Bit Stream Cipher`,`Both a and b`,`None of the above`],a:0,
zh:`把消息分成块（如 8 或 16 位一块），每块用算法和密钥<span class="zhen">（key）</span>加密<span class="zhen">（encryption）</span>，这叫什么？`,
ex:`P4-15 原文就是 <b>BLOCK CIPHER</b> 的定义，例子有 DES、AES。对比 <b>BIT STREAM</b>：每次加密<span class="zhen">（encryption）</span>一位（或一个字节<span class="zhen">（byte）</span>），例子有 RC4。`,
op:[`✓`,`✗ 流密码<span class="zhen">（stream cipher）</span>逐位或逐字节<span class="zhen">（byte）</span>处理`,`✗`,`✗`],
tip:`分块 → Block；逐位 → Stream。DES/AES 是块，RC4 是流。`,ref:`P4-15`},

{id:'4.04',p:4,s:'o',q:`Which of the following is a symmetric crypto system using 64-bit blocks?`,
o:[`RSA`,`DES`,`PGP`,`None of the above`],a:1,
zh:`以下哪个是使用 64 位分组的对称密码<span class="zhen">（symmetric cipher）</span>系统？`,
ex:`<b>DES</b>：对称分组密码<span class="zhen">（symmetric block cipher）</span>，<b>分组 64 位</b>，密钥<span class="zhen">（key）</span> 56 位，16 轮（P4-23）。RSA 是非对称算法<span class="zhen">（asymmetric algorithm）</span>；PGP 是用于邮件加密<span class="zhen">（encryption）</span>的混合加密<span class="zhen">（hybrid encryption）</span>软件，本身不是分组算法。`,
op:[`✗ 非对称<span class="zhen">（asymmetric）</span>`,`✓`,`✗ 混合加密<span class="zhen">（hybrid encryption）</span>程序`,`✗`],
tip:`DES：64 位分组 / 56 位密钥<span class="zhen">（key）</span> / 16 轮。AES：128 位分组 / 128、192、256 位密钥<span class="zhen">（key）</span> / 10、12、14 轮。`,ref:`P4-23、P4-36`},

{id:'4.05',p:4,s:'o',q:`What size key does a DES system use?`,
o:[`64 bit`,`128 bit`,`56 bit`,`256 bit`],a:2,
zh:`DES 使用多长的密钥<span class="zhen">（key）</span>？`,
ex:`<b>56 位</b>（P4-23 "56-bit key length"）。密钥输入实际是 64 位，但其中 8 位是奇偶校验位<span class="zhen">（parity bits）</span>，有效密钥<span class="zhen">（key）</span>只有 56 位，这正是最容易混淆的地方：64 是分组长度<span class="zhen">（block size）</span>，56 是密钥长度<span class="zhen">（key length）</span>。1998 年 EFF 用专用机器 56 小时破解了 DES（P4-25）。`,
op:[`✗ 那是分组长度<span class="zhen">（block size）</span>（陷阱）`,`✗ AES-128`,`✓`,`✗ AES-256`],
tip:`DES 密钥<span class="zhen">（key）</span>只有 56 位，太短，这是它被淘汰的原因。`,ref:`P4-23、P4-25、P4-26`},

{id:'4.06',p:4,s:'o',q:`What is data encryption standard (DES)?`,
o:[`Block cipher`,`Stream cipher`,`Bit cipher`,`None of the above`],a:0,
zh:`DES 属于哪种密码<span class="zhen">（password）</span>？`,
ex:`DES 是<b>分组密码（block cipher）</b>，对每个 64 位块做 16 轮代换和置换（P4-23）。`,
op:[`✓`,`✗ RC4 才是流密码<span class="zhen">（stream cipher）</span>`,`✗`,`✗`],
tip:`DES、3DES、AES 都是块密码<span class="zhen">（block cipher）</span>。`,ref:`P4-15、P4-23`},

{id:'4.07',p:4,s:'o',q:`Which is the largest disadvantage of the symmetric Encryption?`,
o:[`More complex and therefore more time-consuming calculations`,`Problem of the secure transmission of the Secret Key`,`Less secure encryption function`,`Isn't used any more`],a:1,
zh:`对称加密<span class="zhen">（symmetric encryption）</span>最大的缺点是什么？`,
ex:`<b>密钥分发<span class="zhen">（key distribution）</span></b>。P4-19："Main problem is getting the sender and receiver to agree on the secret key without anyone else finding out." 另外用户多了，每两人之间都要一把密钥<span class="zhen">（key）</span>，难以扩展（n 人需要 n(n−1)/2 把密钥<span class="zhen">（key）</span>）。`,
op:[`✗ 那是非对称<span class="zhen">（asymmetric）</span>的缺点（慢）`,`✓`,`✗ AES 非常安全`,`✗ 广泛使用（TLS、磁盘加密<span class="zhen">（disk encryption）</span>）`],
tip:`对称<span class="zhen">（symmetric）</span>：快，但钥匙难送；非对称<span class="zhen">（asymmetric）</span>：慢，但钥匙好发。所以要用混合系统<span class="zhen">（hybrid system）</span>。`,ref:`P4-19、P4-44`},

{id:'4.08',p:4,s:'o',q:`What you should be most careful of when looking for an encryption method to use?`,
o:[`Complexity of the algorithm`,`Veracity of the vendor's claims`,`Speed of the algorithm`,`How long the algorithm has been around`],a:3,
zh:`选择加密方法<span class="zhen">（encryption method）</span>时，最需要注意什么？`,
ex:`官方答案 <b>D：算法存在了多久（是否经过时间检验）</b>。一个算法是否可信，靠的是多年公开、反复的分析与攻击测试。Q&A Q23："the algorithms are tested for many years under various real-world conditions... by industry, academia, mathematic, cryptography experts." AES 的遴选也花了 5 年（P4-37）。新算法未经时间检验，风险<span class="zhen">（risk）</span>最大。`,
op:[`✗ 复杂不等于安全`,`易混项：厂商宣传当然不能轻信（见下题），但本题官方答案选 D`,`✗ 速度是次要考量`,`✓ 时间检验`],
tip:`密码学<span class="zhen">（cryptography）</span>信“老”不信“新”：经受住多年攻击才可信。`,ref:`P4-37；Q&A Q23`},

{id:'4.09',p:4,s:'o',q:`Which of the following is most likely to be true of an encryption method that is advertised as unbreakable?`,
o:[`It is probably suitable for military use.`,`It may be too expensive for your organization.`,`It is likely to be exaggerated.`,`It is probably one you want to use.`],a:2,
zh:`一种宣传为“牢不可破<span class="zhen">（unbreakable）</span>”的加密方法<span class="zhen">（encryption method）</span>，最可能的情况是？`,
ex:`<b>多半是夸大</b>。任何密码<span class="zhen">（password）</span>在理论上都可以暴力穷举，只是时间长短的问题（P4-14：Security = strength of algorithm + length of key）。课件里同样的思路：P3-49 说厂商宣称的 FAR/FRR “tend to be exaggerated through tests under ideal conditions”。`,
op:[`✗`,`✗`,`✓`,`✗`],
tip:`“Unbreakable”是营销用语，不是密码学<span class="zhen">（cryptography）</span>结论。`,ref:`P4-14、P3-49`},

{id:'4.10',p:4,s:'o',q:`Which of the following is most true regarding certified encryption methods?`,
o:[`These are the only methods you should use.`,`It depends on the level of certification.`,`It depends on the source of the certification.`,`There is no such thing as certified encryption.`],a:3,
zh:`关于“经过认证<span class="zhen">（authentication）</span>的加密方法<span class="zhen">（encryption method）</span>”，哪项最正确？`,
ex:`官方答案 <b>D：不存在所谓“认证过的加密<span class="zhen">（certified encryption）</span>”</b>。没有任何权威能“认证<span class="zhen">（authentication）</span>”一种加密方法<span class="zhen">（encryption method）</span>绝对安全。算法的可信度来自公开审查和时间检验，而不是一纸证书<span class="zhen">（certificate）</span>。（严格来说，NIST 有 FIPS 标准和加密模块<span class="zhen">（cryptographic module）</span>验证，但本题考的是这个观念，考试按官方选 D。）`,
op:[`✗`,`✗`,`✗`,`✓`],
tip:`同组题思路一致：不信宣传、不信证书<span class="zhen">（certificate）</span>，信时间检验。`,ref:`样题 Q4-4`},

{id:'4.11',p:4,s:'o',q:`Which of the following is most true regarding new encryption methods?`,
o:[`Never use them until they have been proven.`,`You can use them, but you must be cautious.`,`Only use them if they are certified.`,`Only use them if they are rated unbreakable.`],a:1,
zh:`关于新的加密方法<span class="zhen">（encryption method）</span>，哪项最正确？`,
ex:`<b>可以用，但要谨慎</b>。“永远不用”太绝对（所有算法都曾经是新的，AES 在 2001 年也是新算法）；“只用认证<span class="zhen">（authentication）</span>过的”和“只用宣称牢不可破<span class="zhen">（unbreakable）</span>的”，前两题已经说明这两种说法站不住。`,
op:[`✗ 太绝对`,`✓`,`✗ 不存在 certified encryption`,`✗ 不存在 unbreakable`],
tip:`这一组 8–11 题是连环题：信时间、不信宣传、不信证书<span class="zhen">（certificate）</span>、谨慎尝新。`,ref:`样题 Q4-3、Q4-4`},

{id:'4.12',p:4,s:'o',q:`Asymmetric encryption utilizes only a public key for encryption and decryption.`,
o:[`True`,`False`],a:1,
zh:`非对称加密<span class="zhen">（asymmetric encryption）</span>只用公钥<span class="zhen">（public key）</span>来加密<span class="zhen">（encryption）</span>和解密<span class="zhen">（decryption）</span>。`,
ex:`错。非对称加密<span class="zhen">（asymmetric encryption）</span>使用<b>两把</b>数学相关的密钥：public key 和 private key（P4-44、P4-46）。一把加密<span class="zhen">（encryption）</span>，只有另一把能解密<span class="zhen">（decryption）</span>。`,
tip:`非对称<span class="zhen">（asymmetric）</span> = 公钥<span class="zhen">（public key）</span> + 私钥<span class="zhen">（private key）</span>，一对。`,ref:`P4-44、P4-46`},

{id:'4.13',p:4,s:'o',q:`Asymmetric encryption can be used for confidentiality but not for authentication.`,
o:[`True`,`False`],a:1,
zh:`非对称加密<span class="zhen">（asymmetric encryption）</span>能用于机密性<span class="zhen">（confidentiality）</span>，但不能用于认证<span class="zhen">（authentication）</span>。`,
ex:`错。非对称加密<span class="zhen">（asymmetric encryption）</span><b>两者都能做</b>（P4-47）：<br>• <b>机密性<span class="zhen">（confidentiality）</span></b>：用<b>接收方公钥<span class="zhen">（public key）</span></b>加密<span class="zhen">（encryption）</span>，只有接收方私钥<span class="zhen">（private key）</span>能解（P4-48）；<br>• <b>认证<span class="zhen">（authentication）</span></b>：发送方用<b>自己的私钥<span class="zhen">（private key）</span></b>“加密<span class="zhen">（encryption）</span>”（签名<span class="zhen">（signature）</span>），任何人用发送方公钥能解开，就证明是他发的（P4-49 Public key authentication，即数字签名<span class="zhen">（digital signature）</span>）。`,
tip:`机密性<span class="zhen">（confidentiality）</span>用对方公钥<span class="zhen">（public key）</span>；认证<span class="zhen">（authentication）</span>用自己私钥<span class="zhen">（private key）</span>。`,ref:`P4-47～P4-49`},

{id:'4.14',p:4,s:'o',q:`Public-key encryption is more secure than symmetric encryption as it uses two keys.`,
o:[`True`,`False`],a:1,
zh:`公钥加密<span class="zhen">（public-key encryption）</span>比对称加密<span class="zhen">（symmetric encryption）</span>更安全，因为它用两把钥匙。`,
ex:`错。安全性取决于<b>算法强度<span class="zhen">（algorithm strength）</span>和密钥长度</b>（P4-14：SECURITY = STRENGTH OF ALGORITHM + LENGTH OF KEY），与钥匙数量无关。P4-97 的等效强度<span class="zhen">（equivalent strength）</span>表：128 位对称密钥<span class="zhen">（symmetric key）</span> ≈ 256 位 ECC ≈ <b>3072 位 RSA</b>。公钥<span class="zhen">（public key）</span>的优势是<b>解决了密钥分发<span class="zhen">（key distribution）</span></b>，不是“更安全”。`,
tip:`两把钥匙解决的是分发问题，不是强度问题。`,ref:`P4-14、P4-97、P4-100`},

{id:'4.15',p:4,s:'o',q:`The most widely used public-key cryptosystem is __________ .`,
o:[`RSA`,`DES`,`3DES`,`None of the above`],a:0,
zh:`最广泛使用的公钥密码系统<span class="zhen">（public key cryptosystem）</span>是哪个？`,
ex:`<b>RSA</b>（Q&A Q24 "The most widely used public-key algorithm is the RSA cryptosystem"；P4-100 "RSA is the most commonly used system for web security"）。DES 和 3DES 都是对称算法<span class="zhen">（symmetric algorithm）</span>。`,
op:[`✓`,`✗ 对称<span class="zhen">（symmetric）</span>`,`✗ 对称<span class="zhen">（symmetric）</span>`,`✗`],
tip:`公钥算法<span class="zhen">（public key algorithm）</span>：RSA、Diffie-Hellman、ElGamal、ECC。`,ref:`P4-44、P4-100；Q&A Q24`},

{id:'4.16',p:4,s:'o',q:`The Diffie-Hellman algorithm depends on the difficulty of computing discrete logarithms for its effectiveness.`,
o:[`True`,`False`],a:0,
zh:`Diffie-Hellman 的安全性依赖于计算离散对数<span class="zhen">（discrete logarithm）</span>的困难性。`,
ex:`对。P4-51："Security is based on 'Discrete Log Problem'"：y = g<sup>x</sup> mod p，已知 g、x、p 求 y 很容易；已知 y、g、p 求 x 非常困难。对比：<b>RSA 依赖大数分解<span class="zhen">（integer factorization）</span></b>的困难性。`,
tip:`DH 和 ElGamal 依赖离散对数<span class="zhen">（discrete logarithm）</span>；RSA 依赖大数分解<span class="zhen">（integer factorization）</span>。`,ref:`P4-51、P4-96`},

{id:'4.17',p:4,s:'o',q:`Most of the products and standards that use public-key cryptography for encryption and digital signatures use RSA.`,
o:[`True`,`False`],a:0,
zh:`大多数使用公钥密码<span class="zhen">（public-key cryptography）</span>做加密<span class="zhen">（encryption）</span>和数字签名<span class="zhen">（digital signature）</span>的产品与标准都用 RSA。`,
ex:`对。RSA 是一个完整的系统（密钥生成<span class="zhen">（key generation）</span> + 加密<span class="zhen">（encryption）</span> + 解密<span class="zhen">（decryption）</span>），既能加密<span class="zhen">（encryption）</span>又能签名（P4-100、P4-117）。对比：DH 只能做密钥交换<span class="zhen">（key exchange）</span>，不能加密<span class="zhen">（encryption）</span>消息（P4-51）。`,
tip:`RSA 能加密<span class="zhen">（encryption）</span>也能签名<span class="zhen">（signature）</span>；DH 只能交换密钥<span class="zhen">（key）</span>。`,ref:`P4-100、P4-117`},

{id:'4.18',p:4,s:'o',q:`Suppose that you are using the RSA algorithm and have chosen two prime numbers, p = 5 and q = 11. What will be value of Phi`,
o:[`55`,`13`,`14`,`None of the above`],a:3,
zh:`RSA 中选 p = 5、q = 11，φ 是多少？`,
ex:`φ(n) = (p−1)(q−1) = 4 × 10 = <b>40</b>，不在选项里，所以选 D。<br>陷阱：55 是 n = p × q，不是 φ。`,
op:[`✗ 那是 n`,`✗`,`✗`,`✓ φ = 40`],
tip:`n = p·q；φ = (p−1)(q−1)。`,ref:`P4-67、P4-70`},

{id:'4.19',p:4,s:'o',q:`In RSA algorithm, if the two prime numbers are, 5 and 11 then what will be value of Modulus, N`,
o:[`55`,`44`,`20`,`None of the above`],a:0,
zh:`RSA 中两个素数<span class="zhen">（prime number）</span>是 5 和 11，模数<span class="zhen">（modulus）</span> N 是多少？`,
ex:`N = p × q = 5 × 11 = <b>55</b>（P4-67："Compute their products (called modulus) N = p * q"）。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`和上一题连着考：N = 55，φ = 40。`,ref:`P4-67、P4-69`},

{id:'4.20',p:4,s:'o',q:`Given two very large prime numbers p and q, a composite number N (Modulus) can be calculated as N = p* q. However, given just N, it is not feasible for hackers to find p and q.`,
o:[`Yes, that is true`,`No, that is not true at all`,`It may be possible in some cases`,`None of the above`],a:0,
zh:`给定两个很大的素数<span class="zhen">（prime number）</span>，N = p × q 容易算；但只给 N，黑客<span class="zhen">（hacker）</span>找不出 p 和 q。对吗？`,
ex:`对，这就是 RSA 的安全基础：<b>大数分解难题</b>（P4-67 "RSA obtains its security from the difficulty of factoring large numbers"）。Q&A Q29：p、q 和 φ(n) 必须保密，知道任何一个就能推出另一个。`,
op:[`✓`,`✗`,`✗ 理论上有量子计算<span class="zhen">（quantum computing）</span>威胁（Shor 算法，P4-125），但本题的标准答案是 A`,`✗`],
tip:`乘法容易，分解<span class="zhen">（factorization）</span>难，这就是“单向<span class="zhen">（one-way）</span>”。`,ref:`P4-67；Q&A Q28、Q29`},

{id:'4.21',p:4,s:'o',q:`In public key cryptosystem when Carol sends a message to Bob for confidentiality, what key will she use to encrypt the message?`,
o:[`Public Key`,`Bob's Public Key`,`Carols' Private Key`,`None of the above.`],a:1,
zh:`公钥<span class="zhen">（public key）</span>系统中，Carol 要给 Bob 发机密消息，她用哪把钥匙加密<span class="zhen">（encryption）</span>？`,
ex:`为了<b>机密性<span class="zhen">（confidentiality）</span></b>，用<b>接收方（Bob）的公钥<span class="zhen">（public key）</span></b>加密<span class="zhen">（encryption）</span>，这样只有 Bob 的私钥<span class="zhen">（private key）</span>能解开（P4-48："Bob use Alice key for encryption — Only Alice can decrypt"）。`,
op:[`✗ 没说是谁的公钥<span class="zhen">（public key）</span>，不够精确`,`✓`,`✗ 用自己的私钥<span class="zhen">（private key）</span>是签名<span class="zhen">（signature）</span>（认证<span class="zhen">（authentication）</span>），不是保密`,`✗`],
tip:`保密 → 用收件人的公钥<span class="zhen">（public key）</span>锁上 → 只有收件人能开。`,ref:`P4-47、P4-48`},

{id:'4.22',p:4,s:'o',q:`In public key cryptosystem when Carol sends an encrypted message to Bob for confidentiality, what key will Bob use to decrypt the message?`,
o:[`Bob's Private Key`,`Bob's Public Key`,`Carols' Private Key`,`Carol's Public Key`],a:0,
zh:`Bob 用哪把钥匙解密<span class="zhen">（decryption）</span> Carol 发来的机密消息？`,
ex:`用 Bob 公钥加密<span class="zhen">（public-key encryption）</span>的内容，只有 <b>Bob 的私钥<span class="zhen">（private key）</span></b>能解开（"If Key A encrypts message, only Key B can decrypt"，P4-44）。`,
op:[`✓`,`✗ 公钥加密<span class="zhen">（public-key encryption）</span>的内容，公钥<span class="zhen">（public key）</span>解不开`,`✗ Bob 没有 Carol 的私钥<span class="zhen">（private key）</span>`,`✗`],
tip:`谁收件，谁用自己的私钥<span class="zhen">（private key）</span>解。`,ref:`P4-44、P4-46`},

{id:'4.23',p:4,s:'o',q:`In a classroom with 30 students and a professor, how many public and private keys will be used if all students want to submit the encrypted assignment to the professor?`,
o:[`30 public and 30 private`,`1 public and 30 private`,`1 public and 1 private`,`Variable keys depending on the application`],a:3,
zh:`一个班 30 名学生加 1 位教授，学生都要向教授提交加密<span class="zhen">（encryption）</span>作业，要用多少把公钥<span class="zhen">（public key）</span>和私钥<span class="zhen">（private key）</span>？`,
ex:`官方答案 <b>D：取决于应用</b>。<br>• 如果只要求<b>机密性<span class="zhen">（confidentiality）</span></b>：所有学生都用<b>教授的公钥<span class="zhen">（public key）</span></b>加密<span class="zhen">（encryption）</span>，教授用自己的私钥<span class="zhen">（private key）</span>解密<span class="zhen">（decryption）</span>，只需 1 对密钥<span class="zhen">（key）</span>（1 public + 1 private）；<br>• 如果还要证明<b>是哪个学生交的</b>（认证<span class="zhen">（authentication）</span>或不可否认<span class="zhen">（non-repudiation）</span>，即每人签名<span class="zhen">（signature）</span>）：每个学生还需要自己的密钥对<span class="zhen">（key pair）</span>，就是 31 对；<br>• 如果采用混合系统<span class="zhen">（hybrid system）</span>，还会有会话密钥<span class="zhen">（session key）</span>。<br>所以数量随应用需求而变。`,
op:[`✗`,`✗`,`易混项：只考虑机密性<span class="zhen">（confidentiality）</span>时是 1 对，但题目没限定应用`,`✓ 官方答案`],
tip:`这题考“看需求”：保密需要 1 对，签名<span class="zhen">（signature）</span>需要每人 1 对。`,ref:`P4-47～P4-49`},

{id:'4.24',p:4,s:'o',q:`In asymmetric cryptography system for confidential communication, the private key is used by ----------------- to decrypt ciphertext`,
o:[`Sender`,`Receiver`,`Sender and receiver`,`All the connected devices on the network`],a:1,
zh:`非对称密码系统<span class="zhen">（asymmetric cryptosystem）</span>的机密通信中，谁用私钥<span class="zhen">（private key）</span>解密<span class="zhen">（decryption）</span>密文<span class="zhen">（ciphertext）</span>？`,
ex:`<b>接收方</b>用自己的私钥<span class="zhen">（private key）</span>解密<span class="zhen">（decryption）</span>。P4-46："PRIVATE-KEY: Known only to the recipient, used to decrypt messages, and sign (create) signatures."`,
op:[`✗ 发送方用接收方公钥加密<span class="zhen">（public-key encryption）</span>`,`✓`,`✗ 私钥<span class="zhen">（private key）</span>只有一人持有`,`✗`],
tip:`私钥<span class="zhen">（private key）</span> = 只有一个主人。`,ref:`P4-46`},

{id:'4.25',p:4,s:'o',q:`A __________ is a digital document issued and digitally signed by Certification Authority that binds the name of a subscriber to a public key.`,
o:[`Digital certificate`,`Digital signature`,`Both a and b`,`None of the above`],a:0,
zh:`由证书颁发机构<span class="zhen">（certificate authority (CA)）</span>签发并数字签名<span class="zhen">（digital signature）</span>、把用户名字和公钥<span class="zhen">（public key）</span>绑定在一起的数字文件是什么？`,
ex:`<b>数字证书</b>（X.509）。P4-118："Digital certificate provides the subject's (True Party's) name and public key." P4-121：CA 用自己的私钥<span class="zhen">（private key）</span>给证书<span class="zhen">（certificate）</span>签名<span class="zhen">（signature）</span>。`,
op:[`✓`,`✗ 签名<span class="zhen">（signature）</span>是对消息摘要<span class="zhen">（message digest）</span>的私钥<span class="zhen">（private key）</span>运算，不是 CA 签发的文件`,`✗`,`✗`],
tip:`证书<span class="zhen">（certificate）</span> = 名字 + 公钥<span class="zhen">（public key）</span> + CA 签名<span class="zhen">（signature）</span>。`,ref:`P4-118～P4-121`},

{id:'4.26',p:4,s:'o',q:`The principal object of a hash function is __________ .`,
o:[`Data integrity`,`Authentication`,`Both a and b`,`None of the above`],a:0,
zh:`哈希函数<span class="zhen">（hash function）</span>的主要目的是什么？`,
ex:`哈希<span class="zhen">（hash）</span>的首要作用是<b>数据完整性<span class="zhen">（data integrity）</span></b>：消息改一个字，摘要<span class="zhen">（digest）</span>就面目全非（P4-111 雪崩效应<span class="zhen">（avalanche effect）</span>示例）。哈希<span class="zhen">（hash）</span>本身<b>没有密钥<span class="zhen">（key）</span></b>，所以单独使用无法证明是谁发的；要和私钥<span class="zhen">（private key）</span>签名<span class="zhen">（signature）</span>结合，才能提供认证<span class="zhen">（authentication）</span>。P4-124 汇总表：Hash Functions → Data integrity, password storage。`,
op:[`✓`,`✗ 认证<span class="zhen">（authentication）</span>要靠签名<span class="zhen">（signature）</span>（私钥<span class="zhen">（private key）</span>）`,`✗`,`✗`],
tip:`Hash 保证完整性<span class="zhen">（integrity）</span>；Hash + 私钥<span class="zhen">（private key）</span>（签名<span class="zhen">（signature）</span>）才有认证<span class="zhen">（authentication）</span>。`,ref:`P4-108～P4-111、P4-124`},

{id:'4.27',p:4,s:'o',q:`The most important and widely used family of cryptographic hash functions is the __________ family`,
o:[`Secure Hash Algorithm (SHA)`,`Digest`,`Hash Value`,`All of the above`],a:0,
zh:`最重要、最广泛使用的密码哈希函数<span class="zhen">（cryptographic hash function）</span>家族是？`,
ex:`<b>SHA</b> 家族（P4-109）：SHA-1（160 位，已发现碰撞<span class="zhen">（collision）</span>，不再安全）、SHA-2（SHA-224/256/384/512）。比特币<span class="zhen">（Bitcoin）</span>的工作量证明<span class="zhen">（proof of work (PoW)）</span>就用 SHA-256（P6-63）。“Digest”和“Hash value”是哈希的输出，不是函数家族的名字。`,
op:[`✓`,`✗ 输出名称`,`✗ 输出名称`,`✗`],
tip:`MD5 和 SHA-1 已不安全，用 SHA-2 或 SHA-3。`,ref:`P4-109、P4-110`},

{id:'4.28',p:4,s:'o',q:`The hash value of a message in __________ application is encrypted with a sender's private key.`,
o:[`Digital signature`,`Digital certificate`,`Secure Hash Algorithm (SHA)`,`None of the above`],a:0,
zh:`在哪种应用中，消息的哈希值<span class="zhen">（hash value）</span>会用发送方私钥<span class="zhen">（private key）</span>加密<span class="zhen">（encryption）</span>？`,
ex:`这就是<b>数字签名<span class="zhen">（digital signature）</span></b>的制作过程（P4-105、P4-112）：消息 → 哈希<span class="zhen">（hash）</span>得到摘要<span class="zhen">（digest）</span> → 用<b>发送方私钥<span class="zhen">（private key）</span></b>加密<span class="zhen">（encryption）</span>摘要<span class="zhen">（digest）</span> → 得到签名<span class="zhen">（signature）</span>，附在消息后面。`,
op:[`✓`,`✗ 证书<span class="zhen">（certificate）</span>由 CA 私钥<span class="zhen">（private key）</span>签名<span class="zhen">（signature）</span>，签的是证书<span class="zhen">（certificate）</span>内容`,`✗ SHA 只是哈希算法<span class="zhen">（hash algorithm）</span>`,`✗`],
tip:`签名<span class="zhen">（signature）</span> = Encrypt<sub>私钥</sub>(Hash(消息))。`,ref:`P4-105、P4-112`},

{id:'4.29',p:4,s:'o',q:`A digital signature can guarantee`,
o:[`The integrity of the message`,`The source of the message`,`Both a and b`,`None of the above`],a:2,
zh:`数字签名<span class="zhen">（digital signature）</span>能保证什么？`,
ex:`两者都能（P4-104）："Any changes to the message can be detected, due to the message digest algorithm"，这是<b>完整性<span class="zhen">（integrity）</span></b>；"You can not deny signing the message, because it was signed with your private key"，这是<b>来源认证<span class="zhen">（origin authentication）</span>和不可否认<span class="zhen">（non-repudiation）</span></b>。<br>注意：数字签名<span class="zhen">（digital signature）</span><b>不</b>提供机密性（Q&A Q32）。`,
op:[`部分`,`部分`,`✓`,`✗`],
tip:`签名<span class="zhen">（signature）</span> = 完整性<span class="zhen">（integrity）</span> + 认证<span class="zhen">（authentication）</span> + 不可否认<span class="zhen">（non-repudiation）</span>；不含机密性<span class="zhen">（confidentiality）</span>。`,ref:`P4-104、P4-124；Q&A Q32`},

{id:'4.30',p:4,s:'o',q:`When a message and a digital signature (signed hash) are received, a new hash is created from the received message and compared to the original hash in the digital signature. The message has not been altered when the hash values are:`,
o:[`Not equal`,`Equal`,`It doesn't matter`,`None of the above`],a:1,
zh:`收到消息和签名<span class="zhen">（signature）</span>后，对消息重新算哈希<span class="zhen">（hash）</span>，与签名<span class="zhen">（signature）</span>中的原哈希<span class="zhen">（hash）</span>比较。两个哈希值<span class="zhen">（hash value）</span>怎样时，消息未被篡改<span class="zhen">（tampering）</span>？`,
ex:`<b>相等</b>就说明没被改。验证步骤（Q&A Q32、P4-112）：① 用相同哈希算法<span class="zhen">（hash algorithm）</span>对收到的消息算摘要<span class="zhen">（digest）</span>；② 用发送方公钥<span class="zhen">（public key）</span>解开签名<span class="zhen">（signature）</span>，得到原摘要<span class="zhen">（digest）</span>；③ 两者比较，相同就说明完整且确为对方所发。`,
op:[`✗ 不等说明被篡改<span class="zhen">（tampering）</span>，或者签名<span class="zhen">（signature）</span>不是对方的`,`✓`,`✗`,`✗`],
tip:`两个摘要<span class="zhen">（digest）</span>一样 = 没被改。`,ref:`P4-112；Q&A Q32`},

{id:'4.31',p:4,s:'o',q:`Digital signatures are created using a public key crypto system. Which key does a sender use when they wish to digitally sign a hash before it is sent?`,
o:[`Senders public key`,`Senders private key`,`Both a and b`,`None of the above`],a:1,
zh:`发送方给哈希<span class="zhen">（hash）</span>做数字签名<span class="zhen">（digital signature）</span>时用哪把钥匙？`,
ex:`<b>发送方私钥<span class="zhen">（private key）</span></b>。P4-104："To create a digital signature, you sign the message with your private key." 只有私钥持有者能生成签名<span class="zhen">（signature）</span>，任何持有其公钥<span class="zhen">（public key）</span>的人都能验证（P4-105）。`,
op:[`✗ 公钥<span class="zhen">（public key）</span>用于验证签名<span class="zhen">（signature）</span>`,`✓`,`✗`,`✗`],
tip:`签名<span class="zhen">（signature）</span>用私钥<span class="zhen">（private key）</span>，验签<span class="zhen">（signature verification）</span>用公钥<span class="zhen">（public key）</span>（与加密<span class="zhen">（encryption）</span>正好相反）。`,ref:`P4-104、P4-105`},

{id:'4.32',p:4,s:'o',q:`The purpose of a digital certificate is to -------`,
o:[`Authenticate the public key`,`Authenticate the private key`,`Both a and b`,`None of the above`],a:0,
zh:`数字证书<span class="zhen">（digital certificate）</span>的作用是什么？`,
ex:`证书<span class="zhen">（certificate）</span>证明<b>“这把公钥<span class="zhen">（public key）</span>确实属于这个人”</b>。P4-124："Digital certificates provide assurance that the public-key claimed by the user does indeed belong to him/her." 私钥<span class="zhen">（private key）</span>从不公开，也不会写进证书<span class="zhen">（certificate）</span>。P4-118：验证签名<span class="zhen">（signature）</span>不能用“发送方自己提供的公钥<span class="zhen">（public key）</span>”，否则冒充者<span class="zhen">（impostor）</span>总能自证，必须靠证书<span class="zhen">（certificate）</span>。`,
op:[`✓`,`✗ 私钥<span class="zhen">（private key）</span>永不离开主人`,`✗`,`✗`],
tip:`证书<span class="zhen">（certificate）</span>解决“这把公钥<span class="zhen">（public key）</span>是谁的”。`,ref:`P4-118、P4-124；Q&A Q28`},

{id:'4.33',p:4,s:'o',q:`A special mathematical function that performs one-way encryption is called`,
o:[`Asymmetric encryption`,`Transposition cipher`,`Hashing`,`Multiple encryption`],a:2,
zh:`执行单向<span class="zhen">（one-way）</span>加密<span class="zhen">（encryption）</span>的特殊数学函数叫什么？`,
ex:`P4-109 原文："A hashing function is a special mathematical function that performs <b>one-way encryption</b>." 一旦计算完成，无法从结果还原明文<span class="zhen">（plaintext）</span>（不能 de-hash，Q&A Q31）。`,
op:[`✗ 可以用私钥<span class="zhen">（private key）</span>解密<span class="zhen">（decryption）</span>，是双向的`,`✗ 置换密码<span class="zhen">（transposition cipher）</span>可以逆向还原`,`✓`,`✗ 如 3DES，可逆`],
tip:`One-way = Hash。`,ref:`P4-109；Q&A Q31`},

{id:'4.34',p:4,s:'o',q:`Hybrid system uses public key cryptography for`,
o:[`Encryption`,`Key exchange`,`Both a and b`,`None of the above`],a:1,
zh:`混合系统<span class="zhen">（hybrid system）</span>用公钥密码<span class="zhen">（public-key cryptography）</span>做什么？`,
ex:`P4-98：公钥<span class="zhen">（public key）</span>慢，对称<span class="zhen">（symmetric）</span>快，于是组合起来：<b>第一步用公钥加密<span class="zhen">（public-key encryption）</span>并分享会话密钥（key exchange）</b>；之后用这把对称会话密钥<span class="zhen">（symmetric session key）</span>加密<span class="zhen">（encryption）</span>实际数据。SSL/TLS 就是这样（P5-18）。`,
op:[`✗ 数据加密<span class="zhen">（encryption）</span>用对称<span class="zhen">（symmetric）</span>`,`✓`,`✗`,`✗`],
tip:`公钥<span class="zhen">（public key）</span>送钥匙，对称<span class="zhen">（symmetric）</span>加数据。`,ref:`P4-98、P4-99、P5-18`},

{id:'4.35',p:4,s:'o',q:`In hybrid system ------- crypto system is used to encrypt the session data`,
o:[`Symmetric`,`Asymmetric`,`Both a and B`,`None of the above`],a:0,
zh:`在混合系统<span class="zhen">（hybrid system）</span>中，用哪种密码系统<span class="zhen">（cryptosystem）</span>加密<span class="zhen">（encryption）</span>会话<span class="zhen">（session）</span>数据？`,
ex:`<b>对称<span class="zhen">（symmetric）</span></b>。会话<span class="zhen">（session）</span>数据量大，要用对称算法<span class="zhen">（symmetric algorithm）</span>的吞吐量（"Throughput of symmetric cipher, key management of asymmetric cipher"，P4-98）。`,
op:[`✓`,`✗ 只用来交换会话密钥<span class="zhen">（session key）</span>`,`✗`,`✗`],
tip:`和上一题配对记。`,ref:`P4-98`},

/* ---------- 自编题（依据课件 sld4） ---------- */
{id:'4.c1',p:4,s:'c',q:`What is the block size of AES?`,
o:[`56 bits`,`64 bits`,`128 bits`,`256 bits`],a:2,
zh:`AES 的分组长度<span class="zhen">（block size）</span>是多少？`,
ex:`AES 分组<b>固定 128 位</b>；密钥<span class="zhen">（key）</span>可选 128、192、256 位，对应 10、12、14 轮（P4-32、P4-36）。Rijndael 原算法允许分组和密钥<span class="zhen">（key）</span>各自在 128～256 之间选择，AES 标准把分组固定为 128 位。`,
op:[`✗ DES 密钥<span class="zhen">（key）</span>`,`✗ DES 分组`,`✓`,`✗ 最大的 AES 密钥<span class="zhen">（key）</span>`],
tip:`AES：块 128，钥 128/192/256，轮 10/12/14。`,ref:`P4-32、P4-36`},

{id:'4.c2',p:4,s:'c',q:`How many rounds does AES use with a 256-bit key?`,
o:[`10`,`12`,`14`,`16`],a:2,
zh:`AES-256 使用多少轮？`,
ex:`AES-128 → 10 轮；AES-192 → 12 轮；<b>AES-256 → 14 轮</b>（P4-32、P4-39）。16 轮是 DES。`,
op:[`✗ AES-128`,`✗ AES-192`,`✓`,`✗ DES`],
tip:`密钥<span class="zhen">（key）</span>每多 64 位，轮数<span class="zhen">（number of rounds）</span>加 2。`,ref:`P4-32、P4-39`},

{id:'4.c3',p:4,s:'c',q:`Double DES (2DES) is not much stronger than DES mainly because of:`,
o:[`Rainbow table attack`,`Meet-in-the-middle attack`,`SYN flood`,`Phishing`],a:1,
zh:`双重 DES 并不比 DES 强多少，主要是因为哪种攻击？`,
ex:`P4-28：2DES 用两把密钥<span class="zhen">（key）</span>（2×56 = 112 位），但利用已知的明文<span class="zhen">（plaintext）</span>/密文<span class="zhen">（ciphertext）</span>对，可以做<b>中间相遇攻击（meet-in-the-middle）</b>：从两端分别加密<span class="zhen">（encryption）</span>和解密<span class="zhen">（decryption）</span>，在中间对上结果。计算量与破解单个 DES 相近。所以改用 <b>3DES</b>：慢三倍，但用得当时安全得多，是过渡到 AES 前的临时方案（P4-29）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`2DES 被中间相遇攻击<span class="zhen">（meet-in-the-middle attack）</span>打回原形，所以用 3DES。`,ref:`P4-28、P4-29`},

{id:'4.c4',p:4,s:'c',q:`RC4 is an example of a:`,
o:[`Block cipher`,`Stream cipher`,`Hash function`,`Public-key algorithm`],a:1,
zh:`RC4 属于哪一类？`,
ex:`P4-15："BIT STREAM: Each plaintext bit transformed into cipher bit one bit (or byte) at a time. <b>RC4 is widely used stream cipher</b>." 注意 TLS 1.3 已经移除了 RC4（P5-26）。`,
op:[`✗ DES、AES`,`✓`,`✗ SHA、MD5`,`✗ RSA、DH`],
tip:`RC4 = 流；DES、AES = 块。`,ref:`P4-15、P5-26`},

{id:'4.c5',p:4,s:'c',q:`In which encryption mode does the next input depend on the previous output?`,
o:[`Electronic Code Book (ECB)`,`Cipher Block Chaining (CBC)`,`Stream mode`,`Hash mode`],a:1,
zh:`哪种加密<span class="zhen">（encryption）</span>模式中，下一块的输入依赖上一块的输出？`,
ex:`P4-15：<br>• <b>ECB</b>：每块独立加密<span class="zhen">（encryption）</span>（相同明文<span class="zhen">（plaintext）</span>块得到相同密文<span class="zhen">（ciphertext）</span>块，会泄露<span class="zhen">（leak）</span>规律）；<br>• <b>CBC</b>：Next input depends on previous output（块与块链接起来，更安全）。`,
op:[`✗ 独立加密<span class="zhen">（encryption）</span>`,`✓ Chaining = 链接`,`✗`,`✗`],
tip:`CBC 的 C = Chaining（链）。`,ref:`P4-15`},

{id:'4.c6',p:4,s:'c',q:`Which statement about the Diffie-Hellman algorithm is correct?`,
o:[`It encrypts and decrypts messages directly`,`It is a public key algorithm only for key exchange and does not encrypt or decrypt the message`,`It is a hash function`,`It is a symmetric block cipher`],a:1,
zh:`关于 Diffie-Hellman，哪项正确？`,
ex:`P4-51 原文："It is a Public Key Algorithm <b>only for Key Exchange</b> and Does NOT Encrypt or Decrypt the message." 它让从未接触过的双方在不安全的信道<span class="zhen">（insecure channel）</span>上协商出共享密钥<span class="zhen">（shared key）</span>，安全性基于离散对数难题<span class="zhen">（discrete logarithm problem）</span>。它是 SSL 的密钥交换<span class="zhen">（key exchange）</span>方法之一，TLS 1.3 只保留了 ephemeral DH（P5-20）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`DH 只能交换密钥<span class="zhen">（key）</span>；RSA 能交换、加密<span class="zhen">（encryption）</span>、签名<span class="zhen">（signature）</span>。`,ref:`P4-51、P5-19、P5-20`},

{id:'4.c7',p:4,s:'c',q:`What is the main advantage of Elliptic Curve Cryptography (ECC) over RSA?`,
o:[`It needs no key at all`,`It offers the same security with smaller key sizes`,`It is a symmetric algorithm`,`It was invented before RSA`],a:1,
zh:`椭圆曲线密码（ECC）相对 RSA 的主要优势是什么？`,
ex:`P4-96："ECC ... offers <b>same security with smaller bit sizes</b>." P4-97 等效强度<span class="zhen">（equivalent strength）</span>表：<br>对称<span class="zhen">（symmetric）</span> 128 ≈ ECC 256 ≈ RSA 3072；对称<span class="zhen">（symmetric）</span> 256 ≈ ECC 512 ≈ RSA 15360。<br>它在加密货币<span class="zhen">（cryptocurrency）</span>里被广泛使用。`,
op:[`✗`,`✓`,`✗ 是公钥算法<span class="zhen">（public key algorithm）</span>`,`✗ 1985 年提出，晚于 RSA（1978）`],
tip:`ECC：钥匙短、强度高，适合 IoT 和移动端。`,ref:`P4-96、P4-97`},

{id:'4.c8',p:4,s:'c',q:`Which hash algorithms should NOT be used anymore because they have been shown to be insecure?`,
o:[`SHA-256 and SHA-512`,`MD5 and SHA-1`,`SHA-384 and SHA-3`,`AES and RSA`],a:1,
zh:`哪两个哈希算法<span class="zhen">（hash algorithm）</span>已被证明不安全、不应再使用？`,
ex:`P4-110："Note: <b>MD5 and SHA-1</b> should not be used because they have been shown to be unsecure." SHA-1 已被发现易受碰撞攻击（P4-109）。TLS 1.3 也移除了 MD5 和 SHA-1（P5-26）。`,
op:[`✗ 安全`,`✓`,`✗ 安全`,`✗ 不是哈希算法<span class="zhen">（hash algorithm）</span>`],
tip:`被淘汰的老算法：DES、MD5、SHA-1、RC4。`,ref:`P4-109、P4-110、P4-125`},

{id:'4.c9',p:4,s:'c',q:`"It is computationally infeasible to find any pair (x, y) such that H(x) = H(y)." This hash property is called:`,
o:[`Pre-image resistance (one-way)`,`Strong collision resistance`,`Fixed-length output`,`Avalanche-free`],a:1,
zh:`“计算上无法找到任意一对 (x, y) 使 H(x) = H(y)。”这条性质叫什么？`,
ex:`P4-108 哈希<span class="zhen">（hash）</span>性质：<br>• 适用于任意长度输入，输出长度固定，计算容易；<br>• <b>One-way（抗原像<span class="zhen">（preimage resistance）</span>）</b>：给定 h，找不到 x 使 H(x) = h；<br>• <b>弱抗碰撞<span class="zhen">（weak collision resistance）</span></b>：给定 x，找不到 y ≠ x 使 H(y) = H(x)；<br>• <b>强抗碰撞<span class="zhen">（strong collision resistance）</span></b>：找不到<b>任意一对</b> (x, y) 使 H(x) = H(y)。`,
op:[`✗ 那是“给定 h 求 x”`,`✓ “任意一对” = 强抗碰撞<span class="zhen">（strong collision resistance）</span>`,`✗`,`✗`],
tip:`给定 h → 单向<span class="zhen">（one-way）</span>；给定 x → 弱抗碰撞<span class="zhen">（weak collision resistance）</span>；任意一对 → 强抗碰撞<span class="zhen">（strong collision resistance）</span>。`,ref:`P4-108`},

{id:'4.c10',p:4,s:'c',q:`When verifying a digital certificate, the receiver checks all of the following EXCEPT:`,
o:[`The CA's digital signature using the CA's public key`,`The certificate's valid period`,`Whether the certificate has been revoked`,`The subject's private key`],a:3,
zh:`验证数字证书<span class="zhen">（digital certificate）</span>时，接收方要检查以下各项，除了哪项？`,
ex:`P4-122 和 Q&A Q33 的<b>三项检查</b>：<br>① 用 CA 的公钥<span class="zhen">（public key）</span>验证证书<span class="zhen">（certificate）</span>上的签名<span class="zhen">（signature）</span>，确认真实且未被修改；<br>② 检查是否在有效期<span class="zhen">（validity period）</span>内；<br>③ 检查是否已被吊销<span class="zhen">（revocation）</span>（必须向 CA 查询，例如通过 OCSP 协议<span class="zhen">（protocol）</span>，看证书<span class="zhen">（certificate）</span>字段是看不出来的）。<br>主体的私钥<span class="zhen">（private key）</span>永远不会出现在证书<span class="zhen">（certificate）</span>里，也无从检查。`,
op:[`✗ 要查`,`✗ 要查`,`✗ 要查`,`✓ 不可能也不需要`],
tip:`验证证书<span class="zhen">（certificate）</span>三步：签名<span class="zhen">（signature）</span>、期限、吊销<span class="zhen">（revocation）</span>。`,ref:`P4-122；Q&A Q33`},

{id:'4.c11',p:4,s:'c',q:`A Certificate Authority signs a digital certificate using:`,
o:[`The subject's public key`,`The subject's private key`,`The CA's own private key`,`The CA's public key`],a:2,
zh:`CA 用什么给数字证书<span class="zhen">（digital certificate）</span>签名<span class="zhen">（signature）</span>？`,
ex:`P4-121："The digital signature of the certificate, signed by the CA with <b>the CA's own private key</b>." 用户必须独立获得 CA 的公钥<span class="zhen">（public key）</span>来验证（浏览器<span class="zhen">（browser）</span>和操作系统<span class="zhen">（operating system）</span>里预装了受信任的根证书<span class="zhen">（root certificate）</span>）。`,
op:[`✗`,`✗ CA 拿不到`,`✓`,`✗ 公钥<span class="zhen">（public key）</span>用于验证`],
tip:`谁签名<span class="zhen">（signature）</span>，就用谁的私钥<span class="zhen">（private key）</span>；CA 签证书<span class="zhen">（certificate）</span>，用 CA 的私钥<span class="zhen">（private key）</span>。`,ref:`P4-120、P4-121`},

{id:'4.c12',p:4,s:'c',q:`According to the lecture, which algorithm on a quantum computer threatens RSA and ECC?`,
o:[`Shor's algorithm`,`Dijkstra's algorithm`,`Daugman's algorithm`,`Rijndael`],a:0,
zh:`按课件，量子计算机<span class="zhen">（quantum computer）</span>上的哪种算法会威胁<span class="zhen">（threat）</span> RSA 和 ECC？`,
ex:`P4-125 Challenges in Cryptography："Quantum computing threat (<b>Shor's algorithm</b> can break RSA & ECC)." 所以 TLS 正在推进后量子密码（PQC，P5-10）。Daugman 是虹膜识别<span class="zhen">（iris recognition）</span>算法，Rijndael 是 AES。`,
op:[`✓`,`✗ 最短路径算法`,`✗ 虹膜识别<span class="zhen">（iris recognition）</span>`,`✗ AES`],
tip:`Shor 会打破“大数分解<span class="zhen">（integer factorization）</span>”和“离散对数<span class="zhen">（discrete logarithm）</span>”这两个难题。`,ref:`P4-125、P5-10`},

{id:'4.c13',p:4,s:'c',q:`RSA with p = 3, q = 11 and public key e = 3. What is the private key d?`,
o:[`3`,`7`,`11`,`21`],a:1,
zh:`RSA 中 p = 3、q = 11、e = 3，私钥<span class="zhen">（private key）</span> d 是多少？`,
ex:`n = 33，φ = (3−1)(11−1) = 20。<br>求 d 使 e·d ≡ 1 (mod φ)：课件方法 d = (k·φ + 1) / e，k 取 1, 2, 3… 直到能整除。<br>k = 1：(20 + 1) / 3 = 21 / 3 = <b>7</b> ✓（P4-75）。<br>验证：3 × 7 = 21 = 20 + 1 ✓。`,
op:[`✗ 那是 e = 7 时的 d`,`✓`,`✗`,`✗ 21 是 kφ+1，还要除以 e`],
tip:`d = (kφ + 1) / e，找第一个能整除的 k。“计算题 → RSA”可以随机练。`,ref:`P4-74～P4-76`},

{id:'4.c14',p:4,s:'c',q:`Diffie-Hellman with prime p = 23, generator g = 5, Alice's private a = 6 and Bob's private b = 15. What is the shared secret key?`,
o:[`2`,`8`,`19`,`23`],a:0,
zh:`DH 中 p = 23、g = 5，Alice 私钥<span class="zhen">（private key）</span> 6，Bob 私钥<span class="zhen">（private key）</span> 15，共享密钥<span class="zhen">（shared key）</span>是多少？`,
ex:`A = 5<sup>6</sup> mod 23 = <b>8</b>；B = 5<sup>15</sup> mod 23 = <b>19</b>。<br>Alice：K = 19<sup>6</sup> mod 23 = <b>2</b>；Bob：K = 8<sup>15</sup> mod 23 = <b>2</b> ✓（P4-62）。`,
op:[`✓`,`✗ Alice 的公钥<span class="zhen">（public key）</span>`,`✗ Bob 的公钥<span class="zhen">（public key）</span>`,`✗`],
tip:`公开值<span class="zhen">（public value）</span> = g<sup>私钥<span class="zhen">（private key）</span></sup> mod p；共享钥 = 对方公开值<span class="zhen">（public value）</span><sup>自己私钥<span class="zhen">（private key）</span></sup> mod p。`,ref:`P4-53～P4-62`},

{id:'4.c15',p:4,s:'c',q:`In RSA key generation, the public exponent e must satisfy:`,
o:[`e = φ(n)`,`1 < e < φ(n) and gcd(e, φ(n)) = 1`,`e must be an even number`,`e must equal d`],a:1,
zh:`RSA 密钥生成<span class="zhen">（key generation）</span>中，公钥指数<span class="zhen">（public exponent）</span> e 必须满足什么？`,
ex:`P4-67："Select at random the encryption key e, where 1 < e < ø(N), gcd(e, ø(N)) = 1"，即 e 与 φ(n) <b>互素<span class="zhen">（relatively prime）</span></b>（课件说法：e 与 p−1、q−1 没有公因子<span class="zhen">（common factor）</span>）。偶数 e 一定与 φ 共享因子 2（φ 总是偶数），所以 e 不能是偶数。常用 e = 65537（P4-89）。`,
op:[`✗`,`✓`,`✗ φ 为偶数，偶数 e 必然不互素<span class="zhen">（not relatively prime）</span>`,`✗`],
tip:`选 e 的口诀：在 1 和 φ 之间，与 φ 互素<span class="zhen">（relatively prime）</span>。`,ref:`P4-67、P4-70`},

{id:'4.c16',p:4,s:'c',q:`Which cryptanalysis attack uses precomputed tables of hash values to recover passwords?`,
o:[`Brute force attack`,`Dictionary attack`,`Rainbow table attack`,`Man-in-the-middle attack`],a:2,
zh:`哪种密码分析<span class="zhen">（cryptanalysis）</span>攻击使用预先算好的哈希<span class="zhen">（hash）</span>表来还原密码<span class="zhen">（password）</span>？`,
ex:`P4-7 列出三种密码分析<span class="zhen">（cryptanalysis）</span>攻击：<br>• <b>Brute force</b>：穷举所有组合；<br>• <b>Dictionary</b>：用字典里的常见词；<br>• <b>Rainbow table</b>：用<b>预计算的哈希表</b>反查（P1-53 "Attacker use hash tables to find the password"）。`,
op:[`✗`,`✗`,`✓`,`✗`],
tip:`彩虹表<span class="zhen">（rainbow table）</span> = 拿空间换时间的哈希<span class="zhen">（hash）</span>反查表；对策是加盐（salt）。`,ref:`P4-7、P1-53`},

{id:'4.c17',p:4,s:'c',q:`What is the correct way to verify a received digital signature?`,
o:[`Decrypt the message with the receiver's private key only`,`Hash the received message, decrypt the signature with the sender's public key, and compare the two digests`,`Encrypt the signature with the sender's private key`,`Ask the sender for the original message by phone`],a:1,
zh:`验证收到的数字签名<span class="zhen">（digital signature）</span>，正确做法是什么？`,
ex:`Q&A Q32：① 用发送方同样的算法对收到的明文<span class="zhen">（plaintext）</span>算哈希<span class="zhen">（hash）</span>；② 用<b>真实发送方的公钥<span class="zhen">（public key）</span></b>解开签名<span class="zhen">（signature）</span>，得到原摘要<span class="zhen">（digest）</span>；③ 比较两个摘要<span class="zhen">（digest）</span>，相同就通过。P4-118 强调：发送方公钥<span class="zhen">（public key）</span>要从<b>数字证书<span class="zhen">（digital certificate）</span></b>中获取，不能直接信任发送方自己附上的公钥<span class="zhen">（public key）</span>。`,
op:[`✗`,`✓`,`✗ 那是签名<span class="zhen">（signature）</span>过程，而且接收方没有发送方的私钥<span class="zhen">（private key）</span>`,`✗`],
tip:`验签<span class="zhen">（signature verification）</span>：Hash(消息) 与 Decrypt<sub>发送方公钥<span class="zhen">（public key）</span></sub>(签名<span class="zhen">（signature）</span>) 比较。`,ref:`P4-112、P4-118；Q&A Q32`}
]);

/* Part 5 · Web Security (SSL/TLS, SET), Firewalls & IDS (sld5) */
window.MCQ = (window.MCQ || []).concat([
{id:'5.01',p:5,s:'o',q:`The most complex part of TLS is the __________.`,
o:[`signature`,`message header`,`payload`,`handshake protocol`],a:3,
zh:`TLS 最复杂的部分是什么？`,
ex:`P5-16："SSL HANDSHAKE PROTOCOL — <b>The most complex part of SSL</b>." 握手协议<span class="zhen">（handshake protocol）</span>要完成：双方互相认证<span class="zhen">（authentication）</span>、协商加密<span class="zhen">（encryption）</span>和 MAC 算法、协商密钥<span class="zhen">（key）</span>。分四个阶段：建立安全能力 → 服务器认证<span class="zhen">（server authentication）</span>与密钥交换<span class="zhen">（key exchange）</span> → 客户端认证<span class="zhen">（client authentication）</span>与密钥交换<span class="zhen">（key exchange）</span> → 结束。`,
op:[`✗`,`✗`,`✗`,`✓`],
tip:`握手<span class="zhen">（handshake）</span> = 认证<span class="zhen">（authentication）</span> + 协商算法 + 协商密钥<span class="zhen">（key）</span> → 最复杂。`,ref:`P5-16、P5-17`},

{id:'5.02',p:5,s:'o',q:`_______ is a list that contains the combinations of cryptographic algorithms supported by the client`,
o:[`Compression method`,`Session ID`,`Cipher Suite`,`All of the above`],a:2,
zh:`包含客户端<span class="zhen">（client）</span>支持的密码算法<span class="zhen">（cipher）</span>组合的列表叫什么？`,
ex:`<b>Cipher suite（密码套件）</b>。P5-17：Client Hello 中 "Client lists cipher suites it supports"；Server Hello 中 "Selects a cipher suite to use in the session"。一个套件 = 密钥交换算法<span class="zhen">（key exchange algorithm）</span> + 加密算法<span class="zhen">（encryption algorithm）</span> + MAC/哈希算法<span class="zhen">（hash algorithm）</span>。TLS 1.3 把支持的套件从 37 个减到 5 个（P5-21）。`,
op:[`✗`,`✗ Session ID 标识会话`,`✓`,`✗`],
tip:`Cipher suite = 算法组合菜单，客户端<span class="zhen">（client）</span>列出、服务器<span class="zhen">（server）</span>选择。`,ref:`P5-17、P5-21`},

{id:'5.03',p:5,s:'o',q:`The SSL record protocol provides two services for SSL/TLS connection: message integrity and _________`,
o:[`Confidentiality`,`Availability`,`Authentication`,`None of the above`],a:0,
zh:`SSL 记录协议<span class="zhen">（record protocol）</span>为连接提供两项服务：消息完整性<span class="zhen">（message integrity）</span>和什么？`,
ex:`P5-13："SSL RECORD PROTOCOL — Provides <b>confidentiality and message integrity</b> using shared keys established by the Handshake Protocol." 处理流程（P5-14）：分片<span class="zhen">（fragmentation）</span> → 压缩 → 加 MAC（完整性<span class="zhen">（integrity）</span>）→ 加密<span class="zhen">（encryption）</span>（机密性<span class="zhen">（confidentiality）</span>）→ 加记录头<span class="zhen">（record header）</span>。`,
op:[`✓`,`✗`,`✗ 认证<span class="zhen">（authentication）</span>是握手协议<span class="zhen">（handshake protocol）</span>做的`,`✗`],
tip:`Record 协议<span class="zhen">（protocol）</span>：机密 + 完整；Handshake 协议<span class="zhen">（protocol）</span>：认证<span class="zhen">（authentication）</span> + 协商。`,ref:`P5-13、P5-14`},

{id:'5.04',p:5,s:'o',q:`The _________ is used to convey SSL-related alerts to the peer entity`,
o:[`alert protocol`,`digital signature`,`Digital certificate`,`None of the above`],a:0,
zh:`哪个协议<span class="zhen">（protocol）</span>用来向对端传递 SSL 相关告警<span class="zhen">（alert）</span>？`,
ex:`<b>Alert protocol</b>（P5-15）："Send SSL/TLS related alerts to peers." 告警消息<span class="zhen">（alert message）</span> 2 字节<span class="zhen">（byte）</span>：一个字节<span class="zhen">（byte）</span>表示 fatal 或 warning，一个字节<span class="zhen">（byte）</span>是告警代码<span class="zhen">（alert code）</span>（如 bad record MAC、handshake failure、certificate expired、certificate revoked 等）。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`SSL 四个子协议<span class="zhen">（sub-protocol）</span>：Handshake、Change Cipher Spec、Alert、Record。`,ref:`P5-12、P5-15`},

{id:'5.05',p:5,s:'o',q:`Most browsers come equipped with TLS/SSL and most Web servers have implemented the protocol`,
o:[`TRUE`,`FALSE`],a:0,
zh:`大多数浏览器<span class="zhen">（browser）</span>都内置了 TLS/SSL，大多数 Web 服务器<span class="zhen">（server）</span>也实现了该协议<span class="zhen">（protocol）</span>。`,
ex:`对。P5-8："SSL is easy to apply and use because it is built in all major Web browsers (Edge, Opera, Chrome, Firefox, etc.) and servers." 只要用过 https:// 或看到地址栏的锁，就用过 SSL/TLS（P5-6）。`,
tip:`SSL/TLS 的最大优势就是“无处不在、开箱即用”。`,ref:`P5-6、P5-8`},

{id:'5.06',p:5,s:'o',q:`The firewall may be a single computer system or a set of two or more systems that cooperate to perform the firewall function.`,
o:[`TRUE`,`FALSE`],a:0,
zh:`防火墙<span class="zhen">（firewall）</span>可以是单台计算机，也可以是两台或更多系统协同实现防火墙<span class="zhen">（firewall）</span>功能。`,
ex:`对。P5-44：防火墙<span class="zhen">（firewall）</span>可以是硬件、软件或两者结合。P5-74 的 <b>Screened-subnet</b> 架构就是用两台过滤路由器<span class="zhen">（filtering router）</span>（外部和内部）加中间的 DMZ 协同工作。`,
tip:`防火墙<span class="zhen">（firewall）</span>是一种“功能”，不一定是一台设备。`,ref:`P5-44、P5-69～P5-75`},

{id:'5.07',p:5,s:'o',q:`A traditional packet filter makes filtering decisions on an individual packet basis and does not take into consideration any higher layer context`,
o:[`TRUE`,`FALSE`],a:0,
zh:`传统包过滤器<span class="zhen">（packet filter）</span>逐个包做过滤决定，不考虑任何更高层的上下文。`,
ex:`对。P5-55："Packet Filtering Firewall — Examines individual packets header based on source IP, destination IP, ports... <b>Stateless → no context of previous packets</b>." P5-58：静态包过滤<span class="zhen">（static packet filtering）</span> "Examines packets one at a time, in isolation"。要记住上下文，需要 Stateful Packet Inspection（SPI）。`,
tip:`包过滤<span class="zhen">（packet filtering）</span> = 无状态<span class="zhen">（stateless）</span>、一个一个看；SPI = 有状态表<span class="zhen">（state table）</span>。`,ref:`P5-55、P5-58、P5-59`},

{id:'5.08',p:5,s:'o',q:`The _________ is inserted between the premises network and the Internet to establish a controlled link and to erect an outer security wall or perimeter to protect the premises network from Internet-based attacks.`,
o:[`Firewall`,`Session ID`,`IP protocol field`,`All of the above`],a:0,
zh:`插在内部网络与互联网<span class="zhen">（Internet）</span>之间、建立受控连接并竖起外围安全墙的是什么？`,
ex:`<b>防火墙<span class="zhen">（firewall）</span></b>。P5-42："At its most basic, a firewall is essentially the barrier that sits between a private internal network and the public Internet." 它的主要目的是放行无害流量<span class="zhen">（traffic）</span>、挡住危险流量<span class="zhen">（traffic）</span>。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`Firewall = 内网<span class="zhen">（internal network）</span>与外网<span class="zhen">（external network）</span>之间的那道墙。`,ref:`P5-42`},

{id:'5.09',p:5,s:'o',q:`A _________ applies a set of rules to each incoming and outgoing IP packet and then forwards or discards the packet.`,
o:[`packet filtering firewall`,`IP protocol field`,`Both of the above`,`None of the above`],a:0,
zh:`对每个进出的 IP 包应用一组规则，然后转发或丢弃，这是什么？`,
ex:`<b>包过滤防火墙<span class="zhen">（packet filtering firewall）</span></b>：按规则（源 IP、目的 IP、端口<span class="zhen">（port）</span>等）逐包判断 allow 或 deny（P5-55、P5-57）。P5-52 的规则匹配<span class="zhen">（rule matching）</span>例子：从上到下匹配，第一条命中的规则生效，最后一条通常是 Any/Any/Deny（默认拒绝<span class="zhen">（default deny）</span>）。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`包过滤<span class="zhen">（packet filtering）</span>：看包头<span class="zhen">（packet header）</span>，查规则，放行或丢弃。`,ref:`P5-52、P5-55、P5-57`},

{id:'5.10',p:5,s:'o',q:`An intruder transmitting packets from the outside with a source IP address field containing an address of an internal host is known as IP address _________.`,
o:[`spoofing`,`authentication`,`generation`,`None of the above`],a:0,
zh:`入侵者<span class="zhen">（intruder）</span>从外部发送源 IP 填成内部主机<span class="zhen">（internal host）</span>地址的数据包<span class="zhen">（packet）</span>，这叫 IP 地址<span class="zhen">（IP address）</span>什么？`,
ex:`<b>IP 地址<span class="zhen">（IP address）</span>欺骗（spoofing）</b>。外部接口<span class="zhen">（external interface）</span>上不可能出现源地址<span class="zhen">（source address）</span>是内部网段<span class="zhen">（network segment）</span>的合法包，所以防火墙<span class="zhen">（firewall）</span>很容易识别并丢弃（P5-58："It can stop attacks Packets with spoofed IP addresses"）。P1-65 也提到 DoS 攻击常用伪造<span class="zhen">（forgery）</span>源地址<span class="zhen">（source address）</span>来隐藏身份。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`外部进来的包却带着内部地址 → spoofing。`,ref:`P5-58、P1-65`},

{id:'5.11',p:5,s:'o',q:`A __________ firewall controls the traffic between a personal computer or workstation on one side and the Internet or enterprise network on the other side`,
o:[`personnel`,`poxy server`,`application-level gateway`,`None of the above`],a:0,
zh:`控制个人电脑或工作站与互联网<span class="zhen">（Internet）</span>（或企业网）之间流量<span class="zhen">（traffic）</span>的是哪种防火墙<span class="zhen">（firewall）</span>？`,
ex:`<b>Personal firewall（个人防火墙）</b>，题目把 personal 误印成了 personnel。P5-53："A personal firewall (sometimes called a desktop firewall) is a software application used to protect a single Internet-connected computer." 它能挡黑客<span class="zhen">（hacker）</span>、阻止弹窗和某些 cookie、控制哪些程序能上网；但不能防邮件病毒<span class="zhen">（virus）</span>（要靠杀毒软件<span class="zhen">（antivirus software）</span>），也需要定期更新规则。`,
op:[`✓（personal 的笔误）`,`✗ proxy 的笔误，代理服务器<span class="zhen">（proxy server）</span>`,`✗ 应用层网关<span class="zhen">（application-level gateway）</span>保护整个网络的应用`,`✗`],
tip:`单台电脑 → personal firewall。`,ref:`P5-53`},

{id:'5.12',p:5,s:'o',q:`The firewall can protect against attacks that bypass the firewall`,
o:[`TRUE`,`FALSE`],a:1,
zh:`防火墙<span class="zhen">（firewall）</span>能防御绕过它的攻击。`,
ex:`错。流量<span class="zhen">（traffic）</span>不经过防火墙<span class="zhen">（firewall）</span>，防火墙<span class="zhen">（firewall）</span>就管不着：例如内部人员<span class="zhen">（insider）</span>作恶、U 盘<span class="zhen">（USB drive）</span>带入恶意软件<span class="zhen">（malware）</span>、员工私接 4G 热点<span class="zhen">（hotspot）</span>、加密隧道（P5-54：No Protection Against Insider Threats；Bypass Risk）。P5-74 的结论："Firewalls alone cannot prevent all cyber threats; a layered security approach is necessary."`,
tip:`防火墙<span class="zhen">（firewall）</span>只管经过它的流量<span class="zhen">（traffic）</span>。`,ref:`P5-54、P5-74`},

{id:'5.13',p:5,s:'o',q:`Intrusion detection is based on the assumption that the behavior of the intruder differs from that of a legitimate user in ways that can be quantified.`,
o:[`TRUE`,`FALSE`],a:0,
zh:`入侵检测<span class="zhen">（intrusion detection）</span>基于这样的假设：入侵者<span class="zhen">（intruder）</span>的行为与合法用户<span class="zhen">（genuine user）</span>不同，并且这种差异可以量化。`,
ex:`对，这是 IDS 的基本假设（Stallings）。如果入侵者<span class="zhen">（intruder）</span>和正常用户的行为无法区分，IDS 就无从检测。异常检测<span class="zhen">（anomaly detection）</span>先建立正常行为基线<span class="zhen">（normal behavior baseline）</span>，偏离超过阈值（clipping level）就告警（P5-93）。`,
tip:`IDS 的前提：坏人的行为和好人不一样，而且能量化。`,ref:`P5-86、P5-93`},

{id:'5.14',p:5,s:'o',q:`Signature-based approaches attempt to define normal, or expected behavior, whereas anomaly approaches attempt to define proper behavior`,
o:[`TRUE`,`FALSE`],a:1,
zh:`基于特征<span class="zhen">（signature-based）</span>的方法试图定义正常或预期行为，而异常方法试图定义恰当行为。`,
ex:`错，概念放错了位置。正确说法：<br>• <b>Signature-based</b>（knowledge-based）：匹配<b>已知攻击<span class="zhen">（known attack）</span>模式</b>（特征库<span class="zhen">（signature database）</span>），必须持续更新，对新攻击会漏报（false negative）；<br>• <b>Anomaly-based</b>（behavior-based）：先定义<b>正常行为基线<span class="zhen">（normal behavior baseline）</span></b>，偏离就告警<span class="zhen">（alert）</span>，能发现新攻击，但误报（false positive）多（P5-87、P5-93）。`,
tip:`Signature 认“坏”；Anomaly 认“好”。`,ref:`P5-86、P5-87、P5-93`},

{id:'5.15',p:5,s:'o',q:`A _________ monitors the characteristics of a single host and the events occurring within that host for suspicious activity`,
o:[`host-based IDS`,`security intrusion`,`network-based IDS`,`None of the above`],a:0,
zh:`监控单台主机的特征和主机内发生的事件、寻找可疑活动的是什么？`,
ex:`<b>HIDS</b>（P5-90）："Examines activity only on a specific host — logs, audit trails, and network traffic coming into or leaving the host." 告警<span class="zhen">（alert）</span>线索：登录失败、非正常时段登录、权限提升<span class="zhen">（privilege escalation）</span>、新增用户账户<span class="zhen">（user account）</span>。优点：能检查<b>解密<span class="zhen">（decryption）</span>后</b>的数据，误报<span class="zhen">（false positive）</span>较低。`,
op:[`✓`,`✗`,`✗ 监控网段<span class="zhen">（network segment）</span>流量<span class="zhen">（traffic）</span>`,`✗`],
tip:`单台主机 → HIDS；网段<span class="zhen">（network segment）</span> → NIDS。`,ref:`P5-90～P5-92`},

{id:'5.16',p:5,s:'o',q:`A ________ monitors network traffic for particular network segments or devices and analyzes network, transport, and application protocols to identify suspicious activity`,
o:[`host-based IDS`,`security intrusion`,`network-based IDS`,`None of the above`],a:2,
zh:`监控特定网段<span class="zhen">（network segment）</span>或设备的流量<span class="zhen">（traffic）</span>，分析网络层<span class="zhen">（network layer）</span>、传输层<span class="zhen">（transport layer）</span>和应用层<span class="zhen">（application layer）</span>协议<span class="zhen">（protocol）</span>以识别可疑活动的是什么？`,
ex:`<b>NIDS</b>（P5-87～P5-89）：解析网络流量<span class="zhen">（network traffic）</span>，与攻击特征<span class="zhen">（attack signature）</span>比对。优点：较少设备就能覆盖整个网段<span class="zhen">（network segment）</span>，成本低，能关联多台系统上的攻击。缺点：<b>流量<span class="zhen">（traffic）</span>加密<span class="zhen">（encryption）</span>后就失效</b>，也看不到主机内部的活动。`,
op:[`✗`,`✗`,`✓`,`✗`],
tip:`NIDS 怕加密<span class="zhen">（encryption）</span>；HIDS 能看到解密<span class="zhen">（decryption）</span>后的数据。`,ref:`P5-87～P5-89`},

{id:'5.17',p:5,s:'o',q:`__________ involves an attempt to define a set of rules or attack patterns that can be used to decide if a given behaviour is that of an intruder.`,
o:[`Profile based detection`,`Signature detection`,`Threshold detection`,`Anomaly detection`],a:3,alt:1,
zh:`试图定义一组规则或攻击模式<span class="zhen">（attack pattern）</span>、用来判断某行为是否来自入侵者<span class="zhen">（intruder）</span>的是哪种检测？`,
ex:`<span class="flag">⚠ 官方答案存疑</span><br>样题 PDF 把 <b>D. Anomaly detection</b> 标为答案，但按定义这句话描述的是 <b>B. Signature detection</b>：<br>• Stallings 原文："<b>Signature detection</b>: Involves an attempt to define a set of rules or attack patterns that can be used to decide that a given behavior is that of an intruder."<br>• 课件 P5-93："SIGNATURE-BASED IDS ... matches signatures, which are pre-configured, predetermined attack patterns."<br>• 本 Part 第 14 题也明确：signature 匹配攻击模式<span class="zhen">（attack pattern）</span>，anomaly 定义正常行为。<br>• 下一题（第 18 题）“收集合法用户<span class="zhen">（genuine user）</span>行为数据”才是 anomaly detection。<br><b>结论</b>：概念上应选 B。本程序把 B 和 D 都判为正确。正式 quiz 如果原题照搬，答案键可能沿用 D，作答前请留意老师的口径。`,
op:[`✗ profile-based 是异常检测<span class="zhen">（anomaly detection）</span>的一种子方法`,`✓ 按教材定义`,`✗ threshold 也是异常检测<span class="zhen">（anomaly detection）</span>的子方法`,`官方标注的答案（疑似错误）`],
tip:`rules / attack patterns → Signature；normal behavior of legitimate users → Anomaly。`,ref:`P5-87、P5-93；样题 Q5-5`},

{id:'5.18',p:5,s:'o',q:`_________ involves the collection of data relating to the behavior of legitimate users over a period.`,
o:[`Profile based detection`,`Signature detection`,`Threshold detection`,`Anomaly detection`],a:3,
zh:`收集一段时间内合法用户<span class="zhen">（genuine user）</span>行为数据的是哪种检测？`,
ex:`<b>Anomaly detection（异常检测）</b>。P5-93：Statistical anomaly-based IDS "Collects data from normal traffic and establishes a baseline"，之后定期采样与基线比较，超出 clipping level 就告警<span class="zhen">（alert）</span>。能检测新型攻击，但误报<span class="zhen">（false positive）</span>多。Profile-based 和 threshold 都是异常检测<span class="zhen">（anomaly detection）</span>下面的具体做法，题目问的是总称。`,
op:[`✗ 子方法`,`✗ 匹配攻击特征<span class="zhen">（attack signature）</span>`,`✗ 子方法`,`✓`],
tip:`合法用户<span class="zhen">（genuine user）</span>的行为基线<span class="zhen">（baseline）</span> → Anomaly。`,ref:`P5-93`},

/* ---------- 自编题（依据课件 sld5） ---------- */
{id:'5.c1',p:5,s:'c',q:`HTTPS uses which default port number?`,
o:[`21`,`80`,`443`,`8080`],a:2,
zh:`HTTPS 默认使用哪个端口<span class="zhen">（port）</span>？`,
ex:`P5-5：HTTP 使用 <b>80</b> 端口<span class="zhen">（port）</span>，不加密<span class="zhen">（without encryption）</span>；<b>HTTPS = HTTP + TLS</b>，使用 <b>443</b> 端口<span class="zhen">（port）</span>，提供机密性<span class="zhen">（confidentiality）</span>、完整性<span class="zhen">（integrity）</span>和服务器认证<span class="zhen">（server authentication）</span>。HTTPS 因为要做 TLS 握手<span class="zhen">（handshake）</span>，会稍慢一些。`,
op:[`✗ FTP`,`✗ HTTP`,`✓`,`✗ 常见的备用 HTTP 端口<span class="zhen">（port）</span>`],
tip:`80 明文<span class="zhen">（plaintext）</span>，443 加密<span class="zhen">（encryption）</span>。`,ref:`P5-4、P5-5`},

{id:'5.c2',p:5,s:'c',q:`Why was RSA key exchange removed from TLS 1.3?`,
o:[`RSA is too fast`,`It is not forward secret: if the server's private key is later obtained, recorded conversations can be decrypted`,`RSA cannot be used for signatures`,`Browsers do not support RSA`],a:1,
zh:`TLS 1.3 为什么移除了 RSA 密钥交换<span class="zhen">（key exchange）</span>？`,
ex:`P5-20："RSA mode has a serious downside: it's <b>not forward secret</b>." 攻击者<span class="zhen">（attacker）</span>可以先录下加密<span class="zhen">（encryption）</span>的会话<span class="zhen">（session）</span>，日后一旦拿到服务器<span class="zhen">（server）</span>的 RSA 私钥<span class="zhen">（private key）</span>，就能解密<span class="zhen">（decryption）</span><b>过去所有</b>会话<span class="zhen">（session）</span>。所以 TLS 1.3 只保留 <b>ephemeral Diffie-Hellman</b>：每次会话<span class="zhen">（session）</span>生成新密钥对<span class="zhen">（key pair）</span>，单次泄露<span class="zhen">（leak）</span>不影响过去的会话（Perfect Forward Secrecy）。RSA 在 TLS 1.3 中仍可用于<b>签名</b>（P5-21）。`,
op:[`✗`,`✓`,`✗ RSA 仍用于签名<span class="zhen">（signature）</span>`,`✗`],
tip:`TLS 1.3：去掉 RSA 密钥交换<span class="zhen">（key exchange）</span>，换成 ephemeral DH，实现前向保密（PFS）。`,ref:`P5-19～P5-21、P5-27`},

{id:'5.c3',p:5,s:'c',q:`Which is the correct order of operations in the SSL/TLS Record Protocol?`,
o:[`Encrypt → Compress → Fragment → Add MAC → Header`,`Fragment → Compress → Add MAC → Encrypt → Append header`,`Add MAC → Fragment → Encrypt → Compress → Header`,`Compress → Encrypt → Fragment → Add MAC → Header`],a:1,
zh:`SSL/TLS 记录协议<span class="zhen">（record protocol）</span>的处理顺序是？`,
ex:`P5-14：Application Data → <b>Fragment</b>（分片<span class="zhen">（fragmentation）</span>）→ <b>Compress</b>（压缩）→ <b>Add MAC</b>（加消息认证码）→ <b>Encrypt</b>（加密<span class="zhen">（encryption）</span>）→ <b>Append SSL Record Header</b>（加记录头）。先压缩再加密<span class="zhen">（encryption）</span>是因为密文<span class="zhen">（ciphertext）</span>看起来是随机的，压缩不了。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`口诀：分、压、MAC、密、头。`,ref:`P5-14`},

{id:'5.c4',p:5,s:'c',q:`Which statement about SET (Secure Electronic Transaction) compared with SSL is correct?`,
o:[`SET is a two-party protocol like SSL`,`SET authenticates all parties (cardholder and merchant) with digital certificates and uses message encryption`,`SET is the most widely used e-commerce protocol today`,`With SET the merchant sees the customer's full card details`],a:1,
zh:`SET 与 SSL 相比，哪项正确？`,
ex:`P5-31～P5-38：<br>• SET 由 Visa、MasterCard、Microsoft、IBM、Netscape 等在 1996 年设计，是<b>多方</b>协议<span class="zhen">（protocol）</span>，为每个参与方提供身份认证<span class="zhen">（authentication）</span>；<br>• SET 加密<span class="zhen">（encryption）</span>的是<b>消息</b>，不是信道<span class="zhen">（channel）</span>；<br>• 商家<span class="zhen">（merchant）</span><b>看不到</b>客户的账户信息（交给支付网关<span class="zhen">（payment gateway）</span>处理）；<br>• 客户要对支付指令<span class="zhen">（payment instruction）</span>做数字签名<span class="zhen">（digital signature）</span>，难以抵赖<span class="zhen">（repudiation）</span>；<br>• 但需要银行、商家<span class="zhen">（merchant）</span>、客户三方都安装软件，所以<b>几乎没人用</b>。<br>SSL 是两方协议<span class="zhen">（two-party protocol）</span>，只做服务器认证<span class="zhen">（server authentication）</span>，用得很多。`,
op:[`✗ SSL 才是两方协议<span class="zhen">（two-party protocol）</span>`,`✓`,`✗ 几乎没人用`,`✗ 恰恰相反`],
tip:`SSL：两方、信道加密<span class="zhen">（channel encryption）</span>、商家<span class="zhen">（merchant）</span>担责；SET：多方、消息加密<span class="zhen">（encryption）</span>、支付网关<span class="zhen">（payment gateway）</span>担责。`,ref:`P5-30～P5-38`},

{id:'5.c5',p:5,s:'c',q:`A Stateful Packet Inspection (SPI) firewall differs from a static packet filter because it:`,
o:[`Examines each packet in isolation`,`Keeps a state table of active connections and allows inbound packets that are responses to internally-initiated connections`,`Never inspects packet headers`,`Can only be installed on a personal computer`],a:1,
zh:`状态包检测（SPI）防火墙<span class="zhen">（firewall）</span>与静态包过滤<span class="zhen">（static packet filtering）</span>有什么不同？`,
ex:`P5-59：SPI 用<b>状态表<span class="zhen">（state table）</span></b>记录每个连接（IP、端口<span class="zhen">（port）</span>、序列号<span class="zhen">（serial number）</span>），只放行“内网<span class="zhen">（internal network）</span>先发起的连接”的回包。优点：便宜、安全，几乎所有边界防火墙<span class="zhen">（perimeter firewall）</span>都在用（P5-64）。缺点：维护状态表<span class="zhen">（state table）</span>要额外处理，可能被 DoS 拖垮。`,
op:[`✗ 那是静态包过滤<span class="zhen">（static packet filtering）</span>`,`✓`,`✗`,`✗`],
tip:`SPI = 包过滤<span class="zhen">（packet filtering）</span> + 记住会话<span class="zhen">（session）</span>。`,ref:`P5-57～P5-64`},

{id:'5.c6',p:5,s:'c',q:`Which firewall architecture uses two filtering routers/firewalls to create a DMZ where public-facing servers are placed?`,
o:[`Packet filtering router`,`Single-host (screened host) firewall`,`Dual-homed host firewall`,`Screened-subnet firewall`],a:3,
zh:`哪种防火墙架构<span class="zhen">（firewall architecture）</span>用两台过滤路由器<span class="zhen">（filtering router）</span>或防火墙<span class="zhen">（firewall）</span>形成 DMZ，用来放置面向公众的服务器<span class="zhen">（server）</span>？`,
