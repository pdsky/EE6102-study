<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EE6102 刷题本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --paper:#F2F4F8;
  --surface:#FFFFFF;
  --surface-2:#E9EDF4;
  --line:#D6DCE7;
  --line-strong:#B5BFD1;
  --ink:#18202E;
  --ink-soft:#3A4558;
  --muted:#667185;
  --accent:#2747A8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0E6F7;
  --bubble:#93A6DA;
  --bubble-ink:#4A62AE;
  --mark:#D2342A;
  --good:#1C7A4E;
  --good-soft:#DCF0E4;
  --bad:#B4282E;
  --bad-soft:#F8E0DF;
  --warn:#8F5B00;
  --warn-soft:#F6EBCD;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 8px 24px rgba(20,30,60,.06);
  --f-ui:"Archivo","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","Archivo",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-en:"Source Serif 4","Noto Serif SC",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0E121A;--surface:#161C27;--surface-2:#1E2633;--line:#2A3445;--line-strong:#3B475B;
    --ink:#E6EAF2;--ink-soft:#C1C9D7;--muted:#8A95A9;
    --accent:#8FA7F2;--accent-ink:#0E1424;--accent-soft:#1E2B4F;--bubble:#4A5E9E;--bubble-ink:#A9BBF2;
    --mark:#FF6E61;--good:#5DCB95;--good-soft:#14322A;--bad:#F27F7A;--bad-soft:#3B1D20;--warn:#E5B451;--warn-soft:#3A2F15;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 26px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E121A;--surface:#161C27;--surface-2:#1E2633;--line:#2A3445;--line-strong:#3B475B;
  --ink:#E6EAF2;--ink-soft:#C1C9D7;--muted:#8A95A9;
  --accent:#8FA7F2;--accent-ink:#0E1424;--accent-soft:#1E2B4F;--bubble:#4A5E9E;--bubble-ink:#A9BBF2;
  --mark:#FF6E61;--good:#5DCB95;--good-soft:#14322A;--bad:#F27F7A;--bad-soft:#3B1D20;--warn:#E5B451;--warn-soft:#3A2F15;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-ui);line-height:1.25;text-wrap:balance;margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:.08em .35em;border-radius:4px}
sup{line-height:0}
.mono{font-family:var(--f-mono)}
.en{font-family:var(--f-en)}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 28px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:12px;align-items:flex-start;padding:0 6px}
.marks{display:grid;grid-template-columns:repeat(2,13px);gap:4px;margin-top:5px}
.marks i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--bubble);display:block}
.marks i.on{background:var(--ink);border-color:var(--ink)}
.brand .code{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.brand .name{font-family:var(--f-ui);font-weight:700;font-size:22px;letter-spacing:.02em}
.brand .sub{font-family:var(--f-ui);font-size:12px;color:var(--muted);font-stretch:92%}
.nav{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:2px}
.gl{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 10px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink-soft);text-decoration:none;font-family:var(--f-ui);font-size:14px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.cnt{font-family:var(--f-mono);font-size:11px;min-width:22px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
.cnt:empty{display:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px;line-height:1.55}
.main{padding:34px clamp(16px,4.5vw,56px) 96px;min-width:0}
.view{max-width:880px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:30;border-right:0;border-bottom:1px solid var(--line);padding:8px 16px;gap:6px;overflow:visible}
  .brand{padding:0}
  .brand .sub,.brand .marks{display:none}
  .brand .name{font-size:16px}
  .brand>div:last-child{display:flex;align-items:baseline;gap:10px}
  .nav{flex-direction:row;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
  .nav::-webkit-scrollbar{display:none}
  .grp{flex-direction:row;flex-wrap:nowrap;gap:6px;flex:none}
  .gl,.side-foot{display:none}
  .nav a{padding:5px 11px;font-size:13px;border:1px solid var(--line);white-space:nowrap;flex:none}
  .main{padding:20px 16px 80px}
}

/* ---------- common ---------- */
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.vh{font-size:clamp(24px,3.4vw,30px);font-weight:700;margin:0 0 6px}
.lede{color:var(--ink-soft);margin:0 0 22px;max-width:64ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-family:var(--f-ui);font-size:14px;cursor:pointer;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-ui);font-size:13px;cursor:pointer;color:var(--ink-soft)}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tag{display:inline-block;font-family:var(--f-ui);font-size:11.5px;padding:1px 8px;border-radius:5px;letter-spacing:.02em;white-space:nowrap}
.tag.o{background:var(--accent-soft);color:var(--accent)}
.tag.c{background:var(--surface-2);color:var(--ink-soft)}
.tag.n{background:var(--warn-soft);color:var(--warn)}
.tag.k{background:var(--good-soft);color:var(--good)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.tag.meh{background:var(--warn-soft);color:var(--warn)}
.tag.hot{background:var(--mark);color:#fff;font-weight:600}
.hotbox{background:color-mix(in srgb,var(--mark) 10%,var(--surface));border-left:3px solid var(--mark);color:var(--ink);padding:9px 12px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.6}
.chip.hotc{border-color:color-mix(in srgb,var(--mark) 55%,var(--line))}
.chip.hotc.on{background:var(--mark);border-color:var(--mark);color:#fff}
.qk.hotk{border-left:3px solid var(--mark)}
.exq{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.exq .stem{font-family:var(--f-en);font-size:15.5px;line-height:1.55;margin:0}
.exq .stem ol{margin:6px 0 0;padding-left:24px}
.exq .stem li{margin:4px 0}
.exq .zh{margin:0}
.exname{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0;letter-spacing:.02em}
.en-ans{font-family:var(--f-en);font-size:15px;line-height:1.55;margin:4px 0;padding-left:20px}
p.en-ans{padding-left:0}
.en-ans li{margin:3px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.ref{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
table.mini{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.mini th{background:var(--surface-2);font-family:var(--f-ui);font-weight:600}
.tbl{overflow-x:auto;max-width:100%}
.flag{display:inline-block;font-family:var(--f-ui);font-weight:600;font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:5px;margin-bottom:4px}

/* ---------- home ---------- */
.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 26px}
.date{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.date .k{font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:.04em}
.date .d{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.date .d small{font-size:14px;font-weight:400;color:var(--muted);margin-left:3px}
.date .s{font-size:12.5px;color:var(--ink-soft)}
.date.hot .d{color:var(--accent)}
@media (max-width:640px){.dates{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px;flex-wrap:wrap}
.sec-h h2{font-size:18px}
.parts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) 150px auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pno{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent)}
.pname{font-family:var(--f-ui);font-weight:600;font-size:14.5px}
.pmeta{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)}.bar .b{background:var(--bad)}
.pstat{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.prow{grid-template-columns:34px minmax(0,1fr);row-gap:8px}.prow .barwrap{grid-column:2}.prow .btn{grid-column:2;justify-self:start}}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qk{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 15px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.qk:hover{border-color:var(--accent)}
.qk b{font-family:var(--f-ui);font-size:15px}
.qk span{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.srcnote{font-size:13px;color:var(--muted);margin-top:22px;max-width:72ch}

/* ---------- practice ---------- */
.filters{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow .fl{font-family:var(--f-ui);font-size:12px;color:var(--muted);min-width:42px}
.sheet{margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sheet summary{cursor:pointer;padding:10px 14px;font-family:var(--f-ui);font-size:13.5px;display:flex;justify-content:space-between;gap:10px;list-style:none}
.sheet summary::-webkit-details-marker{display:none}
.sheet summary::after{content:"展开";color:var(--muted);font-size:12.5px}
.sheet[open] summary::after{content:"收起"}
.grid{display:flex;flex-wrap:wrap;gap:5px;padding:4px 14px 14px}
.gb{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bubble);background:transparent;color:var(--bubble-ink);font-family:var(--f-mono);font-size:11px;cursor:pointer;padding:0;display:grid;place-items:center}
.gb.ok{background:var(--good);border-color:var(--good);color:#fff}
.gb.no{background:var(--bad);border-color:var(--bad);color:#fff}
.gb.pk{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.gb.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 14px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--bubble)}
.legend .lg-ok{background:var(--good);border-color:var(--good)}.legend .lg-no{background:var(--bad);border-color:var(--bad)}.legend .lg-pk{background:var(--ink);border-color:var(--ink)}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px 0}
.qid{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qtop .sp{flex:1}
.star{border:0;background:none;cursor:pointer;font-size:19px;line-height:1;color:var(--line-strong);padding:2px 4px}
.star.on{color:#E0A100}
.qbody{padding:10px 20px 18px}
.stem{font-family:var(--f-en);font-size:18.5px;line-height:1.5;margin:4px 0 6px;font-weight:600}
.zh{font-size:14px;color:var(--ink-soft);margin:0 0 6px}
.zhbtn{border:0;background:none;padding:0;color:var(--accent);font-size:13px;cursor:pointer;font-family:var(--f-ui)}
.opts{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.opt{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--bubble);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.bub{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--bubble);color:var(--bubble-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.otx{font-family:var(--f-en);font-size:16px;line-height:1.5;padding-top:3px}
.omk{font-family:var(--f-ui);font-size:12px;padding-top:6px;white-space:nowrap}
.opt.pk .bub{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.right .otx{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:2px;text-underline-offset:5px}
.opt.right .omk{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .omk{color:var(--bad)}
.opt.alt{border-style:dashed;border-color:var(--warn)}
.opt.alt .omk{color:var(--warn)}
.verdict{display:flex;align-items:center;gap:10px;margin:16px 0 0;padding:10px 14px;border-radius:10px;font-family:var(--f-ui);font-weight:600;font-size:14.5px}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict.rc{background:var(--accent-soft);color:var(--accent)}
.explain{border-top:1.5px dashed var(--line-strong);padding:16px 20px 20px;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.ex-sec{margin:0 0 14px}
.ex-sec:last-child{margin-bottom:0}
.ex-k{font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.ex-sec p{margin:0}
.oplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.oplist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px}
.oplist .l{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.oplist li.r .l{color:var(--good)}
.tipbox{background:var(--warn-soft);color:var(--ink);padding:9px 12px;border-radius:8px;font-size:14px}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r)}

/* ---------- mock ---------- */
.mbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--paper);padding:8px 0 12px}
@media (max-width:860px){.mbar{position:static}}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.setup{display:grid;gap:16px}
.score{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin:0 0 18px}
.score .big{font-family:var(--f-mono);font-size:56px;font-weight:600;line-height:1}
.score .big small{font-size:22px;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ritem{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ritem summary{cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;list-style:none}
.ritem summary::-webkit-details-marker{display:none}
.ritem .rs{font-family:var(--f-en);font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ritem .rb{padding:0 14px 14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--warn-soft);margin:10px 0}

/* ---------- wrong ---------- */
.wlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.witem{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.witem:first-child{border-top:0}
.witem .ws{font-family:var(--f-en);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.witem{grid-template-columns:52px minmax(0,1fr)}.witem .row{grid-column:2}}

/* ---------- notes ---------- */
.notes{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 24px 24px}
.notes h3{font-size:17px;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.notes h3.warn{color:var(--warn)}
.notes ul,.notes ol{margin:6px 0;padding-left:20px}
.notes li{margin:4px 0}
.notes p{margin:8px 0}
.notes table.mini{display:block;overflow-x:auto;max-width:100%}
.notes table.mini tbody{display:table;width:100%}

/* ---------- QA ---------- */
.qalist{display:flex;flex-direction:column;gap:10px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.qa>summary{cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:baseline;list-style:none}
.qa>summary::-webkit-details-marker{display:none}
.qa .qn{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:13.5px}
.qa .qs{font-family:var(--f-en);font-size:15.5px;line-height:1.45}
.qa[open] .qs{display:block}
.qa:not([open]) .qs{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qa .qb{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.qa textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;background:var(--paper);font-size:14px;line-height:1.55}
.qa .key{font-family:var(--f-en);font-size:15px;line-height:1.55}
.qa .key ul{margin:6px 0;padding-left:20px}
.qa .key li{margin:3px 0}
.qa .jiang p{margin:6px 0}
.ans-blk{border-top:1.5px dashed var(--line-strong);padding-top:12px;display:flex;flex-direction:column;gap:12px}

/* ---------- calc ---------- */
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.tool h3{font-size:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:var(--paper);font-family:var(--f-mono);font-size:14px;min-width:0;width:100%}
.fld.wide{grid-column:1/-1}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets .fl{font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-right:2px}
.prac{border:1.5px solid var(--accent);border-radius:12px;padding:14px 16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px}
.prac .pq{font-size:15px}
.chk{font-family:var(--f-ui);font-size:13px;font-weight:600}
.chk.ok{color:var(--good)}.chk.no{color:var(--bad)}
.steps{display:flex;flex-direction:column;gap:12px}
.step{border-left:0;padding:12px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.step h4{font-size:14px;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.step h4 .sn{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.step p{margin:4px 0}
.eq{font-family:var(--f-mono);font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:block;overflow-x:auto;white-space:nowrap;margin:6px 0}
.res{font-family:var(--f-mono);font-weight:600;color:var(--good)}
.errmsg{color:var(--bad);font-size:14px;background:var(--bad-soft);padding:8px 12px;border-radius:8px}
table.calc{border-collapse:collapse;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
table.calc th,table.calc td{border:1px solid var(--line);padding:4px 9px;text-align:right;white-space:nowrap}
table.calc th{background:var(--surface-2);font-family:var(--f-ui);font-weight:600}
table.calc tr.hit td{background:var(--good-soft)}
table.calc tr.dim td{color:var(--muted)}
details.more>summary{cursor:pointer;font-family:var(--f-ui);font-size:13px;color:var(--accent);margin:4px 0}
.ansin{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}

@media (prefers-reduced-motion:no-preference){
  .vfade{animation:vf .22s ease}
  @keyframes vf{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
}

/* English for Chinese technical terms */
.zhen{color:var(--muted);font-size:.86em;font-weight:400;font-style:normal;letter-spacing:0;text-transform:none}

<script>
/* Part 1 · Introduction, Threat Landscape, Attacks & Attackers (sld1) */
window.MCQ = (window.MCQ || []).concat([
{id:'1.01',p:1,s:'o',q:`What is cyber security?`,
o:[`It is the collection of technologies, standards, policies and management practices that are applied to digital information to keep it secure`,`It is only using technology to keep digital information secure`,`It is just using the best policy to keep digital information secure`,`None of the above`],a:0,
zh:`什么是网络安全<span class="zhen">（cyber security）</span>？`,
ex:`网络安全<span class="zhen">（cyber security）</span>不是某一种单独手段，而是<b>技术 + 标准 + 策略<span class="zhen">（policy）</span> + 管理实践<span class="zhen">（management practices）</span></b>的组合。课件 P1-10 说安全由三类实体共同实现：<b>Products</b>（产品/技术）、<b>People</b>（人）、<b>Procedures</b>（流程/策略<span class="zhen">（policy）</span>）；Q&A 第 1 题也把它定义为 "policies, procedures, and technical measures"。凡是用 only / just 把它缩成单一手段的选项，基本都是错的。`,
op:[`✓ 技术、标准、策略<span class="zhen">（policy）</span>、管理实践<span class="zhen">（management practices）</span>并列，关键词是“组合”。`,`✗ only technology：Q&A Q18 明确说只靠技术（technology-centric）的策略<span class="zhen">（policy）</span>一定失败。`,`✗ just policy：只靠策略同样不行，没有技术就无法监控和执行。`,`✗ A 已经正确。`],
tip:`看到 only / just / never / always 这类绝对词，先怀疑它。`,ref:`P1-10、P1-11；Q&A Q1`},

{id:'1.02',p:1,s:'o',q:`Why is cyber security important?`,
o:[`In today's high technology environment, organisations are becoming more and more dependent on their information systems`,`Due to hype in the media about cyber security`,`The threats from traditional brick and motor criminals are on the rise`,`Many organisations who are still using offline payment system are depending on cyber security`],a:0,
zh:`为什么网络安全<span class="zhen">（cyber security）</span>很重要？`,
ex:`根本原因是<b>依赖</b>：组织的业务越来越依赖信息系统<span class="zhen">（information system）</span>，一旦系统出事，P1-12 列出的各类资产<span class="zhen">（asset）</span>都会受损：data、knowledge、software、physical、financial、employee、customer & partner assets，还有 goodwill（商誉）。依赖越深，安全越重要。`,
op:[`✓ 依赖信息系统<span class="zhen">（information system）</span>，是重要性的根源。`,`✗ 媒体炒作不是理由。`,`✗ brick-and-mortar（题中误拼 motor）指传统实体犯罪，和网络安全<span class="zhen">（cyber security）</span>的重要性无关。`,`✗ 逻辑反了：仍用线下支付的机构反而较少依赖网络。`],
tip:`重要性 = 依赖程度 × 资产价值<span class="zhen">（asset value）</span>。`,ref:`P1-12`},

{id:'1.03',p:1,s:'o',q:`What are the three basic cyber security concepts?`,
o:[`Confidentiality, Integrity and Access`,`Consideration, Integrity, and Availability`,`Confidentiality, Integrity, Availability`,`None of the above`],a:2,
zh:`网络安全<span class="zhen">（cyber security）</span>的三个基本概念是什么？`,
ex:`<b>CIA 三元组</b>（P1-8）：<br>• <b>Confidentiality</b> 机密性：防止未授权访问<span class="zhen">（unauthorized access）</span>或共享数据；<br>• <b>Integrity</b> 完整性：数据不能被未授权<span class="zhen">（unauthorized）</span>的人修改；<br>• <b>Availability</b> 可用性：授权方<span class="zhen">（authorized party）</span>能持续、及时地访问信息。`,
op:[`✗ Access 不是三要素之一（Access control 是一种安全服务<span class="zhen">（security service）</span>）。`,`✗ Consideration 是凑字的干扰词。`,`✓ 标准答案。`,`✗`],
tip:`拼写也要会：Confidentiality / Integrity / Availability。`,ref:`P1-8`},

{id:'1.04',p:1,s:'o',q:`You visit an organization's website and you realized that you are able to view sensitive files on their web server. Even though it is not your fault, it is still considered a cyber security breach?`,
o:[`True`,`False`],a:0,
zh:`你访问某机构网站时发现自己能看到其服务器<span class="zhen">（server）</span>上的敏感文件。虽然不是你的错，这仍算安全事故<span class="zhen">（security breach）</span>吗？`,
ex:`算。判断是不是 breach，看<b>机密性<span class="zhen">（confidentiality）</span>有没有被破坏</b>，与谁的过错、是否故意无关。P1-13 对 Data Confidentiality 的定义是 "Protection of data from unauthorized disclosure"：敏感文件被无权限<span class="zhen">（privileges）</span>的人看到，就已经发生了未授权披露<span class="zhen">（unauthorized disclosure）</span>。课件里大量真实案例正是这种“配置错误导致数据暴露”：P1-21 公开可访问的 MongoDB（8.09 亿条）、P1-24 配置错误的 Elasticsearch（80 亿条）。`,
tip:`Misconfiguration（配置错误）导致的数据暴露也是 breach。`,ref:`P1-13、P1-21、P1-24`},

{id:'1.05',p:1,s:'o',q:`Verifying that users are who they say they are and that each input arriving at the system came from a trusted source.`,
o:[`Authenticity`,`Integrity`,`Confidentiality`,`None of the above`],a:0,
zh:`验证用户就是他们声称的那个人，并且每个到达系统的输入都来自可信来源。这是哪个属性？`,
ex:`"who they say they are" 加上 "came from a trusted source"，讲的都是<b>身份真实</b>。P1-13：Authentication = "Assurance that communicating entity is the one claimed"。`,
op:[`✓ 真实性<span class="zhen">（authenticity）</span>/身份认证<span class="zhen">（authentication）</span>。`,`✗ Integrity 关心数据有没有被改，不关心是谁发的。`,`✗ Confidentiality 关心谁能看到。`,`✗`],
tip:`是谁 → Authenticity；改没改 → Integrity；谁能看 → Confidentiality；能不能用 → Availability；能否抵赖 → Non-repudiation。`,ref:`P1-13`},

{id:'1.06',p:1,s:'o',q:`List the three stages in the plan-protect-respond cycle.`,
o:[`Planning, protection, and response`,`Planning, Checking and protecting`,`Plan, do and check`,`None of the above`],a:0,
zh:`列出“计划—保护—响应”循环的三个阶段。`,
ex:`题目已经给出名字：plan → protect → respond。<br>• <b>Planning</b>：识别资产<span class="zhen">（asset）</span>和威胁<span class="zhen">（threat）</span>，制定策略<span class="zhen">（policy）</span>；<br>• <b>Protection</b>：按计划部署并运行防护措施；<br>• <b>Response</b>：攻击得手后按计划恢复。<br>P6-112 说 "Response should be 'reacting according to plan'"，强调的正是这个循环里“计划”贯穿始终。`,
op:[`✓`,`✗ 编造的组合。`,`✗ Plan-Do-Check(-Act) 是质量管理的 PDCA 循环，不是本课程的安全循环。`,`✗`],
tip:`三个阶段都绕着“计划”：plan-based protection、recovery according to plan。`,ref:`P6-112`},

{id:'1.07',p:1,s:'o',q:`In plan, protect and response cycle, which stage consumes the most time?`,
o:[`Protection`,`Planning`,`Response`,`All three take the same time`],a:0,
zh:`在计划—保护—响应循环中，哪个阶段最耗时？`,
ex:`Planning 是阶段性的工作，Response 只在事件发生时才启动；<b>Protection</b> 是每天都在进行的运维：配置和维护防火墙<span class="zhen">（firewall）</span>、打补丁<span class="zhen">（patching）</span>、管理账户、监控日志<span class="zhen">（log）</span>……日复一日，所以最耗时。这个说法出自 Panko《Corporate Computer Security》的 plan–protect–respond 循环，样题直接沿用。`,
op:[`✓ 日常持续运行，最耗时。`,`✗ 规划重要，但不是最耗时的。`,`✗ 响应只在出事后进行。`,`✗ 三者不均等。`],
tip:`Protection = 日常运维 → 最耗时。`,ref:`样题 Q1-3`},

{id:'1.08',p:1,s:'o',q:`How is protection defined?`,
o:[`Protection is defined as the plan-based creation of operation and countermeasures`,`To use technologies to protect against attacks`,`To use policy-based protection to protect against attacks`,`All of the above`],a:3,
zh:`“保护”是如何定义的？`,
ex:`官方答案是 <b>D</b>。A 是教科书定义（plan-based creation and operation of countermeasures，按计划建立并运行对抗措施）；B 的技术手段和 C 的策略<span class="zhen">（policy）</span>手段都是 protection 的组成部分。本课程反复强调<b>技术与策略<span class="zhen">（policy）</span>必须结合</b>（Q&A Q18、P3-5 的 Technical + Managerial 两个维度），所以三项合起来才完整。`,
op:[`部分正确：标准定义。`,`部分正确：技术防护。`,`部分正确：策略<span class="zhen">（policy）</span>防护。`,`✓ 三者都对。`],
tip:`本课程里“技术 vs 策略<span class="zhen">（policy）</span>”二选一的题，答案通常是“两者都要”。`,ref:`P3-5；Q&A Q18`},

{id:'1.09',p:1,s:'o',q:`How is the response defined?`,
o:[`Response is defined as recovery according to plan`,`Punish the attackers so that they don't attack again`,`Attack the attackers and destroy their abilities to attack again`,`None of the above`],a:0,
zh:`“响应”是如何定义的？`,
ex:`Response = <b>按计划恢复</b>。P6-112："Response should be 'reacting according to plan'. Planning is critical. A compromise is not the right time to think about what to do."`,
op:[`✓ 关键词 according to plan。`,`✗ 惩罚攻击者<span class="zhen">（attacker）</span>只是事件响应<span class="zhen">（incident response）</span>的一个阶段（P6-113：Detect → Stop → Repair → Punish），不是 response 的定义。`,`✗ 反击（hack back）不是响应，而且本身可能违法。`,`✗`],
tip:`看到 according to plan 就选它。`,ref:`P6-112、P6-113`},

{id:'1.10',p:1,s:'o',q:`Why there is need to understand cyber security Threat landscape?`,
o:[`We will not be able to defend as we will not know how are the attackers and how are they going to attack us`,`Business requirements make it essential to understand it`,`It is requirement of information cyber security policy, so we have no choice`,`None of the above`],a:0,
zh:`为什么需要了解网络安全<span class="zhen">（cyber security）</span>的威胁态势<span class="zhen">（threat landscape）</span>？`,
ex:`知己知彼：不知道攻击者<span class="zhen">（attacker）</span>是谁、会怎样攻击，就无法设计防御。P1-38："If we know the various types of cyberattacks, it becomes easier for us to protect our networks and systems against them." 课程目标第 1 条就是 "Identify and explain modern cyber security threats landscape"。`,
op:[`✓ 了解对手才能防御。`,`✗ 业务要求只是外部理由，不是根本原因。`,`✗ “政策<span class="zhen">（policy）</span>要求所以没得选”是被动理由。`,`✗`],
tip:`威胁态势<span class="zhen">（threat landscape）</span> → 知道“谁、怎么攻” → 才能防。`,ref:`P1-3、P1-38`},

{id:'1.11',p:1,s:'o',q:`Automation, speed and action at distance are adding online attack?`,
o:[`True`,`False`],a:0,
zh:`自动化<span class="zhen">（automation）</span>、速度和远程作案<span class="zhen">（action at a distance）</span>，这些因素在助长网络攻击<span class="zhen">（cyberattack）</span>吗？`,
ex:`对。P1-37 列出互联网<span class="zhen">（Internet）</span>助长攻击的<b>三个特征</b>：<br>1. <b>Automation</b>：计算机和网络速度快，攻击容易发起；借助数据挖掘<span class="zhen">（data mining）</span>或 AI 很容易找到目标；<br>2. <b>Action at a Distance</b>：攻击者<span class="zhen">（attacker）</span>远在千里之外也能造成破坏，各国法律不同，难以起诉；<br>3. <b>Electronic techniques easily transferable/duplicated</b>：电子货币<span class="zhen">（electronic money）</span>可以伪造<span class="zhen">（forgery）</span>，攻击工具一个人就能做出来，还容易改造后复用。`,
tip:`三特征：Automation / Action at a Distance / Technique Propagation（易复制传播）。`,ref:`P1-37；Q&A Q3`},

{id:'1.12',p:1,s:'o',q:`Most obvious reason (s) for cyber security attacks is (are):`,
o:[`Privacy violations`,`Criminal attacks`,`Publicity attacks`,`Legal attacks`,`All of the above`],a:4,
zh:`网络攻击<span class="zhen">（cyberattack）</span>最明显的原因有哪些？`,
ex:`四类全对（Q&A Q3）：<br>• <b>Criminal attacks</b>：图财，包括欺诈<span class="zhen">（fraud）</span>、破坏，以及盗窃个人信息、品牌和身份；<br>• <b>Privacy violations</b>：未经授权<span class="zhen">（unauthorized）</span>获取个人信息，手段有监控、数据库<span class="zhen">（database）</span>、流量分析<span class="zhen">（traffic analysis）</span>；<br>• <b>Publicity attacks</b>：想出名、上新闻，任何系统都可能被盯上；<br>• <b>Legal attacks</b>：借司法程序（如诉讼中的证据开示）获取对方信息。这一类来自 Schneier 的分类。`,
op:[`部分`,`部分`,`部分`,`部分`,`✓ 全部`],
tip:`四类原因：Criminal / Privacy / Publicity / Legal。`,ref:`Q&A Q3；P1-95`},

{id:'1.13',p:1,s:'o',q:`The fabrication of information that is purported to be from someone who is not actually the author is called`,
o:[`Masquerading`,`Eavesdropping`,`Spoofing`,`None of the above`],a:0,
zh:`伪造<span class="zhen">（forgery）</span>一条声称来自某人（但该人并非真正作者）的信息，这叫什么？`,
ex:`伪造<span class="zhen">（forgery）</span>“看起来是某人写的”信息，本质是<b>冒充他人身份</b>，即 masquerading（伪装、冒充）。Stallings 和 RFC 4949 的威胁<span class="zhen">（threat）</span>分类里，伪造<span class="zhen">（forgery）</span>来自他人的消息归入 masquerade（属于 deception 欺骗类）。`,
op:[`✓ 冒充身份<span class="zhen">（masquerading）</span>。`,`✗ 窃听<span class="zhen">（eavesdropping）</span>是被动截获，不伪造<span class="zhen">（forgery）</span>内容。`,`✗ 最强干扰项。spoofing 也有“伪装”的意思，但通常特指伪造<span class="zhen">（forgery）</span> IP、MAC、邮件地址等技术标识（如 P5 的 IP address spoofing）。本题官方答案是 masquerading。`,`✗`],
tip:`伪造<span class="zhen">（forgery）</span>“作者身份” → masquerading；伪造<span class="zhen">（forgery）</span>“地址字段” → spoofing。`,ref:`样题 Q1-5`},

{id:'1.14',p:1,s:'o',q:`Malware is a generic term for "evil/malicious software"`,
o:[`True`,`False`],a:0,
zh:`Malware 是“恶意软件”的统称。`,
ex:`对。P1-39："Malware refers to malicious software including viruses, worms, spyware, ransomware, adware, Rootkits, and trojans." Malware 是一个总类，下面包含多种具体类型。`,
tip:`Malware 家族：virus、worm、trojan、spyware、adware、ransomware、rootkit、logic bomb、botnet。`,ref:`P1-39、P1-40`},

{id:'1.15',p:1,s:'o',q:`Distinguish between viruses and worms`,
o:[`Virus needs a host program while worms are full program and don't need a host program`,`Both are same`,`Worm cannot be detected by antivirus program, while virus can be detected`,`None of the above`],a:0,
zh:`区分病毒<span class="zhen">（virus）</span>和蠕虫<span class="zhen">（worm）</span>。`,
ex:`P1-39："Virus is malicious program that replicates itself and infects computers, however it needs a host to travel, while worm doesn't require a host." 病毒<span class="zhen">（virus）</span><b>寄生</b>在宿主程序<span class="zhen">（host program）</span>里，随宿主传播；蠕虫<span class="zhen">（worm）</span>是<b>独立完整的程序</b>，自己通过网络复制传播。Q&A Q2 的 Morris 事件就是蠕虫<span class="zhen">（worm）</span>：自我复制<span class="zhen">（self-replication）</span>占满磁盘、带宽<span class="zhen">（bandwidth）</span>和 CPU，形成 DoS。`,
op:[`✓ 是否需要宿主，是二者的核心区别。`,`✗ 两者不同。`,`✗ 两者都能被杀毒软件<span class="zhen">（antivirus software）</span>检测（基于特征<span class="zhen">（signature-based）</span>码等）。`,`✗`],
tip:`病毒<span class="zhen">（virus）</span>要“寄主”，蠕虫<span class="zhen">（worm）</span>自己“爬”。`,ref:`P1-39；Q&A Q2`},

{id:'1.16',p:1,s:'o',q:`The interruption or degradation of a data service or information access is called`,
o:[`Denial of service`,`Non-repudiation`,`Masquerading`,`None of the above`],a:0,
zh:`数据服务或信息访问被中断、性能被降低，这叫什么？`,
ex:`中断或降级服务，破坏的是 <b>Availability</b>，这类攻击就是 <b>Denial of Service</b>。P1-62：攻击者<span class="zhen">（attacker）</span>用流量<span class="zhen">（traffic）</span>淹没系统、服务器<span class="zhen">（server）</span>或网络，耗尽资源和带宽<span class="zhen">（bandwidth）</span>，合法请求得不到处理。`,
op:[`✓`,`✗ Non-repudiation（不可否认性）是一种安全服务<span class="zhen">（security service）</span>，不是攻击。`,`✗ Masquerading 是冒充身份。`,`✗`],
tip:`DoS 打的是 CIA 里的 A。`,ref:`P1-62`},

{id:'1.17',p:1,s:'o',q:`How do most viruses spread between computers today?`,
o:[`Mostly via email messages, but also through thumb drives, file sharing programs, downloading infected programs from a malicious website, social networking sites.`,`By installing mobile applications`,`Hackers cracking your password`,`None of the above`],a:0,
zh:`如今大多数病毒<span class="zhen">（virus）</span>是怎样在计算机之间传播的？`,
ex:`P1-42："Malware gets into a system when the user clicks on suspicious links or downloads attachments or uses an infected drive." Q&A Q7 也说勒索软件<span class="zhen">（ransomware）</span>通常藏在<b>邮件附件<span class="zhen">（attachment）</span></b>里。邮件是第一大途径，此外还有 U 盘<span class="zhen">（USB drive）</span>、文件共享<span class="zhen">（file sharing）</span>、恶意网站<span class="zhen">（malicious website）</span>下载和社交网络<span class="zhen">（social network）</span>。`,
op:[`✓ 最全面。`,`✗ 安装 App 只是途径之一，不是“大多数”。`,`✗ 破解密码<span class="zhen">（password cracking）</span>属于 password attack，不是病毒<span class="zhen">（virus）</span>传播方式。`,`✗`],
tip:`传播链：邮件附件<span class="zhen">（attachment）</span>、恶意链接<span class="zhen">（malicious link）</span>、U 盘<span class="zhen">（USB drive）</span>。`,ref:`P1-42；Q&A Q7`},

{id:'1.18',p:1,s:'o',q:`What is a Logic Bomb?`,
o:[`It gives the impression that it is useful program however in reality it is harmful`,`Malicious codes that execute when a certain predefined events occurs.`,`A Virus which bypasses the antivirus program`,`None of the above`],a:1,
zh:`什么是逻辑炸弹<span class="zhen">（logic bomb）</span>？`,
ex:`P1-39："Logic bomb behaves like a virus, performs malicious act, when certain conditions are met (April fool's day, 4th of July, X-mas, etc.)." 核心是<b>条件触发</b>：日期到了、某员工被删账号等预设事件发生时才执行。`,
op:[`✗ 这是 Trojan（木马<span class="zhen">（Trojan horse）</span>）的描述：伪装成有用程序。`,`✓ 条件触发。`,`✗ 编造的定义。`,`✗`],
tip:`Logic bomb = 条件触发；Trojan = 伪装；Virus = 寄生；Worm = 自传播<span class="zhen">（self-propagation）</span>；Rootkit = 隐身。`,ref:`P1-39、P1-40`},

{id:'1.19',p:1,s:'o',q:`What are the likely motivations for hackers`,
o:[`Financial gain, publicity and espionage`,`They are too smart and want people to know about it`,`They do it for a challenge`,`They do it as they are bored`,`All of the above`],a:4,
zh:`黑客<span class="zhen">（hacker）</span>可能的动机有哪些？`,
ex:`P1-95 "Why do hackers hack?"：政府支持的黑客做网络战<span class="zhen">（cyber warfare）</span>、网络恐怖主义<span class="zhen">（cyberterrorism）</span>、间谍活动<span class="zhen">（espionage）</span>；产业间谍<span class="zhen">（industrial espionage）</span>窃取商业机密<span class="zhen">（trade secret）</span>；精英黑客<span class="zhen">（elite hacker）</span>公开漏洞<span class="zhen">（vulnerability）</span>、为了挑战、为了钱；script kiddies 为了获得尊重（炫耀）；内部人员<span class="zhen">（insider）</span>为了报复。选项 A–D 都在其中，所以选 E。`,
op:[`部分`,`部分（炫耀）`,`部分（挑战）`,`部分（无聊、找刺激）`,`✓`],
tip:`动机五花八门，这类题一般选 All of the above。`,ref:`P1-95`},

{id:'1.20',p:1,s:'o',q:`What is a virus or worm payload?`,
o:[`It is a virus or worm designed for mobile devices`,`Payloads are pieces of code that do damage`,`Payload is just a computer jargon for virus`,`None of the above`],a:1,
zh:`病毒<span class="zhen">（virus）</span>或蠕虫<span class="zhen">（worm）</span>的 payload 是什么？`,
ex:`恶意代码<span class="zhen">（malicious code）</span> = <b>传播机制<span class="zhen">（propagation mechanism）</span></b>（怎么扩散）+ <b>payload 有效载荷</b>（到了之后干什么坏事）。Payload 就是真正造成破坏的那段代码：删除文件、加密<span class="zhen">（encryption）</span>勒索、打开后门<span class="zhen">（backdoor）</span>、窃取数据等。Q&A Q2 的 Morris 蠕虫<span class="zhen">（worm）</span>本身“没有破坏性 payload”，但无限复制依然造成了 DoS。`,
op:[`✗ 与移动设备<span class="zhen">（mobile device）</span>无关。`,`✓`,`✗ payload 不是 virus 的同义词。`,`✗`],
tip:`Payload = 弹头。`,ref:`Q&A Q2`},

{id:'1.21',p:1,s:'o',q:`What is the definition of hacking.`,
o:[`When you share your password with someone`,`Hacking is intentionally accessing a computer resource without authorization or in excess of authorization.`,`When you reset your password and don't encrypt it`,`None of the above`],a:1,
zh:`黑客<span class="zhen">（hacker）</span>行为（hacking）的定义是什么？`,
ex:`两个关键点：<b>intentionally</b>（故意）+ <b>without authorization or in excess of authorization</b>（未经授权<span class="zhen">（unauthorized）</span>，或超出授权范围）。“越权”也算：员工有权看 A 数据库<span class="zhen">（database）</span>却去看了 B 数据库<span class="zhen">（database）</span>，同样构成 hacking。`,
op:[`✗ 共享密码<span class="zhen">（shared password）</span>是坏习惯，但不是 hacking 的定义。`,`✓`,`✗ 无关。`,`✗`],
tip:`未授权<span class="zhen">（unauthorized）</span> or 越权，并且是故意的 → hacking。`,ref:`样题 Q1-7`},

{id:'1.22',p:1,s:'o',q:`What is spyware?`,
o:[`Spyware refers to a broad spectrum of Trojan horse programs that gather information about you and make it available to an attacker.`,`When you visit a suspicious website and are infected`,`When you browse a website, and you are infected with adware`,`None of the above`],a:0,
zh:`什么是间谍软件<span class="zhen">（spyware）</span>？`,
ex:`P1-40："Spyware is software that steals all your confidential data without your knowledge." 它通常以木马<span class="zhen">（Trojan horse）</span>方式潜入，<b>收集信息并交给攻击者<span class="zhen">（attacker）</span></b>。Q&A Q13 中 Eve 把间谍软件藏在 U 盘<span class="zhen">（USB drive）</span>里，就是“木马<span class="zhen">（Trojan horse）</span>方式投放的 spyware”。`,
op:[`✓ 收集信息并回传给攻击者<span class="zhen">（attacker）</span>。`,`✗ 描述的是感染途径，不是定义。`,`✗ adware 显示广告，不是 spyware。`,`✗`],
tip:`Spyware 偷信息，Adware 弹广告。`,ref:`P1-40；Q&A Q13`},

{id:'1.23',p:1,s:'o',q:`Why can cookies be dangerous?`,
o:[`Cookies can record too much sensitive information about you and could become spyware`,`Cookies can never be dangerous as it is now legally allowed on any web sites`,`Cookies were only dangerous in the past`,`None of the above`],a:0,
zh:`为什么 cookie 可能有危险？`,
ex:`HTTP 是无状态协议<span class="zhen">（stateless protocol）</span>，网站靠 cookie 记住你（P5-4）。Cookie 可能记录浏览习惯、登录状态甚至敏感信息；被第三方用来跨站追踪，或被窃取后冒用会话<span class="zhen">（session）</span>时，它的作用就<b>类似间谍软件<span class="zhen">（spyware）</span></b>。P5-53 也提到个人防火墙<span class="zhen">（personal firewall）</span>可以阻止 “certain cookies”。`,
op:[`✓`,`✗ 合法不等于安全。`,`✗ 现在依然有风险<span class="zhen">（risk）</span>。`,`✗`],
tip:`Cookie 记录多了就成了监视。`,ref:`P5-4、P5-53`},

{id:'1.24',p:1,s:'o',q:`What is social engineering?`,
o:[`Social Engineering means using social networks`,`Social engineering attacks take advantage of flawed human judgment by convincing the victim to take actions that are counter to security policies.`,`Social Engineering is technical term for reverse engineering in IT field`,`None of the above`],a:1,
zh:`什么是社会工程<span class="zhen">（social engineering）</span>？`,
ex:`P1-44："It is the art of manipulating people so that they end up giving their confidential information." P2-37：manipulates people into performing actions or divulging confidential information。核心是利用<b>人的判断缺陷</b>，诱使受害者做出违反安全策略<span class="zhen">（security policy）</span>的事。`,
op:[`✗ 社会工程<span class="zhen">（social engineering）</span> ≠ 使用社交网络<span class="zhen">（social network）</span>（虽然社交网络<span class="zhen">（social network）</span>常被利用）。`,`✓`,`✗ 与逆向工程无关。`,`✗`],
tip:`社会工程<span class="zhen">（social engineering）</span>攻击的是“人”，不是“机器”。P2-36：Distraction and Misdirection。`,ref:`P1-44、P2-36、P2-37`},

{id:'1.25',p:1,s:'o',q:`What is spam?`,
o:[`Spam is unsolicited commercial e-mail.`,`When your computer is infected with a ransomware`,`When your mailbox is full`,`None of the above`],a:0,
zh:`什么是垃圾邮件<span class="zhen">（spam）</span>？`,
ex:`Spam = <b>unsolicited</b>（未经请求的）+ <b>commercial</b>（商业性质的）e-mail。P1-41：黑客<span class="zhen">（hacker）</span>常用 botnet 发送垃圾邮件而不被追踪；P1-79 的 Spamhaus 就是专门过滤垃圾邮件的组织（过滤约 80% 的 spam）。`,
op:[`✓`,`✗ 那是勒索软件<span class="zhen">（ransomware）</span>感染。`,`✗ 邮箱满了不是 spam 的定义。`,`✗`],
tip:`Unsolicited 是关键词。`,ref:`P1-41、P1-79`},

{id:'1.26',p:1,s:'o',q:`What is phishing?`,
o:[`Phishing means when your computer has a virus`,`Phishing attack victims receive an email message that appears to come from a bank or another firm with which the victim does business`,`It is a technical term for Ransomware`,`A and C`],a:1,
zh:`什么是网络钓鱼<span class="zhen">（phishing）</span>？`,
ex:`P1-44：attacker impersonates to be a trusted contact and sends the victim fake mails（冒充<span class="zhen">（masquerading）</span>可信方发送假邮件）。受害者点链接或打开附件<span class="zhen">（attachment）</span>后，凭证<span class="zhen">（credentials）</span>被盗或被装上恶意软件<span class="zhen">（malware）</span>。P2-39：可能看起来像来自你的银行、PayPal、Google、Amazon，甚至你的 CEO。`,
op:[`✗ 中毒是结果之一，不是钓鱼<span class="zhen">（phishing）</span>的定义。`,`✓`,`✗ 勒索软件<span class="zhen">（ransomware）</span>是另一种恶意软件<span class="zhen">（malware）</span>。`,`✗`],
tip:`钓鱼<span class="zhen">（phishing）</span>家族：Spear（定向）、Whaling（高管）、Smishing（短信）、Vishing（电话）、Angler（社交媒体<span class="zhen">（social media）</span>）、Quishing（二维码<span class="zhen">（QR code）</span>）。`,ref:`P1-44～P1-48、P2-39`},

{id:'1.27',p:1,s:'o',q:`How can social engineering be used to get access to a sensitive file?`,
o:[`Simply by asking someone to send the file or to give access to the file by tricking the user`,`Using brute force attack to find password`,`Cracking password using social networks`,`None of the above`],a:0,
zh:`怎样用社会工程<span class="zhen">（social engineering）</span>拿到一份敏感文件？`,
ex:`社会工程<span class="zhen">（social engineering）</span>最简单也最有效的做法就是<b>骗人主动交出来</b>：冒充<span class="zhen">（masquerading）</span>上司、IT 管理员<span class="zhen">（administrator）</span>或合作方，直接“请”对方发送文件或开放权限<span class="zhen">（privileges）</span>。P2-37 的例子："This is John, the System Administrator. What is your password?"`,
op:[`✓ 直接骗。`,`✗ 暴力破解<span class="zhen">（brute force）</span>是技术攻击，不是社会工程<span class="zhen">（social engineering）</span>。`,`✗ 社会工程<span class="zhen">（social engineering）</span>的核心是“骗”，不是“破解”。`,`✗`],
tip:`社会工程<span class="zhen">（social engineering）</span> = 不用技术，直接骗。`,ref:`P2-37；Q&A Q16`},

/* ---------- 自编题（依据课件 sld1） ---------- */
{id:'1.c1',p:1,s:'c',q:`According to the lecture, which of the following is NOT one of the three Internet characteristics that aid cyber attacks?`,
o:[`Automation`,`Action at a distance`,`Electronic techniques easily transferable/duplicated`,`Strong end-to-end encryption`],a:3,
zh:`下列哪项不是互联网<span class="zhen">（Internet）</span>助长网络攻击<span class="zhen">（cyberattack）</span>的三大特征之一？`,
ex:`P1-37 的三特征是 Automation、Action at a Distance、Electronic techniques easily transferable/duplicated。端到端加密<span class="zhen">（end-to-end encryption）</span>是<b>防御</b>手段，不是助长攻击的特征。`,
op:[`✗ 是特征之一`,`✗ 是特征之一`,`✗ 是特征之一`,`✓ 不属于`],
tip:`问 NOT 的题，先把三个特征默写出来再排除。`,ref:`P1-37`},

{id:'1.c2',p:1,s:'c',q:`Which malware is a set of programs that allows someone to gain control over a system and hides the fact that the computer has been compromised?`,
o:[`Adware`,`Rootkit`,`Logic bomb`,`Spyware`],a:1,
zh:`哪种恶意软件<span class="zhen">（malware）</span>能让人获得系统控制权，并隐藏系统已被入侵<span class="zhen">（intrusion）</span>的事实？`,
ex:`P1-40："Rootkit is a set of programs that allows someone to gain control over systems and hides the fact that the computer has been compromised. Very difficult to detect as it masks behaviors of other malwares." 关键词：<b>控制 + 隐藏</b>。`,
op:[`✗ 弹广告。`,`✓ 隐身，还能掩护其他恶意软件<span class="zhen">（malware）</span>。`,`✗ 条件触发。`,`✗ 偷信息。`],
tip:`Root（最高权限<span class="zhen">（highest privileges）</span>）+ kit（工具包）→ 拿到 root 并隐藏自己。`,ref:`P1-40`},

{id:'1.c3',p:1,s:'c',q:`A whaling attack primarily targets:`,
o:[`Random home users`,`Senior executives and employees with high-level access`,`Only IT administrators`,`Children on social media`],a:1,
zh:`捕鲸攻击（whaling）主要针对谁？`,
ex:`P1-47：whaling 是精心设计的高级钓鱼<span class="zhen">（phishing）</span>，目标是公司里最关键的人：<b>高管、高层经理和高权限<span class="zhen">（privileges）</span>员工</b>。攻击者<span class="zhen">（attacker）</span>也常冒充<span class="zhen">（masquerading）</span>高管给下属发邮件，利用下属“不敢质疑上级”的心理。P1-48 案例：FACC 公司被冒充<span class="zhen">（masquerading）</span> CEO 骗走 4700 万美元。`,
op:[`✗ 那是普通钓鱼<span class="zhen">（phishing）</span>。`,`✓ “鲸鱼”就是大人物。`,`✗ 太窄。`,`✗`],
tip:`Phishing 撒网，Spear 定向，Whaling 抓大鱼。`,ref:`P1-47、P1-48`},

{id:'1.c4',p:1,s:'c',q:`Cyber criminals send text messages posing as a company or charity. This is called:`,
o:[`Vishing`,`Smishing`,`Angler phishing`,`Whaling`],a:1,
zh:`犯罪分子冒充<span class="zhen">（masquerading）</span>公司或慈善机构发送短信，这叫什么？`,
ex:`P1-48：<b>Smishing</b> = SMS + phishing（短信钓鱼）。P2-41 补充：犯罪分子知道人们回复短信比回复邮件更快。`,
op:[`✗ Vishing = Voice phishing（电话）。`,`✓ SMS 短信。`,`✗ Angler：通过社交媒体<span class="zhen">（social media）</span>。`,`✗ Whaling：针对高管。`],
tip:`S-mishing = SMS；V-ishing = Voice。`,ref:`P1-48、P2-41、P2-45`},

{id:'1.c5',p:1,s:'c',q:`A SYN flood attack exploits which mechanism?`,
o:[`DNS name resolution`,`The TCP three-way handshake`,`ICMP echo replies`,`HTTP GET requests`],a:1,
zh:`SYN 洪泛攻击<span class="zhen">（flood attack）</span>利用的是哪个机制？`,
ex:`P1-71～P1-73：TCP 建立连接要三次握手（SYN → SYN/ACK → ACK）。攻击者<span class="zhen">（attacker）</span>大量发送 SYN（常伪造<span class="zhen">（forgery）</span>源 IP），服务器<span class="zhen">（server）</span>回 SYN/ACK 后为每个请求<b>保留半开连接<span class="zhen">（half-open connection）</span></b>等待最后的 ACK，但 ACK 永远不来。端口<span class="zhen">（port）</span>和连接表耗尽后，服务器<span class="zhen">（server）</span>就无法服务正常用户。SYN flood 属于 <b>Protocol attack</b>。`,
op:[`✗ 那是 DNS flood。`,`✓`,`✗ 那是 Ping flood。`,`✗ 那是 HTTP flood（应用层<span class="zhen">（application layer）</span>）。`],
tip:`SYN flood：只握两次手，第三次永远不来。`,ref:`P1-71～P1-74`},

{id:'1.c6',p:1,s:'c',q:`Ping (ICMP) flood and UDP flood are popular examples of which DDoS category?`,
o:[`Volume based attacks`,`Protocol attacks`,`Application layer attacks`,`Insider attacks`],a:0,
zh:`Ping 洪泛<span class="zhen">（flood）</span>和 UDP 洪泛<span class="zhen">（flood）</span>属于哪一类 DDoS？`,
ex:`P1-62 把 DDoS 分三类：<br>• <b>Volume based</b>：用大流量<span class="zhen">（traffic）</span>塞满带宽<span class="zhen">（bandwidth）</span>，例如 Ping flood、UDP flood；<br>• <b>Protocol</b>：攻击网络层<span class="zhen">（network layer）</span>或协议机制，例如 Ping of Death、SYN flood；<br>• <b>Application layer</b>：打垮 Web 服务器<span class="zhen">（server）</span>，例如 HTTP GET/POST flood、DNS flood。`,
op:[`✓`,`✗ SYN flood、PoD 属于这一类。`,`✗ HTTP flood 属于这一类。`,`✗ 不是 DDoS 的分类。`],
tip:`量（Volume）→ 协议（Protocol）→ 应用（Application）。`,ref:`P1-62、P1-71、P1-75`},

{id:'1.c7',p:1,s:'c',q:`In a DoS attack using ICMP Echo Request packets of 500 bytes, how many packets per second are needed to flood a 10 Mbps link?`,
o:[`250`,`2,500`,`25,000`,`20,000`],a:1,
zh:`用 500 字节<span class="zhen">（byte）</span>的 ICMP 包攻击，塞满 10 Mbps 链路<span class="zhen">（link）</span>每秒需要多少个包？`,
ex:`公式：<code>pps = 链路速率(bit/s) ÷ (包大小 bytes × 8)</code><br>= 10,000,000 ÷ (500 × 8) = 10,000,000 ÷ 4,000 = <b>2,500 pps</b>（P1-68）。<br>注意 Mbps 是 bit，包大小<span class="zhen">（packet size）</span>是 byte，<b>一定要 ×8</b>。`,
op:[`✗ 少了一个数量级。`,`✓`,`✗ 那是 100 Mbps 的结果。`,`✗ 忘了 ×8 再算错。`],
tip:`链路<span class="zhen">（link）</span>越快，需要的包越多；包越大，需要的包越少。“计算题”页可以随机练。`,ref:`P1-68～P1-70`},

{id:'1.c8',p:1,s:'c',q:`A 6-digit numeric PIN is attacked by brute force at 500,000 tries per second. How long to test all combinations?`,
o:[`0.2 seconds`,`2 seconds`,`20 seconds`,`2,000 seconds`],a:1,
zh:`6 位纯数字 PIN，每秒尝试 50 万次，穷举全部组合要多久？`,
ex:`组合数<span class="zhen">（number of combinations）</span> = 字符集<span class="zhen">（character set）</span>大小<sup>长度</sup> = 10<sup>6</sup> = 1,000,000。<br>时间 = 组合数<span class="zhen">（number of combinations）</span> ÷ 速度 = 1,000,000 ÷ 500,000 = <b>2 秒</b>（P1-55）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`组合数<span class="zhen">（number of combinations）</span> = N^L；时间 = N^L ÷ 速度；年 = 秒 ÷ (365×24×3600)。`,ref:`P1-55～P1-57`},

{id:'1.c9',p:1,s:'c',q:`A hacker who exploits a security weakness in order to bring the weakness to the attention of the owners is a:`,
o:[`White hat`,`Black hat`,`Gray hat`,`Script kiddie`],a:2,
zh:`利用安全漏洞<span class="zhen">（security vulnerability）</span>，目的是让系统所有者注意到这个漏洞<span class="zhen">（vulnerability）</span>的黑客<span class="zhen">（hacker）</span>是哪一类？`,
ex:`P1-91：<br>• <b>White hat</b>：道德黑客<span class="zhen">（ethical hacker）</span>，帮忙清除病毒<span class="zhen">（virus）</span>、做渗透测试<span class="zhen">（penetration testing）</span>（受雇、有授权<span class="zhen">（authorization）</span>）；<br>• <b>Black hat</b>：偷钱、偷信用卡<span class="zhen">（credit card）</span>信息；<br>• <b>Gray hat</b>：未经授权<span class="zhen">（unauthorized）</span>就利用漏洞<span class="zhen">（vulnerability）</span>，但目的是提醒所有者；<br>• <b>Script kiddies</b>：hackers in training，只会用别人写好的工具。`,
op:[`✗ 白帽<span class="zhen">（white hat）</span>有授权<span class="zhen">（authorization）</span>。`,`✗ 黑帽<span class="zhen">（black hat）</span>图利。`,`✓ 灰帽<span class="zhen">（gray hat）</span>：手段越界，动机偏善。`,`✗`],
tip:`有授权<span class="zhen">（authorization）</span> = 白；没授权<span class="zhen">（authorization）</span>但为提醒 = 灰；为私利 = 黑。`,ref:`P1-91`},

{id:'1.c10',p:1,s:'c',q:`In which attack does the attacker hijack the session between a client and a host, so that communication passes through the attacker?`,
o:[`SQL injection`,`Man-in-the-Middle (eavesdropping) attack`,`Cryptojacking`,`Logic bomb`],a:1,
zh:`哪种攻击会劫持客户端<span class="zhen">（client）</span>与主机之间的会话<span class="zhen">（session）</span>，让通信经过攻击者<span class="zhen">（attacker）</span>？`,
ex:`P1-60：MITM，also known as an <b>eavesdropping attack</b>，攻击者<span class="zhen">（attacker）</span>插入双方通信中间并劫持会话<span class="zhen">（session）</span>。预防方法：留意网站是否安全（HTTPS、证书<span class="zhen">（certificate）</span>）、在设备上使用加密<span class="zhen">（encryption）</span>、避免使用公共 Wi-Fi<span class="zhen">（public Wi-Fi）</span>（参考 Q&A Q17 蹭邻居 Wi-Fi 的风险<span class="zhen">（risk）</span>）。`,
op:[`✗`,`✓`,`✗ 偷算力<span class="zhen">（computing power）</span>挖矿<span class="zhen">（mining）</span>。`,`✗`],
tip:`MITM 的对策：加密<span class="zhen">（encryption）</span> + 验证证书<span class="zhen">（certificate）</span>。`,ref:`P1-60、P5-28；Q&A Q17`},

{id:'1.c11',p:1,s:'c',q:`According to the lecture, which measure helps prevent SQL injection attacks?`,
o:[`Using larger RSA keys`,`Validating user-supplied input`,`Disabling ICMP on routers`,`Using a longer Wi-Fi password`],a:1,
zh:`按课件，哪项措施有助于防止 SQL 注入<span class="zhen">（SQL injection）</span>？`,
ex:`P1-61：SQL 注入<span class="zhen">（SQL injection）</span>是往网站的输入框里注入<span class="zhen">（injection）</span>恶意 SQL，让服务器<span class="zhen">（server）</span>泄露<span class="zhen">（leak）</span>、修改或删除数据库<span class="zhen">（database）</span>表，甚至拿到管理员权限<span class="zhen">（administrator privileges）</span>。预防：① 使用 IDS；② <b>validation of the user-supplied data</b>（校验用户输入<span class="zhen">（validation of user-supplied data）</span>）。`,
op:[`✗ 无关。`,`✓`,`✗ 那是防 Ping flood。`,`✗ 无关。`],
tip:`注入<span class="zhen">（injection）</span>类攻击的根源是“信任了用户输入”。`,ref:`P1-61`},

{id:'1.c12',p:1,s:'c',q:`The 2016 DDoS attack on DNS provider Dyn used which malware to build a botnet out of compromised IoT devices?`,
o:[`Memcached`,`Mirai`,`WannaCry`,`Stuxnet`],a:1,
zh:`2016 年针对 DNS 服务商 Dyn 的 DDoS，用哪个恶意软件<span class="zhen">（malware）</span>把物联网<span class="zhen">（Internet of Things (IoT)）</span>设备变成僵尸网络<span class="zhen">（botnet）</span>？`,
ex:`P1-78：<b>Mirai</b> 把摄像头、智能电视、打印机、婴儿监视器等 IoT 设备变成 botnet，导致 Netflix、PayPal、GitHub 等大网站瘫痪。对比 P1-77：2018 年 GitHub 遭受的 1.3 Tbps 攻击利用的是 <b>Memcached 放大</b>（约 5 万倍），没有用 botnet。`,
op:[`✗ Memcached 是 GitHub 那次（放大攻击<span class="zhen">（amplification attack）</span>）。`,`✓`,`✗ WannaCry 是 2017 年的勒索软件<span class="zhen">（ransomware）</span>。`,`✗`],
tip:`Mirai = IoT 僵尸网络<span class="zhen">（botnet）</span>；这也是 P2 说 IoT 不安全的典型例子。`,ref:`P1-77、P1-78、P1-80`},

{id:'1.c13',p:1,s:'c',q:`"Cryptojacking" takes place when attackers:`,
o:[`Steal cryptocurrency from exchange wallets`,`Access someone else's computer to mine cryptocurrency`,`Encrypt files and demand Bitcoin ransom`,`Forge digital certificates`],a:1,
zh:`“加密劫持<span class="zhen">（cryptojacking）</span>”指攻击者<span class="zhen">（attacker）</span>做什么？`,
ex:`P1-89：攻击者<span class="zhen">（attacker）</span>通过感染网站或诱骗点击，<b>偷用别人电脑的算力<span class="zhen">（computing power）</span>挖矿<span class="zhen">（mining）</span></b>。受害者往往毫无察觉，唯一的迹象是电脑变慢。预防：更新软件、员工培训<span class="zhen">（employee training）</span>、安装广告拦截器<span class="zhen">（ad blocker）</span>（广告是挖矿脚本<span class="zhen">（cryptomining script）</span>的主要来源）、使用 MinerBlock 等扩展。`,
op:[`✗ 那是盗币。`,`✓`,`✗ 那是勒索软件<span class="zhen">（ransomware）</span>。`,`✗`],
tip:`Cryptojacking 偷的是“算力<span class="zhen">（computing power）</span>”，不是“币”。`,ref:`P1-89`},

{id:'1.c14',p:1,s:'c',q:`Which statement about a botnet is correct?`,
o:[`It is a single virus that infects only one computer`,`It is a network of compromised computers (zombies) controlled by a master and used to launch attacks such as DoS`,`It is a firewall architecture`,`It is a type of digital certificate`],a:1,
zh:`关于僵尸网络<span class="zhen">（botnet）</span>哪项正确？`,
ex:`P1-40/41：Botnet 是一群被植入恶意代码<span class="zhen">（malicious code）</span>的“僵尸<span class="zhen">（zombie）</span>”电脑（bots），由一个主控者<span class="zhen">（master）</span>指挥。可用来发起 DoS、破解密码<span class="zhen">（password cracking）</span>、发垃圾邮件<span class="zhen">（spam）</span>，而且不容易被追踪。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`Bot + Net：一群被控制的机器。`,ref:`P1-40、P1-41`}
]);

/* Part 2 · Industry 4.0/5.0, Education, Awareness & Compliance (sld2) */
window.MCQ = (window.MCQ || []).concat([
{id:'2.01',p:2,s:'o',q:`The term industry 4 or i4.0 originated in __________ .`,
o:[`USA`,`China and Singapore`,`Both a and b`,`None of the above`],a:3,
zh:`“工业 4.0<span class="zhen">（Industry 4.0）</span>”一词起源于哪里？`,
ex:`答案是<b>德国</b>，不在选项里，所以选 D。P2-3："It was officially first used in late 2015 and early 2016 in <b>Germany</b> by Klaus Schwab, Founder and Executive Chairman of the World Economic Forum (WEF)." （“Industrie 4.0” 本身是德国政府的高科技战略。）`,
op:[`✗`,`✗`,`✗`,`✓ 正确答案是德国，选项里没有。`],
tip:`工业 4.0<span class="zhen">（Industry 4.0）</span> → 德国 → 选 None of the above。`,ref:`P2-3`},

{id:'2.02',p:2,s:'o',q:`i4.0 encompasses a wide range of advanced technologies, such as:`,
o:[`Digital twins and artificial intelligence`,`High-speed wireless/wired networks`,`Cloud computing and virtualization`,`All of the above`],a:3,
zh:`工业 4.0<span class="zhen">（Industry 4.0）</span> 涵盖哪些先进技术？`,
ex:`P2-3 原文："i4.0 encompasses a wide range of advanced technologies, such as digital twins, artificial intelligence, high-speed wireless/wired networks, cloud computing and virtualization"，目标是打造 smart products、smart processes、smart factories、smart nations。`,
op:[`部分`,`部分`,`部分`,`✓ 原文全部列出`],
tip:`驱动力：IoT/IIoT、Cloud、AI & Big Data、Digital Twins、Virtualization、CPS。`,ref:`P2-3、P2-5`},

{id:'2.03',p:2,s:'o',q:`IoT are driving force for industry 4.0, however __________ .`,
o:[`Currently they are only being used in smart homes`,`They are vulnerable to cyber security attacks`,`They will only be popular in 2030, which might be too late`,`None of the above`],a:1,
zh:`IoT 是工业 4.0<span class="zhen">（Industry 4.0）</span> 的驱动力，但是……？`,
ex:`P2-6："Over 2 Million IoT Devices Vulnerable to Complete Takeover." P1-78 的 Mirai 就是把 IoT 设备变成 botnet。IoT 数量巨大（2024 年约 180 亿台、2030 年约 321 亿台），又普遍缺乏安全设计，所以<b>很容易被攻击</b>。`,
op:[`✗ IIoT 已广泛用于工业。`,`✓`,`✗ 现在就很流行。`,`✗`],
tip:`IoT 的问题是“多”且“弱”。`,ref:`P2-6、P1-78`},

{id:'2.04',p:2,s:'o',q:`Choose the correct statement about Digital Twins.`,
o:[`It is a virtual representation or digital replica (copy) of assets, people, processes, systems, devices, and places`,`Companies utilize digital twin technology to develop virtual prototypes of new products and get insights`,`Both a and b`,`None of the above`],a:2,
zh:`关于数字孪生<span class="zhen">（digital twin）</span>，哪项正确？`,
ex:`P2-18 原文两句都有：① 数字孪生<span class="zhen">（digital twin）</span>是资产<span class="zhen">（asset）</span>、人、流程、系统、设备和场所的<b>虚拟复制品<span class="zhen">（virtual replica）</span></b>；② 企业用它开发新产品的<b>虚拟原型<span class="zhen">（virtual prototype）</span></b>并获得洞见。它集成了 IoT、软件分析、AI 等技术。安全隐患：同样的洞察和控制能力也可能为攻击者<span class="zhen">（attacker）</span>打开大门。`,
op:[`部分`,`部分`,`✓ 两句都是原文`,`✗`],
tip:`Digital twin = 物理世界的数字镜像。`,ref:`P2-18`},

{id:'2.05',p:2,s:'o',q:`The concept of Industry 4.0 depends upon connectivity, however, this interconnectivity creates cyber security holes.`,
o:[`True`,`False`],a:0,
zh:`工业 4.0<span class="zhen">（Industry 4.0）</span> 依赖互联，但这种互联会制造安全漏洞<span class="zhen">（security vulnerability）</span>。`,
ex:`对。P2-26："This interconnectivity creates security holes throughout the system... from a security perspective it cannot be determined where the data is coming from or where it's going." 所以 <b>data visibility（数据可见性）是智能制造<span class="zhen">（smart manufacturing）</span>车间最大的安全挑战</b>。`,
tip:`互联 → 漏洞<span class="zhen">（vulnerability）</span> → 数据可见性是最大挑战。`,ref:`P2-26`},

{id:'2.06',p:2,s:'o',q:`Cloud computing is one of the driving forces for industry 4.0 however using DDoS attack, its availability can be compromised. The other attacks can result in __________ of the stored data.`,
o:[`Confidentiality`,`Integrity`,`Both a and b`,`None of the above`],a:2,
zh:`云计算<span class="zhen">（cloud computing）</span>可被 DDoS 破坏可用性<span class="zhen">（availability）</span>；其他攻击则会破坏存储数据的什么？`,
ex:`P2-8："The most common attack goes against its <b>availability</b>, by means of a Denial of service (DoS) attacks and the <b>confidentiality and integrity</b> of the stored data." DDoS 打 A，其他攻击打 C 和 I，正好覆盖整个 CIA。`,
op:[`部分`,`部分`,`✓`,`✗`],
tip:`云的威胁<span class="zhen">（threat）</span>覆盖整个 CIA。`,ref:`P2-8`},

{id:'2.07',p:2,s:'o',q:`The main reason for cyber security compromises is employee behavior which can be__________.`,
o:[`Malicious`,`Unintentional`,`Both a and b`,`None of the above`],a:2,
zh:`安全事故<span class="zhen">（security breach）</span>的主要原因是员工行为<span class="zhen">（employee behaviour）</span>，这种行为可能是……？`,
ex:`P2-31："Research show that employee actions, <b>both malicious and unintentional</b>, cause considerable computer-related loss and security compromises."`,
op:[`部分`,`部分`,`✓ 原文 both`,`✗`],
tip:`人是最弱的一环：既有坏人，也有粗心的人。`,ref:`P2-31`},

{id:'2.08',p:2,s:'o',q:`The principal problems associated with employee behavior in cyber security includes __________.`,
o:[`Errors and omissions`,`Fraud`,`Actions by disgruntled employees`,`All of the above`],a:3,
zh:`与员工行为<span class="zhen">（employee behaviour）</span>相关的主要安全问题有哪些？`,
ex:`P2-31 三大问题：① <b>Errors and omissions</b>（错误和疏忽，非故意）；② <b>Fraud</b>（欺诈）；③ <b>Actions by disgruntled employees</b>（心怀不满员工的行为）。`,
op:[`部分`,`部分`,`部分`,`✓`],
tip:`三个问题：失误、欺诈<span class="zhen">（fraud）</span>、心怀不满。`,ref:`P2-31`},

{id:'2.09',p:2,s:'o',q:`Choose the correct statement about cyber security awareness, training and education.`,
o:[`Can serve as a deterrent to fraud and actions by disgruntled employees, by increasing employee's knowledge of their accountability and of potential penalties`,`Employees cannot be asked to attend cyber security awareness program as this will make them liable`,`Both a and b`,`None of the above`],a:0,
zh:`关于安全意识<span class="zhen">（security awareness）</span>、培训和教育<span class="zhen">（training and education）</span>，哪项正确？`,
ex:`P2-32 原文：这类项目通过让员工了解<b>自己的责任和可能的处罚</b>来威慑<span class="zhen">（deterrence）</span>欺诈<span class="zhen">（fraud）</span>和报复行为。同页还说：员工不可能遵守自己不知道的策略<span class="zhen">（policy）</span>；员工如果被抓时能声称“不知道”，执法会更难；培训还能<b>限制组织的法律责任<span class="zhen">（legal liability）</span></b>（证明已尽 due care）。`,
op:[`✓ 原文`,`✗ 逻辑反了：培训限制的是组织的责任，不是“让员工担责所以不能要求参加”。`,`✗`,`✗`],
tip:`培训的三个作用：威慑<span class="zhen">（deterrence）</span>、消除“我不知道”的借口、限制组织责任。`,ref:`P2-32`},

{id:'2.10',p:2,s:'o',q:`Cyber security awareness policy should include.`,
o:[`Participation is required for every employee`,`Everyone will be given sufficient time to participate`,`Both a and b`,`None of the above`],a:2,
zh:`安全意识政策<span class="zhen">（security awareness policy）</span>应包括什么？`,
ex:`P2-33：安全意识政策<span class="zhen">（security awareness policy）</span>文件应确立<b>三件事</b>：<br>1. 每位员工都必须参加意识项目<span class="zhen">（awareness program）</span>（包括新员工入职培训和定期活动）；<br>2. 每个人都有足够的时间参加；<br>3. 明确由谁负责管理和开展意识活动。<br>A 和 B 分别是第 1、2 条。`,
op:[`部分`,`部分`,`✓`,`✗`],
tip:`三件事：人人参加、给足时间、责任到人。`,ref:`P2-33`},

{id:'2.11',p:2,s:'o',q:`Cyber security training teaches what people should do and how they should do it.`,
o:[`True`,`False`],a:0,
zh:`安全培训<span class="zhen">（security training）</span>教的是人们应该做什么、怎么做。`,
ex:`对。P2-34 原文："Training teaches <b>what people should do and how they should do it</b>." 对比：Awareness（意识）让人知道安全的重要性和自己的责任；Training（培训）教<b>技能</b>；Education 是更深层的理解。培训内容按角色区分：普通用户、开发人员、管理层、高管各不相同。`,
tip:`Awareness = 知道；Training = 会做。`,ref:`P2-33、P2-34`},

{id:'2.12',p:2,s:'o',q:`Choose the correct social engineering examples.`,
o:[`Phone Call: This is John, the System Administrator. What is your password?`,`Email: ABC Bank has noticed a problem with your account, click on the link below and provide the password to resolve it`,`Both a and b`,`None of the above`],a:2,
zh:`以下哪些是社会工程<span class="zhen">（social engineering）</span>的例子？`,
ex:`两个都是 P2-37 的原图例子：A 是冒充<span class="zhen">（masquerading）</span>管理员<span class="zhen">（administrator）</span>打<b>电话</b>（vishing/pretexting），B 是冒充<span class="zhen">（masquerading）</span>银行发<b>邮件</b>（phishing）。P2-37 还有 In Person 的例子："I have come to repair your machine..."`,
op:[`部分`,`部分`,`✓`,`✗`],
tip:`真正的管理员<span class="zhen">（administrator）</span><b>永远不会</b>问你密码<span class="zhen">（password）</span>。`,ref:`P2-37`},

{id:'2.13',p:2,s:'o',q:`Spear phishing scam is when they target you specifically. They have researched you, they know your family members, where you work, and who is your boss. The chances of fooling you are higher.`,
o:[`True`,`False`],a:0,
zh:`鱼叉式钓鱼<span class="zhen">（spear phishing）</span>专门针对你：研究过你，了解你的家人、单位和老板，所以骗到你的几率更高。`,
ex:`对，这是 P2-40 原文。鱼叉式钓鱼<span class="zhen">（spear phishing）</span>是定向攻击，事先做足功课。P1-48：CISCO 2021 报告称多达 90% 的攻击是钓鱼，其中 65% 是 spear phishing。`,
tip:`越了解你，越容易骗到你。`,ref:`P2-40、P1-46、P1-48`},

{id:'2.14',p:2,s:'o',q:`Some of the top search results in Google are phishing links.`,
o:[`True`,`False`],a:0,
zh:`Google 搜索结果的靠前位置里，有些是钓鱼链接<span class="zhen">（phishing link）</span>。`,
ex:`对。P2-42：骗子也会做 SEO（搜索引擎优化），把诈骗<span class="zhen">（fraud）</span>网站刷到搜索结果前列。识别方法：标题显示正确品牌名，但 URL 对不上（例如标题写 Venmo，网址却是 sites.google.com）。`,
tip:`排名靠前不等于可信，要看 URL。`,ref:`P2-42`},

{id:'2.15',p:2,s:'o',q:`Social media is full of fake accounts and scammers make it look like it is your real friend.`,
o:[`True`,`False`],a:0,
zh:`社交媒体<span class="zhen">（social media）</span>上充斥着假账号，骗子会把它伪装成你的真朋友。`,
ex:`对。P2-43：可能是和你真实朋友同名、同头像的假账号，之后用来骗你。Q&A Q16 也提到：午休时收到一条看似朋友发来的 Facebook 消息，很难忍住不点。`,
tip:`头像和名字都能复制，要私下核实。`,ref:`P2-43；Q&A Q16`},

{id:'2.16',p:2,s:'o',q:`In vishing attack, which is made over the telephone, scammers can spoof a phone number that looks identical to a known number, like your bank.`,
o:[`True`,`False`],a:0,
zh:`电话钓鱼<span class="zhen">（vishing）</span>中，骗子能伪造<span class="zhen">（forgery）</span>一个和已知号码（如你的银行）一模一样的来电号码。`,
ex:`对。P2-45：Vishing（voice phishing）通过电话进行，"Scammers can spoof a phone number that looks identical to a known number, like your bank." 来电显示是可以伪造<span class="zhen">（forgery）</span>的。`,
tip:`来电显示可伪造<span class="zhen">（forgery）</span>。挂断后用官方号码回拨核实（P2-46：Call and verify!）。`,ref:`P2-45、P2-46`},

{id:'2.17',p:2,s:'o',q:`Choose the correct statement about cyber security compliance.`,
o:[`It means following standards and regulatory requirements set by some agency, law or authority group.`,`It means make cyber security challenging both for attackers and users`,`Both a and b`,`None of the above`],a:0,
zh:`关于网络安全合规<span class="zhen">（cybersecurity compliance）</span>，哪项正确？`,
ex:`P2-51："Cybersecurity compliance is the practice of adhering to laws, regulations, and standards designed to protect data, systems, and networks." 合规<span class="zhen">（compliance）</span>就是遵守外部（法律、监管机构<span class="zhen">（regulator）</span>、标准组织）设定的要求，例如 GDPR、PCI DSS、HIPAA（P3-4）。`,
op:[`✓`,`✗ 合规<span class="zhen">（compliance）</span>不是让用户也觉得难。`,`✗`,`✗`],
tip:`Compliance = 守规矩（法律 + 法规 + 标准）。`,ref:`P2-51、P3-4`},

{id:'2.18',p:2,s:'o',q:`Some benefits of Cybersecurity Compliance include:`,
o:[`Helps identify, interpret and prepare for potential data breaches`,`Improves an organization's security position`,`Builds customer confidence and loyalty`,`All of the above`],a:3,
zh:`网络安全合规<span class="zhen">（cybersecurity compliance）</span>的好处有哪些？`,
ex:`P2-52 列出：保护声誉、维持客户信任、<b>建立客户信心和忠诚度</b>、<b>帮助识别、解读并防范潜在数据泄露<span class="zhen">（data breach）</span></b>、<b>改善组织安全态势<span class="zhen">（organizational security posture）</span></b>，还能保护知识产权<span class="zhen">（intellectual property）</span>，带来竞争优势。`,
op:[`部分`,`部分`,`部分`,`✓`],
tip:`合规<span class="zhen">（compliance）</span>好处：声誉、信任、防泄露<span class="zhen">（leak）</span>、安全态势<span class="zhen">（security posture）</span>、保护知识产权<span class="zhen">（intellectual property）</span>。`,ref:`P2-52`},

{id:'2.19',p:2,s:'o',q:`Forming a compliance team is necessary when implementing a thorough compliance program.`,
o:[`True`,`False`],a:0,
zh:`实施完整的合规项目<span class="zhen">（compliance program）</span>时，有必要组建合规团队<span class="zhen">（compliance team）</span>。`,
ex:`对。P2-53：启动合规项目<span class="zhen">（compliance program）</span>的五步中，第 1 步就是 <b>Creating a Compliance Team</b>（"Forming a compliance team is necessary when implementing a thorough compliance program"）。五步依次是：组建团队 → 风险分析<span class="zhen">（risk analysis）</span> → 设置控制 → 制定政策<span class="zhen">（policy）</span> → 监控与快速响应<span class="zhen">（rapid response）</span>。`,
tip:`合规<span class="zhen">（compliance）</span>五步：Team → Risk Analysis → Controls → Policies → Monitor & Respond。`,ref:`P2-53～P2-55`},

{id:'2.20',p:2,s:'o',q:`Cyber security controls can be technical controls (passwords), or physical (camera and fences).`,
o:[`True`,`False`],a:0,
zh:`安全控制<span class="zhen">（security control）</span>既可以是技术控制<span class="zhen">（technical control）</span>（如密码<span class="zhen">（password）</span>），也可以是物理控制<span class="zhen">（physical control）</span>（如摄像头和围栏）。`,
ex:`对。P2-54："The controls can be technical controls, such as passwords and access control lists, or physical controls such as surveillance camera and fences." 课件列出的控制还包括：加密<span class="zhen">（encryption）</span>、防火墙<span class="zhen">（firewall）</span>、密码策略<span class="zhen">（password policy）</span>、网络保险<span class="zhen">（cyber insurance）</span>、员工培训<span class="zhen">（employee training）</span>、事件响应计划<span class="zhen">（incident response plan）</span>、访问控制<span class="zhen">（access control）</span>、补丁管理计划<span class="zhen">（patch management plan）</span>。`,
tip:`控制分为技术控制<span class="zhen">（technical control）</span>和物理控制<span class="zhen">（physical control）</span>（还有管理控制<span class="zhen">（administrative control）</span>，即策略<span class="zhen">（policy）</span>和培训）。`,ref:`P2-54`},

/* ---------- 自编题（依据课件 sld2） ---------- */
{id:'2.c1',p:2,s:'c',q:`Which industrial revolution used computers, automation and electronics?`,
o:[`Industry 1.0`,`Industry 2.0`,`Industry 3.0`,`Industry 4.0`],a:2,
zh:`哪一次工业革命<span class="zhen">（industrial revolution）</span>使用了计算机、自动化<span class="zhen">（automation）</span>和电子技术？`,
ex:`P2-3：<br>• 1.0：机械化和蒸汽；<br>• 2.0：电力、大规模生产、流水线；<br>• <b>3.0：计算机、自动化<span class="zhen">（automation）</span>、电子</b>；<br>• 4.0：数字孪生<span class="zhen">（digital twin）</span>、AI、高速网络、云、虚拟化<span class="zhen">（virtualization）</span>，走向智能化；<br>• 5.0：人与 AI 机器人协作，解决社会挑战。`,
op:[`✗ 蒸汽`,`✗ 电力`,`✓`,`✗ 智能化`],
tip:`蒸汽 → 电力 → 计算机 → 智能 → 人机协作<span class="zhen">（human-machine collaboration）</span>。`,ref:`P2-3`},

{id:'2.c2',p:2,s:'c',q:`What is the main focus of Industry 5.0 according to the lecture?`,
o:[`Steam power and mechanization`,`Connecting people with advanced technology and AI-powered robots working together to solve societal challenges`,`Replacing all human workers with robots`,`Mass production with assembly lines`],a:1,
zh:`按课件，工业 5.0 的重点是什么？`,
ex:`P2-3："The fifth revolution is about connecting people with advanced technology and A.I.-powered robots with a focus on <b>man and machines working together</b> in providing solutions to challenges for society."`,
op:[`✗ 1.0`,`✓`,`✗ 是协作，不是取代。`,`✗ 2.0`],
tip:`5.0 = 以人为本 + 人机协作<span class="zhen">（human-machine collaboration）</span>。`,ref:`P2-3`},

{id:'2.c3',p:2,s:'c',q:`According to the lecture, what is the biggest cybersecurity challenge for smart manufacturing on the factory floor?`,
o:[`Data visibility`,`Electricity cost`,`Lack of robots`,`Slow assembly lines`],a:0,
zh:`按课件，智能制造<span class="zhen">（smart manufacturing）</span>车间最大的网络安全<span class="zhen">（cyber security）</span>挑战是什么？`,
ex:`P2-26：互联制造了安全漏洞<span class="zhen">（security vulnerability）</span>，从安全角度<b>无法判断数据从哪里来、到哪里去</b>。"Hence, <b>data visibility</b> is the biggest cybersecurity challenge for smart manufacturing on the factory floor."`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`看不见数据流，就无法保护它。`,ref:`P2-26`},

{id:'2.c4',p:2,s:'c',q:`A hospital rates a system: Threat likelihood = 4, Vulnerability level = 3, Asset value = 5 (each on a 1–5 scale). Using Risk = Threat × Vulnerability × Asset Value, what is the risk score?`,
o:[`12`,`35`,`60`,`125`],a:2,
zh:`医院给某系统打分：威胁<span class="zhen">（threat）</span> 4、脆弱性<span class="zhen">（vulnerability）</span> 3、资产价值<span class="zhen">（asset value）</span> 5（每项 1～5）。风险分<span class="zhen">（risk score）</span>是多少？`,
ex:`Risk = T × V × A = 4 × 3 × 5 = <b>60</b>。最大值是 5×5×5 = 125，60/125 = 48%，课件判为 <b>medium</b>（中等）风险（P2-57）。`,
op:[`✗ 4+3+5 加错了`,`✗`,`✓`,`✗ 那是满分`],
tip:`三项相乘；百分比 = 分数 ÷ 125。`,ref:`P2-57`},

{id:'2.c5',p:2,s:'c',q:`Password policy: minimum 12 characters, must include 1 uppercase, 1 lowercase, 1 number and 1 symbol. Does "MyPassword123" comply?`,
o:[`Yes, it complies`,`No, it is too short`,`No, it has no special symbol`,`No, it has no uppercase letter`],a:2,
zh:`密码策略<span class="zhen">（password policy）</span>：至少 12 位，必须包含大写、小写、数字、符号各 1 个。“MyPassword123”合规<span class="zhen">（compliance）</span>吗？`,
ex:`逐项检查（P2-58）：长度 13 ✓；大写 M、P ✓；小写 y、a、s… ✓；数字 123 ✓；<b>特殊符号 ✗</b>。结论：Non-compliant（不合规）。`,
op:[`✗`,`✗ 13 ≥ 12`,`✓`,`✗ 有 M 和 P`],
tip:`逐条对照策略<span class="zhen">（policy）</span>检查，别漏掉任何一项。“计算题”页有合规<span class="zhen">（compliance）</span>检查器可以练。`,ref:`P2-58`},

{id:'2.c6',p:2,s:'c',q:`In the security training spectrum, what is the training focus for the executive level?`,
o:[`Good computer security practices`,`Developing a security mindset in the developer`,`How to make tradeoffs involving security risks, costs, benefits`,`Risk management goals, measurement, leadership`],a:3,
zh:`安全培训<span class="zhen">（security training）</span>按角色区分，高管层的培训重点是什么？`,
ex:`P2-34 培训按角色分层：<br>• General users：good computer security practices；<br>• Programmers/developers：security mindset；<br>• Management-level：如何在风险<span class="zhen">（risk）</span>、成本、收益之间做权衡；<br>• <b>Executive-level：风险管理<span class="zhen">（risk management）</span>目标、度量、领导力</b>。`,
op:[`✗ 普通用户`,`✗ 开发者`,`✗ 中层管理`,`✓ 高管`],
tip:`职位越高，越关注“目标与领导”。`,ref:`P2-34`},

{id:'2.c7',p:2,s:'c',q:`In the compliance risk analysis process (Identify, Assess, Analyze, Set Tolerance), "Set Tolerance" means deciding to:`,
o:[`Buy new firewalls`,`Mitigate, transfer, refute or accept the determined risks`,`Fire the IT team`,`Encrypt all data`],a:1,
zh:`合规风险分析<span class="zhen">（compliance risk analysis）</span>中的 “Set Tolerance” 是指决定什么？`,
ex:`P2-53 风险分析<span class="zhen">（risk analysis）</span>四步：<br>1. <b>Identify</b>：识别所有接触数据的系统、资产<span class="zhen">（asset）</span>、网络；<br>2. <b>Assess</b>：评估每类数据的风险<span class="zhen">（risk）</span>等级；<br>3. <b>Analyze</b>：风险<span class="zhen">（risk）</span> = 泄露<span class="zhen">（leak）</span>可能性<span class="zhen">（likelihood）</span> × 影响/成本；<br>4. <b>Set Tolerance</b>：决定对风险<span class="zhen">（risk）</span>采取 <b>mitigate（缓解）/ transfer（转移，如买保险）/ refute（驳回）/ accept（接受）</b>。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`风险处理<span class="zhen">（risk treatment）</span>四选一：减、转、驳、受。`,ref:`P2-53`},

{id:'2.c8',p:2,s:'c',q:`Which of the following is NOT an example of a Cyber-Physical System (CPS) given in the lecture?`,
o:[`Smart grid`,`Autonomous automobile systems`,`Automatic pilot avionics`,`A word processor`],a:3,
zh:`下列哪项不是课件中的信息物理系统（CPS）例子？`,
ex:`P2-22：CPS 是计算能力与物理能力集成的“智能”系统，例子有 smart grid、autonomous automobile systems、medical monitoring、robotics systems、automatic pilot avionics。文字处理软件只是纯软件，不与物理世界交互。`,
op:[`✗ 是 CPS`,`✗ 是 CPS`,`✗ 是 CPS`,`✓ 纯软件`],
tip:`CPS = 计算 + 物理 + 交互。`,ref:`P2-22`},

{id:'2.c9',p:2,s:'c',q:`According to the lecture, the manufacturing industry is the ______ most targeted industry for cybercrime.`,
o:[`first`,`second`,`third`,`tenth`],a:2,
zh:`按课件，制造业是网络犯罪<span class="zhen">（cybercrime）</span>第几大攻击目标？`,
ex:`P2-23："The manufacturing industry is the <b>third</b> most targeted industry for cybercrime, just behind the finance and government sectors."`,
op:[`✗`,`✗`,`✓ 仅次于金融和政府`,`✗`],
tip:`金融 > 政府 > 制造。`,ref:`P2-23`}
]);

/* Part 3 · Planning, Policies & Biometrics (sld3) */
window.MCQ = (window.MCQ || []).concat([
{id:'3.01',p:3,s:'o',q:`In developing a cyber security plan, what should a company/organization do first (particularly when they are in the initial planning stages)?`,
o:[`It should buy state of the art technology`,`It must first assess the current state of its security`,`Both a and b`,`None of the above`],a:1,
zh:`制定网络安全<span class="zhen">（cyber security）</span>计划时，组织首先应该做什么（尤其在初始规划阶段）？`,
ex:`先摸清现状，再谈采购。P3-3："A cyber security plan will help organizations <b>understand the current IT environment</b>, allowing them to make the necessary amendments." Q&A Q19："First step in cyber security planning: Identification — identify what the organization needs to protect and against what attacks"，然后是理解脆弱性<span class="zhen">（vulnerability）</span>。`,
op:[`✗ 不评估就买设备，钱可能花错地方。`,`✓`,`✗ 不能同时做，要先评估。`,`✗`],
tip:`规划第一步：评估、识别，而不是买东西。`,ref:`P3-3；Q&A Q19`},

{id:'3.02',p:3,s:'o',q:`Is top management support important in the success of cyber security project, when the project is being planned, implemented and executed?`,
o:[`Yes, only at the initial stage`,`Yes, throughout the project stages`,`No`,`None of the above`],a:1,
zh:`高层支持<span class="zhen">（senior management support）</span>对安全项目成功重要吗（规划、实施、执行各阶段）？`,
ex:`<b>全程</b>都重要。P3-10 Top-down approach 的优势：strong upper management support、dedicated funding、clear planning。P3-13 DLM 四层防御<span class="zhen">（four-tier defense）</span>的 <b>Tier 1</b> 就是 Senior management commitment and support。Q&A Q18 也说需要 senior management support。`,
op:[`✗ 只在开头支持，项目会半途而废（bottom-up 缺的正是 staying power）。`,`✓`,`✗`,`✗`],
tip:`安全是管理问题，不只是技术问题（Q&A Q18："A management issue. A people issue."）。`,ref:`P3-10、P3-13；Q&A Q18`},

{id:'3.03',p:3,s:'o',q:`What must top management do to demonstrate support for cyber security project?`,
o:[`Must ensure an adequate budget and follows security procedures themselves`,`Send email to all staff and inform them that they are supporting the project`,`Management cannot do anything as it is managed by technical staff`,`None of the above`],a:0,
zh:`高层要怎样证明自己支持安全项目？`,
ex:`支持要落到实处：<b>给钱 + 以身作则</b>。Q&A Q20："Employees and staff cannot be expected to change their behavior if they do not observe respect for security by their superiors." 领导自己不守规矩，员工也不会守。`,
op:[`✓ 预算和以身作则。`,`✗ 发邮件只是口头支持。`,`✗ 高层必须参与。`,`✗`],
tip:`上行下效。`,ref:`Q&A Q20`},

{id:'3.04',p:3,s:'o',q:`What are policies?`,
o:[`Policies are statements about what should be done under specific circumstances`,`Policies describe the actions that are taken to place the policy guidance into operation`,`Both a and b`,`None of the above`],a:0,
zh:`什么是策略（policy）？`,
ex:`Policy 说的是<b>要做什么（what）</b>：特定情况下应该做什么的陈述。B 描述的是“把策略<span class="zhen">（policy）</span>落地的具体行动”，那是 <b>procedures / implementation guidance（怎么做，how）</b>。P3-16："Processes must be developed that show how policies will be implemented."`,
op:[`✓ What。`,`✗ 那是 procedure（How）。`,`✗`,`✗`],
tip:`Policy = What；Procedure = How。`,ref:`P3-6、P3-16`},

{id:'3.05',p:3,s:'o',q:`Why policies need to be acceptable to users?`,
o:[`If policies are not acceptable (sensible) then users will bypass it, which is a dangerous trend`,`So that users can modify it according to his/her needs`,`Both a and b`,`None of the above`],a:0,
zh:`为什么策略<span class="zhen">（policy）</span>需要被用户接受？`,
