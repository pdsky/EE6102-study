ex:`P5-74～P5-75：<b>Screened-subnet</b> 架构用外部和内部两台过滤路由器<span class="zhen">（filtering router）</span>，中间是 DMZ（Web 服务器<span class="zhen">（server）</span>等放在这里）。优点：三层防御<span class="zhen">（three layers of defense）</span>；外部路由器<span class="zhen">（exterior router）</span>只向互联网<span class="zhen">（Internet）</span>宣告 DMZ 的存在，内网<span class="zhen">（internal network）</span>对互联网<span class="zhen">（Internet）</span>不可见；内网<span class="zhen">（internal network）</span>主机也无法直接建立到互联网<span class="zhen">（Internet）</span>的路由。`,
op:[`✗ 第一代，单路由器<span class="zhen">（router）</span>`,`✗ 路由器<span class="zhen">（router）</span>加堡垒主机<span class="zhen">（bastion host）</span>`,`✗ 双网卡主机<span class="zhen">（dual-homed host）</span>，单点故障<span class="zhen">（single point of failure）</span>`,`✓`],
tip:`看到 DMZ 就选 screened subnet。`,ref:`P5-69～P5-75`},

{id:'5.c7',p:5,s:'c',q:`Firewall rules (checked top-down): 1) Src 192.168.1.0/24, Dst Any, Port 80 → Allow; 2) Src Any, Dst 10.0.0.5, Port 22 → Deny; 3) Any, Any, Any → Deny. A packet has Src 192.168.1.30, Dst 10.0.0.5, Port 443. What happens?`,
o:[`Allowed by Rule 1`,`Denied by Rule 2`,`Denied by Rule 3`,`Allowed because no rule matches`],a:2,
zh:`防火墙<span class="zhen">（firewall）</span>规则从上到下匹配，这个包（端口<span class="zhen">（port）</span> 443）会怎样？`,
ex:`逐条匹配（P5-52 Example Query 3）：<br>• Rule 1：源地址<span class="zhen">（source address）</span>匹配，但端口<span class="zhen">（port）</span> 443 ≠ 80 → 不匹配；<br>• Rule 2：目的地址<span class="zhen">（destination address）</span>匹配，但端口<span class="zhen">（port）</span> 443 ≠ 22 → 不匹配；<br>• Rule 3：Any/Any/Any → 匹配 → <b>Deny</b>。<br>最后一条“全部拒绝”就是默认拒绝<span class="zhen">（default deny）</span>策略<span class="zhen">（policy）</span>。`,
op:[`✗ 端口<span class="zhen">（port）</span>不符`,`✗ 端口<span class="zhen">（port）</span>不符`,`✓`,`✗ 默认规则兜底`],
tip:`从上到下，命中即停；每个字段都要匹配才算命中。`,ref:`P5-52`},

{id:'5.c8',p:5,s:'c',q:`What is the key difference between an IDS and an IPS?`,
o:[`IDS blocks attacks; IPS only alerts`,`IDS only detects and alerts (passive); IPS detects and actively blocks threats in real time`,`They are identical`,`IPS is only for hosts, IDS only for networks`],a:1,
zh:`IDS 和 IPS 的关键区别是什么？`,
ex:`P5-94：<b>IDS</b> 是被动的，检测后记录日志<span class="zhen">（log）</span>并告警<span class="zhen">（alert）</span>，适合取证分析<span class="zhen">（forensic analysis）</span>；<b>IPS</b> 是主动的，在流量<span class="zhen">（traffic）</span>到达系统之前检查并实时阻断，常集成在下一代防火墙（NGFW）中。P5-86 也写着 IDS 的缺点之一是 "No Active Protection ... (IPS does)"。`,
op:[`✗ 说反了`,`✓`,`✗`,`✗ 两者都有主机型<span class="zhen">（host-based）</span>和网络型<span class="zhen">（network-based）</span>`],
tip:`D = Detect（只报警）；P = Prevent（会拦截）。`,ref:`P5-86、P5-94`},

{id:'5.c9',p:5,s:'c',q:`A sacrificial computer system intended to attract cyberattacks like a decoy is called a:`,
o:[`Bastion host`,`Honeypot`,`Proxy server`,`DMZ`],a:1,
zh:`作为诱饵、专门吸引网络攻击<span class="zhen">（cyberattack）</span>的“牺牲”系统叫什么？`,
ex:`<b>Honeypot（蜜罐）</b>（P5-95）：故意留下漏洞<span class="zhen">（vulnerability）</span>，看起来像真实系统（如客户计费系统），用来吸引攻击者<span class="zhen">（attacker）</span>、研究他们的手法，或把他们从真实目标引开。局限：无法检测真实系统上的入侵<span class="zhen">（intrusion）</span>，也不一定能识别攻击者<span class="zhen">（attacker）</span>。`,
op:[`✗ 堡垒主机<span class="zhen">（bastion host）</span>是加固<span class="zhen">（hardening）</span>过的防火墙<span class="zhen">（firewall）</span>主机`,`✓`,`✗`,`✗`],
tip:`Honeypot = 引蛇出洞。`,ref:`P5-95`},

{id:'5.c10',p:5,s:'c',q:`A firewall can process 100,000 packets per second. Average packet size is 1000 bytes and link speed is 1 Gbps. Can it handle the load?`,
o:[`Yes, it needs only 12,500 pps`,`Yes, it needs only 100,000 pps`,`No, the link requires 125,000 pps`,`No, the link requires 1,000,000 pps`],a:2,
zh:`防火墙<span class="zhen">（firewall）</span>每秒能处理 10 万个包，平均包长 1000 字节<span class="zhen">（byte）</span>，链路<span class="zhen">（link）</span> 1 Gbps，扛得住吗？`,
ex:`所需 pps = 带宽<span class="zhen">（bandwidth）</span> ÷ (包长 × 8) = 1,000,000,000 ÷ 8,000 = <b>125,000 pps</b>。<br>防火墙<span class="zhen">（firewall）</span>能力 100,000 < 125,000，<b>扛不住</b>（P5-78 Example 2）。如果防火墙<span class="zhen">（firewall）</span>能力是 200,000 pps，就扛得住（Example 1）。`,
op:[`✗ 除错了`,`✗`,`✓`,`✗ 忘了 ×8`],
tip:`和 DoS 包速率<span class="zhen">（packet rate）</span>题是同一个公式。`,ref:`P5-76～P5-78`},

{id:'5.c11',p:5,s:'c',q:`What is a key disadvantage of a Network-based IDS (NIDS)?`,
o:[`It requires an agent on every host`,`It is ineffective when traffic is encrypted`,`It cannot see any network traffic`,`It is more expensive to deploy than HIDS on every host`],a:1,
zh:`网络型<span class="zhen">（network-based）</span> IDS（NIDS）的一个主要缺点是什么？`,
ex:`P5-89：NIDS 的缺点是 "<b>ineffective when traffic is encrypted</b>"，而且不了解主机内部的活动。HIDS 正好互补："Can examine data after it has been decrypted"（P5-90）。`,
op:[`✗ 那是 HIDS 的缺点`,`✓`,`✗`,`✗ NIDS 通常更便宜`],
tip:`加密流量<span class="zhen">（encrypted traffic）</span>让 NIDS 失明；P5-80 也说攻击者<span class="zhen">（attacker）</span>用 TLS 隧道<span class="zhen">（tunneling）</span>绕过防火墙<span class="zhen">（firewall）</span>。`,ref:`P5-89、P5-90、P5-80`},

{id:'5.c12',p:5,s:'c',q:`In SSL/TLS, session keys shorter than ______ bits are considered insecure.`,
o:[`40`,`64`,`128`,`2048`],a:2,
zh:`SSL/TLS 中，会话密钥<span class="zhen">（session key）</span>短于多少位被认为不安全？`,
ex:`P5-11：会话密钥<span class="zhen">（session key）</span>一般在 40～256 位之间，"Anything lower than <b>128-bit</b> is considered insecure." 公钥<span class="zhen">（public key）</span>和私钥<span class="zhen">（private key）</span>则建议 2048 位（512 位弱，1024 位也能被破解）。如果浏览器<span class="zhen">（browser）</span>支持 256 位而服务器<span class="zhen">（server）</span>只支持 128 位，连接就按 128 位建立。`,
op:[`✗`,`✗`,`✓`,`✗ 那是推荐的公钥<span class="zhen">（public key）</span>长度`],
tip:`会话密钥<span class="zhen">（session key）</span> ≥ 128；RSA 密钥<span class="zhen">（key）</span> ≥ 2048。`,ref:`P5-11`},

{id:'5.c13',p:5,s:'c',q:`Which firewall technology offers the best security but the lowest performance?`,
o:[`Packet filtering`,`Stateful packet inspection`,`Application proxy (gateway)`,`Personal firewall`],a:2,
zh:`哪种防火墙<span class="zhen">（firewall）</span>技术安全性最好但性能最低？`,
ex:`P5-68 对比表（数字越小越好）：<br>• Packet Filter：安全 3、性能 1（最快、最不智能）；<br>• SPI：安全 2、性能 2；<br>• <b>App Gateway / Proxy</b>：安全 1、性能 4（最安全、最慢）。<br>代理能看到完整的应用层<span class="zhen">（application layer）</span>协议<span class="zhen">（protocol）</span>，日志<span class="zhen">（log）</span>和审计<span class="zhen">（audit）</span>也方便（P5-65）。`,
op:[`✗ 最快`,`✗ 折中`,`✓`,`✗`],
tip:`看得越深越安全，也越慢。`,ref:`P5-65～P5-68`},

{id:'5.c14',p:5,s:'c',q:`Which TLS 1.3 improvement is NOT correct?`,
o:[`Removes outdated algorithms such as RSA key exchange and SHA-1`,`Faster handshake (round trips reduced from 2 to 1)`,`Provides Perfect Forward Secrecy`,`Restores backward compatibility with SSL 2.0`],a:3,
zh:`下列关于 TLS 1.3 改进的说法，哪项错误？`,
ex:`P5-9、P5-27：TLS 1.3 移除了过时算法（RSA 密钥交换<span class="zhen">（key exchange）</span>、SHA-1、DES、3DES、MD5、RC4）；握手<span class="zhen">（handshake）</span>往返从 2 次减到 1 次；提供完美前向保密<span class="zhen">（perfect forward secrecy (PFS)）</span>；使用更强的加密（ChaCha20、AES）。它<b>取消</b>了与 SSL 的向后兼容（TLS 1.2 及以前还兼容 SSL 3.0）。`,
op:[`✗ 正确说法`,`✗ 正确说法`,`✗ 正确说法`,`✓ 错误：1.3 恰恰去掉了兼容`],
tip:`TLS 1.3：更少、更快、更安全。`,ref:`P5-9、P5-26、P5-27`}
]);

/* Part 6 · Blockchain, Payments, Cryptocurrencies, DeFi, Case Studies (sld6) — 全部为自编题 */
window.MCQ = (window.MCQ || []).concat([
{id:'6.c1',p:6,s:'c',q:`Which network type is generally considered more secure because it has no single point of attack?`,
o:[`Mainframe with dumb terminals`,`Client-server`,`Peer-to-peer (decentralized)`,`Centralized database`],a:2,
zh:`哪种网络结构因为没有单一攻击点而通常被认为更安全？`,
ex:`P6-3 计算架构的演进：<br>• Mainframe：集中式，所有计算和存储都在主机，终端只负责输入输出；<br>• Client-server：分布式计算<span class="zhen">（distributed computing）</span>能力；<br>• <b>Peer-to-peer</b>：去中心化<span class="zhen">（decentralization）</span>，"P2P networks are generally considered to be more secure than centralized networks, as they do not have a single point of attack."<br>区块链<span class="zhen">（blockchain）</span>就是 P2P 网络，每个节点<span class="zhen">（node）</span>都持有账本<span class="zhen">（ledger）</span>副本（P6-10）。`,
op:[`✗ 集中式`,`✗`,`✓`,`✗`],
tip:`去中心化<span class="zhen">（decentralization）</span> = 没有单点故障<span class="zhen">（single point of failure）</span>或单点攻击。`,ref:`P6-3、P6-10`},

{id:'6.c2',p:6,s:'c',q:`Who introduced Bitcoin and the first fully functional blockchain (whitepaper 2008)?`,
o:[`Vitalik Buterin`,`Satoshi Nakamoto`,`Stuart Haber and W. Scott Stornetta`,`Gavin Wood`],a:1,
zh:`谁提出了比特币<span class="zhen">（Bitcoin）</span>和第一个完整可用的区块链<span class="zhen">（blockchain）</span>（2008 年白皮书）？`,
ex:`P6-21：2008 年，化名 <b>Satoshi Nakamoto</b> 的个人或团体发表白皮书 "Bitcoin: A Peer-to-Peer Electronic Cash System"，2009 年上线（P6-5 称 2009 年引入了第一个分布式账本<span class="zhen">（distributed ledger）</span>）。<b>1991 年 Haber & Stornetta</b> 提出了用密码学<span class="zhen">（cryptography）</span>保护的区块链<span class="zhen">（blockchain）</span>来给文档打时间戳<span class="zhen">（timestamp）</span>，是概念先驱。Nakamoto 把密码学<span class="zhen">（cryptography）</span>、PoW 共识<span class="zhen">（consensus）</span>和去中心化<span class="zhen">（decentralization）</span>网络结合起来，做成了第一个完整的区块链<span class="zhen">（blockchain）</span>。`,
op:[`✗ 以太坊<span class="zhen">（Ethereum）</span>联合创始人`,`✓`,`✗ 1991 年的概念先驱`,`✗ 提出 Proof of Authority 的以太坊<span class="zhen">（Ethereum）</span>前 CTO`],
tip:`1991 Haber & Stornetta → 2008 白皮书 → 2009 比特币<span class="zhen">（Bitcoin）</span>上线 → 2015 以太坊<span class="zhen">（Ethereum）</span>。`,ref:`P6-5、P6-21`},

{id:'6.c3',p:6,s:'c',q:`"Once recorded, transactions cannot be altered or deleted." This blockchain characteristic is:`,
o:[`Transparency`,`Immutability`,`Decentralization`,`Consensus`],a:1,
zh:`“交易一旦记录就不能修改或删除”，这是区块链<span class="zhen">（blockchain）</span>的哪个特征？`,
ex:`P6-6 关键特征：<br>• Decentralization：没有单一实体控制；<br>• Transparency：参与者都能看到交易；<br>• <b>Immutability</b>：一旦记录不可更改或删除，保证数据完整性<span class="zhen">（data integrity）</span>；<br>• Security：用哈希<span class="zhen">（hash）</span>和数字签名<span class="zhen">（digital signature）</span>保证真实性<span class="zhen">（authenticity）</span>；<br>• Consensus：所有节点<span class="zhen">（node）</span>就交易有效性达成一致。<br>P6-8：像用墨水写的账本<span class="zhen">（ledger）</span>，记错了要再写一笔来更正，而不是擦掉。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`Immutable = unchanging over time。`,ref:`P6-6～P6-9`},

{id:'6.c4',p:6,s:'c',q:`What links each block to the previous one to form a chain?`,
o:[`The block's timestamp only`,`A reference to the previous block's hash`,`The miner's IP address`,`The user's password`],a:1,
zh:`什么把每个区块<span class="zhen">（block）</span>和前一个区块<span class="zhen">（block）</span>连成链？`,
ex:`P6-25：每个区块<span class="zhen">（block）</span>包含 ① 交易列表 ② 自身哈希 ③ <b>前一个区块<span class="zhen">（block）</span>的哈希</b>（Prev Hash）。改动任何一个旧区块<span class="zhen">（block）</span>，它的哈希就会变，后面所有区块<span class="zhen">（block）</span>里记录的 Prev Hash 都对不上，必须全部重算。这就是“几乎不可篡改<span class="zhen">（immutable）</span>”的原因（P6-26）。`,
op:[`✗ 有时间戳<span class="zhen">（timestamp）</span>，但真正链接的是哈希<span class="zhen">（hash）</span>`,`✓`,`✗`,`✗`],
tip:`Block #101 的 Prev Hash = Block #100 的 Hash。`,ref:`P6-22、P6-25、P6-26`},

{id:'6.c5',p:6,s:'c',q:`Bitcoin's Proof-of-Work puzzle is based on which hash algorithm?`,
o:[`MD5`,`SHA-1`,`SHA-256`,`RSA`],a:2,
zh:`比特币<span class="zhen">（Bitcoin）</span>的工作量证明<span class="zhen">（proof of work (PoW)）</span>谜题基于哪种哈希算法<span class="zhen">（hash algorithm）</span>？`,
ex:`P6-63："This is called the Proof-of-Work. In Bitcoin, it is based on the <b>SHA 256</b> Hash algorithm." 矿工<span class="zhen">（miner）</span>竞相找到能把新区块<span class="zhen">（block）</span>和前一块连起来的哈希<span class="zhen">（hash）</span>，先解出的人可以添加区块<span class="zhen">（block）</span>，并获得 <b>coinbase 交易</b>奖励，这也是产生新比特币<span class="zhen">（Bitcoin）</span>的<b>唯一</b>方式。`,
op:[`✗ 已不安全`,`✗ 已不安全`,`✓`,`✗ 不是哈希<span class="zhen">（hash）</span>`],
tip:`比特币<span class="zhen">（Bitcoin）</span> = PoW + SHA-256；上限 2100 万枚。`,ref:`P6-61、P6-63`},

{id:'6.c6',p:6,s:'c',q:`In which consensus mechanism do validators invest in the coins of the system and validate blocks by placing a bet (stake)?`,
o:[`Proof of Work`,`Proof of Stake`,`Proof of Burn`,`Proof of Capacity`],a:1,
zh:`哪种共识机制<span class="zhen">（consensus mechanism）</span>中，验证者<span class="zhen">（validator）</span>投资系统代币<span class="zhen">（token）</span>，以下注（质押<span class="zhen">（staking）</span>）的方式验证区块<span class="zhen">（block）</span>？`,
ex:`P6-13：<br>• <b>PoW</b>：解复杂数学题，耗算力<span class="zhen">（computing power）</span>（比特币<span class="zhen">（Bitcoin）</span>）；<br>• <b>PoS</b>：验证者<span class="zhen">（validator）</span>投入（质押<span class="zhen">（staking）</span>）代币<span class="zhen">（token）</span>下注（<b>Ethereum 2.0</b>）；<br>• <b>DPoS</b>：代币<span class="zhen">（token）</span>持有者投票选代表来验证，更高效；<br>• <b>PoB</b>：把币发到无法取回的地址，表示长期承诺，浪费资源所以不流行；<br>• <b>Proof of Capacity</b>：投入硬盘空间，空间越大越容易被选中。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`Work 耗算力<span class="zhen">（computing power）</span>；Stake 押币<span class="zhen">（staking）</span>；Burn 烧币<span class="zhen">（coin burning）</span>；Capacity 押硬盘。`,ref:`P6-13`},

{id:'6.c7',p:6,s:'c',q:`Which consensus algorithm, developed with Intel hardware, makes all nodes wait a random amount of time and is widely used in permissioned networks?`,
o:[`Proof of Elapsed Time (PoET)`,`Proof of Authority (PoA)`,`Byzantine Fault Tolerance (BFT)`,`Directed Acyclic Graph (DAG)`],a:0,
zh:`哪种共识算法<span class="zhen">（consensus algorithm）</span>借助 Intel 硬件，让所有节点<span class="zhen">（node）</span>随机等待一段时间，广泛用于许可链<span class="zhen">（permissioned blockchain）</span>？`,
ex:`P6-14：<br>• <b>PoET</b>：所有节点<span class="zhen">（node）</span>随机等待，等待最短者出块，被认为是最公平的之一（Intel 开发硬件支持）；<br>• <b>PoA</b>：基于可信方的声誉，适合私链<span class="zhen">（private blockchain）</span>，Gavin Wood 于 2017 年提出；<br>• <b>BFT</b>：存在恶意节点<span class="zhen">（malicious node）</span>时也能达成共识<span class="zhen">（consensus）</span>（如 Hyperledger Fabric）；<br>• <b>DAG</b>：区块链<span class="zhen">（blockchain）</span>的替代结构，可并行验证（如 IOTA）。`,
op:[`✓`,`✗ 靠声誉`,`✗ 容忍恶意节点<span class="zhen">（malicious node）</span>`,`✗ IOTA`],
tip:`Elapsed Time = 随机等待；Authority = 声誉；DAG = IOTA。`,ref:`P6-14`},

{id:'6.c8',p:6,s:'c',q:`Which programming language is used to write smart contracts on Ethereum?`,
o:[`Python`,`Solidity`,`Haskell`,`COBOL`],a:1,
zh:`以太坊<span class="zhen">（Ethereum）</span>上的智能合约<span class="zhen">（smart contract）</span>用什么语言编写？`,
ex:`P6-15、P6-67：Ethereum 有自己的编程语言 <b>Solidity</b>，拥有最大的智能合约<span class="zhen">（smart contract）</span>生态（DeFi、NFT）。其他平台：Solana（Rust、C、C++）、Binance Smart Chain（Solidity，兼容 EVM）、Cardano（Plutus，基于 Haskell）、Polkadot（Ink!、Rust）。`,
op:[`✗`,`✓`,`✗ Cardano 的 Plutus 基于 Haskell`,`✗`],
tip:`以太坊<span class="zhen">（Ethereum）</span>：Solidity + 智能合约<span class="zhen">（smart contract）</span> + PoS。`,ref:`P6-15、P6-67`},

{id:'6.c9',p:6,s:'c',q:`Which smart contract risk is described as "can't correct errors once deployed"?`,
o:[`Code vulnerabilities`,`Immutability risks`,`Scalability`,`Legal issues`],a:1,
zh:`哪种智能合约<span class="zhen">（smart contract）</span>风险<span class="zhen">（risk）</span>被描述为“部署后无法更正错误”？`,
ex:`P6-18 智能合约<span class="zhen">（smart contract）</span>的挑战：<br>• Code vulnerabilities：代码 bug 会被利用；<br>• <b>Immutability risks</b>：部署后无法更正错误；<br>• Scalability：受区块链<span class="zhen">（blockchain）</span>网络性能限制；<br>• Legal issues：监管和法律效力尚不明确。<br>不可篡改<span class="zhen">（immutable）</span>是区块链<span class="zhen">（blockchain）</span>的优点，放到智能合约<span class="zhen">（smart contract）</span>上也会变成风险<span class="zhen">（risk）</span>。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`不可篡改<span class="zhen">（immutable）</span>有两面：防篡改<span class="zhen">（tampering）</span>，但也改不了 bug。`,ref:`P6-18`},

{id:'6.c10',p:6,s:'c',q:`In which type of blockchain can anyone read, transact and participate in the consensus process (e.g., Bitcoin, Ethereum)?`,
o:[`Public`,`Private`,`Consortium`,`Permissioned`],a:0,
zh:`哪种区块链<span class="zhen">（blockchain）</span>任何人都能读、能交易、能参与共识<span class="zhen">（consensus）</span>（如比特币<span class="zhen">（Bitcoin）</span>、以太坊<span class="zhen">（Ethereum）</span>）？`,
ex:`P6-30：<br>• <b>Public</b>：任何人可读、可交易、可参与共识<span class="zhen">（consensus）</span>，代码开源（Bitcoin、Ethereum）；<br>• <b>Private</b>：仅限一个组织或团体，可以限制读权限<span class="zhen">（privileges）</span>（课件举例 Ripple、Multichain、Corda）；<br>• <b>Permissioned</b>：需要邀请才能加入；<br>• <b>Consortium</b>：多个组织协作，适合所有参与者都需许可且共担责任的业务（R3、Hyperledger、Fabric）；<br>• <b>Hybrid</b>：公私结合（XinFin）。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`公链<span class="zhen">（public blockchain）</span>人人可进；联盟链<span class="zhen">（consortium blockchain）</span>是多家机构合作。`,ref:`P6-30`},

{id:'6.c11',p:6,s:'c',q:`A blockchain adds a new 1 MB block every 10 minutes and the average transaction size is 250 bytes. What is the approximate transactions per second (TPS)?`,
o:[`0.4 TPS`,`6.67 TPS`,`400 TPS`,`4000 TPS`],a:1,
zh:`区块链<span class="zhen">（blockchain）</span>每 10 分钟出一个 1 MB 的块，平均交易大小<span class="zhen">（average transaction size）</span> 250 字节<span class="zhen">（byte）</span>，TPS 大约是多少？`,
ex:`① 每块交易数 TPB = 区块大小<span class="zhen">（block size）</span> ÷ 交易大小<span class="zhen">（transaction size）</span> = 1,000,000 ÷ 250 = <b>4000 笔/块</b>；<br>② TPS = TPB ÷ 出块时间<span class="zhen">（block time）</span> = 4000 ÷ 600 s ≈ <b>6.67 TPS</b>（P6-34）。`,
op:[`✗`,`✓`,`✗`,`✗ 那是每块交易数<span class="zhen">（transactions per block (TPB)）</span>，不是每秒`],
tip:`TPS = (区块大小<span class="zhen">（block size）</span> ÷ 交易大小<span class="zhen">（transaction size）</span>) ÷ 出块秒数。`,ref:`P6-34、P6-35`},

{id:'6.c12',p:6,s:'c',q:`A blockchain processes 200 TPS with an average transaction size of 750 bytes. What is the data throughput?`,
o:[`0.15 Mbps`,`1.2 Mbps`,`12 Mbps`,`150 Mbps`],a:1,
zh:`区块链<span class="zhen">（blockchain）</span>每秒处理 200 笔交易，平均 750 字节<span class="zhen">（byte）</span>，数据吞吐量<span class="zhen">（throughput）</span>是多少？`,
ex:`bytes/s = 200 × 750 = 150,000 B/s；bits/s = 150,000 × 8 = 1,200,000 bit/s；Mbps = 1,200,000 ÷ 10<sup>6</sup> = <b>1.2 Mbps</b>。<br>⚠ 课件 P6-36 这一步写成了 “12 000 000 bits/second”，多写了一个 0，但最终结果 1.2 Mbps 是对的。`,
op:[`✗ 忘了 ×8`,`✓`,`✗ 照抄课件笔误的 12,000,000`,`✗`],
tip:`吞吐量<span class="zhen">（throughput）</span> = TPS × 交易字节<span class="zhen">（byte）</span> × 8 ÷ 10<sup>6</sup>。`,ref:`P6-35、P6-36`},

{id:'6.c13',p:6,s:'c',q:`Which is TRUE about Bitcoin?`,
o:[`It has no supply limit`,`It has a capped supply of 21 million coins and uses Proof-of-Work`,`It supports Solidity smart contracts`,`It is controlled by a central bank`],a:1,
zh:`关于比特币<span class="zhen">（Bitcoin）</span>，哪项正确？`,
ex:`P6-61、P6-73：比特币<span class="zhen">（Bitcoin）</span>是去中心化<span class="zhen">（decentralization）</span>数字货币<span class="zhen">（digital currency）</span>，使用公链<span class="zhen">（public blockchain）</span>，供应<b>上限 2100 万枚</b>（目前流通约 1931 万），采用 <b>PoW</b>，<b>不支持</b>智能合约<span class="zhen">（smart contract）</span>。对比 Ethereum：供应没有固定上限，现在用 PoS，支持智能合约<span class="zhen">（smart contract）</span>，定位是去中心化应用<span class="zhen">（decentralized application）</span>平台。`,
op:[`✗ 那是以太坊<span class="zhen">（Ethereum）</span>`,`✓`,`✗ 那是以太坊<span class="zhen">（Ethereum）</span>`,`✗`],
tip:`BTC：2100 万、PoW、无智能合约<span class="zhen">（smart contract）</span>；ETH：无上限、PoS、有智能合约<span class="zhen">（smart contract）</span>。`,ref:`P6-61、P6-67、P6-73`},

{id:'6.c14',p:6,s:'c',q:`In Bitcoin, what is the ONLY way to create valid new bitcoins?`,
o:[`The central bank prints them`,`The miner who solves the PoW puzzle adds a coinbase transaction`,`Users copy existing coins`,`Exchanges mint them`],a:1,
zh:`在比特币<span class="zhen">（Bitcoin）</span>中，产生新币的唯一合法方式是什么？`,
ex:`P6-63："As an incentive, he has the right to add a so-called <b>Coinbase transaction</b> that gives him a specific number of Bitcoins. This is the only way to create valid Bitcoins." 解出 PoW 谜题的矿工<span class="zhen">（miner）</span>获得这个奖励。`,
op:[`✗`,`✓`,`✗ 那是双花<span class="zhen">（double spending）</span>`,`✗`],
tip:`Coinbase 交易 = 矿工奖励<span class="zhen">（mining reward）</span> = 新币唯一来源。`,ref:`P6-63`},

{id:'6.c15',p:6,s:'c',q:`"Double-spending" in a digital cash scheme means:`,
o:[`Paying twice the price`,`The same digital token is spent more than once because a digital file can be duplicated`,`Using two different currencies`,`Paying with both credit and debit card`],a:1,
zh:`数字现金<span class="zhen">（digital cash）</span>中的“双花<span class="zhen">（double spending）</span>”是什么意思？`,
ex:`P6-56："A potential flaw in a digital cash scheme in which the <b>same single digital token can be spent more than once</b>. This is possible because a digital token consists of a digital file that can be duplicated." 银行的解法是用中心化账本<span class="zhen">（ledger）</span>记录谁拥有什么；比特币<span class="zhen">（Bitcoin）</span>用公开的区块链<span class="zhen">（blockchain）</span>和 PoW 解决了这个问题（P6-55）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`数字现金<span class="zhen">（digital cash）</span>两大难题：匿名性<span class="zhen">（anonymity）</span>、双花（P6-55）。`,ref:`P6-55、P6-56`},

{id:'6.c16',p:6,s:'c',q:`Fiat money is:`,
o:[`Backed by gold`,`Backed by the issuing government`,`A cryptocurrency`,`Backed by commodities such as cocoa beans`],a:1,
zh:`法定货币（fiat money）由什么背书？`,
ex:`P6-41、P6-56：自 20 世纪 70 年代初脱离金本位<span class="zhen">（gold standard）</span>后，货币<span class="zhen">（currency）</span>不再由金银背书，而是由<b>发行国政府</b>背书。fiat 是拉丁语“let it be done”的意思。缺点：中心化，发行数量没有上限（如无限量化宽松<span class="zhen">（quantitative easing）</span>）。P6-38：MONEY = VALUE = TRUST。`,
op:[`✗ 金本位<span class="zhen">（gold standard）</span>已放弃`,`✓`,`✗`,`✗ 早期商品货币<span class="zhen">（commodity money）</span>`],
tip:`Fiat 靠对政府的信任。`,ref:`P6-38～P6-41、P6-56`},

{id:'6.c17',p:6,s:'c',q:`How does the Ripple network validate transactions?`,
o:[`Bitcoin-style Proof-of-Work mining`,`A unique distributed consensus mechanism in which participating nodes verify authenticity by conducting a poll`,`Proof of Burn`,`A single central server`],a:1,
zh:`Ripple 网络怎样验证交易？`,
ex:`P6-71：Ripple 是 XRP 背后的公司和网络，2012 年推出，用作两种货币<span class="zhen">（currency）</span>或网络之间的中间交换媒介<span class="zhen">（medium of exchange）</span>，功能类似 SWIFT。XRP 是<b>预挖<span class="zhen">（premined）</span></b>的；它不用挖矿<span class="zhen">（mining）</span>，而是用一种独特的分布式共识<span class="zhen">（consensus）</span>，由参与节点<span class="zhen">（node）</span><b>投票（poll）</b>验证交易。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`Ripple / XRP：预挖<span class="zhen">（premined）</span>、投票共识<span class="zhen">（voting consensus）</span>、跨境支付<span class="zhen">（cross-border payment）</span>。`,ref:`P6-71`},

{id:'6.c18',p:6,s:'c',q:`According to the lecture, what is a "scaling risk" of DeFi?`,
o:[`Ethereum can process about 15 transactions per second while Visa can process about 65,000`,`DeFi is too fast to regulate`,`DeFi has no smart contracts`,`DeFi only works offline`],a:0,
zh:`按课件，DeFi 的“扩展性<span class="zhen">（scalability）</span>风险<span class="zhen">（risk）</span>”是什么？`,
ex:`P6-79 DeFi 风险<span class="zhen">（risk）</span>：<br>• Volatility：建立在高波动的加密资产<span class="zhen">（crypto asset）</span>上；<br>• Immature Technology：技术不成熟，未经大规模、长时间的压力测试<span class="zhen">（stress testing）</span>；<br>• <b>Scaling Risk</b>：共识机制<span class="zhen">（consensus mechanism）</span>慢，<b>以太坊<span class="zhen">（Ethereum）</span>约 15 TPS，Visa 约 65,000 TPS</b>。<br>DeFi 的好处：去中心化<span class="zhen">（decentralization）</span>、可及性（服务无银行账户的人）、透明、安全（P6-78）。`,
op:[`✓`,`✗`,`✗ DeFi 依赖智能合约<span class="zhen">（smart contract）</span>`,`✗`],
tip:`ETH 15 vs Visa 65,000。`,ref:`P6-78、P6-79`},

{id:'6.c19',p:6,s:'c',q:`What did the 2017 Equifax breach exploit?`,
o:[`A zero-day in Windows`,`An unpatched Apache Struts vulnerability in its online dispute portal`,`A phishing email to the CEO`,`A DDoS by the Mirai botnet`],a:1,
zh:`2017 年 Equifax 数据泄露<span class="zhen">（data breach）</span>利用了什么？`,
ex:`P6-102～P6-106：3 月 7 日 Apache 公布了 Struts 漏洞<span class="zhen">（vulnerability）</span>并提供补丁<span class="zhen">（patch）</span>；3 月 8 日 US-CERT 通知了 Equifax；3 月 10 日黑客<span class="zhen">（hacker）</span>就通过<b>在线争议门户<span class="zhen">（online dispute portal）</span></b>里未打补丁<span class="zhen">（unpatched）</span>的 Struts 入侵<span class="zhen">（intrusion）</span>，导致 1.47 亿人数据被盗。Equifax 自己的策略<span class="zhen">（policy）</span>要求 48 小时内打补丁<span class="zhen">（patching）</span>，但服务器<span class="zhen">（server）</span> 5 个月后才修好；SSL 证书过期<span class="zhen">（certificate expiry）</span>近 10 个月没续，导致数据外泄<span class="zhen">（data exfiltration）</span>没被发现。教训：打好基础补丁<span class="zhen">（patch）</span>、按需知密（need to know）的数据访问、监控异常行为<span class="zhen">（anomalous behaviour）</span>（9000 次快速查询本该引起警觉）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`Equifax = 没打补丁（Struts）+ 证书过期<span class="zhen">（certificate expiry）</span> + 内网<span class="zhen">（internal network）</span>横向移动<span class="zhen">（lateral movement）</span>。`,ref:`P6-101～P6-106`},

{id:'6.c20',p:6,s:'c',q:`In the 2016 Bangladesh Central Bank heist, how did the attackers delay detection of the fraudulent SWIFT transfers?`,
o:[`They encrypted the bank's database`,`They disabled the bank's SWIFT notification printers with malware`,`They launched a DDoS against the Federal Reserve`,`They bribed the auditors`],a:1,
zh:`2016 年孟加拉央行劫案中，攻击者<span class="zhen">（attacker）</span>怎样推迟了欺诈<span class="zhen">（fraud）</span> SWIFT 转账被发现的时间？`,
ex:`P6-108～P6-110：攻击者<span class="zhen">（attacker）</span>潜伏了数月，冒充<span class="zhen">（masquerading）</span> BCB 通过 <b>SWIFT</b> 向纽约联储发送转账指令<span class="zhen">（transfer instruction）</span>；SWIFT 通常把转账通知发到银行的打印机上，攻击者<span class="zhen">（attacker）</span>用恶意软件<span class="zhen">（malware）</span><b>让打印机失灵</b>，还关掉了监控摄像头，又选在三天连休的周末动手。原计划转走 10 亿美元，因为把 “foundation” 拼成 “fandation” 等错误，只成功转走 8100 万美元。教训：共用密码<span class="zhen">（password）</span>、人为失误或内鬼<span class="zhen">（insider）</span>、USB 传播的恶意软件<span class="zhen">（malware）</span>、国际法律漏洞<span class="zhen">（vulnerability）</span>。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`孟加拉劫案：SWIFT + 打印机 + 长周末 + 拼写错误。`,ref:`P6-107～P6-110、P1-17`},

{id:'6.c21',p:6,s:'c',q:`What is the correct order of the incident response stages in the lecture?`,
o:[`Punish → Detect → Repair → Stop`,`Detect → Stop → Repair → Punish`,`Stop → Detect → Punish → Repair`,`Repair → Stop → Detect → Punish`],a:1,
zh:`课件中事件响应<span class="zhen">（incident response）</span>阶段的正确顺序是？`,
ex:`P6-113：<b>Detecting</b> the attack → <b>Stopping</b> the attack → <b>Repairing</b> the damage → <b>Punishing</b> the attacker。P6-112："Response should be 'reacting according to plan'"；P6-114：要<b>演练（rehearsals）</b>，既能发现计划中的问题，又能提高响应速度。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`发现 → 止损 → 修复 → 追责。`,ref:`P6-112～P6-114`},

{id:'6.c22',p:6,s:'c',q:`A Computer Security Incident Response Team (CSIRT) is convened when:`,
o:[`Any single password is reset`,`A major incident occurs that the on-duty security staff cannot handle`,`A new employee joins`,`The firewall is updated`],a:1,
zh:`什么时候召集计算机安全事件响应小组（CSIRT）？`,
ex:`P6-112："Major incidents are incidents the on-duty security staff cannot handle. Company must convene a CSIRT." 成员应包括：高层管理<span class="zhen">（senior management）</span>者、安全人员、IT 人员、受影响业务部门的人员，以及<b>公关和法务</b>部门。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`CSIRT 不只有技术人员，还要有高管、公关和法务。`,ref:`P6-112`},

{id:'6.c23',p:6,s:'c',q:`Which is listed in the lecture as one of the two big problems of digital cash?`,
o:[`How to guarantee anonymity`,`How to print the coins`,`How to make coins heavier`,`How to remove encryption`],a:0,
zh:`课件列出的数字现金<span class="zhen">（digital cash）</span>两大难题之一是什么？`,
ex:`P6-55：数字现金<span class="zhen">（digital cash）</span>的理想属性是 Secure、Anonymous、Portable、Reusable、User-friendly，没有已知系统能全部满足。<b>两大难题</b>：① 如何保证<b>匿名性<span class="zhen">（anonymity）</span></b>？② 如何避免<b>双花<span class="zhen">（double spending）</span></b>？比特币<span class="zhen">（Bitcoin）</span>在 2009 年给出了一个解决双花<span class="zhen">（double spending）</span>的方案。`,
op:[`✓`,`✗`,`✗`,`✗`],
tip:`数字现金<span class="zhen">（digital cash）</span>难题：匿名 + 双花<span class="zhen">（double spending）</span>。`,ref:`P6-55`},

{id:'6.c24',p:6,s:'c',q:`What are the three e-payment goals listed in the lecture?`,
o:[`Speed, Color, Size`,`Integrity, Accountability, Privacy`,`Availability, Mining, Staking`,`Hashing, Signing, Burning`],a:1,
zh:`课件列出的电子支付<span class="zhen">（electronic payment）</span>三大目标是什么？`,
ex:`P6-49：<br>• <b>Integrity</b>：币不能伪造<span class="zhen">（forgery）</span>，合法交易会被兑付；<br>• <b>Accountability</b>：交易事后不能否认，纠纷能高效解决；<br>• <b>Privacy</b>：某些参与方的身份不向其他方透露，数字现金<span class="zhen">（digital cash）</span>不可追踪到付款人或收款人。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`支付三目标：不能伪造<span class="zhen">（forgery）</span>、不能抵赖<span class="zhen">（repudiation）</span>、保护隐私<span class="zhen">（privacy）</span>。`,ref:`P6-49`},

{id:'6.c25',p:6,s:'c',q:`Which statement about the differences between blockchains and relational databases is correct?`,
o:[`Blockchain administrators can easily edit or delete data`,`A blockchain is a write-only (append-only) structure with no admin permissions to edit or delete, while a relational database can be modified by DBAs`,`Relational databases were designed for decentralized applications`,`They are identical`],a:1,
zh:`关于区块链<span class="zhen">（blockchain）</span>和关系型数据库<span class="zhen">（relational database）</span>的区别，哪项正确？`,
ex:`P6-19：区块链<span class="zhen">（blockchain）</span>是<b>只追加（write-only / append-only）</b>的数据结构，新条目通过链接前一块的哈希<span class="zhen">（hash）</span>追加到末尾，没有管理员权限<span class="zhen">（administrator privileges）</span>可以编辑或删除数据；关系型数据库<span class="zhen">（relational database）</span>的 DBA 可以随意修改数据和结构。区块链<span class="zhen">（blockchain）</span>为去中心化应用<span class="zhen">（decentralized application）</span>设计，数据库<span class="zhen">（database）</span>最初为单一实体控制的中心化应用<span class="zhen">（centralized application）</span>设计。`,
op:[`✗`,`✓`,`✗ 说反了`,`✗`],
tip:`区块链<span class="zhen">（blockchain）</span>只增不改；数据库<span class="zhen">（database）</span>增删改查都可以。`,ref:`P6-19`},

{id:'6.c26',p:6,s:'c',q:`According to the lecture summary, the Internet was the "first digital revolution". What is the "second digital revolution"?`,
o:[`Cloud computing`,`Blockchain technology, facilitating peer-to-peer transactions without intermediaries`,`Social media`,`5G networks`],a:1,
zh:`按课件总结，互联网<span class="zhen">（Internet）</span>是“第一次数字革命<span class="zhen">（digital revolution）</span>”，“第二次数字革命<span class="zhen">（second digital revolution）</span>”是什么？`,
ex:`P6-98："First Digital Revolution: The Internet ... is great for collaboration and communication, but is deeply flawed when it comes to commerce, privacy and trust. Second Digital Revolution: The <b>Blockchain</b> technology facilitates peer-to-peer transactions without any intermediary." 课程目标中也说 "Blockchain is considered second digital revolution"（P1-2）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`互联网<span class="zhen">（Internet）</span>传信息，区块链<span class="zhen">（blockchain）</span>传价值与信任。`,ref:`P6-98、P1-2`}
]);

/* 网传 Mock 题：小红书流传的 “EE6102 Quiz 收集版本——题库的冰山一角”（20 题，原文注明部分可能由 AI 生成）+ 同学问到的 RSA 解密题。
   答案按课件核对过；s:'n' = 网传题，不是官方样题。 */

{id:'5.n1',p:5,s:'n',q:`In TLS, which component is used to verify server identity?`,
o:[`Symmetric key`,`HMAC`,`TLS Certificate signed by CA`,`CAPTCHA`],a:2,
zh:`在 TLS 中，用什么来验证服务器<span class="zhen">（server）</span>身份？`,
ex:`服务器<span class="zhen">（server）</span>身份靠 <b>CA 签发的数字证书<span class="zhen">（digital certificate）</span></b>：证书<span class="zhen">（certificate）</span>把域名<span class="zhen">（domain name）</span>和服务器<span class="zhen">（server）</span>公钥<span class="zhen">（public key）</span>绑定在一起，浏览器<span class="zhen">（browser）</span>验证 CA 的签名<span class="zhen">（signature）</span>、有效期<span class="zhen">（validity period）</span>和吊销状态<span class="zhen">（revocation status）</span>后才信任这个公钥<span class="zhen">（public key）</span>。`,
op:[`✗ 对称密钥<span class="zhen">（symmetric key）</span>用来加密<span class="zhen">（encryption）</span>数据，不证明身份。`,`✗ HMAC 保证消息完整性<span class="zhen">（message integrity）</span>，不证明服务器<span class="zhen">（server）</span>是谁。`,`✓ 证书<span class="zhen">（certificate）</span> + CA 签名<span class="zhen">（signature）</span>。`,`✗ CAPTCHA 是区分人和机器人的。`],
tip:`验证服务器<span class="zhen">（server）</span>身份 → 证书（certificate），三查：可信 CA、有效期<span class="zhen">（validity period）</span>、未吊销<span class="zhen">（not revoked）</span>。`,ref:`P5 SSL/TLS；P4 数字证书<span class="zhen">（digital certificate）</span>`},

{id:'1.n1',p:1,s:'n',q:`The primary characteristic of a logic bomb is:`,
o:[`It encrypts files for ransom`,`It replicates across the network`,`It changes hashes to evade detection`,`It activates under specific conditions`],a:3,
zh:`逻辑炸弹<span class="zhen">（logic bomb）</span>的主要特征是什么？`,
ex:`逻辑炸弹<span class="zhen">（logic bomb）</span> = <b>条件触发</b>：到了某个日期、某个员工被删除账号等预设条件满足时才执行恶意动作（P1-39）。`,
op:[`✗ 那是勒索软件<span class="zhen">（ransomware）</span>。`,`✗ 那是蠕虫<span class="zhen">（worm）</span>。`,`✗ 编造的干扰项。`,`✓ 条件触发。`],
tip:`Logic bomb = 条件触发；对照官方样题 1.18。`,ref:`P1-39`},

{id:'5.n2',p:5,s:'n',q:`An IDS that is installed on individual computers is called:`,
o:[`Proxy IDS`,`Layer 3 IDS`,`Host-based IDS`,`Network-based IDS`],a:2,
zh:`安装在单台计算机上的 IDS 叫什么？`,
ex:`IDS 按部署位置分两类：<b>主机型<span class="zhen">（host-based）</span> HIDS</b> 装在单台主机上，监控本机日志<span class="zhen">（log）</span>、文件和进程；<b>网络型<span class="zhen">（network-based）</span> NIDS</b> 放在网段<span class="zhen">（network segment）</span>上，监控经过的流量<span class="zhen">（traffic）</span>。`,
op:[`✗ 没有这种分类。`,`✗ 没有这种分类。`,`✓ 装在单台计算机上 = host-based。`,`✗ 网络型<span class="zhen">（network-based）</span>监控网段<span class="zhen">（network segment）</span>流量<span class="zhen">（traffic）</span>。`],
tip:`装在主机上 = HIDS；放在网络上 = NIDS。`,ref:`P5 IDS/IPS`},

{id:'4.n1',p:4,s:'n',q:`Which of the following is NOT a secure hash algorithm?`,
o:[`bcrypt`,`MD5`,`SHA-1`,`SHA-256`],a:1,alt:2,
zh:`下列哪个不是安全的哈希算法<span class="zhen">（hash algorithm）</span>？`,
ex:`<b>MD5</b> 早已能实际构造碰撞<span class="zhen">（collision）</span>，是最典型的“不安全哈希<span class="zhen">（hash）</span>”，网传答案选它。但 <b>SHA-1</b> 也在 2017 年被实际碰撞<span class="zhen">（collision）</span>，同样已不安全，所以这道题本身有两个可选项；考试如果出现，优先选 MD5。bcrypt 是专门存密码<span class="zhen">（password）</span>的慢哈希<span class="zhen">（hash）</span>，SHA-256 目前安全。`,
op:[`✗ bcrypt 是安全的密码<span class="zhen">（password）</span>哈希<span class="zhen">（hash）</span>。`,`✓ MD5：最典型的不安全哈希<span class="zhen">（hash）</span>。`,`按定义也对：SHA-1 同样已被攻破。`,`✗ SHA-256 安全。`],
tip:`不安全：MD5、SHA-1；安全：SHA-256（SHA-2）、SHA-3、bcrypt。`,ref:`P4 Hash`},

{id:'4.n2',p:4,s:'n',q:`RSA is based on the difficulty of:`,
o:[`Solving hash functions`,`Factoring large integers (product of two primes)`,`Elliptic curve factoring`,`Modular multiplication`],a:1,
zh:`RSA 的安全性基于什么难题？`,
ex:`RSA 的模数<span class="zhen">（modulus）</span> n = p × q。知道 n 很容易，但要分解<span class="zhen">（factorization）</span>出 p 和 q 极其困难；分解<span class="zhen">（factorization）</span>不出 p、q 就算不出 φ(n) 和私钥<span class="zhen">（private key）</span> d。所以 RSA 基于<b>大数分解<span class="zhen">（integer factorization）</span></b>难题。`,
op:[`✗`,`✓ 大数分解<span class="zhen">（integer factorization）</span>。`,`✗ ECC 基于椭圆曲线离散对数<span class="zhen">（discrete logarithm）</span>，不是“分解<span class="zhen">（factorization）</span>”。`,`✗ 模乘本身很容易算。`],
tip:`RSA → 大数分解<span class="zhen">（integer factorization）</span>；DH → 离散对数<span class="zhen">（discrete logarithm）</span>；ECC → 椭圆曲线离散对数<span class="zhen">（discrete logarithm）</span>。`,ref:`P4 RSA`},

{id:'4.n3',p:4,s:'n',q:`Which cryptographic algorithm is symmetric?`,
o:[`Diffie-Hellman`,`AES`,`ElGamal`,`RSA`],a:1,
zh:`哪个是对称加密<span class="zhen">（symmetric encryption）</span>算法？`,
ex:`<b>AES</b> 加密<span class="zhen">（encryption）</span>和解密<span class="zhen">（decryption）</span>用同一把密钥<span class="zhen">（key）</span>，是对称算法<span class="zhen">（symmetric algorithm）</span>。Diffie-Hellman、ElGamal、RSA 都是公钥<span class="zhen">（public key）</span>（非对称<span class="zhen">（asymmetric）</span>）算法。`,
op:[`✗ 公钥<span class="zhen">（public key）</span>密钥交换<span class="zhen">（key exchange）</span>。`,`✓`,`✗ 公钥算法<span class="zhen">（public key algorithm）</span>。`,`✗ 公钥算法<span class="zhen">（public key algorithm）</span>。`],
tip:`对称<span class="zhen">（symmetric）</span>：DES、3DES、AES；非对称<span class="zhen">（asymmetric）</span>：RSA、DH、ElGamal、ECC。`,ref:`P4 对称加密<span class="zhen">（symmetric encryption）</span>`},

{id:'1.n2',p:1,s:'n',q:`A phishing attack aims to`,
o:[`Exploit hardware`,`Trick users into revealing confidential information`,`Encrypt files automatically`,`Crash the server`],a:1,
zh:`钓鱼<span class="zhen">（phishing）</span>攻击的目的是什么？`,
ex:`钓鱼<span class="zhen">（phishing）</span>攻击冒充<span class="zhen">（masquerading）</span>可信方发邮件或消息，<b>骗用户交出</b>密码<span class="zhen">（password）</span>、银行卡等机密信息，或点开恶意链接（P1-44）。`,
op:[`✗`,`✓ 骗人交出机密信息。`,`✗ 那是勒索软件<span class="zhen">（ransomware）</span>。`,`✗ 那是 DoS。`],
tip:`钓鱼<span class="zhen">（phishing）</span>的核心是“骗人”，攻击的是人不是机器。`,ref:`P1-44`},

{id:'5.n3',p:5,s:'n',q:`In a successful TLS handshake, the server must present:`,
o:[`Private key`,`A valid digital certificate`,`A fingerprint`,`A password`],a:1,
zh:`一次成功的 TLS 握手<span class="zhen">（handshake）</span>中，服务器<span class="zhen">（server）</span>必须出示什么？`,
ex:`服务器<span class="zhen">（server）</span>出示<b>有效的数字证书<span class="zhen">（digital certificate）</span></b>（里面有服务器<span class="zhen">（server）</span>公钥<span class="zhen">（public key）</span>），客户端<span class="zhen">（client）</span>验证证书<span class="zhen">（certificate）</span>；私钥<span class="zhen">（private key）</span>永远留在服务器<span class="zhen">（server）</span>上，绝不发送。`,
op:[`✗ 私钥<span class="zhen">（private key）</span>绝不能发出去。`,`✓`,`✗ 指纹<span class="zhen">（fingerprint）</span>是生物识别<span class="zhen">（biometrics）</span>。`,`✗`],
tip:`服务器<span class="zhen">（server）</span>：出示证书<span class="zhen">（certificate）</span>、私钥<span class="zhen">（private key）</span>自己留着；客户端<span class="zhen">（client）</span>：通常不需要证书<span class="zhen">（certificate）</span>。`,ref:`P5 SSL/TLS；录音 W8`},

{id:'2.n1',p:2,s:'n',q:`Social engineering attacks exploit:`,
o:[`Hardware firewalls`,`Human behaviours and trust`,`Cloud storage`,`Open-source code`],a:1,
zh:`社会工程<span class="zhen">（social engineering）</span>攻击利用的是什么？`,
ex:`社会工程<span class="zhen">（social engineering）</span>利用<b>人的行为和信任</b>：冒充<span class="zhen">（masquerading）</span>上级、IT 管理员<span class="zhen">（administrator）</span>或熟人，骗人交出信息或执行操作（P2-36、P2-37）。`,
op:[`✗`,`✓ 人的弱点。`,`✗`,`✗`],
tip:`社会工程<span class="zhen">（social engineering）</span> = 攻击人，不攻击技术。`,ref:`P2-36、P2-37`},

{id:'4.n4',p:4,s:'n',q:`The core principle of asymmetric cryptography is:`,
o:[`Use of public and private key pairs`,`Shared key encryption`,`Password hashing`,`Multiple passwords`],a:0,
zh:`非对称密码学<span class="zhen">（asymmetric cryptography）</span>的核心原理是什么？`,
ex:`非对称<span class="zhen">（asymmetric）</span>（公钥<span class="zhen">（public key）</span>）密码学<span class="zhen">（cryptography）</span>用<b>一对密钥<span class="zhen">（key）</span></b>：公钥<span class="zhen">（public key）</span>公开，私钥<span class="zhen">（private key）</span>保密；用公钥加密<span class="zhen">（public-key encryption）</span>的只能用私钥<span class="zhen">（private key）</span>解，用私钥<span class="zhen">（private key）</span>签名<span class="zhen">（signature）</span>的用公钥<span class="zhen">（public key）</span>验证。`,
op:[`✓ 公钥<span class="zhen">（public key）</span> / 私钥<span class="zhen">（private key）</span>对。`,`✗ 共享密钥<span class="zhen">（shared key）</span>是对称加密<span class="zhen">（symmetric encryption）</span>。`,`✗`,`✗`],
tip:`非对称<span class="zhen">（asymmetric）</span> = 两把钥匙（公钥<span class="zhen">（public key）</span> + 私钥<span class="zhen">（private key）</span>）；对称<span class="zhen">（symmetric）</span> = 一把共享密钥<span class="zhen">（shared key）</span>。`,ref:`P4 公钥加密<span class="zhen">（public-key encryption）</span>`},

{id:'1.n3',p:1,s:'n',q:`Ransomware typically uses:`,
o:[`DDoS`,`SQL Injection`,`Encryption`,`Hashing`],a:2,
zh:`勒索软件<span class="zhen">（ransomware）</span>通常使用什么手段？`,
ex:`勒索软件<span class="zhen">（ransomware）</span>把受害者的文件<b>加密<span class="zhen">（encryption）</span></b>，再索要赎金<span class="zhen">（ransom）</span>（常要比特币<span class="zhen">（Bitcoin）</span>）换取解密<span class="zhen">（decryption）</span>密钥（P1-40、Q&A Q7）。`,
op:[`✗`,`✗`,`✓ 加密<span class="zhen">（encryption）</span>文件。`,`✗ 哈希<span class="zhen">（hash）</span>不可逆，没法“还给你”。`],
tip:`Ransomware = 加密<span class="zhen">（encryption）</span>你的文件 + 要赎金。`,ref:`P1-40；Q&A Q7`},

{id:'4.n5',p:4,s:'n',q:`AES is considered secure due to:`,
o:[`Its use of ECC`,`Double DES`,`Large key sizes, fast operations, and resistance to known attacks`,`Small key size`],a:2,
zh:`AES 为什么被认为是安全的？`,
ex:`AES 有 128/192/256 位的<b>大密钥<span class="zhen">（key）</span></b>，运算快，而且至今抵抗所有已知的实际攻击。`,
op:[`✗ AES 和 ECC 无关。`,`✗ Double DES 是另一种（不安全的）方案。`,`✓`,`✗ 小密钥<span class="zhen">（key）</span>恰恰不安全。`],
tip:`AES：分组 128 位，密钥<span class="zhen">（key）</span> 128/192/256 位，对应 10/12/14 轮。`,ref:`P4 AES`},

{id:'1.n4',p:1,s:'n',q:`Ransomware attacks often involve:`,
o:[`Firewall misconfiguration`,`Spamming users`,`Encrypting data and demanding payment`,`Buffer overflow`],a:2,
zh:`勒索软件<span class="zhen">（ransomware）</span>攻击通常包括什么？`,
ex:`勒索软件<span class="zhen">（ransomware）</span>的标志就是<b>加密<span class="zhen">（encryption）</span>数据并索要赎金<span class="zhen">（ransom）</span></b>。`,
op:[`✗`,`✗`,`✓`,`✗`],
tip:`和 1.n3 是同一个考点。`,ref:`P1-40`},

{id:'1.n5',p:1,s:'n',q:`What does the "C" in CIA triad stand for?`,
o:[`Control`,`Compliance`,`Confidentiality`,`Consistency`],a:2,
zh:`CIA 三元组中的 “C” 代表什么？`,
ex:`CIA = <b>Confidentiality</b>（机密性）、Integrity（完整性）、Availability（可用性）（P1-8）。`,
op:[`✗`,`✗`,`✓`,`✗`],
tip:`老师说 CIA 题有约 20 个版本，注意拼写陷阱。`,ref:`P1-8`},

{id:'1.n6',p:1,s:'n',q:`Which of the following is NOT a type of malware?`,
o:[`Ransomware`,`Firewall`,`Spyware`,`Trojan`],a:1,
zh:`下列哪个不是恶意软件<span class="zhen">（malware）</span>？`,
ex:`<b>防火墙<span class="zhen">（firewall）</span></b>是防御设备，不是恶意软件。勒索软件<span class="zhen">（ransomware）</span>、间谍软件<span class="zhen">（spyware）</span>、木马<span class="zhen">（Trojan horse）</span>都属于 malware（P1-39、P1-40）。`,
op:[`✗ 是恶意软件<span class="zhen">（malware）</span>。`,`✓ 防火墙<span class="zhen">（firewall）</span>是防御手段。`,`✗ 是恶意软件<span class="zhen">（malware）</span>。`,`✗ 是恶意软件<span class="zhen">（malware）</span>。`],
tip:`Malware 家族：virus、worm、trojan、spyware、adware、ransomware、rootkit、logic bomb。`,ref:`P1-39、P1-40`},

{id:'1.n7',p:1,s:'n',q:`Which of the following is an example of a gray-hat hacker`,
o:[`Ransomware attacker`,`Paid penetration tester`,`Unauthorised vulnerability finder who notifies the company and may ask for money`,`State-sponsored threat actor`],a:2,
zh:`下列哪个是灰帽<span class="zhen">（gray hat）</span>黑客<span class="zhen">（hacker）</span>的例子？`,
ex:`灰帽<span class="zhen">（gray hat）</span>：<b>未经授权<span class="zhen">（unauthorized）</span></b>找漏洞<span class="zhen">（vulnerability）</span>，但会通知公司，老师说还可能“要钱”（录音 W3）。受雇的渗透测试<span class="zhen">（penetration testing）</span>员是白帽<span class="zhen">（white hat）</span>，勒索者是黑帽<span class="zhen">（black hat）</span>。`,
op:[`✗ 黑帽<span class="zhen">（black hat）</span>。`,`✗ 白帽<span class="zhen">（white hat）</span>（有授权<span class="zhen">（authorization）</span>）。`,`✓ 灰帽<span class="zhen">（gray hat）</span>。`,`✗ 国家支持的黑客<span class="zhen">（nation-sponsored hacker）</span>。`],
tip:`有授权<span class="zhen">（authorization）</span> = 白；无授权<span class="zhen">（authorization）</span>但通知 = 灰；为私利 = 黑。`,ref:`P1-91；录音 W3`},

{id:'4.n6',p:4,s:'n',q:`Which algorithm is an asymmetric alternative/faster to RSA?`,
o:[`DES`,`AES`,`ECC (Elliptic Curve Cryptography)`,`SHA-2`],a:2,
zh:`哪个算法是 RSA 的非对称<span class="zhen">（asymmetric）</span>替代方案（更快）？`,
ex:`<b>ECC</b> 也是公钥算法<span class="zhen">（public key algorithm）</span>，用短得多的密钥<span class="zhen">（key）</span>达到同样安全强度（256 位 ECC ≈ 3072 位 RSA），所以更快、更省资源。DES、AES 是对称算法<span class="zhen">（symmetric algorithm）</span>，SHA-2 是哈希<span class="zhen">（hash）</span>。`,
op:[`✗ 对称<span class="zhen">（symmetric）</span>。`,`✗ 对称<span class="zhen">（symmetric）</span>。`,`✓`,`✗ 哈希<span class="zhen">（hash）</span>。`],
tip:`同等安全下 ECC 密钥<span class="zhen">（key）</span>更短 → 更快，适合手机和 IoT。`,ref:`P4 ElGamal & ECC`},

{id:'5.n4',p:5,s:'n',q:`IDS stands for:`,
o:[`Integrated Defence Setup`,`Intrusion Detection System`,`Internet Detection System`,`Internal Data Server`],a:1,
zh:`IDS 是什么的缩写？`,
ex:`IDS = <b>Intrusion Detection System</b>，入侵检测系统；IPS = Intrusion Prevention System，入侵防御系统。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`IDS 只检测报警；IPS 还能主动拦截。`,ref:`P5 IDS/IPS`},

{id:'1.n8',p:1,s:'n',q:`The cybersecurity attack landscape refers to`,
o:[`Physical locations of data centres`,`Evolving threats, tools, targets, and attack patterns`,`Firewalls in cloud systems`,`Server power usage`],a:1,
zh:`网络安全<span class="zhen">（cyber security）</span>的攻击态势（attack landscape）指什么？`,
ex:`威胁态势<span class="zhen">（threat landscape）</span>指<b>不断变化的威胁<span class="zhen">（threat）</span>、攻击工具、攻击目标和攻击方式</b>的全貌。了解它才能设计防御（P1-38）。`,
op:[`✗`,`✓`,`✗`,`✗`],
tip:`对照官方样题 1.10：了解威胁态势<span class="zhen">（threat landscape）</span> → 知道谁会攻、怎么攻。`,ref:`P1-3、P1-38`},

{id:'4.n7',p:4,s:'n',q:`A cryptographic hash function must be:`,
o:[`Slower than encryption`,`Reversible`,`Deterministic`,`Key-based`],a:2,
zh:`密码学<span class="zhen">（cryptography）</span>哈希函数<span class="zhen">（hash function）</span>必须具备什么性质？`,
ex:`同一输入永远得到同一个摘要<span class="zhen">（digest）</span>，这就是<b>确定性</b>，否则无法用来校验。哈希<span class="zhen">（hash）</span>是单向<span class="zhen">（one-way）</span>的、不可逆；普通哈希<span class="zhen">（hash）</span>不需要密钥<span class="zhen">（key）</span>（带密钥<span class="zhen">（key）</span>的是 HMAC）。`,
op:[`✗ 哈希<span class="zhen">（hash）</span>通常很快。`,`✗ 哈希<span class="zhen">（hash）</span>不可逆。`,`✓`,`✗ 那是 MAC/HMAC。`],
tip:`哈希<span class="zhen">（hash）</span>：确定性、单向<span class="zhen">（one-way）</span>、抗碰撞<span class="zhen">（collision resistance）</span>、雪崩效应<span class="zhen">（avalanche effect）</span>。`,ref:`P4 Hash`},

{id:'4.n8',p:4,s:'n',q:`Which is the RSA decryption function?`,
o:[`C^e mod n`,`C^d mod n`,`C × e × n`,`log(C, e)`],a:1,
zh:`RSA 的解密<span class="zhen">（decryption）</span>函数是哪个？`,
ex:`RSA 加密<span class="zhen">（encryption）</span> C = M<sup>e</sup> mod n（用公钥<span class="zhen">（public key）</span> e），解密<span class="zhen">（decryption）</span> <b>M = C<sup>d</sup> mod n</b>（用私钥<span class="zhen">（private key）</span> d）。考试系统里上标常常丢失，“Cd mod n”就是 C 的 d 次方模 n，<b>选它</b>。`,
op:[`✗ 那是用公钥<span class="zhen">（public key）</span>再算一次，相当于加密<span class="zhen">（encryption）</span>。`,`✓ C 的 d 次方模 n。`,`✗ RSA 是模幂<span class="zhen">（modular exponentiation）</span>，不是乘法。`,`✗ RSA 不用对数。`],
tip:`加密<span class="zhen">（encryption）</span>用 e，解密<span class="zhen">（decryption）</span>用 d；签名<span class="zhen">（signature）</span>反过来：S = M^d mod n，验证 S^e mod n。`,ref:`P4 RSA`}
]);

/* 学校 Mock-Up Quiz 里出现过的官方样题 */
['1.01','1.02','1.13','1.16'].forEach(function(id){window.MCQ.forEach(function(q){if(q.id===id)q.mock=1})});

/* 计算选择题：按老师口径出数（密码学题的素数都 < 20），干扰项用常见算错的结果。calc:1 = 计算题。 */
window.MCQ = (window.MCQ || []).concat([
{id:'1.k1',p:1,s:'c',calc:1,q:`A 4-character password uses lowercase letters only (a–z). An attacker tries 1,000 passwords per second. How long does it take to try every combination?`,
o:[`About 0.1 seconds`,`About 457 seconds (≈ 7.6 minutes)`,`About 104 seconds`,`About 4,570 seconds`],a:1,
zh:`4 位纯小写字母<span class="zhen">（lowercase letter）</span>密码<span class="zhen">（password）</span>，每秒试 1,000 次，穷举全部组合要多久？`,
ex:`组合数<span class="zhen">（number of combinations）</span> = 字符集<span class="zhen">（character set）</span><sup>长度</sup> = 26<sup>4</sup> = 456,976。<br>时间 = 456,976 ÷ 1,000 ≈ <b>457 秒</b>（约 7.6 分钟）。`,
op:[`✗`,`✓ 26⁴ ÷ 1000。`,`✗ 把 26×4 当成组合数<span class="zhen">（number of combinations）</span>了。`,`✗ 多乘了 10。`],
tip:`组合数<span class="zhen">（number of combinations）</span>是 N 的 L 次方，不是 N×L。`,ref:`P1-55～P1-57`},

{id:'1.k2',p:1,s:'c',calc:1,q:`A 10-character password uses all 95 printable characters. An attacker can test 10^10 passwords per second. Roughly how long is the worst-case brute-force time?`,
o:[`About 1.9 years`,`About 190 years`,`About 19,000 years`,`About 6 × 10^9 years`],a:1,
zh:`10 位密码<span class="zhen">（password）</span>，可用 95 个可打印字符<span class="zhen">（printable characters）</span>，每秒试 10¹⁰ 次，最坏情况要多久？`,
ex:`组合数<span class="zhen">（number of combinations）</span> 95<sup>10</sup> ≈ 5.99 × 10<sup>19</sup>。<br>秒数 = 5.99 × 10<sup>19</sup> ÷ 10<sup>10</sup> ≈ 5.99 × 10<sup>9</sup> 秒。<br>换算成年：÷ 31,536,000（365×24×3600）≈ <b>190 年</b>。`,
op:[`✗ 少了两个数量级。`,`✓`,`✗ 多了两个数量级。`,`✗ 那是秒数，忘了换算成年。`],
tip:`老师：“最容易拿的 15 分”，最后一步 ÷ 31,536,000 别忘。`,ref:`P1-55～P1-57；录音 W2`},

{id:'1.k3',p:1,s:'c',calc:1,q:`An 8-character password uses 62 characters (a–z, A–Z, 0–9). A botnet of 100 machines attacks it, each testing 10^9 passwords per second. How long to try every combination?`,
o:[`About 3.6 seconds`,`About 36 minutes`,`About 2.5 days`,`About 6 hours`],a:1,
zh:`8 位密码<span class="zhen">（password）</span>，62 个字符；100 台僵尸机<span class="zhen">（zombie computers）</span>一起破解，每台每秒 10⁹ 次。穷举要多久？`,
ex:`组合数<span class="zhen">（number of combinations）</span> 62<sup>8</sup> ≈ 2.18 × 10<sup>14</sup>。<br>总速度 = 100 × 10<sup>9</sup> = 10<sup>11</sup> 次/秒。<br>时间 = 2.18 × 10<sup>14</sup> ÷ 10<sup>11</sup> ≈ 2,183 秒 ≈ <b>36 分钟</b>。`,
op:[`✗`,`✓ 有 bots 再除以 bot 数。`,`✗ 那是只有 1 台机器的结果。`,`✗`],
tip:`有 bots：总速度 = 单机速度 × bot 数。`,ref:`P1-55～P1-57；录音 W2`},

{id:'1.k4',p:1,s:'c',calc:1,q:`An attacker floods a 100 Mbps link with 1,000-byte ICMP packets. How many packets per second are needed to saturate the link?`,
o:[`100,000`,`12,500`,`1,250`,`12.5`],a:1,
zh:`用 1,000 字节<span class="zhen">（byte）</span>的 ICMP 包塞满 100 Mbps 链路<span class="zhen">（link）</span>，每秒要多少个包？`,
ex:`pps = 链路速率（bit/s）÷（包大小<span class="zhen">（packet size）</span> × 8）= 100,000,000 ÷ 8,000 = <b>12,500</b>。`,
op:[`✗ 忘了 ×8（字节<span class="zhen">（byte）</span>换成比特）。`,`✓`,`✗ 少了一个数量级。`,`✗`],
tip:`Mbps 是 bit，包大小<span class="zhen">（packet size）</span>是 byte，一定 ×8。`,ref:`P1-68～P1-70`},

{id:'1.k5',p:1,s:'c',calc:1,q:`An attacker sends 5,000 packets per second, each 250 bytes. How much bandwidth does the attack consume?`,
o:[`1.25 Mbps`,`10 Mbps`,`80 Mbps`,`1.25 Gbps`],a:1,
zh:`攻击者<span class="zhen">（attacker）</span>每秒发 5,000 个 250 字节<span class="zhen">（byte）</span>的包，占用多少带宽<span class="zhen">（bandwidth）</span>？`,
ex:`带宽<span class="zhen">（bandwidth）</span> = 5,000 × 250 × 8 = 10,000,000 bit/s = <b>10 Mbps</b>。`,
op:[`✗ 忘了 ×8。`,`✓`,`✗ 多乘了一次 8。`,`✗`],
tip:`反过来算也一样：包数 × 包大小<span class="zhen">（packet size）</span> × 8。`,ref:`P1-68～P1-70`},

{id:'1.k6',p:1,s:'c',calc:1,q:`How many possible 6-character passwords can be formed from digits 0–9 and uppercase letters A–Z?`,
o:[`36 × 6 = 216`,`6^36`,`36^6 ≈ 2.18 × 10^9`,`10^6 + 26^6`],a:2,
zh:`用 0–9 和 A–Z 组成 6 位密码<span class="zhen">（password）</span>，一共有多少种？`,
ex:`字符集<span class="zhen">（character set）</span> = 10 + 26 = 36，组合数<span class="zhen">（number of combinations）</span> = 36<sup>6</sup> = 2,176,782,336 ≈ <b>2.18 × 10<sup>9</sup></b>。`,
op:[`✗`,`✗ 底数<span class="zhen">（base）</span>和指数<span class="zhen">（exponent）</span>反了。`,`✓`,`✗ 字符集<span class="zhen">（character set）</span>要先合并再求幂。`],
tip:`字符集<span class="zhen">（character set）</span>先相加，再求长度次方。`,ref:`P1-55`},

{id:'2.k1',p:2,s:'c',calc:1,q:`Using Risk = Threat × Vulnerability × Asset value (each rated 1–5), what is the risk score for Threat = 4, Vulnerability = 3, Asset value = 5, and what percentage of the maximum is it?`,
o:[`12, 9.6%`,`60, 48%`,`60, 60%`,`20, 16%`],a:1,
zh:`风险<span class="zhen">（risk）</span> = 威胁<span class="zhen">（threat）</span> × 脆弱性<span class="zhen">（vulnerability）</span> × 资产价值<span class="zhen">（asset value）</span>（各 1–5 分）。威胁<span class="zhen">（threat）</span> 4、脆弱性<span class="zhen">（vulnerability）</span> 3、资产价值<span class="zhen">（asset value）</span> 5，风险分<span class="zhen">（risk score）</span>多少？占满分百分之几？`,
ex:`风险分<span class="zhen">（risk score）</span> = 4 × 3 × 5 = <b>60</b>；满分 = 5 × 5 × 5 = 125；60 ÷ 125 = <b>48%</b>。（老师课上把这个例子口误说成“16”，正确是 60。）`,
op:[`✗ 用了加法。`,`✓`,`✗ 满分不是 100，是 125。`,`✗`],
tip:`满分 = 5³ = 125。`,ref:`P2 合规<span class="zhen">（compliance）</span>与风险<span class="zhen">（risk）</span>；录音 W4`},

{id:'2.k2',p:2,s:'c',calc:1,q:`Threat = 2, Vulnerability = 5, Asset value = 4 (each rated 1–5). What percentage of the maximum risk score is this?`,
o:[`40%`,`32%`,`11%`,`80%`],a:1,
zh:`威胁<span class="zhen">（threat）</span> 2、脆弱性<span class="zhen">（vulnerability）</span> 5、资产价值<span class="zhen">（asset value）</span> 4，风险分<span class="zhen">（risk score）</span>占满分的百分之几？`,
ex:`风险分<span class="zhen">（risk score）</span> = 2 × 5 × 4 = 40；40 ÷ 125 = <b>32%</b>。`,
op:[`✗ 把 40 当成了百分比（满分不是 100）。`,`✓`,`✗ 用了加法 (2+5+4)。`,`✗`],
tip:`算完分数一定再除以 125。`,ref:`P2 合规<span class="zhen">（compliance）</span>与风险<span class="zhen">（risk）</span>`},

{id:'4.k1',p:4,s:'c',calc:1,q:`In RSA, p = 3 and q = 11. What is the modulus n?`,
o:[`14`,`20`,`33`,`30`],a:2,
zh:`RSA 中 p = 3、q = 11，模数<span class="zhen">（modulus）</span> n 是多少？`,
ex:`n = p × q = 3 × 11 = <b>33</b>。`,
op:[`✗ p + q。`,`✗ 那是 φ(n)。`,`✓`,`✗`],
tip:`n = pq；φ(n) = (p−1)(q−1)。`,ref:`P4 RSA`},

{id:'4.k2',p:4,s:'c',calc:1,q:`In RSA, p = 5 and q = 7. What is φ(n)?`,
o:[`35`,`34`,`24`,`12`],a:2,
zh:`RSA 中 p = 5、q = 7，φ(n) 是多少？`,
ex:`φ(n) = (p − 1)(q − 1) = 4 × 6 = <b>24</b>。`,
op:[`✗ 那是 n。`,`✗ n − 1 是错的（只有 n 是素数<span class="zhen">（prime number）</span>时才对）。`,`✓`,`✗`],
tip:`φ(n) 不是 n − 1。`,ref:`P4 RSA`},

{id:'4.k3',p:4,s:'c',calc:1,q:`In RSA with p = 3 and q = 7, what is the smallest valid public exponent e (e must be a prime that shares no factor with p − 1 and q − 1)?`,
o:[`2`,`3`,`5`,`7`],a:2,
zh:`RSA 中 p = 3、q = 7，最小的可用公钥<span class="zhen">（public key）</span> e 是多少？（e 是素数<span class="zhen">（prime number）</span>，且和 p−1、q−1 没有公因子<span class="zhen">（common factor）</span>）`,
ex:`φ = 2 × 6 = 12。逐个试素数<span class="zhen">（prime number）</span>：<br>• e = 2：和 p−1 = 2 有公因子<span class="zhen">（common factor）</span>，不行（这就是“e 永远不能是 2”的原因）；<br>• e = 3：和 q−1 = 6 有公因子<span class="zhen">（common factor）</span> 3，不行；<br>• e = <b>5</b>：和 2、6 都没有公因子<span class="zhen">（common factor）</span>，可以。`,
op:[`✗ 2 永远不行。`,`✗ 3 整除 6。`,`✓`,`✗ 7 也可以，但不是最小的。`],
tip:`选 e 三条件：1 < e < φ、e 是素数<span class="zhen">（prime number）</span>、和 p−1、q−1 没有公因子<span class="zhen">（common factor）</span>。`,ref:`P4 RSA；录音 W7`},

{id:'4.k4',p:4,s:'c',calc:1,q:`In RSA, n = 33, φ(n) = 20 and e = 7. What is the private key d?`,
o:[`3`,`7`,`13`,`17`],a:0,
zh:`RSA 中 n = 33、φ(n) = 20、e = 7，私钥<span class="zhen">（private key）</span> d 是多少？`,
ex:`要满足 e × d mod φ = 1。用 k 法：d = (kφ + 1) / e。<br>k = 1：21 ÷ 7 = <b>3</b>，整除。验证：7 × 3 = 21，21 mod 20 = 1 ✓。`,
op:[`✓`,`✗ d 和 e 相同只在特殊情况下成立。`,`✗ 7×13 = 91，91 mod 20 = 11。`,`✗`],
tip:`d = (kφ + 1)/e，k 从 1 开始试，直到整除。`,ref:`P4 RSA；录音 W7`},

{id:'4.k5',p:4,s:'c',calc:1,q:`RSA public key (e = 7, n = 33). Encrypt the message M = 2. What is the ciphertext C?`,
o:[`14`,`29`,`4`,`11`],a:1,
zh:`RSA 公钥 (e = 7, n = 33)，加密<span class="zhen">（encryption）</span> M = 2，密文<span class="zhen">（ciphertext）</span> C 是多少？`,
ex:`C = M<sup>e</sup> mod n = 2<sup>7</sup> mod 33 = 128 mod 33。<br>除法法：128 ÷ 33 = 3.87…，3 × 33 = 99，128 − 99 = <b>29</b>。`,
op:[`✗ 2 × 7 = 14，把幂当成乘法。`,`✓`,`✗`,`✗`],
tip:`计算器没有 mod 键：先除、取整、乘回去、相减。`,ref:`P4 RSA`},

{id:'4.k6',p:4,s:'c',calc:1,q:`RSA private key (d = 3, n = 33). Decrypt the ciphertext C = 8. What is the message M?`,
o:[`24`,`2`,`17`,`8`],a:2,
zh:`RSA 私钥 (d = 3, n = 33)，解密<span class="zhen">（decryption）</span> C = 8，明文<span class="zhen">（plaintext）</span> M 是多少？`,
ex:`M = C<sup>d</sup> mod n = 8<sup>3</sup> mod 33 = 512 mod 33。<br>512 ÷ 33 = 15.5…，15 × 33 = 495，512 − 495 = <b>17</b>。<br>验证：17<sup>7</sup> mod 33 = 8 ✓。`,
op:[`✗ 8 × 3。`,`✗`,`✓`,`✗`],
tip:`解密<span class="zhen">（decryption）</span>用 d：M = C^d mod n。`,ref:`P4 RSA`},

{id:'4.k7',p:4,s:'c',calc:1,q:`RSA keys: n = 33, e = 7, d = 3. Without hashing, what is the digital signature S of the message M = 5?`,
o:[`26`,`5`,`14`,`23`],a:0,
zh:`RSA 密钥<span class="zhen">（key）</span> n = 33、e = 7、d = 3。不用哈希<span class="zhen">（hash）</span>，给消息 M = 5 签名<span class="zhen">（signature）</span>，S 是多少？`,
ex:`签名<span class="zhen">（signature）</span>用<b>私钥<span class="zhen">（private key）</span></b>：S = M<sup>d</sup> mod n = 5<sup>3</sup> mod 33 = 125 mod 33 = 125 − 99 = <b>26</b>。<br>验证用公钥<span class="zhen">（public key）</span>：26<sup>7</sup> mod 33 = 5 = M ✓。`,
op:[`✓`,`✗ 那是验证后得到的 M。`,`✗ 用了 e 签名<span class="zhen">（signature）</span>（5⁷ mod 33 = 14），签名<span class="zhen">（signature）</span>必须用私钥<span class="zhen">（private key）</span>。`,`✗`],
tip:`签名<span class="zhen">（signature）</span>：S = M^d mod n；验证：S^e mod n = M。和加密<span class="zhen">（encryption）</span>正好相反。`,ref:`P4 数字签名<span class="zhen">（digital signature）</span>；录音 W7`},

{id:'4.k8',p:4,s:'c',calc:1,q:`Diffie-Hellman with p = 11, g = 2. Alice's private value is a = 3. What public value does Alice send?`,
o:[`6`,`8`,`3`,`9`],a:1,
zh:`Diffie-Hellman：p = 11、g = 2，Alice 的私密数<span class="zhen">（private value）</span> a = 3。她发出的公开值<span class="zhen">（public value）</span>是多少？`,
ex:`Y<sub>A</sub> = g<sup>a</sup> mod p = 2<sup>3</sup> mod 11 = <b>8</b>。`,
op:[`✗ 2 × 3。`,`✓`,`✗ 私密数<span class="zhen">（private value）</span>不能发出去。`,`✗`],
tip:`公开值<span class="zhen">（public value）</span> Y = g^x mod p。`,ref:`P4 Diffie-Hellman；录音 W6`},

{id:'4.k9',p:4,s:'c',calc:1,q:`Diffie-Hellman with p = 13, g = 2. Alice's private value a = 4, Bob's private value b = 5. What is the shared secret key K?`,
o:[`3`,`6`,`9`,`12`],a:2,
zh:`Diffie-Hellman：p = 13、g = 2，Alice 的 a = 4，Bob 的 b = 5，共享密钥<span class="zhen">（shared key）</span> K 是多少？`,
ex:`Y<sub>A</sub> = 2<sup>4</sup> mod 13 = 16 mod 13 = 3；Y<sub>B</sub> = 2<sup>5</sup> mod 13 = 32 mod 13 = 6。<br>K<sub>A</sub> = Y<sub>B</sub><sup>a</sup> = 6<sup>4</sup> mod 13 = 1296 mod 13 = <b>9</b>；K<sub>B</sub> = Y<sub>A</sub><sup>b</sup> = 3<sup>5</sup> mod 13 = 243 mod 13 = 9 ✓。`,
op:[`✗ 那是 Alice 的公开值<span class="zhen">（public value）</span>。`,`✗ 那是 Bob 的公开值<span class="zhen">（public value）</span>。`,`✓`,`✗`],
tip:`K = (对方的 Y)^(自己的私密数<span class="zhen">（private value）</span>) mod p，双方算出来必须相等。`,ref:`P4 Diffie-Hellman；录音 W6`},

{id:'4.k10',p:4,s:'c',calc:1,q:`10 users each need to communicate securely with every other user. How many keys are needed with symmetric encryption, and how many with public-key encryption?`,
o:[`45 symmetric, 20 public-key`,`90 symmetric, 10 public-key`,`20 symmetric, 45 public-key`,`10 symmetric, 10 public-key`],a:0,
zh:`10 个用户两两之间都要保密通信。对称加密<span class="zhen">（symmetric encryption）</span>需要多少把密钥<span class="zhen">（key）</span>？公钥加密<span class="zhen">（public-key encryption）</span>需要多少把？`,
ex:`对称<span class="zhen">（symmetric）</span>：每对人一把共享密钥<span class="zhen">（shared key）</span>，n(n−1)/2 = 10 × 9 ÷ 2 = <b>45</b>。<br>公钥<span class="zhen">（public key）</span>：每人一对（公钥<span class="zhen">（public key）</span> + 私钥<span class="zhen">（private key）</span>），10 × 2 = <b>20</b> 把。`,
op:[`✓`,`✗ 90 是没除以 2。`,`✗ 反了。`,`✗`],
tip:`对称<span class="zhen">（symmetric）</span>：n(n−1)/2；公钥<span class="zhen">（public key）</span>：2n。对照官方样题 4.23。`,ref:`P4 对称<span class="zhen">（symmetric）</span> vs 公钥<span class="zhen">（public key）</span>`},

{id:'4.k11',p:4,s:'c',calc:1,q:`What is 3^5 mod 7?`,
o:[`1`,`3`,`5`,`6`],a:2,
zh:`3⁵ mod 7 等于多少？`,
ex:`3<sup>5</sup> = 243。除法法：243 ÷ 7 = 34.7…，34 × 7 = 238，243 − 238 = <b>5</b>。`,
op:[`✗`,`✗`,`✓`,`✗`],
tip:`模运算<span class="zhen">（modular arithmetic）</span>不会算就用除法法，考试计算器没有 mod 键。`,ref:`P4 模运算<span class="zhen">（modular arithmetic）</span>；录音 W6`},

{id:'5.k1',p:5,s:'c',calc:1,q:`A firewall sits on a 1 Gbps link where the average packet size is 500 bytes. How many packets per second must it be able to process to keep up with a full link?`,
o:[`2,000,000`,`250,000`,`125,000`,`25,000`],a:1,
zh:`防火墙<span class="zhen">（firewall）</span>接在 1 Gbps 链路<span class="zhen">（link）</span>上，平均包大小<span class="zhen">（average packet size）</span> 500 字节<span class="zhen">（byte）</span>。要跟上满速，每秒至少要处理多少个包？`,
ex:`pps = 1,000,000,000 ÷ (500 × 8) = 1,000,000,000 ÷ 4,000 = <b>250,000</b>。`,
op:[`✗ 忘了 ×8。`,`✓`,`✗`,`✗`],
tip:`和 DoS 包数是同一个公式。`,ref:`P5 防火墙<span class="zhen">（firewall）</span>性能`}
]);
