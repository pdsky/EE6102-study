/* Q and A.pdf — 33 open questions (final-exam style). key = English model answer (condensed), jiang = 中文讲解 */
window.QA = [
{id:'Q1',p:1,q:`What is cyber security?`,
zh:`什么是网络安全<span class="zhen">（cyber security）</span>？`,
key:`<ul><li>Cyber security is the protection of Internet-connected resources — <b>hardware, software and data</b> — from <b>unauthorized use, modification and theft</b> (and physical damage).</li><li>Examples: John uses the Internet to copy Mary's data and then crashes her system; Henry spoofs Julie's IP address to gain access to her computer; John steals ABC bank's data and sells it for $2 million.</li><li>Thus cyber security refers to the <b>policies, procedures and technical measures</b> applied to prevent unauthorized access, alteration, theft or physical damage to smart devices and information systems.</li><li>It aims to preserve the <b>CIA triad</b> (Confidentiality, Integrity, Availability) and is achieved through Products, People and Procedures.</li></ul>`,
jiang:`<p><b>答题框架</b>：定义（保护什么 → 防范什么）→ 2～3 个例子 → 结论句 → 加分点。</p><p>• 保护对象：hardware / software / data；防范：unauthorized use / modification / theft。<br>• 结论句一定要写出 <b>policies + procedures + technical measures</b>：本课程反复强调技术与管理缺一不可（Q18）。<br>• 加分：CIA 三元组（P1-8）、Products-People-Procedures 三实体（P1-10）。</p>`},

{id:'Q2',p:1,q:`Suppose that a network computer virus is designed such a way that as soon as it is copied onto a computer, X, it simply copies itself to six of computer X's neighboring computers and each time it uses a random file name, in order to evade detection. The virus itself does not cause any other damage (it doesn't read, delete or modify any other files). What harm would be done by such a virus and how would it be detected?`,
zh:`一种病毒<span class="zhen">（virus）</span>一被复制到电脑 X，就把自己复制到 X 的 6 台邻近电脑上，每次换一个随机文件名以逃避检测。它本身不读、不删、不改任何文件。它会造成什么危害？怎样检测？`,
key:`<ul><li>Based on the true story of Cornell student <b>Robert Morris</b>; his program (more properly a <b>worm</b>) brought the Internet to its knees.</li><li>Each infected machine copies to 6 neighbours, which copy back to X and onward: 6 → 36 → 216 → … copies grow <b>exponentially</b>.</li><li>Soon X's disk fills with copies; the copies also consume all available <b>bandwidth and CPU</b>, eventually crashing X. It is therefore a <b>denial-of-service (DoS)</b> attack, even without a destructive payload.</li><li>Detection: look for <b>unusual activity</b> — sudden surges in network traffic, mail activity, slowdowns — and investigate. Because random file names defeat signature matching, <b>anomaly-based</b> detection is needed.</li></ul>`,
jiang:`<p><b>关键洞察</b>：“不破坏文件”不等于“无害”。病毒<span class="zhen">（virus）</span>没有 payload，但自我复制<span class="zhen">（self-replication）</span>本身就会耗尽资源，破坏的是 CIA 中的 <b>Availability</b>。</p><p><b>指数增长<span class="zhen">（exponential growth）</span></b>：第 k 轮约有 6<sup>k</sup> 份副本：6、36、216、1296……而且邻居还会再复制回 X，所以 X 会被反复感染。</p><p><b>检测加分点</b>：随机文件名让<b>基于特征（signature）</b>的检测失效，所以要用<b>基于异常（anomaly）</b>的检测：建立正常流量<span class="zhen">（traffic）</span>基线<span class="zhen">（baseline）</span>，流量<span class="zhen">（traffic）</span>突增就告警（P5-93）。这样把 Part 1 和 Part 5 串起来，是很好的得分点。</p>`},

{id:'Q3',p:1,q:`Describe various types of cyber security threats and explain why despite huge advances in technology and encryption techniques it is not possible to provide 100% security for a smart device connected to an internet.`,
zh:`描述各类网络安全<span class="zhen">（cyber security）</span>威胁<span class="zhen">（threat）</span>，并解释为什么技术和加密<span class="zhen">（encryption）</span>进步巨大，联网智能设备仍不可能做到 100% 安全。`,
key:`<ul><li><b>Criminal attacks</b>: financial gain — fraud, destruction, theft (personal, brand, identity).</li><li><b>Privacy violations</b>: personal information acquired by unauthorized organizations — surveillance, databases, traffic analysis.</li><li><b>Publicity attacks</b>: attackers want their names in the papers; can affect ANY system.</li><li>The Internet's characteristics aid attackers: <b>Automation</b> (speed makes minimal-return attacks worthwhile; data mining is easy), <b>Action at a distance</b> (attackers far away; international legal differences hinder prosecution), <b>Electronic techniques easily transferable/duplicated</b> (counterfeit e-money; tools created by one person and easily modified).</li><li>Therefore it is impossible to obtain perfect security. Security is a <b>balance between protection, ease of use and availability</b>; no system can be 100% secure.</li></ul>`,
jiang:`<p><b>两段式作答</b>：① 威胁<span class="zhen">（threat）</span>类型（Criminal / Privacy / Publicity，可以补充 Legal、Insider，以及 P1-38 的六类攻击：malware、DoS、social engineering、SQL injection、MITM、password）；② 不可能 100% 安全的原因。</p><p>“为什么不可能 100%”可以从三个角度写：<br>1. 互联网<span class="zhen">（Internet）</span>三特征让攻击成本低、难追责（P1-37）；<br>2. 人是最弱一环，技术挡不住社会工程（P2-31）；<br>3. 安全与可用性<span class="zhen">（availability）</span>要权衡，绝对安全意味着不可用（P6-116："Security should be considered balance between protection and availability"）。<br>可以引用零日漏洞（Q15）作为补充例子。</p>`},

{id:'Q4',p:1,q:`The "Ransomware" attacks of May 2017, affected over 300,000 devices in 150 countries resulting in estimated cost of over $5+ billion. Discuss the working of Ransomware virus and how it is spread?`,
zh:`2017 年 5 月的勒索软件<span class="zhen">（ransomware）</span>攻击影响了 150 国 30 多万台设备，损失超 50 亿美元。讨论勒索病毒<span class="zhen">（ransomware）</span>的工作原理和传播方式。`,
key:`<ul><li>Ransomware: hackers take control of a computer system and <b>block access until a ransom is paid</b>.</li><li>To gain access, criminals must get malicious software onto a device in the network — often by getting a victim to <b>click a link or download it by mistake</b> (phishing email attachment).</li><li>Once on the victim's computer, the attack <b>locks/encrypts all files</b> it can find within the network — gradually, file after file.</li><li>Victims are asked to pay via <b>cryptocurrency</b> so attackers cannot be tracked. Even after paying, victims may not get their data; mediator companies sometimes negotiate.</li><li>Large organizations have paid huge ransoms (e.g., Acer was asked for $50M; JBS paid $11M).</li></ul>`,
jiang:`<p><b>工作原理三步</b>：入侵<span class="zhen">（intrusion）</span>（钓鱼邮件<span class="zhen">（phishing email）</span>、恶意链接<span class="zhen">（malicious link）</span>）→ 加密<span class="zhen">（encryption）</span>（逐个加密<span class="zhen">（encryption）</span>文件，并在内网<span class="zhen">（internal network）</span>横向扩散）→ 勒索（用加密货币<span class="zhen">（cryptocurrency）</span>支付）。</p><p><b>传播</b>：2017 年 5 月的 WannaCry 还利用了 Windows SMB 漏洞<span class="zhen">（vulnerability）</span>像<b>蠕虫<span class="zhen">（worm）</span></b>一样自动传播，而微软两个月前就发布了补丁<span class="zhen">（patch）</span>（见 Q12）。答题时点出“钓鱼<span class="zhen">（phishing）</span> + 未打补丁<span class="zhen">（unpatched）</span>”两条传播路径，会更完整。</p><p><b>为什么用加密货币<span class="zhen">（cryptocurrency）</span></b>：难追踪（P1-40 "normally using Bitcoin"）。</p>`},

{id:'Q5–Q9',p:1,q:`Ransomware quick facts: Q5 What is ransomware? Q6 Where did it originate? Q7 How does it affect a computer? Q8 How can you protect yourself? Q9 How much are victims expected to pay?`,
zh:`勒索软件<span class="zhen">（ransomware）</span>速答五连问：是什么？起源？怎样影响电脑？怎样自保？要付多少钱？`,
key:`<ul><li><b>Q5</b>: Malicious software that <b>locks a device</b> (computer, tablet, smartphone) and then <b>demands a ransom</b> to unlock it.</li><li><b>Q6</b>: The first documented case appeared in <b>2005 in the United States</b>, then quickly spread worldwide.</li><li><b>Q7</b>: Normally contained in an <b>email attachment</b> masquerading as something innocent; once opened it <b>encrypts the hard drive</b>, making photos, documents etc. inaccessible.</li><li><b>Q8</b>: <b>Anti-virus software</b> can protect your machine, although criminals constantly find new ways around it.</li><li><b>Q9</b>: Varies; on average about <b>$300 in bitcoins</b>, with no guarantee of getting data back. Large organizations are asked for much more (Acer: $50M).</li></ul>`,
jiang:`<p>这一组适合出简答题或选择题，记住关键数字：<b>2005 年美国</b>首例；平均 <b>$300 比特币<span class="zhen">（Bitcoin）</span></b>；Acer 被勒索 <b>$5000 万</b>（P1-25，当时有记录的最大一笔赎金<span class="zhen">（ransom）</span>）。</p><p>Q8 的标准答案只写了杀毒软件<span class="zhen">（antivirus software）</span>；考试可以补充 Q10 的<b>离线备份<span class="zhen">（offline backup）</span></b>，这才是最有效的手段。</p>`},

{id:'Q10',p:1,q:`How one can protect itself from Ransomware attack?`,
zh:`如何防范勒索软件<span class="zhen">（ransomware）</span>攻击？`,
key:`<ul><li>The best protection is to have all files <b>backed up in a completely separate system</b>; if attacked, no information is lost.</li><li>It is difficult to stop determined hackers, but <b>exercising caution</b> helps: attackers must first get the malicious software onto the device.</li><li>The most common infection routes are <b>compromised emails and websites</b> — don't open suspicious attachments or links.</li><li><b>Educate yourself and use technology</b> (anti-virus, patching, firewalls) to protect your devices.</li></ul>`,
jiang:`<p><b>得分点排序</b>：① 隔离的备份<span class="zhen">（backup）</span>（最重要；勒索软件<span class="zhen">（ransomware）</span>会加密<span class="zhen">（encryption）</span>网内所有能访问到的文件，所以备份<span class="zhen">（backup）</span>必须<b>隔离</b>）；② 小心邮件和网站；③ 教育 + 技术。</p><p>可以补充课件 P2-48 的“如何避免勒索软件<span class="zhen">（ransomware）</span>”：不随便下载文件、警惕带附件<span class="zhen">（attachment）</span>的钓鱼邮件<span class="zhen">（phishing email）</span>、不把公司邮箱和密码<span class="zhen">（password）</span>用在私人用途、不把密码<span class="zhen">（password）</span>存在文本文件或表格里。</p>`},

{id:'Q11',p:1,q:`On Tuesday, 27 June 2017, second wave of "Ransomware" attacks was successfully launched. Explain why the lessons were not learnt from the first wave of attacks and why the second wave was also successful?`,
zh:`2017 年 6 月 27 日第二波勒索攻击<span class="zhen">（ransomware attack）</span>又成功了。为什么第一波的教训没被吸取？为什么第二波也成功了？`,
key:`<ul><li>Most organizations <b>did not have security policies in place</b> to handle this sort of situation.</li><li>When the second wave was launched, they simply <b>didn't know what to do</b>, so it was also successful.</li><li>(Lessons not learnt: systems still unpatched, no incident-response plan, no staff training.)</li></ul>`,
jiang:`<p>核心论点：<b>问题出在管理，而不是技术</b>。第一波过后，很多组织只是“救火”，没有建立<b>策略<span class="zhen">（policy）</span>、补丁管理流程<span class="zhen">（patch management process）</span>、事件响应计划<span class="zhen">（incident response plan）</span></b>。</p><p>可以联系 P6-112："A compromise is not the right time to think about what to do"，响应必须是 “reacting according to plan”。没有计划，就会重复犯错。</p>`},

{id:'Q12',p:1,q:`Was the reasons for "Ransomware's" success due to lack of technical expertise or due to lack of policies and its enforcements?`,
zh:`勒索软件<span class="zhen">（ransomware）</span>得手，是因为缺少技术能力，还是缺少策略<span class="zhen">（policy）</span>及其执行？`,
key:`<ul><li><b>Both</b> technical and non-technical aspects of information security.</li><li><b>Patching</b> (technical/procedural): Microsoft had issued patches <b>two months earlier</b>, but infected computers were not updated.</li><li><b>Training</b> (policy/people): <b>83%</b> of ransomware attacks originate when an employee clicks a malicious link, so investing in anti-phishing and malware training should be a priority.</li></ul>`,
jiang:`<p>这类“A 还是 B”的问题，本课程的标准答案几乎都是 <b>Both</b>（参见 Q18：只重技术<span class="zhen">（technology-centric）</span>或只重策略<span class="zhen">（policy）</span>的做法一定失败）。</p><p>两个必背证据：<b>补丁<span class="zhen">（patch）</span>早两个月就发布了</b>；<b>83% 的攻击始于员工点击链接</b>。</p>`},

{id:'Q13',p:1,q:`Eve installed some spyware software on 1000 USB flash drives and has designed this software to auto load from these drives along with some photos of a famous star. She then painted the logo of a well-known magazine on each one and randomly scattered these flash drives in the parking lots of several large companies in her town. What type of malware attack is this and what vulnerability is she trying to exploit in order to get her malware code past the network firewalls of these companies?`,
zh:`Eve 在 1000 个 U 盘<span class="zhen">（USB drive）</span>里装了会自动加载的间谍软件<span class="zhen">（spyware）</span>，附上明星照片，印上知名杂志的 logo，散落在几家大公司的停车场。这是什么类型的恶意软件<span class="zhen">（malware）</span>攻击？她想利用什么漏洞<span class="zhen">（vulnerability）</span>来绕过公司防火墙<span class="zhen">（firewall）</span>？`,
key:`<ul><li>This is a <b>Trojan horse</b> attack: users expect photos of a famous star (given the magazine logo) but do not expect the spyware.</li><li>Eve wants employees to insert the drives into company computers <b>inside the firewall</b>, exploiting the vulnerability of <b>auto-execution (autorun) being enabled</b>, so the spyware loads along with the expected photos.</li><li>She is also exploiting <b>social engineering</b> (curiosity).</li></ul>`,
jiang:`<p>三个关键词：<b>Trojan horse</b>（伪装成有用的东西）、<b>autorun</b>（技术漏洞<span class="zhen">（technical vulnerability）</span>）、<b>social engineering</b>（利用好奇心）。</p><p><b>为什么能绕过防火墙<span class="zhen">（firewall）</span></b>：防火墙<span class="zhen">（firewall）</span>只管经过它的网络流量<span class="zhen">（network traffic）</span>，U 盘<span class="zhen">（USB drive）</span>是员工亲手带进内网<span class="zhen">（internal network）</span>的（防火墙<span class="zhen">（firewall）</span>防不了 bypass 它的攻击，见样题 Q5-12、P5-54）。</p><p>课件对策 P2-49："Don't plug any USB that isn't yours into your device." 孟加拉央行案也怀疑恶意软件<span class="zhen">（malware）</span>经共享 U 盘<span class="zhen">（USB drive）</span>传播（P6-110）。</p>`},

{id:'Q14',p:1,q:`Suppose you want to use an Internet cafe to login to your personal account on a bank web site, but you suspect that the computers in this cafe are infected with software keyloggers. Assuming that you can have both a web browser window and a text editing window open at the same time, describe a scheme that allows you to type in your userID and password so that a keylogger, used in isolation of any screen captures or mouse event captures, would not be able to discover your userID and password.`,
zh:`在网吧登录网银，怀疑电脑装了键盘记录器<span class="zhen">（keylogger）</span>。可以同时开浏览器<span class="zhen">（browser）</span>和文本编辑器，设计一种输入方法，使只记录键盘（不截屏、不记录鼠标）的记录器无法得到你的账号密码<span class="zhen">（password）</span>。`,
key:`<ul><li>Open the bank login page in the browser and a <b>new unnamed file</b> in a text editor.</li><li>Use the <b>mouse to toggle</b> input focus between the two windows.</li><li>In the browser window, type <b>a single character</b> of the userID/password, then click back to the text editor.</li><li>In the text editor, type a <b>reasonably long sequence of random characters</b>.</li><li>Repeat. The keylogger sees one long stream of random characters with the real characters intermixed, hard to detect.</li></ul>`,
jiang:`<p><b>原理</b>：键盘记录器<span class="zhen">（keylogger）</span>只记录<b>按键顺序</b>，不知道每个键落在哪个窗口；用鼠标切换窗口是它看不到的。真实字符被淹没在大量噪声里。</p><p><b>题目限定条件</b>（不截屏、不记录鼠标）一定要在答案里呼应：如果记录器能截屏或记录鼠标点击，这个方法就失效。</p>`},

{id:'Q15',p:1,q:`What is the difference between a skilled hacker and an unskilled hacker (other than the lack of skill)? How does protection against each differ?`,
zh:`熟练黑客<span class="zhen">（hacker）</span>和不熟练黑客<span class="zhen">（hacker）</span>除技能外有何区别？对两者的防护有何不同？`,
key:`<ul><li><b>Expert hacker</b>: develops software scripts and code to exploit relatively <b>unknown vulnerabilities</b>; masters several programming languages, protocols and operating systems.</li><li><b>Unskilled hacker</b> (script kiddie / hacker in training): <b>uses scripts and code developed by skilled hackers</b>; rarely writes their own hacks.</li><li>Protecting against an expert is much harder: they often use <b>new attack code</b>, almost impossible to guard against at first — <b>zero-day attacks</b>.</li><li>Unskilled hackers use <b>publicly available tools</b>, so protection = staying <b>up to date with patches</b> and being aware of published hacking tools.</li></ul>`,
jiang:`<p>对比表答法最清楚：</p><table class="mini"><tr><th></th><th>Expert</th><th>Script kiddie</th></tr><tr><td>工具</td><td>自己写，攻击未知漏洞<span class="zhen">（vulnerability）</span></td><td>用别人写好的</td></tr><tr><td>威胁<span class="zhen">（threat）</span></td><td>零日攻击<span class="zhen">（zero-day attack）</span></td><td>已知攻击<span class="zhen">（known attack）</span></td></tr><tr><td>防护</td><td>难：纵深防御<span class="zhen">（defense in depth）</span> + 异常检测<span class="zhen">（anomaly detection）</span></td><td>易：及时打补丁<span class="zhen">（patching）</span> + 关注公开工具</td></tr></table><p>呼应 P1-91 的黑客分类<span class="zhen">（hacker classification）</span>和 P1-95 的动机（script kiddies 为了 gain respect）。</p>`},

{id:'Q16',p:1,q:`Why it is easy to find secret information (like password, credit card, social security etc.) via social engineering and social networks?`,
zh:`为什么通过社会工程<span class="zhen">（social engineering）</span>和社交网络<span class="zhen">（social network）</span>很容易获取密码<span class="zhen">（password）</span>、信用卡<span class="zhen">（credit card）</span>号、社保号<span class="zhen">（social security number）</span>等秘密信息？`,
key:`<ul><li>Social networks let you share messages, pictures, files and up-to-the-minute information about what you are doing and <b>where you are</b>.</li><li>They are owned by private businesses that make money by <b>collecting and selling data</b> about individuals, particularly to third-party advertisers.</li><li>On these sites you leave the freedoms of the Internet and enter a network <b>governed by the site's owners</b>.</li><li>Most risks are <b>old scams with new twists</b> — e.g., a Facebook post that seems to come from a friend; it is hard not to click.</li><li>Social engineers <b>mine social networks to build trust</b>; once they know your likes, friends and daily updates, gaining your trust is easy.</li></ul>`,
jiang:`<p>答题逻辑：<b>信息多</b>（用户自己公开）→ <b>平台卖数据</b> → <b>规则由平台定</b> → <b>老骗术换新包装</b> → <b>建立信任</b>（社会工程<span class="zhen">（social engineering）</span>最大的武器）。</p><p>联系 spear phishing（P2-40：攻击者<span class="zhen">（attacker）</span>研究过你、知道你的家人和老板）和 P2-43 的假好友账号。</p>`},

{id:'Q17',p:1,q:`I am using an unsecured Wi-Fi from a neighbour. Am I compromising my cyber security?`,
zh:`我在用邻居没加密<span class="zhen">（unencrypted）</span>的 Wi-Fi，这会危及我的网络安全<span class="zhen">（cyber security）</span>吗？`,
key:`<ul><li>Yes. <b>Login information interception</b>: data over unsecured Wi-Fi can be intercepted and login credentials extracted to access banking, email etc. (identity theft).</li><li><b>Sensitive information interception</b>: instant messages, emails and other data can be intercepted — especially dangerous for corporate information.</li><li><b>Compromised devices</b> may also be connected to the same Wi-Fi.</li><li><b>Malicious hotspots</b>: most dangerously, the hotspot itself may be malicious.</li><li>Using unsecured Wi-Fi can lead to identity theft and credit fraud.</li></ul>`,
jiang:`<p>四个风险<span class="zhen">（risk）</span>点：凭证<span class="zhen">（credentials）</span>被截获、敏感信息被截获、同网段<span class="zhen">（network segment）</span>的被感染设备、<b>热点<span class="zhen">（hotspot）</span>本身就是恶意的</b>（即 MITM 攻击，P1-60 的预防措施里就有 "Refrain from using public Wi-Fi networks"）。</p><p>补充对策：只访问 HTTPS 网站（P5-5）、使用 VPN、不在这种网络上做敏感操作。</p>`},

{id:'Q18',p:3,q:`What are the two aspects of computer security and explain why computer security strategies that are technology-centric or policy-centric always fail. Also suggest ways to overcome this major problem?`,
zh:`计算机安全的两个方面是什么？为什么只重技术<span class="zhen">（technology-centric）</span>或只重策略<span class="zhen">（policy）</span>的安全战略总会失败？如何克服？`,
key:`<ul><li>Two aspects: <b>Technological</b> (hardware, software, network — encryption, firewalls, biometrics) and <b>Managerial</b> (policies, procedures, operational and human issues).</li><li>The two groups have different roles; the problem is that they <b>don't understand and appreciate each other's work</b>, and without cooperation neither succeeds.</li><li><b>Technology-centric</b> strategies are weak without strong policies and practices.</li><li><b>Policy-centric</b> strategies are ineffective without technology to monitor and enforce them.</li><li>Solution — a comprehensive, multi-faceted approach: <b>senior management support, strong and sensible policies, practical procedures, modern security technologies</b>. Information security is a management issue and a people issue.</li></ul>`,
jiang:`<p>这是<b>本课程的核心论点</b>，期末大题很可能考。</p><p>答题四段：① 两个方面（P3-5）；② 失败原因（两拨人互不理解）；③ 各自的缺陷（技术没有策略<span class="zhen">（policy）</span> → 弱；策略<span class="zhen">（policy）</span>没有技术 → 无法执行）；④ 四要素方案。</p><p>加分：联系 DLM 四层防御（P3-13：高层支持<span class="zhen">（senior management support）</span> → 使用政策<span class="zhen">（usage policy）</span> → 安全流程 → 技术工具）和 People-Process-Technology 三角（P3-16），再举 Equifax 为例：策略<span class="zhen">（policy）</span>要求 48 小时打补丁<span class="zhen">（patching）</span>，却 5 个月没执行（P6-103）。</p>`},

{id:'Q19',p:3,q:`Assume that you have been appointed a security consultant in a start-up company which is starting branches in several countries. The higher management is not very technical; however, they do know the importance of cyber security and are all geared up to support whatever measure you are willing to take. Thus, describe the two most important steps you will take?`,
zh:`你被一家在多国开分支的初创公司聘为安全顾问，高层不懂技术但很支持。描述你要做的两个最重要的步骤。`,
key:`<ul><li><b>Step 1 — Identification</b>: identify what the organization needs to protect (assets) and against what attacks; identify the types of threat facing its information systems.</li><li><b>Step 2 — Understand vulnerabilities</b>: which may be due to human errors or the complexity of software.</li></ul>`,
jiang:`<p>两步：<b>识别资产<span class="zhen">（asset）</span>与威胁<span class="zhen">（threat）</span></b> → <b>理解脆弱性<span class="zhen">（vulnerability）</span></b>。这就是风险评估<span class="zhen">（risk assessment）</span>的前半部分（P2-53 Identify → Assess → Analyze；P2-57 Risk = Threat × Vulnerability × Asset）。</p><p>“多国分支”是加分提示：不同国家的合规<span class="zhen">（compliance）</span>要求不同（GDPR 等，P3-4），而且要注意 action at a distance 带来的跨国法律问题（P1-37）。</p>`},

{id:'Q20',p:3,q:`In Q19, if the top management was not keen on cyber security, would you still be able to design, implement and manage the security system? If not then what would you need to do to convince the higher management that the security should be taken seriously.`,
zh:`如果高层不重视安全，你还能设计、实施和管理安全系统吗？若不能，怎样说服高层？`,
key:`<ul><li>One can design and implement the system, but <b>without proper policies and enforcement it will not be effective</b>.</li><li>Convince management by making them realize the <b>extent of the problem and what is at risk</b>: data, knowledge, software, physical, financial, employee, customer & partner assets, and goodwill.</li><li>Employees will not change behaviour if they do not see <b>respect for security by their superiors</b>.</li><li>Inform management of threats using attention-getting facts: 100,000 e-commerce sites attacked each week; Yahoo! lost $1 billion in share price after a DoS attack; 39% of companies had DoS downtime over 8 hours; IP theft costs US businesses over $250 billion a year (ASIS).</li></ul>`,
jiang:`<p>先回答“能不能”：<b>能做，但不会有效</b>（缺乏 top-down 支持，P3-10 的 bottom-up 缺点）。</p><p>再回答“怎么说服”：<b>用钱说话</b>，列出风险资产<span class="zhen">（assets at risk）</span>清单（P1-12），用真实事件和数字（可以换成课件里更新的案例：Equifax 罚款 7 亿美元、MGM 损失 8000 万美元、全球网络犯罪<span class="zhen">（cybercrime）</span> 10.5 万亿美元，P1-29、P1-35）。</p>`},

{id:'Q21',p:4,q:`What is cryptography and what were some of the first uses of cryptography? Most cryptography systems use a key for both encrypting and decrypting messages, thus explain what is a key, and what is it used for?`,
zh:`什么是密码学<span class="zhen">（cryptography）</span>？最早用于什么？什么是密钥<span class="zhen">（key）</span>，有什么用？`,
key:`<ul><li><b>Cryptography</b> is the use of mathematical operations to protect messages travelling between parties or stored on a computer (from Greek kryptós "hidden" + gráphein "to write").</li><li>First recorded use: <b>concealing military and political secrets</b> while they were transported.</li><li>A <b>key</b> can be a series of bits used by a computer program, or a passphrase used by humans that is converted into bits.</li><li>The key is used <b>with an algorithm</b> to create ciphertext from plaintext, or derive plaintext from ciphertext. The algorithm stays the same; different keys give different results.</li></ul>`,
jiang:`<p>加分点：<b>Kerckhoffs 思想</b>（课件 P4-13："The algorithms stay the same, but a different key is used"；DES 设计要求 "The security of the algorithm must depend on the key"，P4-21）：算法可以公开，安全全靠密钥。</p><p>再补一句 P4-14：SECURITY = STRENGTH OF ALGORITHM + LENGTH OF KEY，每多 1 位密钥，组合数<span class="zhen">（number of combinations）</span>翻倍。</p>`},

{id:'Q22',p:4,q:`What is general idea behind symmetric key and asymmetric cryptography and what are the fundamental differences between these two systems?`,
zh:`对称密码<span class="zhen">（symmetric cipher）</span>和非对称密码<span class="zhen">（asymmetric cipher）</span>的基本思想是什么？两者的根本区别是什么？`,
key:`<ul><li>Alice's original message is <b>plaintext</b>; what is sent is <b>ciphertext</b>. Alice uses an encryption algorithm and a <b>shared secret key</b>; Bob uses the decryption algorithm and the <b>same</b> key.</li><li><b>Symmetric</b> (private/secret-key): the same key encrypts and decrypts; both parties must own it. Problem: getting a copy of the key to the other party securely.</li><li><b>Asymmetric</b> (public-key): two separate keys — one <b>public</b>, one <b>private</b>.</li><li>Differences: symmetric uses one key, asymmetric two; symmetric is <b>much faster</b> but raises <b>key-management cost</b> (key must be sent securely); asymmetric needs <b>four keys</b> for a two-party conversation and is less efficient in CPU and key management.</li></ul>`,
jiang:`<p>建议画表：</p><table class="mini"><tr><th></th><th>Symmetric</th><th>Asymmetric</th></tr><tr><td>密钥<span class="zhen">（key）</span></td><td>1 把共享</td><td>公钥<span class="zhen">（public key）</span> + 私钥<span class="zhen">（private key）</span></td></tr><tr><td>速度</td><td>快</td><td>慢</td></tr><tr><td>难点</td><td>密钥分发<span class="zhen">（key distribution）</span></td><td>计算量大、要证明公钥<span class="zhen">（public key）</span>属于谁（PKI）</td></tr><tr><td>例子</td><td>DES、3DES、AES、RC4</td><td>RSA、DH、ElGamal、ECC</td></tr><tr><td>用途</td><td>大量数据加密<span class="zhen">（encryption）</span></td><td>密钥交换<span class="zhen">（key exchange）</span>、数字签名<span class="zhen">（digital signature）</span></td></tr></table><p>结尾点出<b>混合系统</b>（P4-98）：用公钥<span class="zhen">（public key）</span>交换会话密钥<span class="zhen">（session key）</span>，用对称密钥加密<span class="zhen">（symmetric key encryption）</span>数据。“四把钥匙”指双方各有一对公私钥<span class="zhen">（public-private key pair）</span>。</p>`},

{id:'Q23',p:4,q:`In PKI, is it possible to derive private key from the public key?`,
zh:`在 PKI 中，能从公钥<span class="zhen">（public key）</span>推出私钥<span class="zhen">（private key）</span>吗？`,
key:`<ul><li>No. Asymmetric algorithms are designed so that it is <b>impossible (computationally infeasible)</b> to derive the private key from the related public key; otherwise the algorithm could not be used.</li><li>Algorithms are therefore <b>tested for many years</b> under real-world conditions by industry, academia, mathematicians, cryptography experts and industrial users.</li><li>Whenever an algorithm is compromised, it is no longer used.</li></ul>`,
jiang:`<p>两把钥匙在数学上相关，但从公钥<span class="zhen">（public key）</span>推私钥<span class="zhen">（private key）</span>需要解一个难题：RSA 是<b>分解<span class="zhen">（factorization）</span> n = p×q</b>，DH 是<b>离散对数<span class="zhen">（discrete logarithm）</span></b>。</p><p>这题也是样题 Q4-8 选 “How long the algorithm has been around” 的理论依据：可信来自<b>长期公开检验</b>。补充：量子计算（Shor 算法）未来可能打破这一点（P4-125）。</p>`},

{id:'Q24',p:4,q:`Describe RSA cryptosystem. a. What is the one-way function in the system? b. What is the trapdoor in the system? c. Define the public key and private key in the system. d. Describe the security of the system.`,
zh:`描述 RSA 密码系统<span class="zhen">（cryptosystem）</span>：a 单向函数<span class="zhen">（one-way function）</span>是什么？b 陷门<span class="zhen">（trapdoor）</span>是什么？c 公钥<span class="zhen">（public key）</span>和私钥<span class="zhen">（private key）</span>分别是什么？d 系统的安全性。`,
key:`<ul><li>Most widely used public-key algorithm (Rivest, Shamir, Adleman); uses exponentiation of integers modulo a product of primes.</li><li>Encrypt: <b>C = M<sup>e</sup> mod n</b>; Decrypt: <b>M = C<sup>d</sup> mod n = (M<sup>e</sup>)<sup>d</sup> mod n = M</b>. Both parties know n and e; only the receiver knows d.</li><li><b>a.</b> One-way function: <b>C = P<sup>e</sup> mod n</b> — given P and e, C is easy to compute; given C and e, P is hard to find when n is very large.</li><li><b>b.</b> Trapdoor: the value of <b>d</b> (Bob's private key), which lets Bob compute P = C<sup>d</sup> mod n.</li><li><b>c.</b> Public key = <b>e</b> (with n); private key = <b>d</b>.</li><li><b>d.</b> Security depends mainly on the <b>difficulty of factoring n</b>; if n is very large and e is chosen properly, the system is secure.</li></ul>`,
jiang:`<p><b>概念区分</b>：单向函数<span class="zhen">（one-way function）</span>（正向容易、反向难）+ <b>陷门<span class="zhen">（trapdoor）</span></b>（掌握秘密信息 d 的人可以轻松反向）= <b>陷门单向函数<span class="zhen">（trapdoor one-way function）</span></b>，这是公钥密码<span class="zhen">（public-key cryptography）</span>的核心。</p><p>记得写出<b>密钥生成<span class="zhen">（key generation）</span>步骤</b>（P4-67）：选素数<span class="zhen">（prime number）</span> p、q → n = pq → φ = (p−1)(q−1) → 选 e 与 φ 互素<span class="zhen">（relatively prime）</span> → 求 d 使 e·d ≡ 1 (mod φ)。</p><p>安全性补充：p、q、φ 必须保密（Q29），n 要足够大（建议 ≥ 2048 位，P5-11）。</p>`},

{id:'Q25',p:4,q:`In RSA cryptosystem the message "STOP" is to be encrypted using a block of 4. Let us assume that the user has chosen two prime numbers p = 43 and q = 59 and e = 13. Show step by step, the resultant encrypted message.`,
zh:`RSA 中用 4 位一块加密<span class="zhen">（encryption）</span>消息“STOP”，p = 43、q = 59、e = 13。逐步写出加密<span class="zhen">（encryption）</span>结果。`,
key:`<ul><li>n = p × q = 43 × 59 = <b>2537</b></li><li>Convert letters to numbers (position in alphabet − 1, i.e., A = 00): S = 18, T = 19, O = 14, P = 15 → blocks of 4: <b>1819 1415</b></li><li>Encrypt each block with C = M<sup>13</sup> mod 2537:</li><li>1819<sup>13</sup> mod 2537 = <b>2081</b> (ST)</li><li>1415<sup>13</sup> mod 2537 = <b>2182</b> (OP)</li><li>Encrypted message: <b>2081 2182</b></li></ul>`,
jiang:`<p><b>编码约定</b>：本题 A = 00, B = 01, …, Z = 25（字母序号减 1），每两个字母拼成 4 位一块。因为每块必须小于 n = 2537，最大的块 2525（ZZ）也小于它，所以 4 位分块可行。</p><p><b>手算 1819<sup>13</sup> mod 2537</b>：用平方-乘法<span class="zhen">（square-and-multiply）</span>。13 = 1101₂ = 8 + 4 + 1，依次算 x<sup>1</sup>, x<sup>2</sup>, x<sup>4</sup>, x<sup>8</sup>（每步都取 mod），再把 x<sup>8</sup>·x<sup>4</sup>·x<sup>1</sup> 相乘取 mod。考场上有计算器的话，用分步取模避免溢出。</p><p>点下方“在计算器中打开”，可以看到完整的平方-乘法<span class="zhen">（square-and-multiply）</span>表。</p>`,
calc:{tool:'rsa',p:43,q:59,e:13,pt:'STOP',ct:''}},

{id:'Q26',p:4,q:`In RSA cryptosystem an encrypted message "0981 0461" is to be decrypted using a block of 4. Let us assume that the user has chosen two prime numbers p = 43 and q = 59 and e = 13. Show step by step, the resultant decrypted message.`,
zh:`RSA 中密文<span class="zhen">（ciphertext）</span>“0981 0461”按 4 位一块解密<span class="zhen">（decryption）</span>，p = 43、q = 59、e = 13。逐步写出解密<span class="zhen">（decryption）</span>结果。`,
key:`<ul><li>M = C<sup>d</sup> mod n</li><li>n = 43 × 59 = 2537; φ = (43−1)(59−1) = 42 × 58 = <b>2436</b></li><li>d = e<sup>−1</sup> mod φ = 13<sup>−1</sup> mod 2436 = <b>937</b> (check: 13 × 937 = 12181 = 5 × 2436 + 1)</li><li>0981<sup>937</sup> mod 2537 = <b>0704</b> → 07 = h, 04 = e</li><li>0461<sup>937</sup> mod 2537 = <b>1115</b> → 11 = l, 15 = p</li><li>Decrypted message: <b>"help"</b></li></ul>`,
jiang:`<p><b>求 d 的两种方法</b>：</p><p>① 课件的 k 试除法<span class="zhen">（trial division）</span>：d = (k·2436 + 1) / 13，k = 1, 2, … 直到能整除。2436 mod 13 = 5，所以要 5k + 1 ≡ 0 (mod 13)，得 k = 5：(5 × 2436 + 1) / 13 = 12181 / 13 = <b>937</b>。</p><p>② 扩展欧几里得<span class="zhen">（extended Euclidean algorithm）</span>：2436 = 13×187 + 5；13 = 5×2 + 3；5 = 3×1 + 2；3 = 2×1 + 1，回代得 13<sup>−1</sup> ≡ 937 (mod 2436)。</p><p><b>解码</b>：用和加密<span class="zhen">（encryption）</span>相同的编码（A = 00），0704 → h e，1115 → l p。</p>`,
calc:{tool:'rsa',p:43,q:59,e:13,pt:'',ct:'0981 0461'}},

{id:'Q27',p:4,q:`In RSA: a. Given q = 13, p = 17, e = 5, find φ(n) and d. b. Given q = 31, p = 127 and e = 17, find d. c. Given p = 19, q = 23 and e = 3, find n, φ(n).`,
zh:`RSA 计算三小题：a 求 φ 和 d；b 求 d；c 求 n 和 φ。`,
key:`<ul><li><b>a.</b> φ(n) = (13−1)(17−1) = 12 × 16 = <b>192</b>; d = 5<sup>−1</sup> mod 192 = <b>77</b> (5 × 77 = 385 = 2 × 192 + 1)</li><li><b>b.</b> φ(n) = 30 × 126 = <b>3780</b>; d = 17<sup>−1</sup> mod 3780 = <b>3113</b> (17 × 3113 = 52921 = 14 × 3780 + 1)</li><li><b>c.</b> n = 19 × 23 = <b>437</b>; φ(n) = 18 × 22 = <b>396</b></li></ul>`,
jiang:`<p><b>a 的 k 试除法<span class="zhen">（trial division）</span></b>：d = (192k + 1) / 5。k = 1 → 193 ✗；k = 2 → 385 / 5 = <b>77</b> ✓。</p><p><b>b</b>：3780 mod 17 = 6，要 6k + 1 ≡ 0 (mod 17)，得 k = 14 → (14 × 3780 + 1) / 17 = 52921 / 17 = <b>3113</b>。k 比较大时，用扩展欧几里得<span class="zhen">（extended Euclidean algorithm）</span>更快。</p><p><b>c 的陷阱</b>：φ = 396 = 2² × 3² × 11，<b>e = 3 与 φ 不互素<span class="zhen">（not relatively prime）</span></b>，所以 d 根本不存在，这组参数下 e = 3 不能用。题目只问 n 和 φ，大概就是这个原因。考试如果追问 d，要指出 gcd(3, 396) = 3 ≠ 1。</p>`,
calc:{tool:'rsa',p:13,q:17,e:5,pt:'',ct:''}},

{id:'Q28',p:4,q:`In Public key, different keys are used for encryption and decryption. The user gives/publishes his/her public key which can be used to send him/her encrypted messages. Thus, how does a receiver know that the public key he/she is using is authentic? Is it possible to spoof a public key? (Also: since the keys are mathematically related, can the private key be calculated from the known public key?)`,
zh:`怎么知道用的公钥<span class="zhen">（public key）</span>是真的？公钥<span class="zhen">（public key）</span>能被冒充<span class="zhen">（masquerading）</span>吗？（附：公私钥<span class="zhen">（public-private key pair）</span>数学相关，能从公钥<span class="zhen">（public key）</span>算出私钥<span class="zhen">（private key）</span>吗？）`,
key:`<ul><li>A <b>trusted third party</b> certifies that a public key belongs to a specific person or entity.</li><li>The <b>digital certificate</b> contains the user's public key and is <b>signed by the Certification Authority (CA)</b>; it can be verified using the CA's public key.</li><li>However, since CAs are <b>not regulated</b>, it is possible to fraudulently obtain a certificate/public key; users can also <b>self-generate</b> certificates. So spoofing is possible — accept certificates only from reputable CAs.</li><li>Private from public? Though mathematically related, it is <b>not feasible</b> to calculate the private key: the clever part of public-key cryptography is designing the relationship. E.g., with very large primes A and B, their product C has only A and B as factors; given C, you cannot feasibly factor it.</li></ul>`,
jiang:`<p><b>核心</b>：公钥<span class="zhen">（public key）</span>的真实性<span class="zhen">（authenticity）</span>靠 <b>PKI + 数字证书<span class="zhen">（digital certificate）</span> + CA</b>（P4-47："A central problem with public-key cryptography is proof that a particular public key is correct"）。</p><p><b>能冒充<span class="zhen">（masquerading）</span>吗？</b>能。CA 没有统一监管，自签名证书<span class="zhen">（self-signed certificate）</span>谁都能生成。所以 P4-124 强调 "only accept certificates issued by reputable CAs"。这正是 Q33 要检查证书<span class="zhen">（certificate）</span>的原因。</p>`},

{id:'Q29',p:4,q:`In RSA algorithm, values of two prime numbers can be made public or not?`,
zh:`RSA 中两个素数<span class="zhen">（prime number）</span>可以公开吗？`,
key:`<ul><li><b>No.</b> The main source of RSA's security is keeping the two primes p and q secret, and therefore also keeping <b>φ(n) secret</b>.</li><li>Knowing either reveals the other: if you know p and q, φ(n) = (p−1)(q−1); if you know φ(n) and n, you can readily calculate p and q.</li><li>With φ(n), anyone can compute d = e<sup>−1</sup> mod φ(n) — the private key.</li></ul>`,
jiang:`<p><b>推理链</b>：p、q 公开 → φ 可求 → 由 e 求 d → 私钥泄露<span class="zhen">（private key exposure）</span>。</p><p>反过来，已知 n 和 φ：p + q = n − φ + 1，p·q = n，解一元二次方程就得到 p 和 q。所以 <b>p、q、φ、d 四个都必须保密</b>，只公开 (n, e)。</p>`},

{id:'Q30',p:4,q:`Alice and Bob want to share a secret key for use in a symmetric cipher, but their only means of communication is insecure. Every piece of information that they exchange is observed by their adversary Eve. With the help of an example explain how Diffie-Hellman key exchange method makes it possible for Alice and Bob to share a key without making it available to Eve?`,
zh:`Alice 和 Bob 只能通过被 Eve 监听的不安全信道<span class="zhen">（channel）</span>通信，却要共享一把对称密钥<span class="zhen">（symmetric key）</span>。举例说明 Diffie-Hellman 怎么做到不让 Eve 知道这把密钥<span class="zhen">（key）</span>。`,
key:`<ul><li>Published by Diffie and Hellman in 1976; used in many commercial products; a practical method to exchange a secret key securely. Security relies on the <b>difficulty of computing discrete logarithms</b>.</li><li>1. Alice and Bob agree on a large prime <b>p</b> and a primitive root <b>g</b>; these are <b>public</b>.</li><li>2. Alice picks secret <b>a</b>, Bob picks secret <b>b</b>.</li><li>3. Alice computes A = g<sup>a</sup> mod p; Bob computes B = g<sup>b</sup> mod p; they exchange A and B (Eve sees A and B).</li><li>4. Alice computes K = B<sup>a</sup> mod p; Bob computes K = A<sup>b</sup> mod p — the <b>same value</b> = g<sup>ab</sup> mod p.</li><li>Example: q = 353, g = 3, a = 97, b = 233 → Y<sub>A</sub> = 3<sup>97</sup> mod 353 = <b>40</b>, Y<sub>B</sub> = 3<sup>233</sup> mod 353 = <b>248</b>; K = 248<sup>97</sup> mod 353 = 40<sup>233</sup> mod 353 = <b>160</b>.</li></ul>`,
jiang:`<p><b>为什么 Eve 算不出来</b>：Eve 知道 p、g、A、B，但要得到 K = g<sup>ab</sup>，必须先从 A = g<sup>a</sup> mod p 求出 a，这就是<b>离散对数难题</b>（P4-51）。</p><p><b>为什么双方结果一样</b>：B<sup>a</sup> = (g<sup>b</sup>)<sup>a</sup> = g<sup>ab</sup> = (g<sup>a</sup>)<sup>b</sup> = A<sup>b</sup> (mod p)。</p><p><b>加分</b>：DH 只交换密钥<span class="zhen">（key）</span>、不加密<span class="zhen">（without encryption）</span>消息；它本身<b>不认证<span class="zhen">（no authentication）</span>身份</b>，可能遭受中间人攻击<span class="zhen">（man-in-the-middle attack (MITM)）</span>，所以 TLS 1.3 用签名<span class="zhen">（signature）</span>来保护 DH 交换（P5-19）。</p><p>⚠ 课件 P4-63 例 8 有笔误：2<sup>13</sup> mod 29 应为 <b>14</b>（课件写成 27），共享密钥<span class="zhen">（shared key）</span>应为 <b>19</b>（课件写成 26）。</p>`,
calc:{tool:'dh',p:353,g:3,a:97,b:233}},

{id:'Q31',p:4,q:`What is hashing and its role in cryptography? Is hashing the same thing as encrypting? Can you de-hash?`,
zh:`什么是哈希<span class="zhen">（hash）</span>，在密码学<span class="zhen">（cryptography）</span>中起什么作用？哈希<span class="zhen">（hash）</span>和加密<span class="zhen">（encryption）</span>一样吗？能“反哈希<span class="zhen">（hash）</span>”吗？`,
key:`<ul><li>A hash (also "digest", informally "checksum") is a kind of "signature" for a stream of data that represents its contents.</li><li>Analogy: a <b>tamper-evident seal</b> on a software package — if you open the box (change the file), it is detected.</li><li>Uses: verifying files, ensuring the <b>integrity</b> of an encrypted message. Because there is no key, there is no way to get the original back.</li><li>Not the same as encryption: hashing returns a value of a <b>fixed size</b> (much smaller than the file); encryption returns output of the <b>same size or larger</b>.</li><li>You <b>cannot de-hash</b> — like determining the whole number from part of a remainder in long division. You can decrypt, but you can't de-hash.</li></ul>`,
jiang:`<p>P4-110 的对比表直接用：</p><table class="mini"><tr><th></th><th>Encryption</th><th>Hashing</th></tr><tr><td>输出长度</td><td>约等于明文<span class="zhen">（plaintext）</span></td><td>固定且短</td></tr><tr><td>可逆？</td><td>可以（解密<span class="zhen">（decryption）</span>）</td><td>不可以</td></tr><tr><td>密钥<span class="zhen">（key）</span></td><td>需要</td><td>不需要</td></tr><tr><td>目的</td><td>机密性<span class="zhen">（confidentiality）</span></td><td>完整性<span class="zhen">（integrity）</span></td></tr></table><p>加分：写出哈希<span class="zhen">（hash）</span>的性质（P4-108：单向<span class="zhen">（one-way）</span>、抗弱碰撞<span class="zhen">（weak collision resistance）</span>、抗强碰撞<span class="zhen">（strong collision resistance）</span>）和例子（SHA-256；MD5 和 SHA-1 已不安全）。</p>`},

{id:'Q32',p:4,q:`What is Digital Signatures and how does the verifier check the digital signature?`,
zh:`什么是数字签名<span class="zhen">（digital signature）</span>？验证者<span class="zhen">（validator）</span>如何验证数字签名<span class="zhen">（digital signature）</span>？`,
key:`<ul><li>A digital signature (not to be confused with a digital certificate) is an electronic signature used to <b>authenticate the identity of the sender</b> of a message or the signer of a document.</li><li>It is <b>not</b> used to ensure confidentiality, but to guarantee who sent the message — <b>non-repudiation</b>.</li><li>It simply <b>reverses</b> asymmetric encryption: the sender encrypts (the message digest) with his/her <b>private key</b>; if the recipient can decrypt it with the sender's <b>public key</b>, it must have been sent by that person.</li><li>Verification: (1) <b>hash</b> the plaintext message with the same algorithm the sender used; (2) <b>decrypt the signature</b> with the true party's public key → message digest; (3) <b>compare</b> the two digests — if identical, the signature is valid.</li></ul>`,
jiang:`<p><b>流程图式作答</b>：<br>发送方：消息 → Hash → 摘要<span class="zhen">（digest）</span> → 用私钥<span class="zhen">（private key）</span>签名<span class="zhen">（signature）</span> → 签名<span class="zhen">（signature）</span> + 消息一起发送。<br>接收方：① Hash(消息)；② 用公钥<span class="zhen">（public key）</span>解开签名<span class="zhen">（signature）</span>；③ 比较两个摘要<span class="zhen">（digest）</span>。</p><p>强调三点：提供<b>完整性<span class="zhen">（integrity）</span> + 认证<span class="zhen">（authentication）</span> + 不可否认<span class="zhen">（non-repudiation）</span></b>，<b>不</b>提供机密性<span class="zhen">（confidentiality）</span>；如需保密，再用接收方公钥加密<span class="zhen">（public-key encryption）</span>消息（P4-113 "with message protection"）。<b>“真实发送方的公钥<span class="zhen">（public key）</span>”要从证书<span class="zhen">（certificate）</span>获取</b>（P4-118）。</p><p>可以附上 RSA 签名<span class="zhen">（signature）</span>小例子（P4-117）：n = 55，e = 3，d = 27，M = 51 → S = 51<sup>27</sup> mod 55 = 6；验证 6<sup>3</sup> mod 55 = 51 ✓。</p>`},

{id:'Q33',p:4,q:`What three things must the receiver of a digital certificate check to ensure that a digital certificate is valid?`,
zh:`接收数字证书<span class="zhen">（digital certificate）</span>时必须检查哪三件事，才能确认证<span class="zhen">（authentication）</span>书有效？`,
key:`<ul><li><b>1. Authentic and unmodified</b>: test the certificate's digital signature with the <b>CA's well-known public key</b>; if it works, the certificate is authentic and unmodified. Since CAs in many countries are not regulated, accept only CAs trusted by reputation.</li><li><b>2. Valid period</b>: each certificate has dates before and after which it is not valid; check it is within its valid period.</li><li><b>3. Not revoked</b>: even within the valid period, a CA may revoke a certificate. Use the <b>Online Certificate Status Protocol (OCSP)</b>: send the certificate's serial number to the CA, which replies <b>good, revoked, or unknown</b>.</li></ul>`,
jiang:`<p>口诀：<b>签名<span class="zhen">（signature）</span>、期限、吊销</b>（P4-122）。</p><p>注意第三点："Cannot be done by looking at fields within the certificate — Receiver must check with the CA"。吊销状态<span class="zhen">（revocation status）</span><b>不写在证书<span class="zhen">（certificate）</span>里</b>，必须在线查询（OCSP）。</p><p>真实案例：Equifax 的 SSL 证书过期<span class="zhen">（certificate expiry）</span>近 10 个月没人发现，导致数据外泄<span class="zhen">（data exfiltration）</span>无法被监测（P6-104）。TLS 最佳实践<span class="zhen">（best practice）</span>里的 OCSP Stapling 也是为了检查证书<span class="zhen">（certificate）</span>有效性（P5-29）。</p>`}
];

/* 考点速记：每章一页，HTML */
window.NOTES = {
1:`<h3>核心概念</h3>
<ul>
<li><b>CIA 三元组</b>：Confidentiality（防未授权访问<span class="zhen">（unauthorized access）</span>）、Integrity（防未授权<span class="zhen">（unauthorized）</span>修改）、Availability（授权方<span class="zhen">（authorized party）</span>能及时访问）。<span class="ref">P1-8</span></li>
<li>安全靠三类实体：<b>Products</b>（物理和技术产品）、<b>People</b>（人）、<b>Procedures</b>（流程和策略<span class="zhen">（policy）</span>）。<span class="ref">P1-10、P1-11</span></li>
<li>术语：Authentication 身份是真的；Access control 防止资源被未授权<span class="zhen">（unauthorized）</span>使用；Non-repudiation 防止通信一方抵赖；Security mechanism 检测、阻止或从攻击中恢复。<span class="ref">P1-13</span></li>
<li>风险资产<span class="zhen">（assets at risk）</span>：data、knowledge、software、physical、financial、employee、customer & partner assets，以及 goodwill。<span class="ref">P1-12</span></li>
</ul>
<h3>互联网<span class="zhen">（Internet）</span>助长攻击的三特征 <span class="ref">P1-37</span></h3>
<ol><li><b>Automation</b>：速度快，借助数据挖掘<span class="zhen">（data mining）</span>或 AI 很容易找到目标</li><li><b>Action at a distance</b>：远程作案，各国法律不同，难以起诉</li><li><b>Electronic techniques easily transferable/duplicated</b>：攻击技术易复制传播</li></ol>
<h3>六大攻击类型 <span class="ref">P1-38</span></h3>
<table class="mini"><tr><th>类型</th><th>要点</th></tr>
<tr><td>Malware</td><td>Virus 要宿主；Worm 不要宿主、自我传播<span class="zhen">（self-propagation）</span>；Trojan 伪装；Logic bomb 条件触发；Rootkit 隐身并掩护其他恶意软件<span class="zhen">（malware）</span>；Botnet 僵尸网络；Ransomware 勒索；Spyware 偷信息；Adware 弹广告</td></tr>
<tr><td>Social engineering</td><td>Phishing、Spear（定向）、Whaling（高管）、Smishing（短信）、Vishing（电话）、Angler（社交媒体<span class="zhen">（social media）</span>）</td></tr>
<tr><td>Password</td><td>Dictionary、Brute force、Keylogger、Shoulder surfing、Rainbow table</td></tr>
<tr><td>MITM</td><td>又称 eavesdropping attack；对策：加密<span class="zhen">（encryption）</span>、不用公共 Wi-Fi<span class="zhen">（public Wi-Fi）</span></td></tr>
<tr><td>SQL injection</td><td>对策：IDS + 校验用户输入<span class="zhen">（validation of user-supplied data）</span></td></tr>
<tr><td>DoS / DDoS</td><td>Volume（Ping、UDP flood）/ Protocol（SYN flood、Ping of Death）/ Application（HTTP GET/POST、DNS flood）</td></tr>
</table>
<p>其他：Insider threat（贪婪、恶意、粗心）、Cryptojacking（偷算力<span class="zhen">（computing power）</span>挖矿<span class="zhen">（mining）</span>）。</p>
<h3>必会计算</h3>
<ul>
<li><b>暴力破解时间<span class="zhen">（brute-force time）</span></b> = 字符集<span class="zhen">（character set）</span><sup>长度</sup> ÷ 每秒尝试次数<span class="zhen">（attempts per second）</span>。6 位 PIN：10<sup>6</sup> ÷ 500,000 = 2 秒；95<sup>10</sup> ≈ 6×10<sup>19</sup>，按 6.4×10<sup>6</sup>/s 约 30 万年；102<sup>16</sup> ≈ 1.37×10<sup>32</sup>，按 400×10<sup>6</sup>/s 约 1.08×10<sup>16</sup> 年，用 100 万台 bot 后约 1.08×10<sup>10</sup> 年。<span class="ref">P1-55～P1-57</span></li>
<li><b>Ping flood 包速率<span class="zhen">（packet rate）</span></b> = 链路<span class="zhen">（link）</span> bit/s ÷ (包字节<span class="zhen">（byte）</span> × 8)。500 B 包：1.5 Mbps → 375 pps，10 Mbps → 2500 pps，100 Mbps → 25,000 pps。<span class="ref">P1-68～P1-70</span></li>
</ul>
<h3>大事件</h3>
<ul><li>GitHub 2018：1.3 Tbps，Memcached 放大约 5 万倍，<b>没有用 botnet</b>，约 20 分钟结束。</li><li>Dyn 2016：<b>Mirai</b> IoT 僵尸网络<span class="zhen">（botnet）</span>。</li><li>Spamhaus 2013：300 Gbps，Cloudflare 缓解，作案者是一名英国少年。</li><li>2025 年：29.7 Tbps（Aisuru），史上最大。</li></ul>
<h3>黑客分类<span class="zhen">（hacker classification）</span> <span class="ref">P1-91、P1-95</span></h3>
<p>White（有授权<span class="zhen">（authorization）</span>）、Black（为私利）、Gray（越界但为提醒所有者）、Script kiddies（hackers in training，为获得尊重）、Hacktivist、Nation-sponsored；内部人员<span class="zhen">（insider）</span>的动机是报复。</p>`,

2:`<h3>工业革命<span class="zhen">（industrial revolution）</span></h3>
<table class="mini"><tr><th>版本</th><th>标志</th></tr><tr><td>1.0</td><td>机械化 + 蒸汽</td></tr><tr><td>2.0</td><td>电力、大规模生产、流水线</td></tr><tr><td>3.0</td><td>计算机、自动化<span class="zhen">（automation）</span>、电子</td></tr><tr><td>4.0</td><td>数字孪生<span class="zhen">（digital twin）</span>、AI、高速网络、云、虚拟化<span class="zhen">（virtualization）</span>，打造智能产品、工厂、国家</td></tr><tr><td>5.0</td><td>人与 AI 机器人协作，解决社会挑战</td></tr></table>
<p>“工业 4.0<span class="zhen">（Industry 4.0）</span>”一词：<b>德国</b>，2015 年底到 2016 年初由 WEF 的 Klaus Schwab 正式使用。样题选 <b>None of the above</b>。<span class="ref">P2-3</span></p>
<h3>驱动技术与各自的安全隐患</h3>
<ul>
<li><b>IoT / IIoT</b>：2024 年约 180 亿台，2030 年约 321 亿台；超过 200 万台 IoT 设备可被完全接管。<span class="ref">P2-6</span></li>
<li><b>Cloud</b>：DoS 打可用性<span class="zhen">（availability）</span>，其他攻击打存储数据的机密性<span class="zhen">（confidentiality）</span>和完整性<span class="zhen">（integrity）</span>。<span class="ref">P2-8</span></li>
<li><b>AI & Big Data</b>：数据是 AI 的燃料；网络犯罪<span class="zhen">（cybercrime）</span>增长了 400%。</li>
<li><b>Digital twin</b>：资产<span class="zhen">（asset）</span>、人、流程等的虚拟复制品<span class="zhen">（virtual replica）</span>；它提供的洞察和控制同样可能被攻击者<span class="zhen">（attacker）</span>利用。<span class="ref">P2-18</span></li>
<li><b>Virtualization</b>：主要挑战是物理资产<span class="zhen">（physical assets）</span>与虚拟模型<span class="zhen">（virtual model）</span>之间的安全信息交换。</li>
<li><b>CPS</b>：智能电网<span class="zhen">（smart grid）</span>、自动驾驶<span class="zhen">（autonomous driving）</span>、医疗监测、机器人、自动驾驶<span class="zhen">（autonomous driving）</span>航电。</li>
<li>互联制造了漏洞<span class="zhen">（vulnerability）</span>，<b>数据可见性（data visibility）</b>是车间最大的安全挑战；制造业是第三大被攻击行业（仅次于金融和政府）。<span class="ref">P2-23、P2-26</span></li>
</ul>
<h3>人的因素<span class="zhen">（human factor）</span> <span class="ref">P2-31～P2-34</span></h3>
<ul>
<li>员工行为<span class="zhen">（employee behaviour）</span>既有恶意的，也有无意的；三大问题：<b>Errors & omissions、Fraud、Disgruntled employees</b>。</li>
<li>意识、培训和教育<span class="zhen">（training and education）</span>的作用：威慑<span class="zhen">（deterrence）</span>欺诈<span class="zhen">（fraud）</span>、消除“我不知道”的借口、<b>限制组织的法律责任<span class="zhen">（legal liability）</span></b>（证明尽到 due care）、满足合规<span class="zhen">（compliance）</span>要求。</li>
<li>意识政策<span class="zhen">（policy）</span>三件事：<b>人人必须参加、给足时间、明确负责人</b>。</li>
<li>Training 教 <b>what to do + how to do it</b>；内容按角色分层：普通用户 → 开发者 → 管理层（风险<span class="zhen">（risk）</span>、成本、收益的权衡）→ 高管（风险管理<span class="zhen">（risk management）</span>目标、度量、领导力）。</li>
</ul>
<h3>社会工程<span class="zhen">（social engineering）</span>形态</h3>
<p>Email phishing、Spear、Smishing、Google 搜索结果里的钓鱼链接<span class="zhen">（phishing link）</span>、社交媒体<span class="zhen">（social media）</span>假好友、QR 码贴纸、Vishing（来电号码可伪造<span class="zhen">（forgery）</span>）。防范：别被紧急情绪带着走、回拨核实、检查邮件地址和 URL、开启 MFA、留意措辞风格、多提问。<span class="ref">P2-37～P2-46</span></p>
<h3>合规 Compliance <span class="ref">P2-51～P2-59</span></h3>
<ul>
<li>定义：遵守法律、法规和标准（例如 GDPR、PCI DSS、HIPAA）。</li>
<li>好处：保护声誉、维持信任、建立信心和忠诚度、防范泄露<span class="zhen">（leak）</span>、改善安全态势<span class="zhen">（security posture）</span>、保护知识产权<span class="zhen">（intellectual property）</span>。</li>
<li>五步：<b>组建团队 → 风险分析<span class="zhen">（risk analysis）</span> → 设置控制 → 制定政策<span class="zhen">（policy）</span> → 监控与快速响应<span class="zhen">（rapid response）</span></b>。</li>
<li>风险分析<span class="zhen">（risk analysis）</span>四步：Identify → Assess → Analyze（可能性<span class="zhen">（likelihood）</span> × 影响）→ Set tolerance（缓解、转移、驳回、接受）。</li>
<li>控制：技术控制<span class="zhen">（technical control）</span>（密码<span class="zhen">（password）</span>、ACL）+ 物理控制<span class="zhen">（physical control）</span>（摄像头、围栏）。</li>
<li><b>Risk = Threat × Vulnerability × Asset</b>（各 1～5 分）：4×3×5 = 60（60/125 = 48%，中等风险<span class="zhen">（medium risk）</span>）。</li>
<li>密码合规检查<span class="zhen">（password compliance check）</span>：例题 “MyPassword123” 缺特殊符号，不合规<span class="zhen">（non-compliant）</span>。</li>
</ul>`,

3:`<h3>安全规划<span class="zhen">（security planning）</span></h3>
<ul>
<li>安全计划<span class="zhen">（security plan）</span>是一份书面文件：策略<span class="zhen">（policy）</span>、战略、流程、技术。目标：保护 CIA、管理风险<span class="zhen">（risk）</span>、保证业务连续<span class="zhen">（business continuity）</span>、满足法规。<span class="ref">P3-2</span></li>
<li>好处：更好地理解风险<span class="zhen">（risk）</span>、主动防护<span class="zhen">（proactive protection）</span>、快速响应<span class="zhen">（rapid response）</span>、满足合规（GDPR、PCI DSS、HIPAA）、预防内部威胁<span class="zhen">（insider threat）</span>。<span class="ref">P3-3、P3-4</span></li>
<li>第一步：<b>评估现状</b>，识别资产<span class="zhen">（asset）</span>与威胁<span class="zhen">（threat）</span>，然后理解脆弱性<span class="zhen">（vulnerability）</span>。<span class="ref">Q&A Q19</span></li>
<li>两个维度：<b>Technical</b>（加密<span class="zhen">（encryption）</span>、防火墙<span class="zhen">（firewall）</span>、生物识别<span class="zhen">（biometrics）</span>）+ <b>Managerial</b>（策略<span class="zhen">（policy）</span>、运营、人）。<span class="ref">P3-5</span></li>
</ul>
<h3>策略<span class="zhen">（policy）</span>与执行</h3>
<ul>
<li>Policy = <b>what</b>（特定情况下应该做什么）；Procedure = <b>how</b>（怎样把策略<span class="zhen">（policy）</span>落地）。</li>
<li>Standards <b>强制</b>；Guidelines <b>酌情</b>，但决策者必须认真考虑。</li>
<li>策略<span class="zhen">（policy）</span>必须 sensible，否则用户会绕过。</li>
<li>实施：识别风险<span class="zhen">（risk）</span>、借鉴他人、符合法律、让员工参与制定、培训、设定明确的处罚、执行、安装工具。<span class="ref">P3-8</span></li>
<li>执行：沟通、访问控制<span class="zhen">（access control）</span>、监控与审计<span class="zhen">（monitoring and auditing）</span>、违规后果。<span class="ref">P3-9</span></li>
</ul>
<h3>两种实施路径 <span class="ref">P3-10</span></h3>
<table class="mini"><tr><th></th><th>Bottom-up</th><th>Top-down</th></tr><tr><td>发起者</td><td>系统管理员<span class="zhen">（system administrator）</span></td><td>高层</td></tr><tr><td>优点</td><td>技术专长</td><td>强力支持、专门资金、规划清晰、能影响组织文化</td></tr><tr><td>缺点</td><td>缺少参与者支持和组织持续力<span class="zhen">（staying power）</span>，很少成功</td><td>—</td></tr></table>
<h3>DLM 四层防御<span class="zhen">（four-tier defense）</span> <span class="ref">P3-13</span></h3>
<ol><li>高层承诺与支持<span class="zhen">（senior management commitment and support）</span></li><li>可接受使用政策<span class="zhen">（acceptable use policy (AUP)）</span>等实践声明<span class="zhen">（statements of practice）</span></li><li>安全使用流程<span class="zhen">（secure-use procedures）</span></li><li>软硬件与网络安全工具<span class="zhen">（network security tools）</span></li></ol>
<p>Zero Trust：<b>never trust, always verify</b>；Defense in depth：层层叠加防御。<span class="ref">P3-14、P3-15</span></p>
<h3>认证因素<span class="zhen">（authentication factor）</span> <span class="ref">P3-18</span></h3>
<p>Something you <b>have</b>（令牌<span class="zhen">（token）</span>）/ <b>know</b>（密码<span class="zhen">（password）</span>）/ <b>are</b>（生物特征<span class="zhen">（biometric characteristic）</span>）。<br>Identification = 一对多<span class="zhen">（one-to-many）</span>（你是谁？）；Verification = 一对一<span class="zhen">（one-to-one）</span>（你是你声称的人吗？）。</p>
<h3>生物识别<span class="zhen">（biometrics）</span></h3>
<table class="mini"><tr><th>类型</th><th>记忆点</th></tr>
<tr><td>Fingerprint</td><td><b>最常用</b>，便宜易用；约 30 个 minutiae 点；缺点：容易被偷、被复制（明胶、高清照片），一旦泄露<span class="zhen">（leak）</span>无法重置</td></tr>
<tr><td>Iris</td><td><b>最准确</b>（可测信息多）；1～3 英尺外采集；Daugman 算法（Gabor 小波<span class="zhen">（Gabor wavelet）</span> + Hamming 距离）；1939 年提出，1990 年实现</td></tr>
<tr><td>Retina</td><td>非常准、难伪造<span class="zhen">（forgery）</span>，但不是主流：要贴近镜头、往眼睛里打光；戴眼镜或有白内障时效果差</td></tr>
<tr><td>Face</td><td>没有指纹<span class="zhen">（fingerprint）</span>准，但可远距离、无接触；算法有 PCA（Eigenfaces）、LDA、LBP、HOG、CNN、FaceNet、ArcFace；3D 人脸不受光照影响</td></tr>
<tr><td>行为特征<span class="zhen">（behavioral characteristic）</span></td><td>声音、击键动态<span class="zhen">（keystroke dynamics）</span>、步态<span class="zhen">（gait）</span>、签名<span class="zhen">（signature）</span>（生理特征<span class="zhen">（physiological characteristic）</span>更稳定）</td></tr></table>
<h3>错误率<span class="zhen">（error rate）</span> <span class="ref">P3-47、P3-49</span></h3>
<ul>
<li><b>FRR = Type I</b>：拒绝合法用户<span class="zhen">（genuine user）</span>；<b>FAR = Type II</b>：接受非法用户。</li>
<li><b>CER</b>：FAR = FRR 的交点，越低越好。</li>
<li>灵敏度<span class="zhen">（sensitivity）</span>提高时 FRR↑、FAR↓。</li>
<li>Error 是无意的，<b>Deception</b> 是故意欺骗；厂商宣称的 FAR/FRR 往往夸大；FTE（注册失败）：例如建筑工人指纹<span class="zhen">（fingerprint）</span>磨损。</li>
<li>攻击方式：presentation attack、截获传感器<span class="zhen">（sensor）</span>输出、模板库<span class="zhen">（template database）</span>、注册环节的完整性<span class="zhen">（integrity）</span>、内鬼<span class="zhen">（insider）</span>。</li>
<li>结论：<b>生物识别<span class="zhen">（biometrics）</span>可以增强、但不能取代密码<span class="zhen">（password）</span></b>（不可撤销<span class="zhen">（irrevocable）</span>、可被伪造<span class="zhen">（forgery）</span>、隐私<span class="zhen">（privacy）</span>问题）。</li>
</ul>`,

4:`<h3>基本术语 <span class="ref">P4-5</span></h3>
<p>Plaintext 明文；Ciphertext 密文；Cipher 算法；Key 密钥；Encryption 明文<span class="zhen">（plaintext）</span> → 密文<span class="zhen">（ciphertext）</span>；Decryption 密文<span class="zhen">（ciphertext）</span> → 明文<span class="zhen">（plaintext）</span>。<br>三类密码<span class="zhen">（password）</span>：<b>Symmetric（1 把密钥<span class="zhen">（key）</span>）/ Asymmetric（2 把）/ Hashing（无密钥<span class="zhen">（key）</span>）</b>。<br>Cryptanalysis（密码分析）攻击：brute force、dictionary、rainbow table。<br>密码学<span class="zhen">（cryptography）</span>提供机密性<span class="zhen">（confidentiality）</span>、完整性<span class="zhen">（integrity）</span>、认证<span class="zhen">（authentication）</span>（签名<span class="zhen">（signature）</span>）、不可否认<span class="zhen">（non-repudiation）</span>（签名<span class="zhen">（signature）</span>）。<span class="ref">P4-16</span></p>
<h3>对称密码<span class="zhen">（symmetric cipher）</span></h3>
<table class="mini"><tr><th>算法</th><th>分组</th><th>密钥<span class="zhen">（key）</span></th><th>轮数<span class="zhen">（number of rounds）</span></th><th>备注</th></tr>
<tr><td>DES</td><td>64</td><td><b>56</b></td><td>16</td><td>IBM Lucifer 改进而来，1976–77 年采用；1998 年 EFF 用 56 小时破解；S 盒<span class="zhen">（S-box）</span>设计保密，引发 NSA 陷门<span class="zhen">（trapdoor）</span>争议</td></tr>
<tr><td>2DES</td><td>64</td><td>112</td><td>—</td><td>中间相遇攻击<span class="zhen">（meet-in-the-middle attack）</span>，强度近似单 DES</td></tr>
<tr><td>3DES</td><td>64</td><td>168（112）</td><td>48</td><td>慢 3 倍，过渡方案</td></tr>
<tr><td>AES</td><td><b>128</b></td><td>128/192/256</td><td>10/12/14</td><td>Rijndael（比利时人 Daemen & Rijmen），2001 年 FIPS 标准，遴选历时 5 年，NSA 也用它加密<span class="zhen">（encryption）</span>绝密信息</td></tr></table>
<p>Block（DES、AES）vs Stream（<b>RC4</b>）；ECB 各块独立，CBC 链式（下一块依赖上一块的输出）。<br>密钥长度<span class="zhen">（key length）</span>：8 位 = 256 种；56 位按 10<sup>6</sup>/s 约 2285 年；64 位约 58.5 万年；128 位约 10<sup>25</sup> 年。<span class="ref">P4-14</span></p>
<h3>公钥密码<span class="zhen">（public-key cryptography）</span></h3>
<ul>
<li>1976 年由 Diffie & Hellman 提出（斯坦福博士生），Merkle 也有贡献。公钥<span class="zhen">（public key）</span>用于加密<span class="zhen">（encryption）</span>和验签<span class="zhen">（signature verification）</span>；私钥<span class="zhen">（private key）</span>用于解密<span class="zhen">（decryption）</span>和签名<span class="zhen">（signature）</span>。<span class="ref">P4-46、P4-47</span></li>
<li><b>保密</b>：用接收方公钥加密<span class="zhen">（public-key encryption）</span> → 接收方私钥<span class="zhen">（private key）</span>解密<span class="zhen">（decryption）</span>。<b>认证<span class="zhen">（authentication）</span></b>：用发送方私钥<span class="zhen">（private key）</span>签名<span class="zhen">（signature）</span> → 发送方公钥<span class="zhen">（public key）</span>验证。</li>
<li>核心难题：证明公钥<span class="zhen">（public key）</span>确实属于某人 → <b>PKI / CA</b>。</li>
<li><b>DH</b>：只做密钥交换<span class="zhen">（key exchange）</span>，不加密<span class="zhen">（without encryption）</span>；安全性基于离散对数<span class="zhen">（discrete logarithm）</span>。Y = g<sup>X</sup> mod q；K = (对方 Y)<sup>自己 X</sup> mod q。</li>
<li><b>RSA</b>：1978 年发表，基于大数分解<span class="zhen">（integer factorization）</span>；n = pq，φ = (p−1)(q−1)，e 与 φ 互素<span class="zhen">（relatively prime）</span>，ed ≡ 1 (mod φ)；C = M<sup>e</sup> mod n，M = C<sup>d</sup> mod n；M 必须小于 n。</li>
<li><b>ElGamal</b>：1985 年，基于离散对数<span class="zhen">（discrete logarithm）</span>，密文<span class="zhen">（ciphertext）</span>是明文<span class="zhen">（plaintext）</span>的两倍长、速度慢。<b>ECC</b>：1985 年提出，2005 年后才普及，密钥<span class="zhen">（key）</span>短、强度相同。</li>
<li>等效强度<span class="zhen">（equivalent strength）</span>：对称<span class="zhen">（symmetric）</span> 128 ≈ ECC 256 ≈ RSA 3072。<span class="ref">P4-97</span></li>
<li><b>混合系统<span class="zhen">（hybrid system）</span></b>：公钥<span class="zhen">（public key）</span>交换会话密钥<span class="zhen">（session key）</span>，对称密钥加密<span class="zhen">（symmetric key encryption）</span>数据（SSL/TLS 就是这样）。</li>
</ul>
<h3>哈希<span class="zhen">（hash）</span>与签名<span class="zhen">（signature）</span></h3>
<ul>
<li>哈希<span class="zhen">（hash）</span>：任意长度输入、固定长度输出、单向<span class="zhen">（one-way）</span>、抗弱碰撞<span class="zhen">（weak collision resistance）</span>和强碰撞<span class="zhen">（collision）</span>；用于完整性<span class="zhen">（integrity）</span>。MD5（128 位）和 SHA-1（160 位）已不安全，应使用 SHA-2 或 SHA-3。<span class="ref">P4-108～P4-110</span></li>
<li>签名<span class="zhen">（signature）</span> = 用私钥<span class="zhen">（private key）</span>处理消息的哈希<span class="zhen">（hash）</span> → 提供完整性<span class="zhen">（integrity）</span>、认证<span class="zhen">（authentication）</span>和不可否认<span class="zhen">（non-repudiation）</span>，<b>不提供机密性<span class="zhen">（confidentiality）</span></b>。验签<span class="zhen">（signature verification）</span>：Hash(消息) 与公钥<span class="zhen">（public key）</span>解开的签名<span class="zhen">（signature）</span>比较。</li>
<li>RSA 签名<span class="zhen">（signature）</span>例：n = 55，e = 3，d = 27，M = 51 → S = 6，验证 6<sup>3</sup> mod 55 = 51。<span class="ref">P4-117</span></li>
</ul>
<h3>数字证书<span class="zhen">（digital certificate）</span> X.509</h3>
<p>字段：版本、颁发者<span class="zhen">（issuer）</span>、序列号<span class="zhen">（serial number）</span>、主体、主体公钥<span class="zhen">（subject public key）</span>、公钥算法<span class="zhen">（public key algorithm）</span>、CA 签名<span class="zhen">（signature）</span>、签名算法<span class="zhen">（signature algorithm）</span>。<b>CA 用自己的私钥<span class="zhen">（private key）</span>签名<span class="zhen">（signature）</span></b>。<br>验证三步：<b>签名<span class="zhen">（signature）</span>（用 CA 公钥<span class="zhen">（public key）</span>）→ 有效期<span class="zhen">（validity period）</span> → 吊销状态<span class="zhen">（revocation status）</span>（向 CA 查询，OCSP）</b>。新加坡的 CA：Verisign、GlobalSign、Netrust。</p>
<h3>挑战 <span class="ref">P4-125</span></h3>
<p>密钥管理<span class="zhen">（key management）</span>、量子威胁（Shor 算法能破解 RSA 和 ECC）、同态加密<span class="zhen">（homomorphic encryption）</span>、IoT 轻量级密码<span class="zhen">（lightweight cryptography）</span>、性能权衡、过时算法（DES、MD5、SHA-1）。</p>
<h3 class="warn">⚠ 课件勘误</h3>
<ul>
<li>P4-63 DH 例 8：2<sup>13</sup> mod 29 = <b>14</b>（课件写成 27），共享密钥<span class="zhen">（shared key）</span> = <b>19</b>（课件写成 26）。</li>
<li>P4-69：“(e × d) mod N = 1” 应为 mod <b>φ(N)</b>：23 × 7 = 161 = 4 × 40 + 1。</li>
<li>P4-79/P4-80：“HI” 的编码前后不一致（H = 8 和 H = 7 两种都出现了）；Q&A 和 STOP 例题用 <b>A = 00</b>。</li>
<li>P4-73：“121, this (113)” 是笔误，应为 121。</li>
</ul>`,

5:`<h3>HTTP vs HTTPS <span class="ref">P5-3～P5-5</span></h3>
<p>HTTP：无状态<span class="zhen">（stateless）</span>、明文<span class="zhen">（plaintext）</span>、<b>端口<span class="zhen">（port）</span> 80</b>；面临的威胁<span class="zhen">（threat）</span>：完整性<span class="zhen">（integrity）</span>、机密性<span class="zhen">（confidentiality）</span>、认证<span class="zhen">（authentication）</span>、DoS。HTTPS = HTTP + TLS，<b>端口<span class="zhen">（port）</span> 443</b>，提供机密性<span class="zhen">（confidentiality）</span>、完整性<span class="zhen">（integrity）</span>、服务器认证<span class="zhen">（server authentication）</span>，稍慢。</p>
<h3>SSL/TLS</h3>
<ul>
<li>Netscape 1994 年设计；SSLv2 易受中间人攻击<span class="zhen">（man-in-the-middle attack (MITM)）</span>；SSLv3 于 1996 年发布；IETF 在 1999 年把它改名为 TLS 1.0；SSL 在 2015 年被淘汰；TLS 1.3 于 2018 年定稿；TLS 1.0 和 1.1 在 2020 年弃用。<span class="ref">P5-8～P5-10</span></li>
<li>两层协议<span class="zhen">（protocol）</span>：上层是 Handshake、Change Cipher Spec、Alert（以及 HTTP）；下层是 <b>Record Protocol</b>。</li>
<li><b>Session</b>（由握手<span class="zhen">（handshake）</span>建立，可被多个连接共享）vs <b>Connection</b>（每个连接都属于一个 session）。</li>
<li><b>Record</b>：提供机密性<span class="zhen">（confidentiality）</span>和完整性<span class="zhen">（integrity）</span>。流程：分片<span class="zhen">（fragmentation）</span> → 压缩 → 加 MAC → 加密<span class="zhen">（encryption）</span> → 加记录头<span class="zhen">（record header）</span>。</li>
<li><b>Handshake</b>：最复杂的部分，负责互相认证<span class="zhen">（authentication）</span>、协商算法和密钥<span class="zhen">（key）</span>。消息：ClientHello（列出 cipher suites）→ ServerHello（选定一个）→ Certificate → ServerHelloDone → ClientKeyExchange（用服务器<span class="zhen">（server）</span>公钥加密<span class="zhen">（public-key encryption）</span>会话密钥<span class="zhen">（session key）</span>）→ ChangeCipherSpec → Finished。</li>
<li><b>Alert</b>：2 字节（fatal 或 warning + 告警代码<span class="zhen">（alert code）</span>）。<b>Change Cipher Spec</b>：把 pending 状态切换为 current。</li>
<li>密钥长度<span class="zhen">（key length）</span>：公钥<span class="zhen">（public key）</span>建议 2048 位；会话密钥<span class="zhen">（session key）</span> 40～256 位，<b>低于 128 位不安全</b>。</li>
<li><b>TLS 1.3</b>：去掉 RSA 密钥交换<span class="zhen">（key exchange）</span>（因为不具备前向保密<span class="zhen">（forward secrecy）</span>），只保留 ephemeral DH；cipher suites 从 37 个减到 5 个；握手<span class="zhen">（handshake）</span> 1-RTT；移除 3DES、DES、MD5、RC4、SHA-1；签名算法<span class="zhen">（signature algorithm）</span>用 RSA、ECDSA、EdDSA。</li>
<li>常见攻击：MITM、Downgrade、BEAST（TLS 1.0）、POODLE（SSL 3.0）、Heartbleed（OpenSSL）、DROWN（SSLv2）。</li>
<li>SSL 不能：认证<span class="zhen">（authentication）</span>电脑的实际操作者、商家<span class="zhen">（merchant）</span>或消费者本人，也不能防止被盗信用卡<span class="zhen">（credit card）</span>的使用；它是<b>两方协议<span class="zhen">（two-party protocol）</span></b>。</li>
</ul>
<h3>SET vs SSL <span class="ref">P5-31～P5-38</span></h3>
<table class="mini"><tr><th></th><th>SSL</th><th>SET</th></tr><tr><td>目的</td><td>加密<span class="zhen">（encryption）</span>的数据交换</td><td>电商支付<span class="zhen">（e-commerce payment）</span></td></tr><tr><td>认证<span class="zhen">（authentication）</span></td><td>主要是服务器<span class="zhen">（server）</span></td><td>所有参与方都有证书<span class="zhen">（certificate）</span></td></tr><tr><td>加密<span class="zhen">（encryption）</span></td><td>信道<span class="zhen">（channel）</span></td><td>消息</td></tr><tr><td>商家欺诈<span class="zhen">（merchant fraud）</span></td><td>可能（商家<span class="zhen">（merchant）</span>能看到卡信息）</td><td>不太可能（卡信息交给支付网关<span class="zhen">（payment gateway）</span>）</td></tr><tr><td>客户欺诈<span class="zhen">（customer fraud）</span></td><td>可能</td><td>客户要签名<span class="zhen">（signature）</span>，难以抵赖<span class="zhen">（repudiation）</span></td></tr><tr><td>责任方</td><td>商家<span class="zhen">（merchant）</span></td><td>支付网关<span class="zhen">（payment gateway）</span></td></tr><tr><td>使用</td><td>高</td><td>几乎没有</td></tr></table>
<h3>防火墙<span class="zhen">（firewall）</span></h3>
<ul>
<li>硬件防火墙<span class="zhen">（hardware firewall）</span>保护整个网络（路由器<span class="zhen">（router）</span>层面）；软件防火墙<span class="zhen">（software firewall）</span>保护单机。只丢弃<b>能被证明是攻击</b>的包，所以总有攻击包<span class="zhen">（attack packet）</span>能漏过去。</li>
<li>类型：Packet filtering（无状态<span class="zhen">（stateless）</span>，只看包头<span class="zhen">（packet header）</span>）、Stateful（SPI，状态表<span class="zhen">（state table）</span>，最主流）、Proxy / Application gateway（最安全、最慢）、NGFW（DPI + IPS + 应用感知）、Cloud（FWaaS）、WAF（防 SQL 注入<span class="zhen">（SQL injection）</span>和 XSS）。</li>
<li>包过滤<span class="zhen">（packet filtering）</span>三种：static、dynamic、stateful。静态包过滤<span class="zhen">（static packet filtering）</span>能挡住伪造<span class="zhen">（forgery）</span>源 IP 的包。</li>
<li>性能对比（数字越小越好）：包过滤<span class="zhen">（packet filtering）</span> 安全 3 / 性能 1；SPI 2 / 2；App GW 1 / 4。</li>
<li>架构：Packet filtering router → Screened host（bastion host）→ Dual-homed（双网卡<span class="zhen">（network interface card (NIC)）</span> + NAT）→ <b>Screened subnet（两台路由器<span class="zhen">（router）</span> + DMZ，三层防御<span class="zhen">（three layers of defense）</span>）</b>。</li>
<li>个人防火墙<span class="zhen">（personal firewall）</span>不能防邮件病毒<span class="zhen">（virus）</span>，也需要定期更新；防火墙<span class="zhen">（firewall）</span>防不了内鬼<span class="zhen">（insider）</span>和绕过它的攻击。</li>
<li>规则匹配<span class="zhen">（rule matching）</span>：从上到下，第一条命中即生效，最后一条是 deny all。</li>
<li>性能计算：所需 pps = 带宽<span class="zhen">（bandwidth）</span> ÷ (包长 × 8)；1 Gbps、1000 B → 125,000 pps。</li>
<li>“边界<span class="zhen">（perimeter）</span>已死”：云、远程办公<span class="zhen">（remote work）</span>和 BYOD、零信任<span class="zhen">（zero trust）</span>、加密流量<span class="zhen">（encrypted traffic）</span>、复杂威胁<span class="zhen">（sophisticated threat）</span>，让边界<span class="zhen">（perimeter）</span>从固定位置变成以身份为基础；防火墙<span class="zhen">（firewall）</span>仍然需要，但要与其他措施结合。</li>
<li>推荐实践：允许内网<span class="zhen">（internal network）</span>流量<span class="zhen">（traffic）</span>出站<span class="zhen">（egress）</span>；防火墙<span class="zhen">（firewall）</span>本身不能从公网<span class="zhen">（public network）</span>直接访问；SMTP 经网关<span class="zhen">（gateway）</span>转发；拒绝所有 ICMP；阻止外部 telnet；用代理<span class="zhen">（proxy）</span>或 DMZ 提供 Web 服务。</li>
</ul>
<h3>IDS / IPS</h3>
<ul>
<li>HIDS：看单台主机（日志<span class="zhen">（log）</span>、审计记录<span class="zhen">（audit trail）</span>），能检查解密<span class="zhen">（decryption）</span>后的数据，误报<span class="zhen">（false positive）</span>少，但每台主机都要部署，成本高。告警<span class="zhen">（alert）</span>线索：登录失败、非正常时段登录、权限提升<span class="zhen">（privilege escalation）</span>、新增账户。</li>
<li>NIDS：看网段<span class="zhen">（network segment）</span>流量<span class="zhen">（traffic）</span>，部署成本低，能关联多台系统的攻击；<b>流量<span class="zhen">（traffic）</span>加密<span class="zhen">（encryption）</span>后失效</b>，也看不到主机内部。</li>
<li><b>Signature</b>（knowledge-based）：匹配已知攻击<span class="zhen">（known attack）</span>模式，要持续更新，会漏掉新攻击（false negative）。</li>
<li><b>Anomaly</b>（statistical / behavior-based）：收集合法用户<span class="zhen">（genuine user）</span>行为，建立基线<span class="zhen">（baseline）</span>，超过 clipping level 就告警<span class="zhen">（alert）</span>；能发现新攻击，但误报多（false positive）。</li>
<li>IDS 被动，只告警<span class="zhen">（alert）</span>；<b>IPS 主动阻断</b>，常集成在 NGFW 中。Honeypot：诱饵系统<span class="zhen">（decoy system）</span>。</li>
</ul>
<h3 class="warn">⚠ 样题存疑</h3>
<p>样题 Part 5 第 17 题（“define a set of rules or attack patterns”）：官方标 Anomaly，按定义应为 <b>Signature detection</b>。程序里两个选项都判对。</p>`,

6:`<h3>演进</h3>
<p>Mainframe（集中式）→ Client-server（分布式）→ <b>P2P</b>（去中心化<span class="zhen">（decentralization）</span>，没有单点攻击面<span class="zhen">（attack surface）</span>）。账本<span class="zhen">（ledger）</span>：5000 年前的泥板 → 700 年前意大利的复式记账<span class="zhen">（double-entry bookkeeping）</span> → 1980–90 年代的电子账本<span class="zhen">（electronic ledger）</span> → 2009 年的分布式账本<span class="zhen">（distributed ledger）</span>。<span class="ref">P6-3、P6-5</span></p>
<h3>区块链<span class="zhen">（blockchain）</span></h3>
<ul>
<li>定义：去中心化<span class="zhen">（decentralization）</span>、分布式的数字账本<span class="zhen">（digital ledger）</span>，记录交易安全、不可篡改<span class="zhen">（immutable）</span>、透明，不需要中心机构。</li>
<li>特征：Decentralization、Transparency、<b>Immutability</b>、Security（哈希<span class="zhen">（hash）</span> + 签名<span class="zhen">（signature）</span>）、Consensus。</li>
<li>组成：Transactions、Immutable ledger、Decentralized peers、Encryption、Consensus，以及可选的 Smart contracts。</li>
<li>区块<span class="zhen">（block）</span> = 交易 + 自身哈希<span class="zhen">（hash）</span> + <b>前一块的哈希<span class="zhen">（hash）</span></b>；第一个区块叫 genesis block。</li>
<li>工作流程：发起交易 → 节点<span class="zhen">（node）</span>验证 → 打包成区块 → 共识<span class="zhen">（consensus）</span>后上链 → 链式连接保证安全 → 分发给所有节点<span class="zhen">（node）</span>。</li>
<li>与数据库<span class="zhen">（database）</span>的区别：区块链<span class="zhen">（blockchain）</span>只追加、没有管理员<span class="zhen">（administrator）</span>能编辑；数据库<span class="zhen">（database）</span>由 DBA 随意增删改。</li>
<li>起源：<b>1991 年 Haber & Stornetta</b>（给文档打时间戳<span class="zhen">（timestamp）</span>）；<b>2008 年 Satoshi Nakamoto</b> 的白皮书。</li>
</ul>
<h3>共识算法<span class="zhen">（consensus algorithm）</span> <span class="ref">P6-13、P6-14</span></h3>
<table class="mini"><tr><th>算法</th><th>记忆点</th></tr>
<tr><td>PoW</td><td>解数学题、耗算力<span class="zhen">（computing power）</span>；Bitcoin，基于 SHA-256</td></tr>
<tr><td>PoS</td><td>质押<span class="zhen">（staking）</span>代币<span class="zhen">（token）</span>下注；Ethereum 2.0</td></tr>
<tr><td>DPoS</td><td>持币人<span class="zhen">（token holder）</span>投票选代表</td></tr>
<tr><td>PoB</td><td>把币发到无法取回的地址；浪费资源，不流行</td></tr>
<tr><td>Capacity</td><td>投入硬盘空间</td></tr>
<tr><td>PoET</td><td>随机等待；Intel 硬件；许可链<span class="zhen">（permissioned blockchain）</span></td></tr>
<tr><td>PoA</td><td>声誉；私链<span class="zhen">（private blockchain）</span>；Gavin Wood 2017 年提出</td></tr>
<tr><td>BFT</td><td>容忍恶意节点<span class="zhen">（malicious node）</span>；Hyperledger Fabric</td></tr>
<tr><td>DAG</td><td>可并行验证；IOTA</td></tr></table>
<h3>区块链<span class="zhen">（blockchain）</span>类型 <span class="ref">P6-30</span></h3>
<p>Public（Bitcoin、Ethereum）/ Private（课件举例 Ripple、Multichain、Corda）/ Permissioned（需要邀请）/ Consortium（R3、Hyperledger、Fabric）/ Hybrid（XinFin）。</p>
<h3>智能合约<span class="zhen">（smart contract）</span> <span class="ref">P6-15～P6-18</span></h3>
<p>自动执行的程序，省去中介。平台：Ethereum（Solidity）、Solana（Rust）、BSC、Cardano（Plutus）、Polkadot。风险<span class="zhen">（risk）</span>：代码漏洞<span class="zhen">（code vulnerability）</span>、<b>不可更正</b>、扩展性<span class="zhen">（scalability）</span>、法律问题。例子：Uniswap、OpenSea、Chainlink（预言机<span class="zhen">（oracle）</span>）。</p>
<h3>TPS 计算 <span class="ref">P6-34～P6-36</span></h3>
<ul><li>TPB = 区块大小<span class="zhen">（block size）</span> ÷ 交易大小<span class="zhen">（transaction size）</span>；TPS = TPB ÷ 出块秒数。1 MB、250 B、600 s → 4000 笔/块，约 6.67 TPS。</li><li>吞吐量<span class="zhen">（throughput）</span> Mbps = TPS × 交易字节<span class="zhen">（byte）</span> × 8 ÷ 10<sup>6</sup>。1000 × 250 → 2 Mbps；200 × 750 → 1.2 Mbps；1200 × 600 → 5.76 Mbps。</li></ul>
<h3>货币<span class="zhen">（currency）</span>与支付</h3>
<ul>
<li>货币<span class="zhen">（currency）</span>的功能：交换媒介<span class="zhen">（medium of exchange）</span>、计价单位<span class="zhen">（unit of account）</span>、价值储存<span class="zhen">（store of value）</span>；MONEY = VALUE = TRUST。纸币最早出现在 7 世纪的中国；20 世纪 70 年代初脱离金本位<span class="zhen">（gold standard）</span>后成为 <b>fiat</b>（由政府背书）。</li>
<li>支付方式：Cash（匿名、免费、易被偷）、Check（花费金额最大、不匿名）、Credit card、Stored value（借记卡<span class="zhen">（debit card）</span>、礼品卡）、Accumulating balance（账单类）。</li>
<li>电子支付<span class="zhen">（electronic payment）</span>三目标：<b>Integrity、Accountability、Privacy</b>。数字现金<span class="zhen">（digital cash）</span>两大难题：<b>匿名性<span class="zhen">（anonymity）</span>、双花<span class="zhen">（double spending）</span></b>。</li>
<li>网上信用卡<span class="zhen">（credit card）</span>支付的局限：安全（双方都无法被完全认证<span class="zhen">（authentication）</span>）、成本（约 3.5% 加每笔 20～30 美分）、社会公平（很多人没有信用卡<span class="zhen">（credit card）</span>）。</li>
</ul>
<h3>加密货币<span class="zhen">（cryptocurrency）</span></h3>
<table class="mini"><tr><th></th><th>Bitcoin</th><th>Ethereum</th><th>Ripple (XRP)</th></tr>

<tr><td>定位</td><td>数字货币<span class="zhen">（digital currency）</span></td><td>可编程区块链平台<span class="zhen">（programmable blockchain platform）</span></td><td>跨境结算<span class="zhen">（cross-border settlement）</span>，类似 SWIFT</td></tr></table>
<p>新币只能通过 coinbase 交易（矿工奖励<span class="zhen">（mining reward）</span>）产生。加密货币<span class="zhen">（cryptocurrency）</span>的优点：去中心化<span class="zhen">（decentralization）</span>、安全、快且便宜、跨境；缺点：波动大、缺乏监管、接受度低。</p>
<h3>DeFi <span class="ref">P6-78～P6-80</span></h3>
<p>好处：去中心化<span class="zhen">（decentralization）</span>、可及性、透明、安全。风险<span class="zhen">（risk）</span>：波动、技术不成熟、<b>扩展性（ETH 15 TPS vs Visa 65,000）</b>。智能合约<span class="zhen">（smart contract）</span>在 DeFi 中的作用：自动执行、无需信任中介、透明、可互操作<span class="zhen">（interoperable）</span>、取代中介。</p>
<h3>案例</h3>
<ul>
<li><b>Equifax 2017</b>：Apache Struts 漏洞<span class="zhen">（vulnerability）</span>没打补丁<span class="zhen">（patching）</span>，1.47 亿人受影响；策略<span class="zhen">（policy）</span>要求 48 小时修补却拖了 5 个月；SSL 证书过期<span class="zhen">（certificate expiry）</span>约 10 个月；黑客<span class="zhen">（hacker）</span>在内网<span class="zhen">（internal network）</span>横向移动<span class="zhen">（lateral movement）</span>；高管内幕交易<span class="zhen">（insider trading）</span>；和解金最高 7 亿美元。教训：做好基础工作、按需知密<span class="zhen">（need to know）</span>、监控异常（9000 次快速查询）。</li>
<li><b>孟加拉央行 2016</b>：攻击者<span class="zhen">（attacker）</span>通过 SWIFT 发假指令、让打印机失灵、选在长周末动手；原计划 10 亿美元，实际转走 8100 万美元；“fandation” 拼写错误和收款方 Jupiter 被制裁让其余转账被拦下。原因：员工共用密码<span class="zhen">（password）</span>、人为失误或内鬼<span class="zhen">（insider）</span>、U 盘<span class="zhen">（USB drive）</span>传播恶意软件<span class="zhen">（malware）</span>、国际法律漏洞<span class="zhen">（vulnerability）</span>。</li>
</ul>
<h3>事件响应<span class="zhen">（incident response）</span> <span class="ref">P6-112～P6-114</span></h3>
<p>按计划响应；重大事件<span class="zhen">（major incident）</span>召集 <b>CSIRT</b>（高管、安全人员、IT、业务部门、公关、法务）。阶段：<b>Detect → Stop → Repair → Punish</b>。灾难恢复<span class="zhen">（disaster recovery）</span>（专用备份站点<span class="zhen">（backup site）</span>或两站互备）、业务连续性<span class="zhen">（business continuity）</span>、<b>定期演练</b>（发现计划问题、提高响应速度）。安全是一个过程，而不是一劳永逸的方案，要在保护与可用性<span class="zhen">（availability）</span>之间平衡。</p>`
